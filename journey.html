<style>

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}

.row{display:flex;gap:8px;align-items:center}
.wrapx{flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #E3D9CA;background:#fff;color:#3A322A;font-size:13px}

.n{min-height:40px;border-radius:10px;border:1px solid #E3D9CA;background:#fff;font-size:14px;color:#3A322A;padding:0}

.n.red{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:800}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:800;font-size:14px;padding:0 16px}
.btn.ghost{background:#fff;border:1px solid #D8CCBA;color:#3A322A}

input[type=text],input[type=number],textarea,select{width:100%;min-height:44px;border-radius:10px;border:1px solid #E3D9CA;padding:8px 12px;font-size:14px;background:#fff;color:var(--tx)}

label.l{font-size:12px;color:var(--mu);font-weight:700}

.demo button.on{background:#F0B85C;color:#2B241D;border-color:#F0B85C;font-weight:800}
/* 여정 지도 */
.map{position:relative;width:100%;max-width:390px;height:560px;margin:0 auto}

/* 트레이너 */
.tbar{background:var(--tr);color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:6px}

.st{flex:1;min-height:52px;border-radius:12px;border:1px solid #E3D9CA;background:#fff;font-size:11px;color:#3A322A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}

.st.ok{background:var(--acs);border-color:var(--ac);color:var(--ac2);font-weight:800}
.st.past{background:#F4F2EE;color:var(--mu)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:#fff;text-align:left;width:100%}
.fb{font-size:13px;padding:8px 0;border-top:1px solid #F3EEE6;display:flex;gap:8px;justify-content:space-between}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;min-height:44px;padding:10px 0 0;border:0;border-top:1px solid #F3EEE6;background:none;text-align:left;color:var(--tx);width:100%}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid #B9AD9C;flex:none}

.hidden{display:none}

<body>
<div id="app"></div>
<script>
/* ===== 설정 ===== */
const SB_URL='https://vpdemapnpunsuxqdffgn.supabase.co',SB_KEY='sb_publishable_fonyE5eloRwvXb7hacPTow_d6JR0zMv';
const BASE=location.origin+location.pathname.replace(/[^/]*$/,'');
const QS=new URLSearchParams(location.search);
const DEMO=QS.has('demo')||!/github\.io$/.test(location.hostname);
// 지나온 여정 다시 보기 허용 구간 (거부·일상은 자기 여정만)
const PAST_OK={1:false,2:true,3:true,4:false,5:true};
const J=[null,
 {name:'몸 풀기',sub:'가볍게 움직여 보기',theory:'거부 · 전숙고'},
 {name:'재미 찾기',sub:'내 숫자 하나',theory:'호기심 · 숙고'},
 {name:'첫 몰입',sub:'룬 기록 시작',theory:'첫 몰입 · 준비→실행 초기'},
 {name:'일상',sub:'티어와 내가 고르는 도전',theory:'일상 · 실행'},
 {name:'나만의 무대',sub:'내가 설계하는 운동',theory:'열정의 동력 · 유지'}];
const SIGNALS=[null,
 ['“생각보다 괜찮네요”, “이 정도면 할 만하네요”라고 말한다','다음 약속을 거부하지 않는다'],
 ['“이거 또 해요?”, “아까 그거 재밌었어요”라고 말한다','다음 세션을 먼저 잡거나 혼자 한 번 해 봤다고 말한다'],
 ['“시간 가는 줄 몰랐어요”, “머리가 맑아요”라고 말한다','출석이 4주 이상 끊기지 않는다'],
 ['스스로 다음 도전을 제안한다','혼자 운동한 날을 자연스럽게 말한다','“안 하면 찌뿌둥해요”라고 말한다'],
 ['운동을 하고 싶은 것으로 말한다','쉬어도 불안해하지 않고 다시 돌아온다']];
const PDT={0:'전혀 어렵지 않음',2:'매우 쉬움',4:'약간 어려움',6:'꽤 어려움',8:'매우 어려움',10:'도저히 수행하기 어려움'};
const SET={0:'전혀 해낼 자신이 없음',2:'거의 자신이 없음',4:'조금 자신 있음',6:'해낼 수 있을 것 같음',8:'상당히 자신 있음',10:'확실히 해낼 자신 있음'};
const STEPS=[0,2,4,6,8,10];

/* ===== 상태 ===== */
let sb=null;
const S={scr:'boot',uid:null,role:'member',stage:null,approved:[],view:null,code:'',codeMsg:'',busy:false,
  gifts:[],sessions:[],fb:[],ui:{},
  tr:{tab:'members',list:null,others:null,q:'',sel:null,detail:null,invites:null,ui:{pd:null,se:null,vas:0,talk:'change',role:'trainer',ex:'',exs:[]}}};
const esc=x=>String(x==null?'':x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const sbErr=e=>/function|does not exist|schema cache|relation/i.test((e&&e.message)||'')?'서버에 여정 SQL(supabase-journey-1.sql)을 먼저 실행해 주세요':((e&&e.message)||'서버 오류');

/* ===== 접근 규칙 ===== */
function isOpen(n){const st=S.stage;if(!st)return false;return n===st||S.approved.includes(n)||(PAST_OK[st]&&n<st)}
function openKind(n){const st=S.stage;if(n===st)return 'own';if(S.approved.includes(n))return 'appr';if(PAST_OK[st]&&n<st)return 'past';return 'lock'}

/* ===== 시험 모드 데이터 ===== */
function demoData(){
  const d=n=>new Date(Date.now()+9*3600e3-n*864e5).toISOString().slice(0,10);
  S.gifts=[{id:1,gift_date:d(1),title:'수업 루틴',payload:{slots:[{nm:'고양이-소 스트레칭'},{nm:'가벼운 머신 체스트 프레스'},{nm:'벽 짚고 앉았다 일어나기'}]}}];
  S.sessions=[
    {session_date:d(1),session_no:1,items:[{nm:'고블릿 스쿼트',sets:[{t:'W',w:6,r:10,done:true},{t:'M',w:12,r:10,done:true},{t:'M',w:12,r:10,done:true}]},{nm:'랫풀다운',sets:[{t:'M',w:25,r:12,done:true}]}]},
    {session_date:d(4),session_no:1,items:[{nm:'고블릿 스쿼트',sets:[{t:'M',w:10,r:10,done:true}]},{nm:'랫풀다운',sets:[{t:'M',w:20,r:12,done:true}]}]},
    {session_date:d(8),session_no:1,items:[{nm:'고블릿 스쿼트',sets:[{t:'M',w:8,r:10,done:true}]}]},
    {session_date:d(15),session_no:1,items:[{nm:'고블릿 스쿼트',sets:[{t:'M',w:8,r:8,done:true}]}]},
    {session_date:d(29),session_no:1,items:[{nm:'고블릿 스쿼트',sets:[{t:'M',w:6,r:8,done:true}]}]}];
  S.fb=[{id:1,kind:'number',entered_by:'member',session_date:d(4),data:{metric:'플랭크',guess:20,actual:25},created_at:d(4)}];
}
function demoTrainer(){
  S.tr.list=[{member_id:'m1',nickname:'회원 A',stage:3,approved:[],last_feedback:today()},{member_id:'m2',nickname:'회원 B',stage:1,approved:[],last_feedback:null},{member_id:'m3',nickname:'회원 C',stage:4,approved:[5],last_feedback:null}];
  S.tr.others=[{id:'m9',nickname:'회원 D (여정 미지정)'}];
  S.tr.invites=[{code:'RUNE-7K2Q',member_name:'회원 B',start_stage:2,expires_at:new Date(Date.now()+6*864e5).toISOString(),used_at:null,canceled_at:null}];
}
function demoDetail(id){
  const m=S.tr.list.find(x=>x.member_id===id)||{stage:1};
  const fb=[];const base=[[2,6],[4,6],[6,4],[8,4],[8,8],[8,8],[10,4],[4,8],[6,8],[4,8]];
  base.forEach(([se,pd],i)=>fb.push({id:100+i,entered_by:i%2?'member':'trainer',kind:'pdse',exercise:i<7?'고블릿 스쿼트':'루마니안 데드리프트',pd,se,vas:0,session_date:new Date(Date.now()-(10-i)*3*864e5).toISOString().slice(0,10),data:{},created_at:new Date(Date.now()-(10-i)*3*864e5).toISOString()}));
  fb.push({id:200,entered_by:'trainer',kind:'talk',data:{type:'change',text:'계단에서 숨찬 건 좀 그렇긴 해요.'},session_date:today(),created_at:new Date().toISOString()});
  return {stage:m.stage,access:(m.approved||[]).map(s=>({stage:s,role:'trainer',at:new Date().toISOString(),revoked:null})),ot:{type_name:'출발선형',start_stage:2,result:{zone:'걱정',stageName:'숙고'},at:new Date().toISOString()},feedback:fb.reverse()};
}

/* ===== 서버 ===== */
async function boot(){
  const c=QS.get('code');if(c){S.code=c.toUpperCase();try{localStorage.setItem('rune-journey-code',S.code)}catch(e){}}
  else{try{S.code=localStorage.getItem('rune-journey-code')||''}catch(e){}}
  if(DEMO){S.uid='demo';S.role='trainer';S.stage=Number(QS.get('stage'))||2;S.approved=[];demoData();S.scr='launch';render();return}
  try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){S.scr='login';render();return}
  const {data}=await sb.auth.getSession();
  if(!data||!data.session){S.scr='login';render();return}
  S.uid=data.session.user.id;await loadMe();
}
async function loadMe(){
  try{const a=await sb.from('profiles').select('role').eq('id',S.uid).maybeSingle();S.role=(a.data&&a.data.role)||'member'}catch(e){}
  const r=await sb.rpc('journey_me');
  if(r.error){S.scr='err';S.err=sbErr(r.error);render();return}
  S.stage=r.data&&r.data.stage||null;S.approved=(r.data&&r.data.approved)||[];
  if(!S.stage){S.scr=S.role==='trainer'?'launch':'code';render();if(S.code&&S.role!=='trainer')redeem();return}
  try{localStorage.removeItem('rune-journey-code')}catch(e){}
  S.scr='launch';render();loadMemberData();
}
async function loadMemberData(){
  if(DEMO||!sb)return;
  try{
    const [g,s,f]=await Promise.all([
      sb.from('routine_gifts').select('id,gift_date,title,payload,created_at').eq('member_id',S.uid).order('created_at',{ascending:false}).limit(5),
      sb.from('workout_sessions').select('session_date,session_no,items').eq('member_id',S.uid).order('session_date',{ascending:false}).limit(60),
      sb.from('session_feedback').select('*').eq('member_id',S.uid).order('created_at',{ascending:false}).limit(300)]);
    S.gifts=g.data||[];S.sessions=s.data||[];S.fb=f.data||[];
  }catch(e){}
  render();
}
async function redeem(){
  const code=(document.getElementById('code')?document.getElementById('code').value:S.code||'').trim().toUpperCase();
  if(!code){S.codeMsg='코드를 입력해 주세요';render();return}
  S.code=code;S.busy=true;S.codeMsg='';render();
  if(DEMO){S.busy=false;if(code==='RUNE-7K2Q'){S.stage=2;S.approved=[];S.scr='joined'}else S.codeMsg='코드를 찾을 수 없어요. 대문자·숫자를 다시 확인하거나 트레이너에게 물어봐 주세요.';render();return}
  const r=await sb.rpc('journey_redeem',{p_code:code});S.busy=false;
  if(r.error){S.codeMsg=sbErr(r.error);render();return}
  const d=r.data||{};
  if(d.ok){try{localStorage.removeItem('rune-journey-code')}catch(e){}S.stage=d.stage;S.approved=[];S.scr='joined';render();loadMemberData();return}
  S.codeMsg={bad:'코드를 찾을 수 없어요. 대문자·숫자를 다시 확인하거나 트레이너에게 물어봐 주세요.',expired:'기간이 지난 코드예요. 트레이너에게 새 코드를 요청해 주세요.',used:'이미 사용된 코드예요. 본인이 가입한 게 아니라면 트레이너에게 알려 주세요.',canceled:'취소된 코드예요. 트레이너에게 새 코드를 요청해 주세요.',login:'먼저 로그인해 주세요.'}[d.reason]||'확인하지 못했어요';
  render();
}
async function addFb(row){
  const r0=Object.assign({member_id:S.uid,entered_by:'member',session_date:today(),data:{}},row);
  if(DEMO){r0.id=Date.now();r0.created_at=new Date().toISOString();S.fb.unshift(r0);toast('시험 모드: 화면에만 저장했어요');render();return true}
  const r=await sb.from('session_feedback').insert(r0).select('*').single();
  if(r.error){toast(sbErr(r.error));return false}
  S.fb.unshift(r.data);toast('저장했어요');render();return true;
}

/* ===== 계산 도우미 ===== */
function topSet(it){const ss=(it.sets||[]).filter(s=>s.done!==false&&s.t!=='W'&&(s.w>0||s.r>0));if(!ss.length)return null;ss.sort((a,b)=>(b.w||0)-(a.w||0)||(b.r||0)-(a.r||0));return ss[0]}
const fmtSet=s=>s?((s.w>0?s.w+'kg × ':'')+(s.r||0)+'회'):'-';
const exName=it=>it.nm||it.name||it.id||'종목';
function latestFb(kind){return S.fb.find(f=>f.kind===kind)}
function todayFb(kind){return S.fb.find(f=>f.kind===kind&&f.session_date===today())}
function giftSlots(){const g=S.gifts[0];return g&&g.payload&&Array.isArray(g.payload.slots)?g.payload.slots.filter(Boolean):[]}
function recentExNames(){const set=[];giftSlots().forEach(x=>{const n=exName(x);if(!set.includes(n))set.push(n)});(S.sessions[0]&&S.sessions[0].items||[]).forEach(x=>{const n=exName(x);if(!set.includes(n))set.push(n)});return set}
function zoneOf(pd,se,vas){
  if(vas>=4)return {z:'통증 우선',t:'해당 동작 범위·하중을 줄이고 원인부터 확인해요.',bg:'#FDECEC'};
  if(pd==null||se==null)return null;
  if(pd>=6&&se<=4)return {z:'불안 · 어렵고 부담스러운 수행',t:'다음 수업은 기술 난이도를 한 단계 낮추고 성공 경험을 먼저 주기.',bg:'#FFF1E6'};
  if(pd>=6&&se>=6)return {z:'몰입 · 어렵지만 통제하는 느낌',t:'지금 강도 유지. 몰입 중엔 말 걸지 말고 끝난 뒤 이름 붙이기.',bg:'#E8F4EC'};

async function loadTrainer(){

  const [a,b,c]=await Promise.all([sb.rpc('journey_trainer_members'),sb.rpc('trainer_member_list'),sb.rpc('journey_my_invites')]);
  if(a.error){S.tr.err=sbErr(a.error);render();return}
  S.tr.err='';S.tr.list=a.data||[];const ids=new Set(S.tr.list.map(x=>x.member_id));

}

  ${z?`<div style="background:${z.bg};border-radius:12px;padding:12px"><p style="margin:0;font-size:11px;font-weight:800;color:var(--mu)">다음 수업 제안</p><p class="h">${esc(z.z)}</p><p style="margin:4px 0 0;font-size:13px">${esc(z.t)}</p></div>`:''}
  <button class="btn" data-a="trSavePdse" ${u.pd==null||u.se==null?'disabled':''}>기록지에 저장</button><p class="sub">${st>=3?'구간 ③ 이상 회원은 앱에서 직접 남긴 값도 아래 기록에 같이 보여요.':'구간 ①~② 회원은 트레이너가 칩으로 기록해요.'}</p></div>
  <div class="card"><p class="h">회원이 한 말</p><div class="row">${['change','sustain'].map(k=>`<button class="chip${u.talk===k?' on':''}" data-a="trUi" data-k="talk" data-v="${k}">${k==='change'?'변화 대화':'유지 대화'}</button>`).join('')}</div><input id="ttk" type="text" placeholder="회원의 말 그대로"><button class="btn ghost" data-a="trTalk">남기기</button></div>
  <div class="card"><p class="h">다음 구간으로 넘어가는 신호</p><p class="sub">날짜가 아니라 회원의 말과 행동으로 판단해요.</p>${sig}</div>
  <div class="card"><p class="h">몰입 지도 추이</p>${flowMap(d.feedback||[])}</div>
  <div class="card"><p class="h">OT 판정</p>${otTxt}</div>
  <div class="card"><p class="h">최근 기록</p>${(d.feedback||[]).slice(0,40).map(fbText).join('')||'<p class="sub">아직 없어요.</p>'}</div></div>`;
}
async function trWrite(fn,args,ok){
  if(DEMO){ok&&ok();render();toast('시험 모드: 화면에만 반영했어요');return}
  const r=await sb.rpc(fn,args);if(r.error){toast(sbErr(r.error));return}
  toast('저장했어요');await loadTrainer();if(S.tr.sel)await loadDetail(S.tr.sel);
}
async function trAddFb(row){
  const r0=Object.assign({member_id:S.tr.sel,entered_by:'trainer',session_date:today(),data:{}},row);
  if(DEMO){r0.id=Date.now();r0.created_at=new Date().toISOString();S.tr.detail.feedback.unshift(r0);toast('시험 모드: 화면에만 저장했어요');render();return}
  const r=await sb.from('session_feedback').insert(r0).select('*').single();
  if(r.error){toast(sbErr(r.error));return}
  S.tr.detail.feedback.unshift(r.data);toast('저장했어요');render();
}

/* ===== 이벤트 ===== */
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==='trq'){S.tr.q=e.target.value;const p=e.target.selectionStart;render();const el=document.getElementById('trq');if(el){el.focus();el.setSelectionRange(p,p)}}if(k==='tex')S.tr.ui.ex=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='pex')S.ui.pex=e.target.value});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,val=id=>(document.getElementById(id)||{}).value||'';
  const A={
    reload:()=>location.reload(),
    login:()=>{if(!sb){toast('로그인은 upvible.github.io 주소에서만 동작해요');return}sb.auth.signInWithOAuth({provider:v,options:{redirectTo:BASE+'journey.html'+(S.code?'?code='+encodeURIComponent(S.code):'')}}).then(r=>{if(r.error)toast('로그인을 시작하지 못했어요: '+r.error.message)})},
    logout:async()=>{if(DEMO){S.scr='code';render();return}await sb.auth.signOut();location.href=BASE+'journey.html'},
    redeem,
    closeJoined:()=>{S.scr='launch';render()},
    openStage:()=>{S.view=+v;S.ui={pex:recentExNames()[0]||''};S.scr='home';render();window.scrollTo(0,0)},
    locked:()=>toast('트레이너나 센터가 승인하면 열려요'),
    toMap:()=>{S.scr='launch';render();window.scrollTo(0,0)},
    goTrainer:()=>{if(S.role!=='trainer'){toast('트레이너 계정만 들어갈 수 있어요');return}S.scr='trainer';S.tr.sel=null;render();loadTrainer()},
    demoStage:()=>{S.stage=+v;S.scr='launch';render()},
    demoCode:()=>{S.stage=null;S.scr='code';S.code='RUNE-7K2Q';S.codeMsg='';render()},
    ui:()=>{const k=b.dataset.k;S.ui[k]=isNaN(+v)?v:+v;render()},
    dislike:()=>{S.ui.dis=Object.assign({},S.ui.dis,{[v]:true});addFb({kind:'dislike',exercise:v})},
    word:()=>addFb({kind:'word',data:{word:v}}),
    fun:()=>addFb({kind:'fun',exercise:v}),
    saveNum:()=>{const g=+val('ng'),ac=+val('na'),m=val('nm').trim()||'플랭크';if(!val('na')){toast('실제로 해 본 숫자를 적어 주세요');return}addFb({kind:'number',data:{metric:m,guess:val('ng')?g:null,actual:ac}})},
    savePdse:()=>{const u=S.ui,ex=(document.getElementById('pex')||{}).value||null;addFb({kind:'pdse',exercise:ex,pd:u.pd,se:u.se,vas:u.vas||0}).then(ok=>{if(ok){S.ui.pd=null;S.ui.se=null;S.ui.vas=0;render()}})},
    saveLine:()=>{const t=val('ln').trim();if(t)addFb({kind:'line',data:{text:t}})},
    saveGoal4:()=>{const t=val('g4').trim();if(t)addFb({kind:'goal4w',data:{way:S.ui.way||'',text:t}})},
    mini15:()=>addFb({kind:'mini15'}),
    saveLife:()=>{const t=val('lf').trim();if(t)addFb({kind:'life',data:{text:t}})},
    saveQgoal:()=>{const t=val('qg').trim();if(t)addFb({kind:'qgoal',data:{text:t}})},
    saveRetro:()=>addFb({kind:'retro',data:{good:val('r1'),learn:val('r2'),next:val('r3')}}),
    trTab:()=>{S.tr.tab=v;S.tr.sel=null;render()},
    trSel:()=>loadDetail(v),
    trBack:()=>{S.tr.sel=null;render()},
    trUi:()=>{const k=b.dataset.k;S.tr.ui[k]=isNaN(+v)?v:+v;render()},
    setStage:()=>trWrite('journey_set_stage',{p_member:S.tr.sel,p_stage:+v},()=>{S.tr.detail.stage=+v;const m=S.tr.list.find(x=>x.member_id===S.tr.sel);if(m)m.stage=+v}),
    toggleAcc:()=>{const d=S.tr.detail,on=!(d.access||[]).some(a=>!a.revoked&&a.role!=='code'&&a.stage===+v);
      trWrite('journey_set_access',{p_member:S.tr.sel,p_stage:+v,p_on:on,p_role:S.tr.ui.role},()=>{if(on)d.access.unshift({stage:+v,role:S.tr.ui.role,at:new Date().toISOString(),revoked:null});else d.access.forEach(a=>{if(a.stage===+v&&!a.revoked&&a.role!=='code')a.revoked=new Date().toISOString()})})},
    assign:()=>trWrite('journey_set_stage',{p_member:b.dataset.m,p_stage:+v},()=>{const o=S.tr.others.find(x=>x.id===b.dataset.m);S.tr.others=S.tr.others.filter(x=>x!==o);S.tr.list.unshift({member_id:o.id,nickname:o.nickname,stage:+v,approved:[]})}),
    cancelCode:()=>trWrite('journey_cancel_invite',{p_code:v},()=>{const x=S.tr.invites.find(i=>i.code===v);if(x)x.canceled_at=new Date().toISOString()}),
    trSavePdse:()=>{const u=S.tr.ui;trAddFb({kind:'pdse',exercise:val('tex').trim()||null,pd:u.pd,se:u.se,vas:u.vas||0}).then(()=>{u.pd=null;u.se=null;u.vas=0;render()})},
    trTalk:()=>{const t=val('ttk').trim();if(t)trAddFb({kind:'talk',data:{type:S.tr.ui.talk,text:t}})},
    signal:()=>{const st=S.tr.detail.stage;trAddFb({kind:'signal',data:{stage:st,idx:+v,text:SIGNALS[st][+v]}})},
    noop:()=>{}
  };
  if(A[a]){e.preventDefault();await A[a]()}
});
if(!DEMO)window.addEventListener('load',()=>{try{sb&&sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&!S.uid){S.uid=s.user.id;loadMe()}})}catch(e){}});
render();boot();
</script>
</body>
