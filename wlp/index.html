<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WLP · Workout Life Program</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<meta name="theme-color" content="#2B241D">
<meta name="apple-mobile-web-app-title" content="WLP">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<script src="./rec.js"></script>
<script src="./sched.js"></script>
<style>
button,a,input,select{touch-action:manipulation}
:root{--dk:#1C1712;--dk2:#25201A;--dk3:#3A2F23;--ln:#4A3F34;--dt:#F5EFE6;--dm:#B9AE9F;--dm2:#8F8476;--am:#F0B85C;
--bg:#FBF8F3;--pn:#fff;--bd:#EDE6DA;--tx:#1F1A14;--mu:#6B6155;--ac:#B45309;--acs:#FDECC8;--ac2:#7C3D06;--bad:#B91C1C;--ok:#1F6F5C;--tr:#2B241D}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.dark{background:var(--dk);color:var(--dt);min-height:100vh}
.wrap{padding:16px 16px 40px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.warm{background:#FFF7E8;border-color:#F5DDB0}
.card.blue{background:#F2F6FB;border-color:#D6E2F0}
.h{font-size:15px;font-weight:800;margin:0}
.sub{font-size:12px;color:var(--mu);margin:0;line-height:1.55}
.row{display:flex;gap:8px;align-items:center}
.wrapx{flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid #E3D9CA;background:#fff;color:#3A322A;font-size:13px}
.chip.on{background:var(--acs);border-color:var(--ac);color:var(--ac2);font-weight:800}
.n6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.n{min-height:40px;border-radius:10px;border:1px solid #E3D9CA;background:#fff;font-size:14px;color:#3A322A;padding:0}
.n.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:800}
.n.red{background:var(--bad);border-color:var(--bad);color:#fff;font-weight:800}
.btn{min-height:46px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:800;font-size:14px;padding:0 16px}
.btn.ghost{background:#fff;border:1px solid #D8CCBA;color:#3A322A}
.btn.sm{min-height:36px;font-size:12px;padding:0 12px}
.btn.dark{background:var(--tr)}
.btn:disabled{opacity:.45}
input[type=text],input[type=number],textarea,select{width:100%;min-height:44px;border-radius:10px;border:1px solid #E3D9CA;padding:8px 12px;font-size:14px;background:#fff;color:var(--tx)}
textarea{min-height:64px;resize:vertical}
label.l{font-size:12px;color:var(--mu);font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 4px}
.brand{font-weight:900;font-size:15px;color:var(--ac)}
.link{background:none;border:0;color:var(--mu);font-size:13px;text-decoration:underline;min-height:44px;padding:0 4px}
.mv{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid #F3EEE6;font-size:14px;gap:8px}
.gone{text-decoration:line-through;color:#8A8074}
.stamp{width:34px;height:34px;border-radius:17px;border:1.5px dashed #D8CCBA;display:flex;align-items:center;justify-content:center;font-size:10px;color:#8A8074}
.stamp.ok{border:1.5px solid var(--ac);background:var(--acs);color:var(--ac2);font-weight:800}
.day{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-size:12px;color:var(--mu)}
.day.hl{background:#FDE68A;color:#5B3A06;font-weight:800}
.wk{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:var(--mu)}
.knot{width:100%;height:8px;border-radius:4px;background:#EDE6DA}
.knot.a{background:var(--ac)}.knot.b{background:#F0B85C}
.pill{background:#F4F2EE;border-radius:10px;padding:8px 10px}
.pill b{display:block;font-size:11px;color:var(--mu)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tr);color:#fff;padding:12px 16px;border-radius:12px;font-size:13px;z-index:99;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.demo{background:#2B241D;color:#F0B85C;font-size:11px;padding:6px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo button{min-height:28px;border-radius:8px;border:1px solid #5A4E42;background:transparent;color:#E8E1D6;font-size:11px;padding:0 8px}
.demo button.on{background:#F0B85C;color:#2B241D;border-color:#F0B85C;font-weight:800}
/* 필승전략 */
.winb{min-height:54px;border-radius:12px;border:1px solid #E3D9CA;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;color:var(--tx)}
.winb b{font-size:13px;color:var(--ac)}.winb span{font-size:12px}
.winb.on{background:#2B241D;border-color:#2B241D}.winb.on b{color:#F0B85C}.winb.on span{color:#fff}
.winbg{position:fixed;inset:0;background:rgba(28,23,18,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.winpop{text-align:left;width:100%;max-width:480px;max-height:86vh;overflow:auto;background:#FBF8F3;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.wsec{background:#fff;border:1px solid #EDE6DA;border-radius:14px;padding:10px 12px}
.wk{font-size:13px;font-weight:900;margin:0 0 4px}.wa{margin:0;font-size:15px;font-weight:800;line-height:1.5}
.wsec ul{margin:0;padding-left:18px;font-size:14px;line-height:1.65}
/* 일일 스케줄 */
.schr{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;align-items:center;padding:6px 2px;border-bottom:1px solid #F3EEE6}
.schr.now{background:#FFF7E8;border-radius:8px}.schr.now .scht{color:var(--ac);font-weight:900}
.scht{font-size:12px;color:var(--mu)}.schc{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.schi{min-height:36px;border-radius:10px;border:1px solid #E3D9CA;background:#fff;font-size:13px;padding:0 10px;text-align:left}
.schi.완료{background:#DCFCE7;border-color:#BBF7D0}.schi.노쇼{background:#FDECEC;border-color:#F5C2C2;color:#B91C1C}.schi.취소{text-decoration:line-through;color:#9CA3AF}
.schadd{min-height:36px;min-width:36px;border-radius:10px;border:1px dashed #D8CCBA;background:none;color:var(--mu);font-size:16px;margin-left:auto}
/* 운동 기록 */
.srow{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 44px 44px;gap:6px;align-items:center}
.srow.hd{font-size:10px;color:var(--mu);text-align:center}
.tb{min-height:40px;border-radius:8px;border:0;font-size:11px;font-weight:900;padding:0}
.tb.W{background:#EDE6DA;color:#6B6155}.tb.M{background:#FDECC8;color:#7C3D06}.tb.SL{background:#B91C1C;color:#fff}
input.sin{min-height:42px;padding:0 6px;text-align:center;font-weight:800;font-size:15px}
input.sin::placeholder{color:#B9AD9C;font-weight:700}
.ckb{height:42px;border-radius:12px;border:1.5px solid #D8CCBA;background:#fff;font-size:16px;font-weight:900;color:#B9AD9C;padding:0}
.ckb.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mini{min-height:40px;min-width:40px;border-radius:10px;border:1px solid #E3D9CA;background:#fff;font-size:12px;font-weight:800;color:var(--mu);padding:0 6px}
.mini.on{background:var(--acs);border-color:var(--ac);color:var(--ac2)}
.mini:disabled{opacity:.3}
.zone{font-size:10px;font-weight:800;margin:-2px 0 2px 46px}
.zl{border-radius:6px;padding:3px 6px}
.cue{font-size:13px;background:#FFF7E8;border-radius:10px;padding:8px 10px;color:var(--ac2);margin:0;line-height:1.5}
.add{flex:1;min-height:38px;border-radius:10px;border:1px dashed #D8CCBA;background:none;font-size:12px;color:var(--mu)}
/* 여정 지도 */
.map{position:relative;width:100%;max-width:390px;height:560px;margin:0 auto}
.node{position:absolute;display:flex;align-items:center;gap:12px;background:none;border:0;padding:8px;margin:-8px;-webkit-tap-highlight-color:rgba(240,184,92,.25);color:inherit;text-align:left}
.node.r{flex-direction:row-reverse;text-align:right}
.orb{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.badge{font-size:10px;font-weight:800;border-radius:6px;padding:2px 6px;display:inline-block;margin-top:2px}
/* 트레이너 */
.tbar{background:var(--tr);color:#fff;padding:16px;display:flex;flex-direction:column;gap:4px}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:40px;border-radius:10px;border:1px solid #5A4E42;background:transparent;color:#E8E1D6;font-size:13px}
.tab.on{background:var(--am);color:var(--tr);border-color:var(--am);font-weight:800}
.st{flex:1;min-height:52px;border-radius:12px;border:1px solid #E3D9CA;background:#fff;font-size:11px;color:#3A322A;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.st b{font-size:15px}
.st.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:800}
.st.own{background:var(--tr);border-color:var(--tr);color:#fff;font-weight:800}
.st.ok{background:var(--acs);border-color:var(--ac);color:var(--ac2);font-weight:800}
.st.past{background:#F4F2EE;color:var(--mu)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border-radius:12px;border:1px solid var(--bd);background:#fff;text-align:left;width:100%}
.fb{font-size:13px;padding:8px 0;border-top:1px solid #F3EEE6;display:flex;gap:8px;justify-content:space-between}
.tag{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:13px;min-height:44px;padding:10px 0 0;border:0;border-top:1px solid #F3EEE6;background:none;text-align:left;color:var(--tx);width:100%}
.box{width:20px;height:20px;border-radius:6px;border:1.5px solid #B9AD9C;flex:none}
.box.on{background:var(--ac);border-color:var(--ac)}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
const OTA = (function(){
  const T8={
   "111":{n:"열정 엔진",risk:false,start:"스스로 설계하는 시작",one:"이미 운동을 즐길 준비가 되어 있어요. 목표는 회원님이 정하고, 센터는 안전과 회복을 맡아요.",rx:"회원이 도전을 설계, 트레이너는 안전·회복만. 휴식 주 계획",warn:"강박적 열정(통증 참기·쉬는 날 불안) 살피기",reg:"장기 플랜도 회원이 먼저 말할 가능성 높음. 조건만 정직하게",call:"새 무대(대회·러닝)·장기 플랜 안내"},
   "101":{n:"분투형",risk:true,start:"속도를 조절하며 쌓는 시작",one:"의욕이 커서 오히려 처음 4주는 일부러 천천히 가요. 그래야 오래 가요.",rx:"강도 한 단계 낮춰 성공 경험부터. 계획은 작게 쪼개기",warn:"가장 위험한 칸. 혼자 무리·3~6주 차 이탈. 의욕 말고 속도를 칭찬",reg:"등록이 빠를 수 있음. 낙관적 숫자 금지, 정체기 먼저 말하기",call:"‘천천히 가는 첫 4주’와 정체기를 미리 설명"},
   "011":{n:"정체된 성실파",risk:false,start:"새 기술로 다시 불붙는 시작",one:"꾸준함은 이미 충분해요. 4주마다 새로 배울 것 하나로 지루함을 깨요.",rx:"도전 손잡이(템포·범위·균형·새 기술)를 회원이 고르게",warn:"같은 루틴이 계속되면 출석이 조용히 빠짐",reg:"‘새로 배울 것’이 등록 이유가 됨",call:"새로 배울 기술 하나를 미리 보여 주기"},
   "001":{n:"출발선형",risk:false,start:"작고 정교한 첫걸음",one:"하고 싶은 마음이 준비돼 있어요. 처음 2주는 세 동작만 내 것으로 만들어요.",rx:"첫 경험을 정교하게. 미세 몰입 → 몰입 블록. 계획은 회원이 말하게",warn:"계획을 크게 세우기 쉬움(계획 오류)",reg:"등록 의향 높음. 단계와 재측정 날짜만 보여 주면 충분",call:"첫 2주 3동작 플랜 + 재측정 날짜 안내"},
   "100":{n:"회피형",risk:true,start:"편안함부터 시작",one:"힘든 건 하지 않아요. 싫은 동작은 빼고, 몸 상태만 같이 봐요.",rx:"관계 맺기부터. 실패 없는 쉬운 경험, 사람 적은 자리",warn:"필요성 설득·위협은 회피를 굳힘",reg:"오늘은 등록 대화 금지. 다음 약속만",call:"등록 권유 금지. ‘편한 강도로 한 번 더’ 체험 초대만"},
   "110":{n:"간헐형",risk:false,start:"요일부터 고정하는 시작",one:"오시면 잘하실 분이에요. 강도보다 ‘오는 요일’을 지키는 게 먼저예요.",rx:"강도보다 빈도 설계. 15분 최소 루틴, 고정 요일",warn:"‘오면 잘하니까’ 방치하면 한 달씩 빔",reg:"월 단위·소회차부터",call:"가능한 고정 요일 묻기 + 15분 버전 소개"},
   "000":{n:"관망형",risk:false,start:"내가 아끼는 것에서 출발",one:"운동 얘기는 잠깐 두고, 회원님이 아끼는 시간과 연결되는 움직임부터 찾아요.",rx:"가치 듣기, 놀이 요소, 회원 선택지",warn:"정보를 쏟아붓는 순간 대화가 끝남",reg:"등록 대화 금지. 다시 만날 이유 하나만",call:"운동 정보 대신 ‘아끼는 시간’ 질문. 소식은 1회만"},
   "010":{n:"휴면 경험자",risk:false,start:"예전 감각을 되찾는 시작",one:"해 본 경험이 있으세요. 예전 리듬으로, 지금 몸에 맞는 강도로 다시 시작해요.",rx:"그만둔 이유와 다시 하면 좋을 점(의미) 대화",warn:"예전 기준 강도는 실망을 부름",reg:"‘다시 시작’ 프레임, 소회차",call:"예전에 좋았던 운동 묻기, ‘다시 시작’ 소회차"}};
  const JM={1:{n:"몸 풀기",two:"힘든 건 하지 않아요. 20~30분, 싫은 동작은 빼고 몸 상태만 같이 봐요."},
    2:{n:"재미 찾기",two:"1~2분짜리 작은 도전으로 ‘어, 재밌네’를 찾아요. 고르는 건 회원님이에요."},
    3:{n:"첫 몰입",two:"한 세션 안에 시간 가는 줄 모르는 5~15분을 만들어요. 세트마다 목표는 하나만."},
    4:{n:"일상",two:"주 2~3회 리듬을 만들고 4주마다 새 기술 하나. 바쁜 주엔 15분 버전으로 이어요."},
    5:{n:"나만의 무대",two:"분기 목표는 회원님이 정하고, 센터는 안전과 회복을 맡아요."}};
  const ZONES={"2,0":"불안","2,1":"각성","2,2":"몰입","1,0":"걱정","1,1":"전환 지대","1,2":"통제","0,0":"무관심","0,1":"지루함","0,2":"이완"};
  const STN={1:"전숙고",2:"숙고",3:"준비",4:"실행",5:"유지"};
  const clamp=v=>Math.max(0,Math.min(10,v)), lvl=v=>v<3.7?0:v>=6.3?2:1;
  function compute(a){
    let st=null;
    if(a.q1===true) st=a.q11===true?5:a.q11===false?4:null;
    else if(a.q1===false){ if(a.q2===false) st=1; else if(a.q2===true) st=a.q3===true?3:a.q3===false?2:null; }
    const need=['imp','conf','burden','exp','diff','can','pri','time'];
    if(st===null||need.some(k=>a[k]==null)) return null;
    const ct=(a.want||[]).length, stt=(a.hard||[]).length, cost=(a.hard||[]).includes('비용이 부담돼요')?2:null;
    const C=clamp(a.burden*0.4+a.diff*0.6), Sk=clamp(a.conf*0.35+a.can*0.4+a.exp*0.25);
    const parts=[[a.pri,.35],[a.time,.3],[a.imp,.2]]; if(cost!==null) parts.push([cost,.15]);
    const ws=parts.reduce((s,p)=>s+p[1],0); let I=parts.reduce((s,p)=>s+p[0]*p[1],0)/ws;
    I=clamp(I+Math.max(-1.5,Math.min(1.5,(ct-stt)*0.3)));
    const zone=ZONES[lvl(C)+","+lvl(Sk)]; let start=st; const notes=[];
    if((zone==="불안"||zone==="걱정")&&start>2){start=2;notes.push(`지도 위치가 ${zone}이라 ② 재미 찾기로 낮춰 시작`)}
    if(zone==="무관심"&&a.imp<=3&&start>1){start=1;notes.push("무관심 영역 + 중요도 3 이하 → ① 몸 풀기")}
    if(stt>=2&&stt>=ct*2&&start>1){start--;notes.push(`망설임(${stt})이 원하는 이유(${ct})의 두 배 이상 → 한 구간 낮춤`)}
    const k=(C>=5?"1":"0")+(Sk>=5?"1":"0")+(I>=5?"1":"0"); const tp=Object.assign({k},T8[k]);
    if(k==="101"&&start>3){start=3;notes.push("분투형 → ③ 이상 올리지 않음")}
    const edge=[["도전",C],["기술",Sk],["투자 의지",I]].filter(x=>Math.abs(x[1]-5)<0.7).map(x=>x[0]);

  const f={boot:vBoot,login:vLogin,code:vCode,staffReq:vStaffReq,pending:vPending,joined:vLaunch,launch:vLaunch,home:vHome,rec:vRec,recEdit:vRecEdit,trainer:vTrainer,err:vErr}[S.scr]||vBoot;
  if(Array.isArray(S.fb))S.fb.forEach(x=>{if(x&&!x.data)x.data={}});
  let h;
  try{h=f()}catch(e){
    console.error(e);
    h=`<div class="wrap" style="padding-top:40px"><div class="card"><p class="h">화면을 여는 중 문제가 생겼어요</p><p class="sub">${esc(String(e&&e.message||e))}</p><p class="sub" style="font-size:11px">이 문장을 캡처해서 알려 주시면 바로 고칠게요.</p><button class="btn" data-a="toMap">여정 지도로</button></div></div>`;
  }
  const html=demoBar()+h;
  if(html===S._lastHtml&&a.innerHTML)return;
  S._lastHtml=html;a.innerHTML=html;
}

  return `<div class="wrap"><button class="link" style="align-self:flex-start" data-a="trBack">◀ 회원 목록</button>
  <div class="card"><p class="h">${esc(m.name)} · 지금 구간</p><div class="row" style="gap:5px">${stBtns}</div><p class="sub">회원 화면에는 구간 이론 이름이 보이지 않아요(“${J[st].name}”로만). 구간을 내려도 승인한 여정은 그대로예요.</p></div>
  <div class="card"><p class="h">여정 접근 승인</p><p class="sub">${PAST_OK[st]?'이 구간은 지나온 여정을 다시 볼 수 있어요.':'이 구간은 자기 여정만 열려요.'} 다른 여정은 여기서 승인해요.</p><div class="row" style="gap:5px">${accBtns}</div>
  <div class="row"><span class="sub">승인 주체</span>${['trainer','center'].map(r=>`<button class="chip${u.role===r?' on':''}" data-a="trUi" data-k="role" data-v="${r}">${r==='trainer'?'트레이너':'센터'}</button>`).join('')}</div>
  ${(d.access||[]).slice(0,6).map(a=>`<p class="sub">여정 ${a.stage} · ${a.role==='code'?'가입 코드':a.role==='center'?'센터 승인':'트레이너 승인'} · ${String(a.at).slice(0,10)}${a.revoked?' · 취소 '+String(a.revoked).slice(0,10):''}</p>`).join('')}</div>
  <div class="card" style="border:1.5px solid var(--ac)"><p class="h">수업 기록지 · 종목 끝</p>
  <label class="l" for="tex">종목</label><input id="tex" type="text" list="exs" value="${esc(u.ex)}" placeholder="종목 이름" data-in="tex"><datalist id="exs">${(u.exs||[]).map(x=>`<option value="${esc(x)}">`).join('')}</datalist>
  <div class="row" style="justify-content:space-between"><b style="font-size:13px">PD · 얼마나 어려웠나 (기술·인지 포함)</b><b style="color:var(--ac)">${u.pd??''}</b></div>${row('pd')}<p class="sub">${u.pd!=null?PDT[u.pd]:''}</p>
  <div class="row" style="justify-content:space-between"><b style="font-size:13px">SE · 한 세트 더 해낼 자신감</b><b style="color:var(--ac)">${u.se??''}</b></div>${row('se')}<p class="sub">${u.se!=null?SET[u.se]:''}</p>
  <div class="row" style="justify-content:space-between"><b style="font-size:13px">VAS · 통증</b><b style="color:var(--bad)">${u.vas??0}</b></div>${row('vas')}
  ${z?`<div style="background:${z.bg};border-radius:12px;padding:12px"><p style="margin:0;font-size:11px;font-weight:800;color:var(--mu)">다음 수업 제안</p><p class="h">${esc(z.z)}</p><p style="margin:4px 0 0;font-size:13px">${esc(z.t)}</p></div>`:''}
  <button class="btn" data-a="trSavePdse" ${u.pd==null||u.se==null?'disabled':''}>기록지에 저장</button><p class="sub">${st>=3?'구간 ③ 이상 회원은 앱에서 직접 남긴 값도 아래 기록에 같이 보여요.':'구간 ①~② 회원은 트레이너가 칩으로 기록해요.'}</p></div>
  <div class="card"><p class="h">회원이 한 말</p><div class="row">${['change','sustain'].map(k=>`<button class="chip${u.talk===k?' on':''}" data-a="trUi" data-k="talk" data-v="${k}">${k==='change'?'변화 대화':'유지 대화'}</button>`).join('')}</div><input id="ttk" type="text" placeholder="회원의 말 그대로"><button class="btn ghost" data-a="trTalk">남기기</button></div>
  <div class="card"><p class="h">다음 구간으로 넘어가는 신호</p><p class="sub">날짜가 아니라 회원의 말과 행동으로 판단해요.</p>${sig}</div>
  <div class="card"><p class="h">몰입 지도 추이</p>${flowMap(d.feedback||[])}</div>
  <div class="card"><p class="h">OT 판정</p>${otTxt}</div>
  ${(d.workouts||[]).length?`<div class="card"><p class="h">WLP 운동 기록</p>${d.workouts.map(w=>`<div class="fb"><span>${esc(w.session_date.slice(5).replace('-','/'))}${w.source==='rune'?' · 룬PT':''}${(w.extra||{}).alert?' <span class="tag" style="background:#FDECEC;color:#B91C1C">회복 신호</span>':''}</span><span class="sub" style="text-align:right">${(w.items||[]).map(it=>esc(exName(it))+' '+fmtSet(topSet(it))).join(' · ')}</span></div>`).join('')}</div>`:''}
  <div class="card"><p class="h">최근 기록</p>${(d.feedback||[]).slice(0,40).map(fbText).join('')||'<p class="sub">아직 없어요.</p>'}</div></div>`;
}
async function trWrite(fn,args,ok){
  if(DEMO){ok&&ok();render();toast('시험 모드: 화면에만 반영했어요');return}
  const r=await sb.rpc(fn,args);if(r.error){toast(sbErr(r.error));return}
  toast('저장했어요');await loadTrainer();if(S.tr.sel)await loadDetail(S.tr.sel);
}
async function trAddFb(row){
  const r0=Object.assign({member_id:S.tr.sel,entered_by:'trainer',session_date:today(),data:{}},row);
  if(DEMO){r0.id=Date.now();r0.created_at=new Date().toISOString();S.tr.detail.feedback.unshift(r0);toast('시험 모드: 화면에만 저장했어요');render();return}
  const r=await sb.from('wlp_feedback').insert(r0).select('*').single();
  if(r.error){toast(sbErr(r.error));return}
  S.tr.detail.feedback.unshift(r.data);toast('저장했어요');render();
}

/* ===== 이벤트 ===== */
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k==='trq'){S.tr.q=e.target.value;const p=e.target.selectionStart;render();const el=document.getElementById('trq');if(el){el.focus();el.setSelectionRange(p,p)}}if(k==='tex')S.tr.ui.ex=e.target.value;if(k==='otAt'){S.tr.ropt=e.target.value;const b=document.querySelector('[data-a=sendReply]');if(b)b.disabled=!e.target.value.trim()}});
document.addEventListener('change',e=>{if(e.target.id==='pex')S.ui.pex=e.target.value});
document.addEventListener('input',e=>{if(e.target.id==='sname'||e.target.id==='sphone')S.ui[e.target.id]=e.target.value});
let _down=null;
document.addEventListener('pointerdown',e=>{const x=e.target.closest&&e.target.closest('[data-a]');_down=x?{el:x,a:x.dataset.a,v:x.dataset.v,t:Date.now()}:null},true);
// 손가락을 누르는 사이 화면이 다시 그려져(예: OT 알림 도착) 버튼이 바뀌면 브라우저가 클릭을 버림 → 같은 버튼을 찾아 대신 눌러 줌
document.addEventListener('pointerup',e=>{
  const d=_down;if(!d||document.contains(d.el)||Date.now()-d.t>800)return;
  const q='[data-a="'+d.a+'"]'+(d.v!=null?'[data-v="'+String(d.v).replace(/"/g,'\\"')+'"]':'');
  const nb=document.querySelector(q),under=document.elementFromPoint(e.clientX,e.clientY),u=under&&under.closest&&under.closest('[data-a]');
  if(nb&&u===nb){_down=null;setTimeout(()=>nb.click(),0)}
},true);
document.addEventListener('click',async e=>{
  let b=e.target.closest('[data-a]');
  if(!b&&_down&&Date.now()-_down.t<800){const q='[data-a="'+_down.a+'"]'+(_down.v!=null?'[data-v="'+String(_down.v).replace(/"/g,'\\"')+'"]':'');b=document.querySelector(q)}
  _down=null;
  if(!b)return;const a=b.dataset.a,v=b.dataset.v,val=id=>(document.getElementById(id)||{}).value||'';
  const A={
    reload:()=>location.reload(),
    login:()=>{if(!sb){toast('로그인은 upvible.github.io 주소에서만 동작해요');return}sb.auth.signInWithOAuth({provider:v,options:{redirectTo:BASE+'index.html'+(S.code?'?code='+encodeURIComponent(S.code):''),queryParams:v==='kakao'?{prompt:'login'}:{prompt:'select_account'}}}).then(r=>{if(r.error)toast('로그인을 시작하지 못했어요: '+r.error.message)})},
    logout:async()=>{if(DEMO){S.scr='code';render();return}try{await sb.auth.signOut({scope:'local'})}catch(e){}try{localStorage.removeItem('wlp-auth')}catch(e){}location.href=BASE+'index.html'},
    redeem,
    closeJoined:()=>{S.scr='launch';render()},
    openStage:()=>{S.view=+v;S.ui={pex:recentExNames()[0]||''};S.scr='home';render();window.scrollTo(0,0)},
    locked:()=>toast('트레이너나 센터가 승인하면 열려요'),
    toMap:()=>{S.scr='launch';render();window.scrollTo(0,0)},
    goTrainer:()=>{if(!isStaff()){toast('직원 계정만 들어갈 수 있어요. 직원 코드를 받았다면 로그아웃 후 코드 입력 화면에서 넣어 주세요');return}S.scr='trainer';S.tr.sel=null;render();loadTrainer()},
    demoStage:()=>{S.stage=+v;S.scr='launch';render()},
    demoCode:()=>{S.stage=null;S.scr='code';S.code='RUNE-7K2Q';S.codeMsg='';render()},
    ui:()=>{const k=b.dataset.k;S.ui[k]=isNaN(+v)?v:+v;render()},
    dislike:()=>{S.ui.dis=Object.assign({},S.ui.dis,{[v]:true});addFb({kind:'dislike',exercise:v})},
    word:()=>addFb({kind:'word',data:{word:v}}),
    fun:()=>addFb({kind:'fun',exercise:v}),
    saveNum:()=>{const g=+val('ng'),ac=+val('na'),m=val('nm').trim()||'플랭크';if(!val('na')){toast('실제로 해 본 숫자를 적어 주세요');return}addFb({kind:'number',data:{metric:m,guess:val('ng')?g:null,actual:ac}})},
    savePdse:()=>{const u=S.ui,ex=(document.getElementById('pex')||{}).value||null;addFb({kind:'pdse',exercise:ex,pd:u.pd,se:u.se,vas:u.vas||0}).then(ok=>{if(ok){S.ui.pd=null;S.ui.se=null;S.ui.vas=0;render()}})},
    saveLine:()=>{const t=val('ln').trim();if(t)addFb({kind:'line',data:{text:t}})},
    saveGoal4:()=>{const t=val('g4').trim();if(t)addFb({kind:'goal4w',data:{way:S.ui.way||'',text:t}})},
    mini15:()=>addFb({kind:'mini15'}),
    saveLife:()=>{const t=val('lf').trim();if(t)addFb({kind:'life',data:{text:t}})},
    saveQgoal:()=>{const t=val('qg').trim();if(t)addFb({kind:'qgoal',data:{text:t}})},
    saveRetro:()=>addFb({kind:'retro',data:{good:val('r1'),learn:val('r2'),next:val('r3')}}),
    trTab:()=>{S.tr.tab=v;S.tr.sel=null;S.tr.openCase=null;render()},
    trSel:()=>loadDetail(v),
    trBack:()=>{S.tr.sel=null;render()},
    trUi:()=>{const k=b.dataset.k;S.tr.ui[k]=isNaN(+v)?v:+v;render()},
    setStage:()=>trWrite('wlp_set_stage',{p_member:S.tr.sel,p_stage:+v},()=>{S.tr.detail.stage=+v;const m=S.tr.list.find(x=>x.member_id===S.tr.sel);if(m)m.stage=+v}),
    toggleAcc:()=>{const d=S.tr.detail,on=!(d.access||[]).some(a=>!a.revoked&&a.role!=='code'&&a.stage===+v);
      trWrite('wlp_set_access',{p_member:S.tr.sel,p_stage:+v,p_on:on,p_role:S.tr.ui.role},()=>{if(on)d.access.unshift({stage:+v,role:S.tr.ui.role,at:new Date().toISOString(),revoked:null});else d.access.forEach(a=>{if(a.stage===+v&&!a.revoked&&a.role!=='code')a.revoked=new Date().toISOString()})})},
    cancelCode:()=>trWrite('wlp_cancel_code',{p_code:v},()=>{const x=S.tr.invites.find(i=>i.code===v);if(x)x.canceled_at=new Date().toISOString()}),
    trSavePdse:()=>{const u=S.tr.ui;trAddFb({kind:'pdse',exercise:val('tex').trim()||null,pd:u.pd,se:u.se,vas:u.vas||0}).then(()=>{u.pd=null;u.se=null;u.vas=0;render()})},
    trTalk:()=>{const t=val('ttk').trim();if(t)trAddFb({kind:'talk',data:{type:S.tr.ui.talk,text:t}})},
    signal:()=>{const st=S.tr.detail.stage;trAddFb({kind:'signal',data:{stage:st,idx:+v,text:SIGNALS[st][+v]}})},
    goTrainerOt:()=>{S.scr='trainer';S.tr.tab='ot';S.tr.sel=null;render();loadTrainer()},
    openCase:()=>{S.tr.openCase=+v;S.tr.rk=null;S.tr.ropt=null;render();window.scrollTo(0,0)},
    closeCase:()=>{S.tr.openCase=null;render()},
    otHide:()=>{try{sessionStorage.setItem('wlp-ot-hide',String(S.newCases||0))}catch(e){}render()},
    trSetJ:async()=>{const c=S.tr.cases.find(x=>x.id===S.tr.openCase);if(!c)return;const n=c.judged_stage===+v?null:+v;
      if(!DEMO){const r=await sb.rpc('wlp_set_judged',{p_case:c.id,p_stage:n});if(r.error||(r.data&&r.data.ok===false)){toast(r.error?sbErr(r.error):r.data.reason);return}}
      c.judged_stage=n;c.judged_type=n?'직접 수정':null;toast(n?'lv'+n+' '+JNM[n]+'(으)로 바꿨어요':'미판정으로 바꿨어요');render()},
    winOpen:()=>{S.tr.win=+v;render()},
    winClose:()=>{S.tr.win=null;render()},
    winStay:()=>{},
    trYm:()=>{S.tr.ym={y:Math.floor(+v/100),m:+v%100};S.tr.of='전체';render()},
    trOf:()=>{S.tr.of=v;render()},
    trProg:async()=>{const c=S.tr.cases.find(x=>x.id===S.tr.openCase),d=val('trPd').trim();
      if(DEMO){c.status=v;if(d){if(v==='OT1 완료')c.ot1_at=d;if(v==='OT2 완료')c.ot2_at=d;if(v==='PT 등록')c.pt_at=d}S.newCases=S.tr.cases.filter(x=>x.status==='응답 대기').length;render();toast('시험 모드: 화면에만 반영했어요');return}
      const r=await sb.rpc('wlp_set_progress',{p_case:c.id,p_status:v,p_date:d||null});if(r.error||(r.data&&r.data.ok===false)){toast(r.error?sbErr(r.error):'바꾸지 못했어요');return}toast('센터 OT 현황에도 반영됐어요');await loadTrainer()},
    rk:()=>{S.tr.rk=v;S.tr.ropt=null;render()},
    ropt:()=>{S.tr.ropt=v;render()},
    sendReply:async()=>{const t=S.tr,note=t.rk==='done'?(val('otAt').trim()||t.ropt):t.ropt;if(t.rk!=='contact'&&!note)return;
      if(DEMO){const c=t.cases.find(x=>x.id===t.openCase);if(t.rk==='back')t.cases=t.cases.filter(x=>x!==c);else{c.status=t.rk==='done'?'조율 완료':'연락 중';c.reply=(t.rk==='done'?'조율 완료 · ':'연락 중 · ')+(note||'');if(t.rk==='done')c.first_ot_at=note}
        S.newCases=t.cases.filter(x=>x.status==='응답 대기').length;t.openCase=t.rk==='done'?t.openCase:null;t.rk=null;render();toast('시험 모드: 화면에만 반영했어요');return}
      const r=await sb.rpc('wlp_respond',{p_case:t.openCase,p_kind:t.rk,p_note:note||null});if(r.error){toast(sbErr(r.error));return}
      toast('센터로 보냈어요');const keep=t.rk==='done';t.rk=null;t.ropt=null;if(!keep)t.openCase=null;await loadTrainer()},
    toStaffReq:()=>{S.scr='staffReq';render()},
    toCode:()=>{S.scr='code';render()},
    sendStaffReq:async()=>{const n=val('sname').trim(),ph=val('sphone').trim(),ti=S.ui.stitle;if(!n){toast('이름을 적어 주세요');return}
      if(DEMO){S.req={status:'대기',name:n,title:ti};S.scr='pending';render();return}
      const r=await sb.rpc('wlp_request_staff',{p_name:n,p_phone:ph,p_title:ti});if(r.error){toast(sbErr(r.error));return}
      const d=r.data||{};if(!d.ok){toast({already:'이미 직원으로 등록된 계정이에요',name:'이름을 적어 주세요',login:'먼저 로그인해 주세요'}[d.reason]||'보내지 못했어요');if(d.reason==='already')location.reload();return}
      S.req={status:'대기',name:n,title:ti};S.scr='pending';render()},
    noop:()=>{}
  };
  try{
  if(A[a]){e.preventDefault();await A[a]()}
  else if(typeof RA!=='undefined'&&RA[a]){e.preventDefault();await RA[a](b,v)}
  else if(typeof SCH_A!=='undefined'&&SCH_A[a]){e.preventDefault();await SCH_A[a](b,v)}
  }catch(err){console.error(err);toast('문제가 생겼어요: '+String(err&&err.message||err).slice(0,80))}
});
if(!DEMO)window.addEventListener('load',()=>{try{sb&&sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&s&&!S.uid){S.uid=s.user.id;loadMe()}})}catch(e){}});
render();boot();
</script>
