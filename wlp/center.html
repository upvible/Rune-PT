   "101":{n:"분투형",risk:true,start:"속도를 조절하며 쌓는 시작",one:"의욕이 커서 오히려 처음 4주는 일부러 천천히 가요. 그래야 오래 가요.",rx:"강도 한 단계 낮춰 성공 경험부터. 계획은 작게 쪼개기",warn:"가장 위험한 칸. 혼자 무리·3~6주 차 이탈. 의욕 말고 속도를 칭찬",reg:"등록이 빠를 수 있음. 낙관적 숫자 금지, 정체기 먼저 말하기",call:"‘천천히 가는 첫 4주’와 정체기를 미리 설명"},
   "011":{n:"정체된 성실파",risk:false,start:"새 기술로 다시 불붙는 시작",one:"꾸준함은 이미 충분해요. 4주마다 새로 배울 것 하나로 지루함을 깨요.",rx:"도전 손잡이(템포·범위·균형·새 기술)를 회원이 고르게",warn:"같은 루틴이 계속되면 출석이 조용히 빠짐",reg:"‘새로 배울 것’이 등록 이유가 됨",call:"새로 배울 기술 하나를 미리 보여 주기"},
   "001":{n:"출발선형",risk:false,start:"작고 정교한 첫걸음",one:"하고 싶은 마음이 준비돼 있어요. 처음 2주는 세 동작만 내 것으로 만들어요.",rx:"첫 경험을 정교하게. 미세 몰입 → 몰입 블록. 계획은 회원이 말하게",warn:"계획을 크게 세우기 쉬움(계획 오류)",reg:"등록 의향 높음. 단계와 재측정 날짜만 보여 주면 충분",call:"첫 2주 3동작 플랜 + 재측정 날짜 안내"},

   "110":{n:"간헐형",risk:false,start:"요일부터 고정하는 시작",one:"오시면 잘하실 분이에요. 강도보다 ‘오는 요일’을 지키는 게 먼저예요.",rx:"강도보다 빈도 설계. 15분 최소 루틴, 고정 요일",warn:"‘오면 잘하니까’ 방치하면 한 달씩 빔",reg:"월 단위·소회차부터",call:"가능한 고정 요일 묻기 + 15분 버전 소개"},
   "000":{n:"관망형",risk:false,start:"내가 아끼는 것에서 출발",one:"운동 얘기는 잠깐 두고, 회원님이 아끼는 시간과 연결되는 움직임부터 찾아요.",rx:"가치 듣기, 놀이 요소, 회원 선택지",warn:"정보를 쏟아붓는 순간 대화가 끝남",reg:"등록 대화 금지. 다시 만날 이유 하나만",call:"운동 정보 대신 ‘아끼는 시간’ 질문. 소식은 1회만"},

  const JM={1:{n:"몸 풀기",two:"힘든 건 하지 않아요. 20~30분, 싫은 동작은 빼고 몸 상태만 같이 봐요."},
    2:{n:"재미 찾기",two:"1~2분짜리 작은 도전으로 ‘어, 재밌네’를 찾아요. 고르는 건 회원님이에요."},

    4:{n:"일상",two:"주 2~3회 리듬을 만들고 4주마다 새 기술 하나. 바쁜 주엔 15분 버전으로 이어요."},
    5:{n:"나만의 무대",two:"분기 목표는 회원님이 정하고, 센터는 안전과 회복을 맡아요."}};
  const ZONES={"2,0":"불안","2,1":"각성","2,2":"몰입","1,0":"걱정","1,1":"전환 지대","1,2":"통제","0,0":"무관심","0,1":"지루함","0,2":"이완"};
  const STN={1:"전숙고",2:"숙고",3:"준비",4:"실행",5:"유지"};
  const clamp=v=>Math.max(0,Math.min(10,v)), lvl=v=>v<3.7?0:v>=6.3?2:1;
  function compute(a){
    let st=null;
    if(a.q1===true) st=a.q11===true?5:a.q11===false?4:null;
    else if(a.q1===false){ if(a.q2===false) st=1; else if(a.q2===true) st=a.q3===true?3:a.q3===false?2:null; }
    const need=['imp','conf','burden','exp','diff','can','pri','time'];
    if(st===null||need.some(k=>a[k]==null)) return null;
    const ct=(a.want||[]).length, stt=(a.hard||[]).length, cost=(a.hard||[]).includes('비용이 부담돼요')?2:null;
    const C=clamp(a.burden*0.4+a.diff*0.6), Sk=clamp(a.conf*0.35+a.can*0.4+a.exp*0.25);
    const parts=[[a.pri,.35],[a.time,.3],[a.imp,.2]]; if(cost!==null) parts.push([cost,.15]);
    const ws=parts.reduce((s,p)=>s+p[1],0); let I=parts.reduce((s,p)=>s+p[0]*p[1],0)/ws;
    I=clamp(I+Math.max(-1.5,Math.min(1.5,(ct-stt)*0.3)));
    const zone=ZONES[lvl(C)+","+lvl(Sk)]; let start=st; const notes=[];
    if((zone==="불안"||zone==="걱정")&&start>2){start=2;notes.push(`지도 위치가 ${zone}이라 ② 재미 찾기로 낮춰 시작`)}
    if(zone==="무관심"&&a.imp<=3&&start>1){start=1;notes.push("무관심 영역 + 중요도 3 이하 → ① 몸 풀기")}
    if(stt>=2&&stt>=ct*2&&start>1){start--;notes.push(`망설임(${stt})이 원하는 이유(${ct})의 두 배 이상 → 한 구간 낮춤`)}
    const k=(C>=5?"1":"0")+(Sk>=5?"1":"0")+(I>=5?"1":"0"); const tp=Object.assign({k},T8[k]);
    if(k==="101"&&start>3){start=3;notes.push("분투형 → ③ 이상 올리지 않음")}
    const edge=[["도전",C],["기술",Sk],["투자 의지",I]].filter(x=>Math.abs(x[1]-5)<0.7).map(x=>x[0]);
    if(edge.length) notes.push(`${edge.join(" · ")} 축이 경계선 → OT에서 다시 판정`);
    return {st,stName:STN[st],C,Sk,I,ct,stt,zone,start,tp,notes,jm:JM[start]};
  }
  const PRESETS={

    B:{label:'의욕 넘치는 초보',q1:false,q2:true,q3:true,q11:null,imp:10,conf:6,burden:6,exp:0,diff:6,can:4,pri:9,time:6,want:['몸이 가벼워지고 싶어요','체력을 키우고 싶어요','보기 좋은 몸을 만들고 싶어요','오래 건강하고 싶어요'],hard:['혼자는 꾸준히 못 해요'],dir:['체지방·체중','근력'],days:['월','수','금'],slots:['저녁'],name:'이OO',phone:'010-2345-6789',c1:true,c2:true},
    C:{label:'쉬고 있는 경험자',q1:false,q2:true,q3:false,q11:null,imp:6,conf:8,burden:2,exp:9,diff:2,can:8,pri:3,time:3,want:['아픈 곳을 줄이고 싶어요','체력을 키우고 싶어요'],hard:['시간이 없어요','혼자는 꾸준히 못 해요'],dir:['통증·불편 줄이기'],days:['화','목'],slots:['오전'],name:'박OO',phone:'010-3456-7890',c1:true,c2:false}};
  const MW6={"111":"주 4회 이상도 좋아요. 대신 쉬는 날 하루를 먼저 정해요. 쉬는 것도 계획이에요.","101":"처음 2주는 PT 2회 + 혼자 15분 1회. 2주가 지켜지면 그때 늘려요.","011":"지금 리듬은 그대로, 네 번 중 한 번은 새 기술을 배우는 날로 바꿔요.","001":"PT 2회 + 혼자 2회(사진 한 장짜리 세 동작). 혼자 하는 날은 15분이면 충분해요.","100":"횟수 목표는 없어요. 편한 강도로 한 번 더 만나는 것부터 시작해요.","110":"고정 요일 2회부터. 2주가 지켜지면 15분 버전 2회를 더해요.","000":"운동 계획보다, 요즘 가장 아끼는 시간이 언제인지부터 이야기해요.","010":"예전에 하던 리듬으로, 강도는 지금 몸에 맞게 다시 시작해요."};
  return {T8,JM,ZONES,STN,compute,PRESETS,MW6};
})();

 '010':'[WLP] {n}님, 예전에 좋았던 운동을 지금 몸에 맞게 다시 시작하는 짧은 플랜을 리포트에 담아 두었어요.',

async function boot(){
  if(DEMO){demo();render();return}

  if(!data||!data.session){S.scr='login';render();return}
  const r=await sb.rpc('wlp_me');if(r.error){S.scr='err';S.err=errText(r.error);render();return}
  S.me=r.data;S.me.uid=data.session.user.id;
  if(S.me.role!=='center'){S.scr=S.me.center_exists?'deny':'bootstrap';render();return}
  S.scr='app';render();loadAll();
}
async function loadAll(){
  if(DEMO){render();return}
  const [l,c,s,k,q]=await Promise.all([sb.from('wlp_leads').select('*').order('created_at',{ascending:false}).limit(500),sb.rpc('wlp_cases'),sb.rpc('wlp_staff_list'),sb.rpc('wlp_my_codes'),sb.rpc('wlp_staff_requests_list')]);
  if(l.error){toast(errText(l.error));return}
  S.leads=l.data||[];S.cases=c.data||[];S.staff=s.data||[];S.codes=k.data||[];S.reqs=q.error?[]:(q.data||[]);render();
}
async function loadEvents(id){if(DEMO){S.ev[id]=S.ev[id]||[{action:'설문 제출',created_at:new Date().toISOString()}];render();return}
  const r=await sb.from('wlp_lead_events').select('*').eq('lead_id',id).order('created_at');S.ev[id]=r.data||[];render()}
async function call(fn,args,demoFn){
  if(DEMO){demoFn&&demoFn();render();toast('시험 모드: 화면에만 반영했어요');return true}
  const r=await sb.rpc(fn,args);if(r.error){toast(errText(r.error));return false}
  await loadAll();return r.data===undefined?true:(r.data??true);
}

    <div class="card"><p class="h">${C.status==='재배정 요청'?'다시 배정 (반송한 트레이너 제외)':can?'담당 트레이너 배정':'배정됨 · '+esc(staffName(C.trainer_id))}</p>
    <div class="trs">${trainers.map(tr=>{const ex=(C.returned_by||[]).includes(tr.user_id),load=S.cases.filter(x=>x.trainer_id===tr.user_id&&['응답 대기','연락 중'].includes(x.status)).length;
      return `<button class="tr${ex||!can?' no':S.pickT===tr.user_id?' on':''}" data-a="${ex||!can?'noop':'pickT'}" data-v="${tr.user_id}"><b>${esc(tr.name)}${ex?' (반송)':''}</b><span class="sub">진행 ${load}건</span></button>`}).join('')||'<p class="sub">직원·코드 탭에서 트레이너를 먼저 등록해 주세요.</p>'}</div>
    <button class="btn" data-a="assign" ${can&&S.pickT?'':'disabled'}>배정 + 스케줄 조율 요청 보내기</button><p class="sub">트레이너가 WLP 앱(M)에 들어가면 알림이 떠요.</p></div>
    <div class="card"><p class="h">기록</p>${(C.events||[]).map(e=>`<p class="sub">${md(e.at)} · ${esc(e.action)}${e.note?' · '+esc(e.note):''}</p>`).join('')}</div>`}
  const stats=trainers.map(tr=>{const mine=S.cases.filter(x=>x.trainer_id===tr.user_id),late=mine.some(x=>x.status==='응답 대기'&&hoursSince(x.assigned_at)>=24);
    return `<tr><td>${esc(tr.name)}</td><td style="${late?'color:#B91C1C;font-weight:800':''}">${mine.filter(x=>x.status==='응답 대기').length}</td><td>${mine.filter(x=>x.status==='연락 중').length}</td><td>${mine.filter(x=>x.status==='조율 완료').length}</td><td>${S.cases.filter(x=>x.member_id&&x.trainer_id===tr.user_id).length}</td><td>${S.cases.filter(x=>(x.returned_by||[]).includes(tr.user_id)).length}</td></tr>`}).join('');
  return `<div class="board">${board}</div><div class="two"><div class="main"><div class="card"><p class="h">트레이너별 진행</p><table><tr><th>트레이너</th><th>응답 대기</th><th>연락 중</th><th>조율 완료</th><th>가입 완료</th><th>반송</th></tr>${stats}</table><p class="sub">가입 완료(코드로 가입까지 끝난 회원) ${joined}명은 현황판에서 빠져요.</p></div></div><div class="side">${side}</div></div>`;
}
function vStaff(){
  const own=!!(S.me&&S.me.is_owner),pend=S.reqs.filter(r=>r.status==='대기'),done=S.reqs.filter(r=>r.status!=='대기').slice(0,10);
  const reqRow=r=>{const can=r.want_role!=='center'||own;const adm=r.want_role==='center';return `<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.title)}</td><td>${esc(r.phone||'')}</td><td>${md(r.created_at)}</td><td>${can?`<button class="btn" style="min-height:34px" data-a="approve" data-v="${r.id}">승인</button> <button class="btn g" style="min-height:34px" data-a="reject" data-v="${r.id}">거절</button>`:'<span class="sub">총관리자만 승인</span>'}${adm&&can?'<br><span class="sub">승인하면 총관리자 권한도 함께</span>':''}</td></tr>`};
  const staffRow=s=>{const me=S.me&&S.me.uid===s.user_id,lock=(s.role==='center'||s.is_owner)&&!own;
    return `<tr style="${s.active?'':'opacity:.5'}"><td><b>${esc(s.name)}</b>${s.is_owner?' <span class="st" style="background:#2B241D;color:#F0B85C">총관리자</span>':''}</td>
    <td>${lock||me||s.title==='총괄 관리자'?esc(s.title||''):`<select data-ch="title" data-v="${s.user_id}" style="min-height:34px;padding:2px 8px">${['트레이너'].concat(own?['부점장','점장']:[]).map(x=>`<option${x===s.title?' selected':''}>${x}</option>`).join('')}</select>`}</td><td>${esc(s.phone||'')}</td><td>${s.active?'사용 중':'중지'}</td>
    <td>${lock||me?(me?'<span class="sub">내 계정</span>':''):`<button class="btn g" style="min-height:34px" data-a="toggleStaff" data-v="${s.user_id}">${s.active?'사용 중지':'다시 사용'}</button>`}${own&&!me&&s.role==='center'&&s.active?` <button class="btn g" style="min-height:34px" data-a="toggleAdmin" data-v="${s.user_id}">${s.is_owner?'총관리자 빼기':'총관리자 주기'}</button>`:''}</td></tr>`};
  return `<div class="two"><div class="main">
  <div class="card" style="border:1.5px solid #B45309"><p class="h">승인 대기 ${pend.length}명</p><p class="sub">직원이 WLP 앱에서 카카오 로그인 → '직원 승인 요청'을 보내면 여기에 떠요. 트레이너는 센터 관리자 누구나, 점장·부점장은 총관리자만 승인해요.</p>
  ${pend.length?`<table><tr><th>이름</th><th>직책</th><th>연락처</th><th>요청일</th><th></th></tr>${pend.map(reqRow).join('')}</table>`:'<p class="sub">대기 중인 요청이 없어요.</p>'}</div>
  <div class="card"><p class="h">직원 ${S.staff.filter(s=>s.active).length}명</p><table><tr><th>이름</th><th>직책</th><th>연락처</th><th>상태</th><th></th></tr>${S.staff.map(staffRow).join('')}</table>
  <p class="sub">사용 중지하면 그 계정은 바로 직원 기능을 못 써요(기록은 남아요). 총관리자는 여러 명 둘 수 있고, 마지막 한 명은 빼거나 중지할 수 없어요. 내 계정은 스스로 중지할 수 없어요.</p></div>
  ${done.length?`<div class="card"><p class="h">처리한 요청</p>${done.map(r=>`<p class="sub">${md(r.decided_at||r.created_at)} · ${esc(r.name)} ${esc(r.title)} · ${r.status}${r.note?' · '+esc(r.note):''}</p>`).join('')}</div>`:''}
  <div class="card"><p class="h">발급한 코드</p><table><tr><th>코드</th><th>종류</th><th>이름</th><th>상태</th><th></th></tr>${S.codes.map(c=>{const st=c.canceled_at?'취소됨':c.used_at?'사용됨 '+md(c.used_at):new Date(c.expires_at)<new Date()?'만료됨':'대기 · '+md(c.expires_at)+'까지';
    return `<tr><td><b>${esc(c.code)}</b></td><td>${c.kind==='staff'?'직원 ('+(c.staff_role==='center'?'센터':'트레이너')+')':'회원 · 여정 '+c.start_stage}</td><td>${esc(c.name||'')}</td><td>${st}</td><td>${!c.used_at&&!c.canceled_at?`<button class="btn g" style="min-height:32px" data-a="cancelCode" data-v="${esc(c.code)}">취소</button>`:''}</td></tr>`}).join('')}</table></div></div>
  <div class="side">
  <div class="card"><p class="h">직원 접속 안내 (카톡으로 보내기)</p><div class="msg">[WLP] 센터 직원 앱 안내
1) ${BASE}index.html 접속 (홈 화면에 추가 권장)
2) 카카오로 로그인
3) '센터 직원이에요 → 직원 승인 요청' 누르고 이름·직책 입력
4) 승인되면 오른쪽 아래 M 버튼으로 OT 배정·회원 관리
${own?'(점장·부점장은 '+BASE+'center.html 에서 센터 관리)':''}</div><button class="btn g" data-a="copyGuide">안내문 복사</button></div>
  <div class="card"><p class="h">태블릿 직원 화면 번호</p><p class="sub">센터 태블릿 설문 결과에서 직원 화면을 열 때 쓰는 번호예요. 서버에 저장돼요(처음 값 0000).</p><div style="display:flex;gap:6px"><input id="pin" type="text" inputmode="numeric" placeholder="숫자 4~8자리"><button class="btn" data-a="setPin">바꾸기</button></div></div>
  <div class="card"><p class="h">코드로 바로 등록 (보조)</p><p class="sub">승인 요청 대신 코드를 주고 싶을 때. 받은 사람이 WLP 앱 코드 입력 화면에 넣으면 바로 직원이 돼요. 3일 뒤 만료.</p>
  <input id="sn" type="text" placeholder="이름"><div class="chips"><button class="ch${(S.srole||'trainer')==='trainer'?' ac':''}" data-a="srole" data-v="trainer">트레이너</button>${own?`<button class="ch${S.srole==='center'?' ac':''}" data-a="srole" data-v="center">센터 관리자</button>`:''}</div>
  <button class="btn g" data-a="staffCode">직원 코드 발급</button>${S.lastStaffCode?`<div class="msg">${esc(S.lastStaffCode)}</div>`:''}</div>
  <div class="card"><p class="h">설문 QR 주소</p><p class="sub">데스크 QR: ${BASE}survey.html<br>센터 태블릿: ${BASE}survey.html?mode=tablet</p></div>
  <div class="card"><p class="h">보관 기간 정리</p><p class="sub">미등록 잠재회원 중 1년 지난 기록을 지워요. 월 1회 권장.</p><button class="btn g" data-a="purge">지금 정리</button></div></div></div>`;
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v,val=id=>(document.getElementById(id)||{}).value||'';
  const L=S.leads.find(x=>x.id===S.selL),C=S.cases.find(x=>x.id===S.selC);
  switch(a){
   case 'login':sb.auth.signInWithOAuth({provider:v,options:{redirectTo:BASE+'center.html'}});break;
   case 'logout':await sb.auth.signOut();location.reload();break;
   case 'bootstrap':{const r=await sb.rpc('wlp_bootstrap_center',{p_name:val('bn'),p_title:val('bt')||'총괄 관리자'});if(r.error)toast(errText(r.error));else if(r.data==='ok')location.reload();else toast('이미 센터 관리자가 있어요');break}
   case 'tab':S.tab=v;render();break;
   case 'lf':S.lf=v;render();break;
   case 'selL':S.selL=+v;if(!S.ev[+v])loadEvents(+v);render();break;
   case 'lstatus':await call('wlp_lead_set_status',{p_id:L.id,p_status:v},()=>{L.status=v});S.ev[L.id]=null;loadEvents(L.id);break;
   case 'copyReport':await copy(document.querySelector('.msg').textContent);await call('wlp_lead_log',{p_id:L.id,p_action:'리포트 발송',p_note:null},()=>{});toast('복사했어요. 카톡/문자에 붙여 넣어 보내 주세요');S.ev[L.id]=null;loadEvents(L.id);break;
   case 'copyMsg':{const t=(MSG[(L.result||{}).k]||'').replace(/\{n\}/g,L.name);await copy(t);await call('wlp_lead_log',{p_id:L.id,p_action:'문자 발송',p_note:t},()=>{if(L.status==='신규')L.status='연락함'});toast('복사했어요');S.ev[L.id]=null;loadEvents(L.id);break}
   case 'register':await call('wlp_lead_register',{p_id:L.id,p_med:val('med')||null},()=>{L.status='등록';S.cases.unshift({id:Date.now(),lead_id:L.id,name:L.name,phone:L.phone,status:'미배정',trainer_id:null,returned_by:[],result:L.result,answers:L.answers,med_memo:val('med'),events:[{action:'OT 접수',at:new Date().toISOString()}]})});toast('OT 배정 탭에 추가됐어요');break;
   case 'selC':S.selC=+v;S.pickT=null;render();break;
   case 'pickT':S.pickT=v;render();break;
   case 'assign':await call('wlp_assign',{p_case:C.id,p_trainer:S.pickT},()=>{C.status='응답 대기';C.trainer_id=S.pickT;C.assigned_at=new Date().toISOString();(C.events=C.events||[]).push({action:'배정',note:staffName(S.pickT),at:new Date().toISOString()})});S.pickT=null;render();break;
   case 'setMed':await call('wlp_set_med',{p_case:C.id,p_med:val('cmed')},()=>{C.med_memo=val('cmed')});break;
   case 'srole':S.srole=v;render();break;
   case 'staffCode':{if(!val('sn').trim()){toast('이름을 적어 주세요');break}if(DEMO){S.lastStaffCode='WLP-DEMO · '+val('sn');render();break}
     const r=await sb.rpc('wlp_issue_staff_code',{p_role:S.srole||'trainer',p_name:val('sn').trim()});if(r.error){toast(errText(r.error));break}
     S.lastStaffCode=`[WLP] ${val('sn').trim()}님 직원 코드: ${r.data.code}\n${BASE}index.html 에서 카카오 로그인 → 코드 입력 (3일 안)`;await loadAll();break}
   case 'cancelCode':await call('wlp_cancel_code',{p_code:v},()=>{const c=S.codes.find(x=>x.code===v);if(c)c.canceled_at=new Date().toISOString()});break;
   case 'approve':case 'reject':{const id=+v,ok=a==='approve',note=ok?null:(prompt('거절 사유 (선택)')||null);
     await call('wlp_decide_staff',{p_req:id,p_approve:ok,p_note:note},()=>{const r=S.reqs.find(x=>x.id===id);r.status=ok?'승인':'거절';r.decided_at=new Date().toISOString();if(ok)S.staff.push({user_id:r.user_id,role:r.want_role,name:r.name,title:r.title,phone:r.phone,is_owner:r.want_role==='center',active:true})});break}
   case 'toggleStaff':{const s=S.staff.find(x=>x.user_id===v);await call('wlp_set_staff',{p_user:v,p_active:!s.active,p_title:null},()=>{s.active=!s.active});break}
   case 'toggleAdmin':{const s=S.staff.find(x=>x.user_id===v);if(!confirm(s.is_owner?s.name+'님의 총관리자 권한을 뺄까요?':s.name+'님에게 총관리자 권한을 줄까요? (직원 승인·권한 변경을 모두 할 수 있게 돼요)'))break;
     await call('wlp_set_admin',{p_user:v,p_on:!s.is_owner},()=>{s.is_owner=!s.is_owner});break}
   case 'setPin':{const p=val('pin').trim();if(!/^[0-9]{4,8}$/.test(p)){toast('숫자 4~8자리로 정해 주세요');break}await call('wlp_set_pin',{p_pin:p},()=>{});toast('바꿨어요');break}
   case 'copyGuide':await copy(document.querySelector('.side .msg').textContent);toast('복사했어요');break;
   case 'purge':{if(DEMO){toast('시험 모드');break}const r=await sb.rpc('wlp_purge_leads');if(r.error)toast(errText(r.error));else{toast(r.data+'건 정리했어요');loadAll()}break}
  }
});
document.addEventListener('change',async e=>{if(e.target.dataset.ch==='title'){const id=e.target.dataset.v,s=S.staff.find(x=>x.user_id===id);await call('wlp_set_staff',{p_user:id,p_active:s.active,p_title:e.target.value},()=>{s.title=e.target.value;s.role=e.target.value==='트레이너'?'trainer':'center';if(s.role==='trainer')s.is_owner=false})}});
render();boot();
</script>
</body>
</html>
