   "011":{n:"정체된 성실파",risk:false,start:"새 기술로 다시 불붙는 시작",one:"꾸준함은 이미 충분해요. 4주마다 새로 배울 것 하나로 지루함을 깨요.",rx:"도전 손잡이(템포·범위·균형·새 기술)를 회원이 고르게",warn:"같은 루틴이 계속되면 출석이 조용히 빠짐",reg:"‘새로 배울 것’이 등록 이유가 됨",call:"새로 배울 기술 하나를 미리 보여 주기"},
   "001":{n:"출발선형",risk:false,start:"작고 정교한 첫걸음",one:"하고 싶은 마음이 준비돼 있어요. 처음 2주는 세 동작만 내 것으로 만들어요.",rx:"첫 경험을 정교하게. 미세 몰입 → 몰입 블록. 계획은 회원이 말하게",warn:"계획을 크게 세우기 쉬움(계획 오류)",reg:"등록 의향 높음. 단계와 재측정 날짜만 보여 주면 충분",call:"첫 2주 3동작 플랜 + 재측정 날짜 안내"},

   "110":{n:"간헐형",risk:false,start:"요일부터 고정하는 시작",one:"오시면 잘하실 분이에요. 강도보다 ‘오는 요일’을 지키는 게 먼저예요.",rx:"강도보다 빈도 설계. 15분 최소 루틴, 고정 요일",warn:"‘오면 잘하니까’ 방치하면 한 달씩 빔",reg:"월 단위·소회차부터",call:"가능한 고정 요일 묻기 + 15분 버전 소개"},
   "000":{n:"관망형",risk:false,start:"내가 아끼는 것에서 출발",one:"운동 얘기는 잠깐 두고, 회원님이 아끼는 시간과 연결되는 움직임부터 찾아요.",rx:"가치 듣기, 놀이 요소, 회원 선택지",warn:"정보를 쏟아붓는 순간 대화가 끝남",reg:"등록 대화 금지. 다시 만날 이유 하나만",call:"운동 정보 대신 ‘아끼는 시간’ 질문. 소식은 1회만"},
   "010":{n:"휴면 경험자",risk:false,start:"예전 감각을 되찾는 시작",one:"해 본 경험이 있으세요. 예전 리듬으로, 지금 몸에 맞는 강도로 다시 시작해요.",rx:"그만둔 이유와 다시 하면 좋을 점(의미) 대화",warn:"예전 기준 강도는 실망을 부름",reg:"‘다시 시작’ 프레임, 소회차",call:"예전에 좋았던 운동 묻기, ‘다시 시작’ 소회차"}};
  const JM={1:{n:"몸 풀기",two:"힘든 건 하지 않아요. 20~30분, 싫은 동작은 빼고 몸 상태만 같이 봐요."},
    2:{n:"재미 찾기",two:"1~2분짜리 작은 도전으로 ‘어, 재밌네’를 찾아요. 고르는 건 회원님이에요."},
    3:{n:"첫 몰입",two:"한 세션 안에 시간 가는 줄 모르는 5~15분을 만들어요. 세트마다 목표는 하나만."},

    5:{n:"나만의 무대",two:"분기 목표는 회원님이 정하고, 센터는 안전과 회복을 맡아요."}};
  const ZONES={"2,0":"불안","2,1":"각성","2,2":"몰입","1,0":"걱정","1,1":"전환 지대","1,2":"통제","0,0":"무관심","0,1":"지루함","0,2":"이완"};
  const STN={1:"전숙고",2:"숙고",3:"준비",4:"실행",5:"유지"};

  function compute(a){

    const ws=parts.reduce((s,p)=>s+p[1],0); let I=parts.reduce((s,p)=>s+p[0]*p[1],0)/ws;

    const zone=ZONES[lvl(C)+","+lvl(Sk)]; let start=st; const notes=[];

   case 'toCase':{const c=S.cases.find(x=>x.lead_id===+v);S.tab='cases';if(c){S.ym={y:c.reg_y||NOWY,m:c.reg_m||NOWM};S.selC=c.id}S.cf='전체';S.ctr='전체';render();break}
   case 'prog':{const d=val('pdate').trim();await call('wlp_set_progress',{p_case:C.id,p_status:v,p_date:d||null},()=>{C.status=v;if(d){if(v==='OT1 완료'||v==='조율 완료')C.ot1_at=d;if(v==='OT2 완료')C.ot2_at=d;if(v==='PT 등록')C.pt_at=d}(C.events=C.events||[]).push({action:v,note:d,at:new Date().toISOString()})});break}
   case 'jToggle':{const s=S.staff.find(x=>x.user_id===v),n=+b.dataset.n,cur=s.journey_open||[],nx=cur.includes(n)?cur.filter(x=>x!==n):cur.concat([n]).sort();
     if(DEMO){s.journey_open=nx;render();break}
     const r=await sb.rpc('wlp_set_staff_journey',{p_staff:v,p_levels:nx});if(r.error||(r.data&&r.data.ok===false)){toast(r.error?errText(r.error):r.data.reason||'바꾸지 못했어요');break}
     s.journey_open=nx;toast(`${s.name} · 여정 ${n} ${nx.includes(n)?'열었어요':'닫았어요'}`);render();break}
   case 'setSheetName':{const nm=val('sn_'+v).trim();if(DEMO){const s=S.staff.find(x=>x.user_id===v);s.sheet_name=nm;toast('시험 모드: 화면에만 반영');render();break}
     const r=await sb.rpc('wlp_set_sheet_name',{p_staff:v,p_name:nm});if(r.error||(r.data&&r.data.ok===false)){toast(r.error?errText(r.error):'저장하지 못했어요');break}toast(nm?`저장했어요 · OT ${r.data.linked}건을 이 계정에 연결했어요`:'시트 이름을 지웠어요');await loadAll();break}
   case 'delCase':{if(!confirm(C.name+'님 OT를 삭제할까요? 시트 행은 그대로 두고 WLP 진행 칸에 "삭제됨"으로 표시해요. 아래 "삭제한 항목"에서 복구할 수 있어요.'))break;
     if(DEMO){(S.deleted=S.deleted||[]).unshift({id:C.id,name:C.name,reg_y:C.reg_y,reg_m:C.reg_m,del_prev:C.status,deleted_at:new Date().toISOString(),trainer_name:C.trainer_name});S.cases=S.cases.filter(x=>x.id!==C.id);S.selC=null;render();break}
     const r=await sb.rpc('wlp_case_delete',{p_case:C.id});if(r.error){toast(errText(r.error));break}S.selC=null;toast('삭제했어요');await loadAll();break}
   case 'restoreCase':{if(DEMO){toast('시험 모드에서는 복구를 보여 주지 않아요');break}const r=await sb.rpc('wlp_case_restore',{p_case:+v});if(r.error){toast(errText(r.error));break}toast('복구했어요');await loadAll();break}
   case 'showDel':S.showDel=!S.showDel;render();break;
   case 'copyKey':try{await navigator.clipboard.writeText(S.sheetKey);toast('복사했어요. 시트 WLP 메뉴 → 연결 키 넣기에 붙여 넣어 주세요')}catch(e){toast('복사가 안 되면 키 글자를 눌러 전체 선택 후 복사해 주세요')}break;
   case 'sheetKey':{if(!confirm('새 연결 키를 만들까요? 시트에 넣어 둔 이전 키는 못 쓰게 돼요.'))break;if(DEMO){S.sheetKey='demo-key-1234';render();break}const r=await sb.rpc('wlp_new_sheet_key');if(r.error){toast(errText(r.error));break}S.sheetKey=r.data;render();break}
   case 'sheetSync':{const u=CFG.SHEET_SYNC_URL;if(DEMO){toast('시험 모드: 시트는 실제 서버에서만 불러와요');break}if(!u){toast('config.js 에 SHEET_SYNC_URL(시트 Apps Script 웹 앱 주소)을 넣어 주세요');break}
     b.disabled=true;b.textContent='불러오는 중…';try{const r=await fetch(u);const d=await r.json();toast(d.ok?`앱→시트 ${d.wrote}줄 고침 · ${d.added}줄 추가 / 시트→앱 새 ${d.new} · 갱신 ${d.updated}`:'못 불러왔어요: '+(d.reason||d.error))}catch(e){toast('시트 응답을 못 받았어요. 잠시 뒤 새로고침해 보세요')}await loadAll();break}
   case 'pickT':S.pickT=v;render();break;
   case 'assign':await call('wlp_assign',{p_case:C.id,p_trainer:S.pickT},()=>{C.status='응답 대기';C.trainer_id=S.pickT;C.assigned_at=new Date().toISOString();(C.events=C.events||[]).push({action:'배정',note:staffName(S.pickT),at:new Date().toISOString()})});S.pickT=null;render();break;
   case 'setMed':await call('wlp_set_med',{p_case:C.id,p_med:val('cmed')},()=>{C.med_memo=val('cmed')});break;
   case 'srole':S.srole=v;render();break;
   case 'staffCode':{if(!val('sn').trim()){toast('이름을 적어 주세요');break}if(DEMO){S.lastStaffCode='WLP-DEMO · '+val('sn');render();break}
     const r=await sb.rpc('wlp_issue_staff_code',{p_role:S.srole||'trainer',p_name:val('sn').trim()});if(r.error){toast(errText(r.error));break}
     S.lastStaffCode=`[WLP] ${val('sn').trim()}님 직원 코드: ${r.data.code}\n${BASE}index.html 에서 카카오 로그인 → 코드 입력 (3일 안)`;await loadAll();break}
   case 'cancelCode':await call('wlp_cancel_code',{p_code:v},()=>{const c=S.codes.find(x=>x.code===v);if(c)c.canceled_at=new Date().toISOString()});break;
   case 'approve':case 'reject':{const id=+v,ok=a==='approve',note=ok?null:(prompt('거절 사유 (선택)')||null);
     await call('wlp_decide_staff',{p_req:id,p_approve:ok,p_note:note},()=>{const r=S.reqs.find(x=>x.id===id);r.status=ok?'승인':'거절';r.decided_at=new Date().toISOString();if(ok)S.staff.push({user_id:r.user_id,role:r.want_role,name:r.name,title:r.title,phone:r.phone,is_owner:r.want_role==='center',active:true})});break}
   case 'toggleStaff':{const s=S.staff.find(x=>x.user_id===v);await call('wlp_set_staff',{p_user:v,p_active:!s.active,p_title:null},()=>{s.active=!s.active});break}
   case 'toggleAdmin':{const s=S.staff.find(x=>x.user_id===v);if(!confirm(s.is_owner?s.name+'님의 총관리자 권한을 뺄까요?':s.name+'님에게 총관리자 권한을 줄까요? (직원 승인·권한 변경을 모두 할 수 있게 돼요)'))break;
     await call('wlp_set_admin',{p_user:v,p_on:!s.is_owner},()=>{s.is_owner=!s.is_owner});break}
   case 'setPin':{const p=val('pin').trim();if(!/^[0-9]{4,8}$/.test(p)){toast('숫자 4~8자리로 정해 주세요');break}await call('wlp_set_pin',{p_pin:p},()=>{});toast('바꿨어요');break}
   case 'copyGuide':await copy(document.querySelector('.side .msg').textContent);toast('복사했어요');break;
   case 'purge':{if(DEMO){toast('시험 모드');break}const r=await sb.rpc('wlp_purge_leads');if(r.error)toast(errText(r.error));else{toast(r.data+'건 정리했어요');loadAll()}break}
  }
});
document.addEventListener('change',async e=>{if(e.target.dataset.ch==='cy'){S.stats=null;S.ym={y:+e.target.value,m:+e.target.value===NOWY?NOWM:12};const ms=S.cases.filter(c=>c.reg_y===S.ym.y).map(c=>c.reg_m);if(ms.length&&!ms.includes(S.ym.m))S.ym.m=Math.max(...ms);S.selC=null;render();return}
  if(e.target.dataset.ch==='title'){const id=e.target.dataset.v,s=S.staff.find(x=>x.user_id===id);await call('wlp_set_staff',{p_user:id,p_active:s.active,p_title:e.target.value},()=>{s.title=e.target.value;s.role=e.target.value==='트레이너'?'trainer':'center';if(s.role==='trainer')s.is_owner=false})}});
render();boot();
</script>
</body>
