<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WLP · OT 마법사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="./config.js"></script>
<style>
:root{--dark:#2b2520;--dark2:#3a332c;--gold:#e8b96a;--gold2:#f6e3bd;--cream:#faf7f2;--line:#ece4d8;--ink:#2f2a25;--mute:#8a8075;--ok:#3f8f5a;--bad:#c4553f;--blue:#4c78a8}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:#1f1b18;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit}
.stage{display:flex;justify-content:center;padding:18px 10px 40px}
.tab{width:100%;max-width:880px;background:var(--cream);border-radius:22px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4);min-height:720px;display:flex;flex-direction:column}
.top{background:var(--dark);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:12px}
.top h1{font-size:17px;margin:0;font-weight:900;flex:1}
.top .time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--gold)}
.top .ghost{background:transparent;border:1px solid #5a5148;color:#e9e1d6;border-radius:10px;padding:6px 10px;font-size:13px}
.prog{height:6px;background:#3a332c}
.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}
.main{flex:1;padding:28px 34px 22px;display:flex;flex-direction:column}
.part{font-size:13px;font-weight:700;color:#a3772b;letter-spacing:.3px}
.qt{font-size:23px;font-weight:900;margin:8px 0 6px;line-height:1.4;letter-spacing:-.3px}
.hint{color:var(--mute);font-size:14px;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-size:16.5px;line-height:1.4;transition:.12s}
.opt:hover{border-color:#d8c8ae}
.opt .n{flex:none;width:28px;height:28px;border-radius:50%;background:#f1ebe2;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--mute)}
.opt.on{border-color:var(--dark);background:#fffaf0}
.opt.on .n{background:var(--dark);color:#fff}
.opt.dim{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--line);border-radius:999px;padding:10px 16px;font-size:15.5px}
.chip.on{background:var(--dark);border-color:var(--dark);color:#fff}
.lbl{font-size:14px;font-weight:700;margin:18px 0 8px;color:var(--dark2)}
.lbl:first-child{margin-top:0}
.txt{width:100%;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:18px;background:#fff}
.txt:focus{outline:none;border-color:var(--dark)}
.grid4{display:grid;grid-template-columns:110px repeat(4,1fr);gap:8px;align-items:center}
.grid4 .h{font-size:13px;color:var(--mute);text-align:center}
.grid4 .r{font-weight:700;font-size:15px}
.grid4 button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 0;font-size:14px}
.grid4 button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.rank .opt .n{background:#fff;border:2px dashed #d9cdb9}
.rank .opt.on .n{background:var(--gold);border:0;color:var(--dark)}
.sel{display:flex;gap:10px;align-items:center;font-size:16px}
.sel select{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:#fff}
.foot{display:flex;gap:10px;margin-top:auto;padding-top:22px}
.btn{border:0;border-radius:14px;padding:16px 22px;font-weight:700;font-size:16px}
.btn.p{background:var(--dark);color:#fff;flex:1}
.btn.p:disabled{background:#cfc6ba}
.btn.s{background:#efe8dd}
.btn.g{background:var(--gold);color:var(--dark)}
.note{font-size:13px;color:var(--mute);margin-top:12px}
/* intro */
.intro h2{font-size:30px;margin:6px 0 10px;font-weight:900;letter-spacing:-.5px}
.intro p{font-size:16px;line-height:1.7;color:#5b5249;margin:0 0 16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 18px}
.form label{font-size:13px;font-weight:700;color:var(--mute);display:block;margin-bottom:6px}
.form input{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:#fff}
.presets{border-top:1px dashed #dccfbb;margin-top:18px;padding-top:16px}
.presets .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.presets button{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;text-align:left}
.presets button small{display:block;color:var(--mute);font-size:12px}
/* result */
.rtabs{display:flex;gap:6px;padding:14px 22px 0;background:var(--dark)}
.rtabs button{background:transparent;border:1px solid #5a5148;border-bottom:0;color:#e9e1d6;border-radius:12px 12px 0 0;padding:11px 16px;font-weight:700;font-size:14px}
.rtabs button.on{background:var(--cream);color:var(--dark);border-color:var(--cream)}
.rmain{padding:22px 26px 30px}
/* kakao */
.kakao{background:#b2c7d9;border-radius:18px;padding:18px;max-width:430px;margin:0 auto}
.kakao .who{font-size:13px;color:#3b4a57;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.kakao .who i{width:34px;height:34px;border-radius:12px;background:var(--dark);display:inline-flex;align-items:center;justify-content:center;color:var(--gold);font-style:normal;font-weight:900;font-size:12px}
.bubble{background:#fff;border-radius:4px 16px 16px 16px;overflow:hidden;margin-left:42px}
.bubble .hd{background:var(--dark);color:#fff;padding:16px}
.bubble .hd small{color:var(--gold);font-weight:700;font-size:12px}
.bubble .hd b{display:block;font-size:20px;margin-top:4px}
.bubble .bd{padding:14px 16px;font-size:14.5px;line-height:1.65}
.bubble .bd h5{margin:14px 0 4px;font-size:13px;color:#a3772b}
.bubble .bd h5:first-child{margin-top:0}
.bubble .bd ul{margin:0;padding-left:18px}
.bubble .code{margin:14px 16px 16px;background:#f5efe4;border-radius:10px;padding:12px;text-align:center;font-weight:900;font-size:18px;letter-spacing:1px}
.bubble .code small{display:block;font-weight:500;font-size:12px;color:var(--mute);letter-spacing:0}
.journey{display:flex;gap:4px;margin-top:10px}
.journey span{flex:1;height:6px;border-radius:3px;background:#5a5148}
.journey span.on{background:var(--gold)}
/* trainer card */
.tc{background:#24201c;color:#eee7dd;border-radius:16px;padding:22px 20px;max-width:640px;margin:0 auto}
.tc h2{margin:0 0 4px;font-size:20px}
.tc .lead{color:#a99f92;font-size:13px;margin:0 0 14px}
.bdg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.bdg span{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:7px;background:#3a332c}
.bdg span.g{background:var(--gold);color:var(--dark)}
.bdg span.r{background:#5a2f27;color:#ffb7a8}
.bdg span.b{background:#2c3b4c;color:#b9d2ee}
.sent{background:#322b25;border-left:3px solid var(--gold);padding:11px 13px;border-radius:8px;font-size:14.5px;line-height:1.6;margin-bottom:14px}
.sent .quote{display:block;color:#a99f92;margin-top:4px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:9px 12px;font-size:14px;margin:0 0 6px}
.kv dt{color:#a99f92}.kv dd{margin:0}
.tc h4{margin:18px 0 8px;font-size:15px}
.q{background:#2f2823;border-radius:10px;padding:11px 13px;font-size:14px;line-height:1.6;margin-bottom:8px}
.q small{display:block;color:#a99f92;margin-top:3px}
.flag{background:#3b2a24;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;margin-bottom:6px}
.flag b{color:#ffb7a8}
.flag.info b{color:var(--gold)}
.ck{display:flex;gap:8px;font-size:14px;padding:5px 0}
.ck .auto{font-size:11px;color:var(--gold);margin-left:4px}
/* logic */
table.lg{border-collapse:collapse;width:100%;font-size:13.5px;background:#fff}
table.lg th,table.lg td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.lg th{background:#f4efe7;font-size:12.5px}
.yes{color:var(--ok);font-weight:700}.no{color:#b9afa3}
pre{background:var(--dark);color:#f0e8dc;padding:14px;border-radius:12px;font-size:12px;overflow:auto;max-height:340px}
.rfoot{display:flex;gap:8px;justify-content:center;padding:0 26px 26px;flex-wrap:wrap}
.wbar{max-width:880px;margin:14px auto 0;padding:0 10px;display:flex;flex-direction:column;gap:8px}
.wtabs{display:flex;gap:6px}
.wtabs a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:11px 0;border-radius:12px;border:1px solid #4a423a;color:#e9e1d6}
.wtabs a.on{background:var(--gold);border-color:var(--gold);color:var(--dark)}
.authbar{font-size:13px;color:#cfc6ba;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.authbar a{color:var(--gold)}
.authbar button{background:transparent;border:1px solid #5a5148;color:#e9e1d6;border-radius:8px;padding:5px 9px;font-size:12px}
.inv{max-width:640px;margin:22px auto 0;border:2px solid var(--dark);border-radius:16px;padding:16px;background:#fff}
.inv h3{margin:0 0 4px;font-size:17px}
.inv .hint{font-size:13px;color:var(--mute);margin:4px 0}
.inv .save{font-weight:700;color:var(--dark2)}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.stg button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:700;font-size:13px;line-height:1.3}
.stg button small{display:block;font-weight:500;font-size:11px;color:var(--mute)}
.stg button.on{background:var(--dark);border-color:var(--dark);color:#fff}
.stg button.on small{color:var(--gold2)}
.inv .code{font-size:28px;font-weight:900;letter-spacing:.06em}
.inv .qr{background:#fff;padding:6px;border:1px solid var(--line);border-radius:10px;display:inline-block}
.inv .err{background:#fbefec;color:var(--bad);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:8px}
@media(max-width:640px){.main{padding:20px 18px}.qt{font-size:20px}.opts.two{grid-template-columns:1fr}.grid4{grid-template-columns:76px repeat(4,1fr)}.form{grid-template-columns:1fr}.kv{grid-template-columns:84px 1fr}}
</style>
</head>

function startTimer(){S.t0=Date.now();clearInterval(timer);timer=setInterval(()=>{const el=document.getElementById('tm');if(el)el.textContent=mmss(Date.now()-S.t0);},1000);}
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');};

function answered(q){const v=S.a[q.id];
  switch(q.t){case 'single':return v!=null;case 'multi':return v&&v.length>0;case 'text':return q.opt||(v&&v.trim().length>=2);
  case 'pain':return v.parts.length>0&&(v.parts.includes(7)||v.deg!=null);case 'day':return v.s!=null&&v.e!=null&&v.sl!=null;
  case 'food':return v.r.every(x=>x!=null)&&v.m!=null;case 'avail':return v.s.length>0&&v.c!=null;case 'rank':return v.length===3;}return false;}

  const app=document.getElementById('app');
  if(S.step<0){app.innerHTML=intro();return;}

  const q=Q[S.step];const pct=Math.round(S.step/Q.length*100);
  app.innerHTML=`<div class="top"><h1>나를 위한 운동 설계 체크</h1><span class="time">⏱ <span id="tm">${mmss(Date.now()-S.t0)}</span></span><span style="font-size:13px;color:#cfc6ba">${S.step+1} / ${Q.length}</span><button class="ghost" data-a="home">새 설문</button></div>

  ${body(q)}

  const ti=document.getElementById('ti');if(ti){ti.oninput=()=>{S.a[q.id]=ti.value;document.querySelector('[data-a="next"]').disabled=!answered(q);};ti.onkeydown=e=>{if(e.key==='Enter'&&answered(q))go(1);};setTimeout(()=>ti.focus(),30);}

  document.querySelectorAll('select[data-sel]').forEach(s=>s.onchange=()=>{S.a.q8[s.dataset.sel]=s.value===''?null:+s.value;render();});

function body(q){const v=S.a[q.id];
  const opt=(i,label,on,attr,dim)=>`<button class="opt ${on?'on':''} ${dim?'dim':''}" ${attr}><span class="n">${C[i]||i+1}</span><span>${esc(label)}</span></button>`;
  switch(q.t){
  case 'single':return `<div class="opts ${q.opts.length>5?'two':''}">${q.opts.map((o,i)=>opt(i,o,v===i,`data-single="${i}"`)).join('')}</div>`;
  case 'multi':{let h=`<div class="opts ${q.opts.length>6?'two':''}">${q.opts.map((o,i)=>opt(i,o,v.includes(i),`data-multi="${i}"`,q.max&&v.length>=q.max&&!v.includes(i)&&i!==q.none)).join('')}</div>`;
    if(q.sub&&v.includes(q.sub.i))h+=`<div class="lbl">지적받은 수치 (모두)</div><div class="chips">${q.sub.opts.map((o,i)=>`<button class="chip ${S.a.q5s.includes(i)?'on':''}" data-q5s="${i}">${o}</button>`).join('')}</div>`;
    if(q.txt)h+=`<input class="txt" id="mt" style="margin-top:14px" value="${esc(S.a[q.txt]||'')}" placeholder="예: 성대가 안 좋아져서 노래를 못 불러요" maxlength="80">`;return h;}
  case 'text':return `<input class="txt" id="ti" value="${esc(v||'')}" placeholder="${q.opt?'예: 무릎 수술한 적 있어요':'편하게 적어주세요'}" maxlength="80"><p class="note">${q.opt?'':'정확한 문장보다 떠오르는 대로가 더 좋아요.'}</p>`;
  case 'pain':return `<div class="lbl">부위 (모두)</div><div class="chips">${q.parts.map((o,i)=>`<button class="chip ${v.parts.includes(i)?'on':''}" data-part="${i}">${o}</button>`).join('')}</div>
     ${v.parts.length&&!v.parts.includes(7)?`<div class="lbl">가장 불편한 곳의 정도</div><div class="opts two">${q.deg.map((o,i)=>opt(i,o,v.deg===i,`data-deg="${i}"`)).join('')}</div>`:''}`;
  case 'day':{const hs=(sel,k)=>`<select data-sel="${k}"><option value="">선택</option>${Array.from({length:24},(_,h)=>`<option value="${h}" ${sel===h?'selected':''}>${h}시</option>`).join('')}</select>`;
     return `<div class="lbl">일(또는 주된 활동) 시간</div><div class="sel">${hs(v.s,'s')} ~ ${hs(v.e,'e')}</div>
     <div class="lbl">보통 잠드는 시각</div><div class="chips">${q.sleep.map((o,i)=>`<button class="chip ${v.sl===i?'on':''}" data-sl="${i}">${o}</button>`).join('')}</div>`;}
  case 'food':return `<div class="grid4"><span></span>${FREQ.map(f=>`<span class="h">${f}</span>`).join('')}${q.rows.map((r,ri)=>`<span class="r">${r}</span>${FREQ.map((f,fi)=>`<button class="${v.r[ri]===fi?'on':''}" data-food="${ri}:${fi}">${f}</button>`).join('')}`).join('')}</div>
     <div class="lbl">하루 끼니</div><div class="chips">${q.meals.map((o,i)=>`<button class="chip ${v.m===i?'on':''}" data-meal="${i}">${o}</button>`).join('')}</div>`;
  case 'avail':return `<div class="lbl">시간대 (모두)</div><div class="chips">${q.slots.map((o,i)=>`<button class="chip ${v.s.includes(i)?'on':''}" data-slot="${i}">${o}</button>`).join('')}</div>
     <div class="lbl">현실적인 횟수</div><div class="chips">${q.cnt.map((o,i)=>`<button class="chip ${v.c===i?'on':''}" data-cnt="${i}">${o}</button>`).join('')}</div>`;
  case 'rank':return `<div class="opts two rank">${q.opts.map((o,i)=>{const r=v.indexOf(i);return `<button class="opt ${r>=0?'on':''} ${v.length>=3&&r<0?'dim':''}" data-rank="${i}"><span class="n">${r>=0?r+1:''}</span><span>${esc(o)}</span></button>`;}).join('')}</div>`;
  }}

/* ---------- 판정 ---------- */
const STAGE=['거부','호기심','첫 몰입','일상','열정'];
const MSTAGE=['둘러보기','호기심','첫 몰입','일상','열정']; // 회원에게 보이는 이름
function analyze(){
  const a=S.a,i=S.info;const R={rules:[]};const rule=(area,cond,hit,out)=>R.rules.push({area,cond,hit,out});
  R.maintain=a.q1===5;R.si=R.maintain?1:a.q1;
  R.stage=R.si+1;R.stageName=STAGE[R.si];
  rule('단계','Q1 ①~⑤ 번호 = WLP 여정 단계',!R.maintain,`여정 ${C[R.si]} ${R.stageName}`);
  rule('단계','Q1 ⑥ 유지 희망 → 거부가 아니라 ② 호기심에서 시작',R.maintain,'여정 ② 호기심 · 유지·안전형');
  R.retry=a.q1===2&&a.q2===1;rule('단계','Q1 ③ 그리고 Q2 ② → 재도전자',R.retry,'성공 경험 설계 우선');
  const tried=a.q15.filter(x=>x!==10);
  const vague=a.q16===8;
  const anju=!R.maintain&&(a.q1<=1)&&(a.q17===0||a.q17===3)&&vague;
  const rank1=a.q14[0];
  const ach=!R.maintain&&((a.q1>=3&&a.q1<=4)||((rank1===1||rank1===6)&&tried.length>=2));
  R.type=R.maintain?'유지·안전형':anju?'안주형':ach?'성취발전형':'혼합형';
  rule('유형','유지·안전형: Q1 ⑥ (향상보다 잃지 않기)',R.maintain,'유지·안전형');

/* ---------- 이벤트 ---------- */
function go(d){
  const n=S.step+d;
  if(n<0){S.step=-1;render();return;}
  if(n>=Q.length){S.elapsed=Date.now()-S.t0;clearInterval(timer);S.R=null;S.rtab='member';S.step=Q.length;render();window.scrollTo(0,0);return;}
  S.step=n;render();window.scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;const d=t.dataset;const q=Q[S.step];
  if(t.tagName==='A'){if(t.getAttribute('href')==='#')e.preventDefault();return;}
  if(d.sex){S.info.sex=d.sex;readInfo();render();return;}
  if(d.preset!=null){INV=freshInv();INV.preset=true;const p=PRESETS[+d.preset];S.info={name:p.name,age:p.age,sex:p.sex,job:p.job};S.a=Object.assign(blank(),JSON.parse(JSON.stringify(p.a)));S.elapsed=(4*60+20)*1000;S.R=null;S.rtab='trainer';S.step=Q.length;render();window.scrollTo(0,0);return;}
  if(d.a==='start'){INV=freshInv();readInfo();if(!S.info.name){document.getElementById('iname').focus();return;}S.a=blank();startTimer();S.step=0;render();return;}
  if(d.a==='next'){go(1);return;}
  if(d.a==='back'){go(-1);return;}
  if(d.rtab){S.rtab=d.rtab;render();return;}
  if(d.stg){if(!INV.code){INV.stage=+d.stg;render();}return;}
  if(d.a==='issue'){issue();return;}
  if(d.a==='copylink'){copyLink(t);return;}
  if(d.a==='cancelcode'){cancelCode();return;}
  if(d.a==='edit'){S.R=null;startTimer();S.t0=Date.now()-S.elapsed;S.step=0;render();return;}
  if(d.a==='home'){clearInterval(timer);INV=freshInv();S={step:-1,info:{name:'',age:'',sex:'',job:''},a:blank(),t0:0,elapsed:0,rtab:'member'};render();window.scrollTo(0,0);setTimeout(()=>{const n=document.getElementById('iname');if(n)n.focus();},30);return;}
  if(!q)return;const v=S.a[q.id];
  if(d.single!=null){S.a[q.id]=+d.single;render();setTimeout(()=>go(1),260);return;}
  if(d.multi!=null){const i=+d.multi;let arr=v.slice();
    if(i===q.none)arr=arr.includes(i)?[]:[i];else{arr=arr.filter(x=>x!==q.none);if(arr.includes(i))arr=arr.filter(x=>x!==i);else if(!q.max||arr.length<q.max)arr.push(i);}
    S.a[q.id]=arr;if(q.id==='q5'&&!arr.includes(6))S.a.q5s=[];render();return;}
  if(d.q5s!=null){const i=+d.q5s;const s=S.a.q5s;S.a.q5s=s.includes(i)?s.filter(x=>x!==i):[...s,i];render();return;}
  if(d.part!=null){const i=+d.part;let p=v.parts.slice();if(i===7)p=p.includes(7)?[]:[7];else{p=p.filter(x=>x!==7);p=p.includes(i)?p.filter(x=>x!==i):[...p,i];}v.parts=p;if(p.includes(7)||!p.length)v.deg=null;render();return;}
  if(d.deg!=null){v.deg=+d.deg;render();return;}
  if(d.sl!=null){v.sl=+d.sl;render();return;}
  if(d.food){const [r,f]=d.food.split(':').map(Number);v.r[r]=f;render();return;}
  if(d.meal!=null){v.m=+d.meal;render();return;}
  if(d.slot!=null){const i=+d.slot;v.s=v.s.includes(i)?v.s.filter(x=>x!==i):[...v.s,i];render();return;}
  if(d.cnt!=null){v.c=+d.cnt;render();return;}
  if(d.rank!=null){const i=+d.rank;S.a.q14=v.includes(i)?v.filter(x=>x!==i):v.length<3?[...v,i]:v;render();return;}
});

  INV.busy=true;INV.err='';render();
  const pl=Object.assign(payload(R),{at:new Date().toISOString()});
  const r=await sb.rpc('wlp_issue_member_code',{p_stage:INV.stage,p_name:S.info.name||'회원',p_result:pl,p_type_key:'v2',p_type_name:R.type+' · '+R.ab,p_case:CASE_ID,p_ot:INV.otId});
  INV.busy=false;
  if(r.error){INV.err=errMsg(r.error);render();return}
  INV.code=r.data.code;INV.exp=r.data.expires_at;INV.link=BASE+'index.html?code='+encodeURIComponent(INV.code);R.code=INV.code;render();
}
async function copyLink(btn){
  const txt=`[WLP] ${S.info.name||'회원'}님, 오늘 OT 수고 많으셨어요.\n아래 링크로 들어와 카카오로 로그인하면 첫 여정이 열려요.\n${INV.link}\n(가입 코드: ${INV.code} · ${new Date(INV.exp).toLocaleDateString('ko-KR')}까지)`;
  const ok=document.getElementById('copyok');try{await navigator.clipboard.writeText(txt);ok.textContent='복사했어요'}catch(e){ok.textContent='복사가 막혀 있어요. 길게 눌러 복사해 주세요'}
}
async function cancelCode(){
  if(sb){const r=await sb.rpc('wlp_cancel_code',{p_code:INV.code});if(r.error){INV.err=errMsg(r.error);render();return}}
  INV.code=null;INV.err='';if(S.R)S.R.code='WLP-????';render();
}
authInit();
render();
})();
</script>
