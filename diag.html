 <div class="seg" id="tabs"><button data-k="ib" class="on">인바디 변화</button><button data-k="rz">레드존 대비</button><button data-k="hb">힘바디 성장</button></div>

<script>
const $=id=>document.getElementById(id);
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lerp=(x,xs,ys)=>{if(x<=xs[0])return ys[0];for(let i=1;i<xs.length;i++)if(x<=xs[i]){const t=(x-xs[i-1])/(xs[i]-xs[i-1]);return ys[i-1]+t*(ys[i]-ys[i-1])}return ys[ys.length-1]};
const mix=(c,t,a)=>{const o={};for(const k in c)o[k]=c[k]+(t[k]-c[k])*a;return o};
const PC=['var(--s1)','var(--s3)','var(--s2)'];
const NAME={ib:'인바디 변화',rz:'레드존 대비',hb:'힘바디 성장'};
const HASH={inbody:'ib',redzone:'rz',himbody:'hb'};

/* ---------- 룬PT 앱에서 넘겨준 내 기록 ---------- */
let P=null;try{P=JSON.parse(localStorage.getItem('rune-diag-payload')||'null')}catch(e){}
const TIERS=['아이언','브론즈','실버','골드','플래티넘','에메랄드','다이아몬드','마스터','그랜드마스터','챌린저'];
const BODY={sex:'m',age:38,w:0,smm:0,fat:0,d:''};
const LK=['squat','bench','deadlift','ohp','bbrow'],LNAME={squat:'스쿼트',bench:'벤치프레스',deadlift:'데드리프트',ohp:'오버헤드 프레스',bbrow:'바벨 로우'};
const MV={squat:{m:.85,fr:.72,red:.40,rf:.85},deadlift:{m:1.0,fr:.7,red:.50,rf:.85},bench:{m:.65,fr:.55,red:.30,rf:.65},ohp:{m:.42,fr:.50,red:.18,rf:.65},bbrow:{m:.55,fr:.55,red:.28,rf:.65}};
const AGEM={20:1,30:1,40:.94,50:.85,60:.74,70:.61,80:.48};
function initBody(){if(!P)return;BODY.sex=P.sex==='f'?'f':'m';BODY.age=P.age||38;BODY.height=P.height||null;const b=P.body||{};BODY.w=+b.w||0;BODY.smm=+b.smm||0;BODY.fat=+b.fat||0;if(!BODY.fat&&b.bf&&BODY.w)BODY.fat=+(BODY.w*b.bf/100).toFixed(1);BODY.d=b.d||''}
initBody();
const hasBody=()=>BODY.w>0&&BODY.smm>0&&BODY.fat>0;
const L=k=>(P&&P.lifts&&P.lifts[k])||null;

/* ---------- Supabase ---------- */
const SB_URL='https://vpdemapnpunsuxqdffgn.supabase.co',SB_KEY='sb_publishable_fonyE5eloRwvXb7hacPTow_d6JR0zMv';
let sb=null,UID=null,ONLINE=false;
try{sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){}
const LOC={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let TOK={ib:{issued:0,bonus:0,used:0,bal:0,progress:0},hb:{issued:0,bonus:0,used:0,bal:0,progress:0},src:'local'};
async function loadTokens(){
 const sess=P?P.sessLocal||0:0,pass=P?P.passes||0:0;
 if(sb){try{const s=await sb.auth.getSession();UID=s.data&&s.data.session?s.data.session.user.id:null}catch(e){}}
 if(sb&&UID){try{await sb.rpc('diag_sync',{p_hb_passes:pass});const r=await sb.rpc('diag_balance');if(r.error)throw r.error;
   (r.data||[]).forEach(x=>{TOK[x.tool]={issued:x.issued,bonus:x.bonus,used:x.used,bal:x.bal,progress:x.progress}});TOK.src='server';ONLINE=true;flushQ();return}catch(e){}}
 const u=LOC.get('rune-diag-used',{ib:0,hb:0});
 TOK.ib={issued:Math.floor(sess/10),bonus:0,used:u.ib||0,progress:sess%10};TOK.ib.bal=TOK.ib.issued-TOK.ib.used;
 TOK.hb={issued:pass,bonus:0,used:u.hb||0,progress:0};TOK.hb.bal=TOK.hb.issued-TOK.hb.used;TOK.src='local'}
async function useToken(k){
 if(TOK.src==='server'){const r=await sb.rpc('diag_use_token',{p_tool:k});if(r.error)throw new Error(r.error.message||'토큰을 쓰지 못했어요');await loadTokens();return}
 const u=LOC.get('rune-diag-used',{ib:0,hb:0});u[k]=(u[k]||0)+1;LOC.set('rune-diag-used',u);await loadTokens()}
async function sendSurvey(tool,answers,summary){
 if(sb&&UID){try{const r=await sb.rpc('diag_submit_survey',{p_tool:tool,p_answers:answers,p_summary:summary});if(r.error)throw r.error;return true}catch(e){}}
 const q=LOC.get('rune-diag-queue',[]);q.push({tool,answers,summary,at:Date.now()});LOC.set('rune-diag-queue',q.slice(-20));return false}
async function flushQ(){const q=LOC.get('rune-diag-queue',[]);if(!q.length||!sb||!UID)return;const rest=[];for(const x of q){try{const r=await sb.rpc('diag_submit_survey',{p_tool:x.tool,p_answers:x.answers,p_summary:x.summary});if(r.error)throw r.error}catch(e){rest.push(x)}}LOC.set('rune-diag-queue',rest)}
async function reloadBody(){ // 서버에 쌓인 최신 인바디(체중·체지방·골격근)를 다시 읽어요
 if(!sb||!UID)return false;try{const r=await sb.from('body_measurements').select('measured_on,body_kg,body_fat_pct,smm_kg').eq('member_id',UID).order('measured_on',{ascending:false}).limit(5);if(r.error)throw r.error;
  const x=(r.data||[]).find(v=>v.smm_kg!=null&&v.body_kg!=null&&v.body_fat_pct!=null)||(r.data||[])[0];if(!x)return false;
  BODY.w=+x.body_kg||BODY.w;if(x.smm_kg!=null)BODY.smm=+x.smm_kg;if(x.body_fat_pct!=null)BODY.fat=+(BODY.w*x.body_fat_pct/100).toFixed(1);BODY.d=x.measured_on;return true}catch(e){return false}}

/* ---------- 인바디 계산식 (기존 4T 시뮬레이터) ---------- */
function simulate(p,h,N){const male=p.sex==='m',base=[0.45,0.25,0.12][p.exp]*(male?1:0.6),freqF=lerp(h.str,[0,1,2,3,4],[0,0.4,0.75,0.95,1]),proF=lerp(h.pro,[0.8,1.2,1.6],[0.55,0.8,1]),slpF=lerp(h.slp,[5,6,7],[0.75,0.85,1]),ageF=lerp(p.age,[30,45,60,75],[1,0.85,0.7,0.55]),ess=male?0.04:0.11;
 let fat=p.fat,smm=p.smm,w=p.weight;const out=[{w,smm,fat,pbf:fat/w*100}];
 for(let wk=1;wk<=N;wk++){const month=wk/4.345,intake=h.def+h.alc*400/7-h.car,adapt=(p.weight-w)*35,bal=intake+adapt,def=Math.max(0,-bal);let dS;
  if(h.str>=0.5){const dF=lerp(def,[0,300,500,750,1000],[1,0.95,0.85,0.65,0.45]);dS=base*freqF*proF*slpF*ageF*dF*Math.exp(-0.035*month)/4.345}else dS=-(def/500)*0.15/4.345-(p.age>40?0.008:0.004)/4.345;
  let dFat=bal*7/7700*0.8;if(bal<0){dFat*=(h.slp<6?0.85:1);dFat=Math.max(dFat,-0.01*w);dFat=Math.max(dFat,ess*w-fat)}else dFat*=(h.str>=0.5?0.8:0.95);
  smm+=dS;fat+=dFat;w=p.weight+(smm-p.smm)*1.7+(fat-p.fat);out.push({w,smm,fat,pbf:fat/w*100})}
 return out}
const NW=156,moOf=w=>w==null?null:+(w/4.345).toFixed(1);
const fmtM=(m,cap)=>m==null?`${cap/12}년 이상`:`약 ${m}개월`;

/* ---------- 설문 정의 ---------- */
const O=a=>a.map(x=>Array.isArray(x)?x:[x,x]);
const SVY={
ib:[['지금 나의 생활',[
 ['str','근력운동 (회/주)','sel',[[0,'안 해요'],[1,'1회'],[2,'2회'],[3,'3회'],[4,'4회'],[5,'5회']],1],
 ['car','유산소 (분/주)','sel',[[0,'안 해요'],[30,'30분'],[60,'60분'],[90,'90분'],[150,'150분'],[210,'210분 이상']],30],
 ['def','식단 관리 수준','sel',[[300,'자주 과식·야식'],[100,'조금 많이 먹는 편'],[0,'평소 먹는 대로'],[-150,'조금 신경 씀'],[-300,'꽤 철저히 관리']],100],
 ['pro','단백질 (체중 1kg당)','sel',[[0.7,'거의 신경 안 씀'],[0.9,'보통 0.9g'],[1.2,'챙기는 편 1.2g'],[1.6,'충분히 1.6g'],[2.0,'매우 충분 2.0g']],0.9],
 ['slp','수면 (시간/일)','sel',[[5,'5시간 이하'],[6,'6시간'],[7,'7시간'],[8,'8시간 이상']],6],
 ['alc','음주 (회/주)','sel',[[0,'안 마셔요'],[1,'1회'],[2,'2회'],[3,'3회'],[5,'5회']],2]]],
 ['내가 이루고 싶은 목표',[
 ['gw','목표 체중 (kg)','num',0,'W'],['gs','목표 골격근량 (kg)','num',0,'S'],['gf','목표 체지방률 (%)','num',0,'F'],
 ['gm','이루고 싶은 기간','sel',[[3,'3개월'],[6,'6개월'],[9,'9개월'],[12,'12개월']],6]]],

 const o=[rm];let x=rm;for(let m=1;m<=N;m++){x=x*(1+b*F*Math.exp(-.03*m)/100);o.push(x)}return o}

function parseInBodyQR(raw){let t=String(raw||'').trim();const k=t.indexOf('IBData=');if(k>=0)t=t.slice(k+7).split('&')[0];try{t=decodeURIComponent(t)}catch(e){}

 const v={sex:mm[1]==='M'?'m':'f',date:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,fat:n(6,10),ffm:n(12,10),w:n(13,10),smm:n(17,10),height:parseInt(prefix.slice(-8,-4),10)/10,bmi:n(20,10),pbf:n(21,10)};

let jsqrP=null;function loadJsQR(){if(window.jsQR)return Promise.resolve(window.jsQR);if(jsqrP)return jsqrP;const urls=['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];

async function decodeQR(file){if(/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name||''))throw new Error('아이폰 HEIC 사진은 열 수 없어요. 스크린샷으로 찍어 올려 주세요.');

  if('BarcodeDetector' in window){try{const det=new BarcodeDetector({formats:['qr_code']});const r=await det.detect(img);if(r&&r.length)return r[0].rawValue}catch(e){}}
  const jsQR=await loadJsQR(),c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true}),W0=img.naturalWidth,H0=img.naturalHeight;
  const tryR=(sx,sy,sw,sh,mx)=>{const sc=Math.min(1,mx/Math.max(sw,sh));c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);const d=ctx.getImageData(0,0,c.width,c.height),r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});return r?r.data:null};

 b.innerHTML=`<h2>인바디 결과지 사진 올리기</h2><div class="mu">결과지의 QR이 보이게 찍은 사진이나 스크린샷을 올려요</div><input type="file" accept="image/*" id="qf"><div id="qs" class="mu"></div><div id="qv"></div><button class="btn ghost" id="qx">닫기</button>`;
 $('qx').onclick=()=>m.hidden=true;
 $('qf').onchange=async()=>{const f=$('qf').files[0];if(!f)return;$('qs').textContent='사진에서 QR을 찾는 중...';
  try{const v=parseInBodyQR(await decodeQR(f));showQ(v)}catch(e){if(e.partial){$('qs').innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`;showQ(e.partial)}else $('qs').innerHTML=`<span style="color:var(--bad)">${esc(e.message)}</span>`}}}
function showQ(v){$('qv').innerHTML=`<div class="grid2"><label class="f"><span>측정일</span><input type="date" id="q_d" value="${v.date}"></label><label class="f"><span>체중 kg</span><input type="number" step="0.1" id="q_w" value="${v.w}"></label><label class="f"><span>골격근량 kg</span><input type="number" step="0.1" id="q_s" value="${v.smm}"></label><label class="f"><span>체지방량 kg</span><input type="number" step="0.1" id="q_f" value="${v.fat}"></label></div><button class="btn" id="q_ok">이 값으로 저장</button>`;
 $('q_ok').onclick=async()=>{const d=$('q_d').value,w=+$('q_w').value,s=+$('q_s').value,f=+$('q_f').value;if(!d||!(w>20)||!(s>5)||!(f>1)){toast('측정일·체중·골격근·체지방량을 확인해 주세요');return}await saveBody(d,w,s,f,{ffm:v.ffm,pbf:v.pbf,bmi:v.bmi});$('qrm').hidden=true;paint()}}
function openManual(){const m=$('qrm'),b=$('qrbox');m.hidden=false;const t=new Date(Date.now()+9*36e5).toISOString().slice(0,10);
 b.innerHTML=`<h2>인바디 값 직접 입력</h2><div class="grid2"><label class="f"><span>측정일</span><input type="date" id="q_d" value="${t}"></label><label class="f"><span>체중 kg</span><input type="number" step="0.1" id="q_w" value="${BODY.w||''}"></label><label class="f"><span>골격근량 kg</span><input type="number" step="0.1" id="q_s" value="${BODY.smm||''}"></label><label class="f"><span>체지방량 kg</span><input type="number" step="0.1" id="q_f" value="${BODY.fat||''}"></label></div><button class="btn" id="q_ok">저장</button><button class="btn ghost" id="qx">닫기</button>`;
 $('qx').onclick=()=>m.hidden=true;$('q_ok').onclick=async()=>{const d=$('q_d').value,w=+$('q_w').value,s=+$('q_s').value,f=+$('q_f').value;if(!d||!(w>20)||!(s>5)||!(f>1)){toast('값을 확인해 주세요');return}await saveBody(d,w,s,f,null);m.hidden=true;paint()}}

/* ---------- 목표 바꿔 보기 ---------- */
function adopt(){
 if(tab==='ib'){const b=IB,W=ibWhy();PREV.ib={gs:SV.ib.gs,gf:SV.ib.gf,gw:SV.ib.gw,gm:SV.ib.gm,gfk:SV.ib.gfk};const before=planMs(b.defs),bt=b.TG;let Wf=W;
  for(let it=0;it<8;it++){SV.ib.gs=Wf.sug.s;SV.ib.gf=Wf.sug.f;SV.ib.gw=Wf.sug.w;SV.ib.gfk=+(Wf.sug.f/100*Wf.sug.w).toFixed(1);SV.ib.gm=6;ibBuild();const n=ibWhy();const ch=Math.abs(n.sug.s-Wf.sug.s)+Math.abs(n.sug.f-Wf.sug.f);Wf=n;if(ch<.05)break}
  SV.ib.gs=Wf.sug.s;SV.ib.gf=Wf.sug.f;SV.ib.gw=Wf.sug.w;SV.ib.gfk=+(Wf.sug.f/100*Wf.sug.w).toFixed(1);ibBuild();const a=IB,p2=a.defs[1];
  CHG.ib={what:`골격근 ${bt.s}kg → <b>${Wf.sug.s}kg</b> · 체지방률 ${bt.f.toFixed(1)}% → <b>${Wf.sug.f}%</b> · 체중 ${bt.w}kg → <b>${Wf.sug.w}kg</b>${bt.m!==6?` · 기간 ${bt.m}개월 → <b>6개월</b>`:' · 기간 6개월'}`,
   why:`처음 목표는 1년에 늘릴 수 있는 근육량과 안전한 감량 속도를 넘어서 있었어요. 그래서 2안(60% 실천)으로 6개월 안에 실제로 닿을 수 있는 수준으로 낮췄어요. 목표를 낮춘 게 아니라 '지금 단계의 목표'를 현실에 맞춘 거예요.`,
   how:`그래프의 6개월 목표선이 이동하고, 세 안의 도달 기간이 <b>${before}</b> → <b>${planMs(a.defs)}</b>(1안 / 2안 / 3안)로 바뀌어요. ${reachTxt(a.defs)}`,
   checks:[`<b>1개월 뒤</b> 체중 변화가 월 ${(a.S.weight*.04).toFixed(1)}kg 안쪽인지 확인 (빠르면 근손실 신호)`,`<b>3개월 뒤</b> 이정표: 골격근 ${p2.sim[13].smm.toFixed(1)}kg · 체지방률 ${p2.sim[13].pbf.toFixed(1)}% — 못 미치면 식단·수면부터 점검`,`단백질 ${Math.max(1.2,+p2.h.pro.toFixed(1))}g/kg 이상, 수면 7시간을 매주 지키는지 확인`,`<b>6개월 뒤</b> 인바디를 다시 측정하고 토큰으로 재진단 → 다음 목표 설정`]}}
 else if(tab==='hb'){const P2=HB.per[LIFT],bs=H.steps,before=planMs(P2.defs),oldT=Math.round(P2.tgt),oldTier=OVT[LIFT]?'직접 입력':TIERS[P2.ti2];let st=0;
  for(let s2=3;s2>=1;s2--){const t2=(P2.l.ladder&&P2.l.ladder[Math.min(P2.ti+s2,9)-1])||P2.rm*(1+.12*s2);if(P2.defs[1].sim[6]>=t2){st=s2;break}}
  PREV.hb={steps:bs,gm:H.gm,ovt:OVT[LIFT]};delete OVT[LIFT];if(st)H.steps=['한 티어 위','두 티어 위','세 티어 위'][st-1];else OVT[LIFT]=Math.round(P2.defs[1].sim[6]);H.gm='6개월';hbBuild();const Q2=HB.per[LIFT],p2=Q2.defs[1],h=p2.h;
  CHG.hb={what:`${LNAME[LIFT]} 목표 ${oldTier} (${oldT}kg) → <b>${TIERS[Q2.ti2]} (${Math.round(Q2.tgt)}kg)</b> · 기간 ${HB.m!==6?'→ ':''}6개월`,
   why:`처음 목표는 6개월 동안 1RM이 올라갈 수 있는 한계를 넘었어요. 근력은 수준이 높을수록 같은 노력에 오르는 폭이 작아져서, ${st?'2안(60% 실천)으로 6개월 안에 닿는 가장 높은 티어로 맞췄어요.':'한 티어 위도 6개월 안에는 어려워서, 2안(60% 실천)으로 닿을 수 있는 무게로 맞췄어요. 이 무게를 달성하면 다음 티어가 훨씬 가까워져요.'}`,
   how:`그래프의 6개월 목표선이 ${oldT}kg → ${Math.round(Q2.tgt)}kg로 바뀌고, 세 안의 도달 기간이 <b>${before}</b> → <b>${planMs(Q2.defs)}</b>(1안 / 2안 / 3안)로 바뀌어요. ${reachTxt(Q2.defs)} 승급시험 목표도 ${TIERS[Q2.ti2]}로 같이 맞춰져요.`,
   checks:[`<b>1개월 뒤</b> 주당 유효 세트 ${Math.round(h.sets)}세트 · 주 ${Math.round(h.freq)}회를 지켰는지 (기록으로 자동 확인)`,`<b>3개월 뒤</b> 이정표 ${LNAME[LIFT]} ${Math.round(p2.sim[3])}kg — 못 미치면 볼륨·회복·수면부터 점검`,`무게·반복을 늘린 세션이 ${Math.round(h.over/5)*5}% 이상인지 (과부하 없이는 승급이 안 와요)`,`통증·불편이 생기면 목표는 두고 볼륨만 줄여요${H.pain.length?` (설문에서 '${H.pain.join('·')}' 부위 우선 확인)`:''}`,`<b>6개월 뒤</b> ${TIERS[Q2.ti2]} 승급전 도전 → 통과하면 토큰 1개로 다음 목표 컨설팅`]}}
 toast('6개월 뒤 목표로 설정했어요')}
function undo(){const p=PREV[tab];if(!p)return;if(tab==='ib')Object.assign(SV.ib,p);else{H.steps=p.steps;H.gm=p.gm;if(p.ovt)OVT[LIFT]=p.ovt}CHG[tab]=null;toast('이전 목표로 되돌렸어요')}

/* ---------- 이벤트 ---------- */
async function submitSurvey(k,from){const rows=collect(k,from),ok=await sendSurvey(k,rows,{tool:k,at:new Date().toISOString(),body:{w:BODY.w,smm:BODY.smm,fat:BODY.fat}});toast(ok?'설문이 트레이너에게 전달됐어요':'설문을 저장했어요 (로그인·서버 연결 시 전달돼요)');step[k]='load';paint()}
document.addEventListener('change',e=>{const el=e.target.closest('[data-ed]');if(!el)return;const k=el.dataset.ed,v=+el.value;if(!(v>0))return paint();
 ({cw:()=>BODY.w=v,cs:()=>BODY.smm=v,cf:()=>BODY.fat=v,gw:()=>SV.ib.gw=v,gs:()=>SV.ib.gs=v,gf:()=>SV.ib.gfk=v,hw:()=>BODY.w=v,hr:()=>{if(L(LIFT))L(LIFT).rm=v},ht:()=>OVT[LIFT]=v})[k]();CHG[tab]=null;paint()});
document.addEventListener('click',async e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(x=c('#tabs button')){tab=x.dataset.k;history.replaceState(null,'','#'+Object.keys(HASH).find(h=>HASH[h]===tab));paint();return}
 if(t.id==='start'){if(tab==='ib'&&!SV.ib.gm){}step[tab]='survey';if(tab==='hb')hst=0;paint();return}
 if(t.id==='sub'){await submitSurvey(tab,9);if(tab==='ib'){SV.ib.gfk=+(SV.ib.gf/100*SV.ib.gw).toFixed(1)}return}
 if(t.id==='load'){if(tab==='ib'){await reloadBody()}LOADED[tab]=1;paint();return}
 if(t.id==='qr'){openQR();return}if(t.id==='manual'){openManual();return}
 if(t.id==='run'){if(tab!=='rz'){try{await useToken(tab)}catch(err){toast(err.message||'토큰을 쓰지 못했어요');return}}
   if(tab==='ib'&&SV.ib.gfk==null)SV.ib.gfk=+(SV.ib.gf/100*SV.ib.gw).toFixed(1);step[tab]='done';paint();window.scrollTo(0,0);return}
 if(t.id==='home'){step[tab]='home';LOADED[tab]=0;CHG[tab]=null;paint();return}
 if(x=c('[data-plan]')){SEL[tab]=+x.dataset.plan;paint();return}
 if(x=c('[data-mk]')){MK=x.dataset.mk;paint();return}
 if(x=c('[data-lift]')){if(tab==='hb'&&step.hb==='survey')H.lift=x.dataset.lift;else{LIFT=x.dataset.lift;CHG[tab]=null}paint();return}
 if(t.id==='adopt'){adopt();paint();return}if(t.id==='undo'){undo();paint();return}
 /* 힘바디 설문 */
 if(x=c('[data-hs]')){hst=+x.dataset.hs;paint();return}
 if(x=c('[data-mx]')){const k=x.dataset.mx,i=+x.dataset.i;H.mx[k][i]=(H.mx[k][i]+1)%3;paint();return}
 if(x=c('[data-adh]')){H.adh=+x.dataset.adh;paint();return}
 if(x=c('[data-lk]')){const f=x.dataset.lk,Lx=LS[H.lift];if(f==='skip')Lx.skip=!Lx.skip;else Lx[f]=(f==='rir'||f==='rest')?+x.dataset.v:x.dataset.v;paint();return}
 if(x=c('[data-hk]')){const k=x.dataset.hk,v=x.dataset.v;if(x.dataset.m==='1'){const a=H[k],i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)}else{H[k]=(typeof H[k]==='number')?+v:v;if(hst>=3)H.ans[hst]=1}if(hst===3)H.ans[3]=1;paint();return}
 if(t.id==='hprev'){hst=Math.max(0,hst-1);paint();return}
 if(t.id==='hskip'){await submitSurvey('hb',hst+1);return}
 if(t.id==='hnext'){if(hst===3)H.ans[3]=1;if(hst<4){hst++;paint()}else await submitSurvey('hb',5);return}
});
async function init(){
 const h=(location.hash||'').slice(1);if(HASH[h])tab=HASH[h];
 SVY.ib.forEach(([t,fs])=>fs.forEach(f=>{if(f[2]==='num'){}}));
 SV.ib.gw=+(BODY.w-3).toFixed(1)||'';SV.ib.gs=+(BODY.smm+1).toFixed(1)||'';SV.ib.gf=+Math.max(8,(BODY.w?BODY.fat/BODY.w*100:25)-4).toFixed(1);
 paint();await loadTokens();paint()}
window.addEventListener('hashchange',()=>{const h=(location.hash||'').slice(1);if(HASH[h]){tab=HASH[h];paint()}});
init();
</script>
</body>
</html>
