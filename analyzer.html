.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:30px;height:30px;flex:none}

<div class="pf-bg" id="pfBg" hidden>
  <div class="pf" role="dialog" aria-modal="true" aria-labelledby="pfT">

    <p>여기 몸 정보를 세 분석에 한 번에 넣어요. 인바디에 측정이 있으면 최근 측정값을 바로 가져올 수 있어요.</p>
    <div class="grid2">
      <label class="f full">이름<input id="p_name"></label>
      <label class="f">성별<select id="p_sex"><option value="m">남성</option><option value="f">여성</option></select></label>
      <label class="f">나이<input id="p_age" type="number" min="12" max="95"></label>
      <label class="f">키 (cm)<input id="p_height" type="number" step="0.1"></label>
      <label class="f">체중 (kg)<input id="p_bw" type="number" step="0.1"></label>
      <label class="f">체지방률 (%)<input id="p_bf" type="number" step="0.1"></label>

  </div>
</div>

rea-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}\n.md-bg[hidden]{display:none!important}\n.md{background:var(--s1);color:var(--fg);border-radius:16px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:18px 18px 20px;box-shadow:0 18px 50px rgba(0,0,0,.35)}\n.md-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}\n.md h3{margin:2px 0 0;font-size:19px;font-weight:800}\n.md-x{border:0;background:var(--s2);color:var(--fg);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;flex:none}\n.md-what{margin:10px 0 4px;font-size:14px}\n.md-sec{margin-top:12px}.md-sec>b{font-size:12px;color:var(--mu);letter-spacing:.3px}\n.md-sec p{margin:4px 0 0;font-size:13.5px}.md-sec ol{margin:4px 0 0;padding-left:20px;font-size:13.5px}.md-sec li{margin:3px 0}\n.md-sec .cuts{margin-top:6px}.md-on{outline:2px solid var(--fg);font-weight:800}\n.md-warn{background:color-mix(in srgb,var(--z-org) 12%,transparent);border-radius:10px;padding:8px 10px}\n.md a{color:var(--accent)}\n.tierpick{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;padding:8px 10px;background:var(--s2);border-radius:10px;font-size:12.5px}\n.tp-h{font-weight:800;color:var(--fg2);margin-right:4px}\n.tp{display:inline-flex;align-items:center;gap:5px;cursor:pointer}.tp input{width:auto;margin:0}\n.tp i{width:9px;height:9px;transform:rotate(45deg);display:inline-block}\n.projbox{margin-top:8px;padding:10px 12px;background:var(--s2);border-radius:10px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}\n.pj-ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n.pj-age{display:inline-flex;align-items:center;gap:6px}.pj-age input{width:64px;padding:4px 6px}\n.pj-chips{display:inline-flex;gap:4px;flex-wrap:wrap}\n.chip-s{border:1px solid var(--bd);background:var(--s1);color:var(--fg2);border-radius:999px;padding:2px 9px;font-size:12px}\n.chip-s[aria-pressed=\"true\"]{border-color:var(--z-red);color:var(--z-red);font-weight:800}\n.pj-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}\n@media (max-width:560px){.pj-res{grid-template-columns:1fr}}\n.pj-res>div{background:var(--s1);border-radius:8px;padding:8px 10px}.pj-res .k{font-size:11.5px;color:var(--fg2)}.pj-res .v{font-size:18px;font-weight:800}\n.launch{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n@media (max-width:900px){.launch{grid-template-columns:repeat(2,1fr)}}\n@media (max-width:480px){.launch{grid-template-columns:1fr}}\n.lb{all:unset;cursor:pointer;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:3px;min-width:0}\n.lb:hover{border-color:var(--accent)}.lb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.lb b{font-size:14px;font-weight:800}.lb .ld{font-size:12px;color:var(--mu)}.lb .lv{font-size:12px;font-weight:700;color:var(--fg2)}\n.lb.main{grid-column:1/-1;border-left:5px solid var(--z-org)}\n.sh-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}\n.sh-bg[hidden]{display:none!important}\n.sh{background:var(--bg);border-radius:16px;width:min(980px,100%);max-height:92vh;overflow:auto;box-shadow:0 18px 50px rgba(0,0,0,.35)}\n.sh-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--bd);font-weight:800}\n#shB{padding:12px}#shB>section{border-left-width:1px}\n.warnline{margin-top:10px!important;font-size:13px;color:var(--fg)!important;background:color-mix(in srgb,var(--z-org) 14%,transparent);border-radius:8px;padding:8px 10px}\n.read{background:color-mix(in srgb,var(--z-yel) 12%,var(--s1));border:1px solid color-mix(in srgb,var(--z-yel) 40%,var(--bd));border-radius:12px;padding:12px 14px;font-size:13px}\n.read ul{margin:6px 0 0;padding-left:18px}.read li{margin:3px 0}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n", "html": "<header>\n  <h1>7대 동작 건강 기준표<\/h1>\n  <div class=\"sub\">연령·성별·체중·체지방률별 일반인 분포와 건강 위험 신호(레드존) · 레벨 테스트와 5단계 판정 가이드<\/div>\n<\/header>\n\n<div class=\"layout\">\n  <div class=\"inputs\">\n    <section class=\"panel\">\n      <h2>기준 몸<\/h2>\n      <div class=\"grid2\">\n        <label class=\"f\">성별<select id=\"sex\"><option value=\"m\">남성<\/option><option value=\"f\">여성<\/option><\/select><\/label>\n        <label class=\"f\">현재 나이<input id=\"age\" type=\"number\" min=\"20\" max=\"89\"><\/label>\n        <label class=\"f\">체중 (kg)<input id=\"bw\" type=\"number\" step=\"0.5\"><\/label>\n        <label class=\"f\">체지방률 (%)<input id=\"bf\" type=\"number\" step=\"0.5\" min=\"5\" max=\"55\"><\/label>\n        <label class=\"f full\">비교 모집단<select id=\"pop\"><option value=\"gen\">일반 인구 전체 (노쇠·시설 거주 포함 추정)<\/option><option value=\"vol\">검사 참여 건강 표본 (연구 기준표 그대로)<\/option><\/select><\/label>\n        <label class=\"f full\">기준 단위<select id=\"basis\"><option value=\"bw\">체중 1kg당 (일반 판정)<\/option><option value=\"ffm\">제지방 1kg당 (체지방 영향 제거)<\/option><\/select><\/label>\n      <\/div>\n      <p class=\"note\" id=\"bodyNote\"><\/p>\n    <\/section>\n    <section class=\"panel\">\n      <h2>내 기록 <span class=\"unit-s\" id=\"recUnit\"><\/span><\/h2>\n      <div id=\"recBox\" class=\"grid2\"><\/div>\n      <p class=\"note\" id=\"recNote\"><\/p>\n    <\/section>\n    <section class=\"read\">\n      <b>이 자료를 읽는 법<\/b>\n      <ul>\n        <li>바벨 동작 자체를 건강 결과와 직접 비교한 대규모 연구는 거의 없어요. 그래서 레드존은 <b>같은 움직임을 쓰는 검증된 현장 테스트<\/b>(의자 일어서기, 바닥 일어서기, 악력, 보행속도, 심폐체력)의 기준을 동작 값으로 옮긴 거예요.<\/li>\n        <li>분포는 운동하지 않는 사람까지 포함한 <b>일반인 추정 분포<\/b>예요. 근력 감소율·심폐체력 기준표·근감소증 유병률에 맞춰 만든 모델이라 실제 측정 자료가 쌓이면 바뀔 수 있어요.<\/li>\n        <li>레드존은 진단이 아니라 <b>\"이 수준 아래에서 위험 연관이 커진다\"는 신호<\/b>예요. 통증·질환이 있으면 의료진 판단이 먼저예요.<\/li>\n      <\/ul>\n    <\/section>\n  <\/div>\n\n  <div class=\"results\">\n    <div class=\"mvbar\" id=\"mvbar\" role=\"tablist\" aria-label=\"동작\"><\/div>\n    <section class=\"hero\" id=\"hero\"><\/section>\n\n    <section class=\"panel\">\n      <h2><span id=\"ridgeTitle\">연령별 일반인 분포<\/span> <span class=\"seg\" id=\"decSeg\"><\/span><\/h2>\n      <svg id=\"ridge\" viewBox=\"0 0 640 470\" role=\"img\" aria-label=\"연령대별 분포 곡선과 레드존\"><\/svg>\n      <div class=\"projbox\" id=\"projBox\"><\/div>\n      <div class=\"tierpick\" id=\"tierPick\"><\/div>\n      <div class=\"legend\"><span><i style=\"background:var(--z-red)\"><\/i>위험 (레드존)<\/span><span><i style=\"background:var(--z-org)\"><\/i>경계<\/span><span><i style=\"background:var(--z-yel)\"><\/i>주의<\/span><span><i style=\"background:var(--z-grn)\"><\/i>양호<\/span><span><i style=\"background:var(--z-blu)\"><\/i>우수<\/span><span><i style=\"background:var(--accent);width:3px;height:14px\"><\/i>내 기록<\/span><\/div>\n      <p class=\"note\">위험·경계선은 연령과 상관없이 같은 위치예요. 몸을 움직이는 데 필요한 힘은 나이가 들어도 줄지 않기 때문이에요. 분포만 왼쪽으로 내려오면서 선 아래 비율이 급격히 커져요.<\/p>\n    <\/section>\n\n    <section class=\"launch\" id=\"launch\" aria-label=\"자세히 보기\"><\/section>\n    <div id=\"vault\" hidden>\n    <section class=\"panel ug\" id=\"ckPanel\">\n      <h2>안정성 체크 <span class=\"unit-s\">1RM으로 안 잡히는 무너짐을 직접 재요<\/span> <button class=\"btn-s\" id=\"ckClear\">이 탭 기록 지우기<\/button><\/h2>\n      <div class=\"cktabs\" id=\"ckTabs\" role=\"tablist\"><\/div>\n      <p class=\"ug-lead\" id=\"ckLead\"><\/p>\n      <div class=\"ug-sum\" id=\"ckSum\"><\/div>\n      <div class=\"ug-list\" id=\"ckList\"><\/div>\n      <p class=\"note\">항목 이름을 누르면 준비물·측정 방법·판정 기준·안전 주의·근거가 팝업으로 열려요. 근거 A·B 항목의 위험·경계선은 연구 기준선이고, 근거 C와 '제안값'으로 표시된 구간은 현장 실용 기준이에요.<\/p>\n    <\/section>\n\n    <div class=\"two\">\n      <section class=\"panel\">\n        <h2>레드존 비율 추이 <span class=\"unit-s\">위험 구간에 드는 일반인 %<\/span><\/h2>\n        <svg id=\"trend\" viewBox=\"0 0 420 260\" role=\"img\" aria-label=\"연령대별 레드존 비율\"><\/svg>\n        <div class=\"legend\" id=\"trendLegend\"><\/div>\n      <\/section>\n      <section class=\"panel\">\n        <h2>10~20년 뒤를 위한 지금 목표<\/h2>\n        <div class=\"plan\" id=\"plan\"><\/div>\n        <div class=\"callout\" id=\"planCall\"><\/div>\n        <p class=\"note\">평균 감소 = 같은 성별 일반인의 연령별 평균 감소율. 꾸준히 운동 = 그 감소의 절반만 일어난다고 가정한 추정이에요.<\/p>\n      <\/section>\n    <\/div>\n\n    <section class=\"panel\" id=\"popPanel\">\n      <h2>모집단 보정 <span class=\"unit-s\" id=\"popTag\"><\/span><\/h2>\n      <p class=\"ug-lead\" style=\"margin-top:0\">대부분의 체력 기준표는 스스로 검사받으러 온 건강한 사람으로 만들어져 위쪽으로 치우쳐 있어요. 일반 인구 전체 모드는 이 표본에 운동하지 않는 사람과 노쇠·시설 거주자를 연령별 비율로 섞어서 다시 그린 분포예요.<\/p>\n      <div class=\"scroll-x\"><table id=\"popTable\"><\/table><\/div>\n      <p class=\"note\">비율 근거: 지역사회 노인 노쇠 유병률 약 10.7%, 전노쇠 41.6% (Collard 2012, 21개 연구 61,500명) — 나이가 많을수록 높고, 시설 거주자는 이 연구에서 빠져 있어 80대 노쇠 비중을 더 높게 잡았어요. 그룹별 수준(건강 표본의 85% · 노쇠 50%, 심폐 70%)은 근감소·노쇠 기준과 일반 노인 측정 범위에 맞춘 추정값이에요.<\/p>\n    <\/section>\n\n    <section class=\"panel\" id=\"oddsPanel\">\n      <h2>지금 티어로 보는 레드존 확률 <span class=\"seg\" id=\"oScn\"><button data-s=\"both\">둘 다<\/button><button data-s=\"keep\">운동 지속<\/button><button data-s=\"stop\">운동 중단<\/button><\/span><\/h2>\n      <div class=\"grid2\" style=\"grid-template-columns:repeat(4,1fr);margin-bottom:12px\" id=\"oIn\">\n        <label class=\"f\">지금 나이<input id=\"oAge\" type=\"number\" min=\"20\" max=\"85\"><\/label>\n        <label class=\"f\">지금 티어<select id=\"oTier\"><\/select><\/label>\n        <label class=\"f\">티어 안 위치 (%)<input id=\"oPos\" type=\"number\" min=\"0\" max=\"100\" step=\"10\"><\/label>\n        <label class=\"f\">예측 나이<select id=\"oTo\"><option value=\"70\">70세<\/option><option value=\"80\">80세<\/option><option value=\"90\">90세<\/option><\/select><\/label>\n      <\/div>\n      <div class=\"kpis\" id=\"oKpi\" style=\"margin-top:0\"><\/div>\n      <svg id=\"oChart\" viewBox=\"0 0 640 260\" role=\"img\" aria-label=\"나이에 따른 레드존 확률\"><\/svg>\n      <div class=\"legend\"><span><i style=\"background:var(--z-grn);height:3px;width:18px\"><\/i>운동 지속<\/span><span><i style=\"background:var(--z-red);height:3px;width:18px\"><\/i>운동 중단<\/span><span><i style=\"border-top:2px dashed var(--fg2);height:0;width:18px;background:none\"><\/i>경계 이하까지 포함<\/span><\/div>\n      <div class=\"sub-h\" style=\"font-size:13px;font-weight:800;margin:16px 0 8px\">지금 나이 × 지금 티어 → <span id=\"oHmTo\"><\/span> 레드존 확률 <span class=\"unit-s\" id=\"oHmScn\"><\/span><\/div>\n      <div class=\"scroll-x\"><table id=\"oHeat\"><\/table><\/div>\n      <p class=\"note\" id=\"oNote\"><\/p>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>판정 가이드라인 · <span id=\"gTitle\"><\/span> <span class=\"unit-s\" id=\"gUnit\"><\/span><\/h2>\n      <div class=\"scroll-x\"><table id=\"gTable\"><\/table><\/div>\n      <p class=\"note\">위험·경계 = 기능 기준선(전 연령 같음). 주의·양호·우수 = 같은 연령·성별·체성분 일반인의 하위 30%·상위 20% 경계. 고령에서는 분포가 기준선 아래로 내려와 '주의'와 '양호' 칸이 좁아지거나 사라져요.<\/p>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>레벨 테스트 방법 · <span id=\"tTitle\"><\/span><\/h2>\n      <div class=\"tests\" id=\"tests\"><\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>동작별 위험 연관 근거 강도<\/h2>\n      <div class=\"scroll-x\"><table id=\"riskTable\"><\/table><\/div>\n      <p class=\"note\">점 3개 = 대규모 코호트·메타분석에서 일관됨 · 2개 = 코호트 또는 대리 테스트를 거친 연관 · 1개 = 간접 근거 · 0개 = 판정 근거로 쓰지 않음. 신경계 질환(파킨슨 등)은 근거가 부족해 판정에 넣지 않았어요.<\/p>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>핵심 근거<\/h2>\n      <div class=\"ev\" id=\"ev\"><\/div>\n    <\/section>\n    <\/div>\n  <\/div>\n<\/div>\n\n<div class=\"sh-bg\" id=\"sh\" hidden><div class=\"sh\" role=\"dialog\" aria-modal=\"true\" aria-label=\"자세히 보기\"><div class=\"sh-top\"><span id=\"shT\"><\/span><button class=\"md-x\" id=\"shX\" aria-label=\"닫기\">×<\/button><\/div><div id=\"shB\"><\/div><\/div><\/div>\n<div class=\"md-bg\" id=\"md\" hidden><div class=\"md\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mdTitle\" id=\"mdBody\"><\/div><\/div>"}, "hb": {"css": ":host{display:block}\n[hidden]{display:none!important}\n\n/* 레이아웃: 4T 인바디 시뮬레이터와 같은 2열(왼쪽 입력 · 오른쪽 결과) → 모바일 1열 */\n:host{\n  --bg:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#dedcd6;\n  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#82817c;\n  --grid:#e6e4df; --axis:#b9b7b0;\n  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;\n  --accent:#2a78d6; --good:#0a7a3e; --bad:#c23b22;\n  --p-a:#2a78d6; --p-b1:#1baf7a; --p-b2:#0b6e4a; --p-c1:#eb6834; --p-c2:#b8336a; --talent:#c99a00;\n}\n@media (prefers-color-scheme: dark){:host(:not(.th-light)){\n  --bg:#121211; --surface-1:#1a1a19; --surface-2:#232321; --border:#34332f;\n  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;\n  --grid:#2c2b28; --axis:#55544e;\n  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;\n  --accent:#3987e5; --good:#4cc47e; --bad:#f07a63; --p-a:#4b95ec; --p-b1:#2bc48b; --p-b2:#8fe6c2; --p-c1:#f08a4f; --p-c2:#e76fa3; --talent:#f5c84a; color-scheme:dark}}\n:host(.th-dark){\n  --bg:#121211; --surface-1:#1a1a19; --surface-2:#232321; --border:#34332f;\n  --text-primary:#f0efec; --text-secondary:#c3c2b7; --text-muted:#8f8e86;\n  --grid:#2c2b28; --axis:#55544e;\n  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70;\n  --accent:#3987e5; --good:#4cc47e; --bad:#f07a63; --p-a:#4b95ec; --p-b1:#2bc48b; --p-b2:#8fe6c2; --p-c1:#f08a4f; --p-c2:#e76fa3; --talent:#f5c84a; color-scheme:dark}\n*{box-sizing:border-box}\n.app-root{margin:0;background:var(--bg);color:var(--text-primary);font-family:\"Noto Sans KR\",system-ui,sans-serif;font-size:14px;line-height:1.5}\nbutton{font:inherit;cursor:pointer}\nheader{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px;padding-left:max(20px,env(safe-area-inset-left,0px));p eight:500;color:var(--text-muted);font-size:12px;text-align:left;padding:0 3px 6px}\n.sess-table td,.rt-table td{padding:3px}\n.sess-table input{padding:6px 5px;font-size:13px;font-variant-numeric:tabular-nums}\n.sess-table input[type=date]{font-size:12px}\n.rt-table td:first-child{color:var(--text-secondary);white-space:nowrap;padding-right:6px}\n.rt-table td.tgt input,.rt-table td.tgt select{border-color:var(--accent)}\n.rt-table .ro{padding:7px 9px;background:var(--surface-2);border-radius:8px;color:var(--text-secondary);font-variant-numeric:tabular-nums}\n.note{font-size:12px;color:var(--text-muted);margin-top:8px}\n.unit-s{font-size:11px;color:var(--text-muted)}\n.rt-table input.auto{color:var(--text-secondary);font-style:italic}\n.sub-h{font-size:13px;font-weight:700;margin:14px 0 8px;padding-top:12px;border-top:1px solid var(--border)}\n.goal-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}\n.goal-row select{width:auto}\n.reach{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}\n@media (max-width:520px){.reach{grid-template-columns:1fr}}\n.reach div{background:var(--surface-2);border-radius:10px;padding:10px 12px}\n.reach .k{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}\n.reach .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}\n.gaps{display:flex;flex-direction:column;gap:6px;margin-top:10px}\n.gap{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:13px;background:var(--surface-2);border-radius:10px;padding:8px 12px}\n.gap b{font-variant-numeric:tabular-nums}\n.mx-band{margin-bottom:14px}.mx-bh{font-size:14px;margin-bottom:4px}\n.mx-row{display:grid;grid-template-columns:72px 1fr 112px;gap:8px;align-items:center;margin:5px 0}\n@media (max-width:480px){.mx-row{grid-template-columns:58px 1fr 92px;gap:6px}}\n.mx-lb{font-size:12.5px;font-weight:800;display:flex;flex-direction:column;line-height:1.2}\n.mx-track{position:relative;height:22px;background:var(--surface-2);border-radius:5px}\n.mx-zero{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--axis)}\n.mx-out{position:absolute;top:5px;height:12px;border-radius:3px;opacity:.28}\n.mx-in{position:absolute;top:5px;height:12px;border-radius:3px;opacity:.75}\n.mx-mid{position:absolute;top:2px;height:18px;width:3px;margin-left:-1.5px;background:var(--text-primary);border-radius:2px}\n.mx-tal{position:absolute;top:5px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--talent);box-shadow:0 0 0 2px var(--surface-1)}\n.mx-v{font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;line-height:1.3}\n.mx-axis{display:grid;grid-template-columns:72px 1fr 112px;gap:8px;font-size:10.5px;color:var(--text-muted)}\n@media (max-width:480px){.mx-axis{grid-template-columns:58px 1fr 92px;gap:6px}}\n.mx-axis div{display:flex;justify-content:space-between}\n.dcharts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media (max-width:1250px){.dcharts{grid-template-columns:repeat(2,1fr)}}\n@media (max-width:560px){.dcharts{grid-template-columns:1fr}}\n.dc-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);padding:2px 2px 6px}\ntable.data tr.bstart td{border-top:2px solid var(--border)}\n.viewseg{margin-top:6px}\ntable.pg td{vertical-align:top}\ntable.pg tr.on td{background:color-mix(in srgb,var(--accent) 9%,transparent)}\n.warn{font-size:12px;color:var(--bad);margin-top:6px}\n.results{display:flex;flex-direction:column;gap:16px;min-width:0}\n.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;flex-wrap:wrap}\n.seg button{font-size:13px;border:0;background:transparent;color:var(--text-secondary);padding:6px 12px;border-radius:7px}\n.seg button[aria-pressed=\"true\"]{background:var(--surface-1);color:var(--text-primary);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}\n.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}\n.exbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}\n.exbtn{flex:none;border:1px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:12px;padding:8px 14px;text-align:left;display:flex;flex-direction:column}\n.exbtn b{font-size:14px}.exbtn small{font-size:12px;font-weight:700}\n.exbtn[aria-pressed=\"true\"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}\n.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n@media (max-width:700px){.hero{grid-template-columns:repeat(2,1fr)}}\n.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:14px;min-width:0}\n.tile .k{font-size:12px;color:var(--text-secondary)}\n.tile .v{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.tile .v small{font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:2px}\n.tile .d{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}\n.good{color:var(--good)!important}.bad{color:var(--bad)!important}\n.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media (max-width:1250px){.charts{grid-template-columns:1fr}}\n.chart{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 12px 6px;position:relative;min-width:0}\n.chart h4{margin:0;font-size:14px}.chart .unit{font-size:12px;color:var(--text-muted)}\n.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}\n.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}\n.legend i.dash{background:none!important;border-top:3px dotted}\n.legend i.dot{width:10px;height:10px;border-radius:50%;background:var(--text-primary)}\n.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);display:none;min-width:160px;z-index:5}\n.tip .t{font-weight:700;margin-bottom:4px}\n.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}\n.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}\n.two{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}\n@media (max-width:1100px){.two{grid-template-columns:1fr}}\n.msgs{display:flex;flex-direction:column;gap:8px}\n.msg{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 13px}\n.msg .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}\n.msg.caution .n{background:var(--series-2)}\n.msg p{margin:0;font-size:14px}.msg p b{font-weight:800}\n.ab-row{display:grid;grid-template-columns:40px 1fr 92px;gap:4px 10px;align-items:center;margin:7px 0}\n.ab-row .lb{font-size:13px;color:var(--text-secondary);font-weight:700}\n.ab-row .tv{font-size:12px;text-align:right;white-space:nowrap}\n.bar-track{position:relative;height:18px;background:var(--surface-2);border-radius:4px}\n.bar-track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--border)}\n.bar-fill{position:absolute;left:0;height:7px;border-radius:0 4px 4px 0}\n.bar-fill.now{top:2px;background:var(--text-secondary)}\n.bar-fill.after{top:10px}\n.scale-lb{display:grid;grid-template-columns:40px 1fr 92px;gap:10px;font-size:10.5px;color:var(--text-muted)}\n.scale-lb div{display:flex;justify-content:space-between}\n.badge{display:inline-block;font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2)}\ntable.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}\ntable.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}\ntable.data th:first-child,table.data td:first-child{text-align:left}\ntable.data th{color:var(--text-muted);font-weight:500;font-size:12px}\ntable.data tr.sum td{font-weight:700}\n.scroll-x{overflow-x:auto}\n.disclaimer{font-size:12px;color:var(--text-muted)}\ndetails summary{cursor:pointer;color:var(--text-secondary);font-size:13px}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n", "html": "<header>\n  <div>\n    <h1>힘바디 시뮬레이터<\/h1>\n    <div class=\"sub\">최근 3세션 수행기록 + 루틴 → 3·6개월 뒤 수행능력 예측<\/div>\n    <div class=\"seg viewseg\" id=\"viewSeg\"><button data-v=\"sim\">회원 예측<\/button><button data-v=\"dist\">성장 분포 비교<\/button><\/div>\n  <\/div>\n  <span class=\"saved\" id=\"saved\"><\/span>\n<\/header>\n\n<div class=\"layout\" id=\"viewSim\">\n  <div class=\"inputs\">\n    <section class=\"panel\">\n      <h2>회원<\/h2>\n      <div class=\"row\" style=\"margin-bottom:12px\">\n        <select id=\"memberSel\" aria-label=\"회원 선택\"><\/select>\n        <button class=\"btn primary\" id=\"newMember\">+ 새 회원<\/button>\n      <\/div>\n      <div class=\"grid2\">\n        <label class=\"f\">이름<input id=\"name\"><\/label>\n        <label class=\"f\">성별<select id=\"sex\"><option value=\"m\">남성<\/option><option value=\"f\">여성<\/option><\/select><\/label>\n        <label class=\"f\">연령대<select id=\"age\"><option value=\"20\">20대<\/option><option value=\"30\">30대<\/option><option value=\"40\">40대<\/option><option value=\"50\">50대<\/option><option value=\"60\">60대<\/option><option value=\"70\">70대+<\/option><\/select><\/label>\n        <label class=\"f\">체중 (kg)<input id=\"bw\" type=\"number\" step=\"0.5\"><\/label>\n        <label class=\"f full\">골격근량 (kg · 인바디, 선택)<input id=\"smm\" type=\"number\" step=\"0.1\" placeholder=\"비우면 체중으로 추정\"><\/label>\n      <\/div>\n      <div style=\"display:flex;justify-content:flex-end;margin-top:8px\"><button class=\"btn ghost danger sm\" id=\"delMember\">이 회원 삭제<\/button><\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>최근 3세션 수행기록<\/h2>\n      <div class=\"row\" style=\"margin-bottom:10px\"><select id=\"exSel\" aria-label=\"종목\"><\/select><\/div>\n      <table class=\"sess-table\">\n        <thead><tr><th style=\"width:34%\">날짜<\/th><th>무게<\/th><th>반복<\/th><th>RIR<\/th><th>세트<\/th><\/tr><\/thead>\n        <tbody id=\"sessBody\"><\/tbody>\n      <\/table>\n      <div class=\"note\">세트 중 가장 잘 된 세트를 넣어요. RIR = 남긴 여유 반복수. 무게 0이면 그 세션은 빼고 계산해요.<\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>근력 조건: 지금 vs 권장치 <button class=\"btn ghost sm\" id=\"autoBtn\">지금 = 기록값으로<\/button><\/h2>\n      <table class=\"rt-table\">\n        <thead><tr><th><\/th><th>지금<\/th><th>권장치<\/th><\/tr><\/thead>\n        <tbody>\n          <tr><td>주당 유효 세트<br><span class=\"unit-s\">세트/주 · RIR 3 이하<\/span><\/td><td><input id=\"cEff\" type=\"number\" step=\"0.5\" min=\"0\"><\/td><td class=\"tgt\"><input id=\"tEff\" type=\"number\" step=\"0.5\" min=\"0\"><\/td><\/tr>\n          <tr><td>빈도<br><span class=\"unit-s\">회/주 · 이 종목<\/span><\/td><td><input id=\"cFreq\" type=\"number\" step=\"0.5\" min=\"0.5\" max=\"4\"><\/td><td class=\"tgt\"><input id=\"tFreq\" type=\"number\" step=\"0.5\" min=\"0.5\" max=\"4\"><\/td><\/tr>\n          <tr><td>강도 비중<br><span class=\"unit-s\">% · 3–8회 본세트<\/span><\/td><td><input id=\"cInt\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/td><td class=\"tgt\"><input id=\"tInt\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/td><\/tr>\n          <tr><td>과부하 진행<br><span class=\"unit-s\">% · 무게·반복 늘린 세션<\/span><\/td><td><input id=\"cProg\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/td><td class=\"tgt\"><input id=\"tProg\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/td><\/tr>\n          <tr><td>단백질<br><span class=\"unit-s\">g/체중kg · 회원 공통<\/span><\/td><td><input id=\"cPro\" type=\"number\" step=\"0.1\" min=\"0\"><\/td><td class=\"tgt\"><input id=\"tPro\" type=\"number\" step=\"0.1\" min=\"0\"><\/td><\/tr>\n          <tr><td>수면<br><span class=\"unit-s\">시간/일 · 회원 공통<\/span><\/td><td><input id=\"cSlp\" type=\"number\" step=\"0.5\" min=\"3\" max=\"10\"><\/td><td class=\"tgt\"><input id=\"tSlp\" type=\"number\" step=\"0.5\" min=\"3\" max=\"10\"><\/td><\/tr>\n          <tr><td>체중 변화<br><span class=\"unit-s\">kg / 6개월 · 회원 공통<\/span><\/td><td><input id=\"cBw\" type=\"number\" step=\"0.5\"><\/td><td class=\"tgt\"><input id=\"tBw\" type=\"number\" step=\"0.5\"><\/td><\/tr>\n        <\/tbody>\n      <\/table>\n      <div class=\"note\">위 4줄의 '지금'은 최근 3세션 기록에서 자동으로 채워요(직접 고치면 그 값을 써요). 권장치: 유효 세트 6–10 · 빈도 2–3 · 강도 비중 50% 이상 · 과부하 80% 이상 · 단백질 1.6 · 수면 7–9시간. 체중 변화는 목표에 맞게(증량기 +1~3kg/6개월). 80% 실천 = 지금에서 권장치까지 차이의 80%만큼 바뀐 상태예요.<\/div>\n      <div class=\"sub-h\">다음 세션 처방<\/div>\n      <div class=\"grid2\">\n        <label class=\"f full\">방식<select id=\"preset\"><\/select><\/label>\n        <label class=\"f\">반복 구간<div class=\"row\"><input id=\"nLo\" type=\"number\" min=\"1\" max=\"20\"><span>–<\/span><input id=\"nHi\" type=\"number\" min=\"1\" max=\"20\"><\/div><\/label>\n        <label class=\"f\">RIR<input id=\"nRir\" type=\"number\" min=\"0\" max=\"5\"><\/label>\n      <\/div>\n      <div class=\"note\" id=\"perSess\"><\/div>\n    <\/section>\n  <\/div>\n\n  <div class=\"results\" id=\"results\"><\/div>\n<\/div>\n\n<div class=\"layout\" id=\"viewDist\" hidden>\n  <div class=\"inputs\">\n    <section class=\"panel\">\n      <h2>기준 몸 <button class=\"btn ghost sm\" id=\"dReset\">기본값으로<\/button><\/h2>\n      <div class=\"grid2\">\n        <label class=\"f\">성별<select id=\"dSex\"><option value=\"m\">남성<\/option><option value=\"f\">여성<\/option><\/select><\/label>\n        <label class=\"f\">나이<input id=\"dAge\" type=\"number\" min=\"12\" max=\"90\"><\/label>\n        <label class=\"f\">체중 (kg)<input id=\"dBw\" type=\"number\" step=\"0.5\"><\/label>\n        <label class=\"f\">체지방률 (%)<input id=\"dBf\" type=\"number\" step=\"0.5\" min=\"3\" max=\"60\"><\/label>\n        <label class=\"f full\">종목 (티어 기준표)<select id=\"dEx\"><\/select><\/label>\n      <\/div>\n      <div class=\"note\" id=\"dBody\"><\/div>\n    <\/section>\n    <section class=\"panel\">\n      <h2>훈련 방식<\/h2>\n      <div class=\"grid2\">\n        <label class=\"f full\">프로그램<select id=\"dPg\"><\/select><\/label>\n        <label class=\"f\">주당 유효 세트<input id=\"dEff\" type=\"number\" step=\"0.5\" min=\"0\"><\/label>\n        <label class=\"f\">빈도 (회/주)<input id=\"dFreq\" type=\"number\" step=\"0.5\" min=\"0.5\" max=\"4\"><\/label>\n        <label class=\"f\">강도 비중 (%)<input id=\"dInt\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/label>\n        <label class=\"f\">과부하 진행 (%)<input id=\"dProg\" type=\"number\" step=\"10\" min=\"0\" max=\"100\"><\/label>\n        <label class=\"f full\">준수율 (계획 대비 실제 세션 %)<input id=\"dAdh\" type=\"number\" step=\"5\" min=\"30\" max=\"100\"><\/label>\n      <\/div>\n      <div class=\"sub-h\">훈련 환경<\/div>\n      <div class=\"grid2\">\n        <label class=\"f\">단백질 (g/체중kg)<input id=\"dPro\" type=\"number\" step=\"0.1\" min=\"0\"><\/label>\n        <label class=\"f\">수면 (시간/일)<input id=\"dSlp\" type=\"number\" step=\"0.5\" min=\"3\" max=\"10\"><\/label>\n      <\/div>\n    <\/section>\n    <section class=\"panel\">\n      <h2>체중 플랜<\/h2>\n      <div class=\"grid2\">\n        <label class=\"f\">A 유지 (kg 증가)<input id=\"dPA\" type=\"number\" step=\"0.5\" min=\"-3\" max=\"3\"><\/label>\n        <label class=\"f\">기간 (개월)<input id=\"dMon\" type=\"number\" step=\"1\" min=\"2\" max=\"12\"><\/label>\n        <label class=\"f\">B1 증가 (%)<input id=\"dPB1\" type=\"number\" step=\"1\" min=\"0\" max=\"40\"><\/label>\n        <label class=\"f\">B2 증가 (%)<input id=\"dPB2\" type=\"number\" step=\"1\" min=\"0\" max=\"40\"><\/label>\n        <label class=\"f\">C1 감소 (%)<input id=\"dPC1\" type=\"number\" step=\"1\" min=\"0\" max=\"40\"><\/label>\n        <label class=\"f\">C2 감소 (%)<input id=\"dPC2\" type=\"number\" step=\"1\" min=\"0\" max=\"40\"><\/label>\n      <\/div>\n      <div class=\"note\">체중은 기간 동안 일정하게 변하고, 그 뒤로는 유지돼요. 감소는 양수로 넣어요(10 = 10% 감량).<\/div>\n    <\/section>\n    <section class=\"panel\">\n      <h2>분포 기준 <span class=\"unit-s\">개인 반응도 배수<\/span><\/h2>\n      <div class=\"grid2\">\n        <label class=\"f\">저점<input id=\"dQ0\" type=\"number\" step=\"0.05\" min=\"0.1\"><\/label>\n        <label class=\"f\">고점<input id=\"dQ4\" type=\"number\" step=\"0.05\" min=\"0.1\"><\/label>\n        <label class=\"f\">하위 25%<input id=\"dQ1\" type=\"number\" step=\"0.05\" min=\"0.1\"><\/label>\n        <label class=\"f\">상위 25%<input id=\"dQ3\" type=\"number\" step=\"0.05\" min=\"0.1\"><\/label>\n        <label class=\"f full\" style=\"color:var(--talent);font-weight:700\">재능 (노란 선)<input id=\"dQ5\" type=\"number\" step=\"0.05\" min=\"0.1\"><\/label>\n      <\/div>\n      <div class=\"note\">일반인 범위 = 저점~고점(옅은 영역), 가운데 50% = 진한 영역, 중간값 = 1.0. 같은 조건에서 성장 속도가 사람마다 이 배수만큼 달라진다고 봐요.<\/div>\n    <\/section>\n  <\/div>\n  <div class=\"results\" id=\"distRes\">\n    <div class=\"toolbar\">\n      <div class=\"seg\" id=\"dHz\"><button data-h=\"8\">8주<\/button><button data-h=\"13\">3개월<\/button><button data-h=\"26\">6개월<\/button><button data-h=\"52\">1년<\/button><\/div>\n      <div class=\"seg\" id=\"dMet\"><button data-m=\"pct\">1RM 변화 %<\/button><button data-m=\"bwx\">체중 대비 배수<\/button><button data-m=\"tier\">티어<\/button><\/div>\n    <\/div>\n    <section class=\"panel\">\n      <h2>구간 × 체중 플랜 분포 <span class=\"badge\" id=\"dMatTag\"><\/span><\/h2>\n      <div class=\"note\" style=\"margin:-6px 0 10px\">구간마다 눈금이 달라요. 같은 구간 안의 5개 플랜끼리 비교하세요.<\/div>\n      <div id=\"dMatrix\"><\/div>\n      <div class=\"legend\" style=\"margin-top:10px\"><span><i style=\"height:10px;width:22px;background:var(--axis);opacity:.45\"><\/i>일반인 저점~고점<\/span><span><i style=\"height:10px;width:22px;background:var(--axis)\"><\/i>가운데 50%<\/span><span><i style=\"width:3px;height:14px;background:var(--text-primary)\"><\/i>중간값<\/span><span><i style=\"width:10px;height:10px;border-radius:50%;background:var(--talent)\"><\/i>재능<\/span><\/div>\n    <\/section>\n    <section class=\"panel\">\n      <h2>한눈에 보는 해석<\/h2>\n      <div class=\"msgs\" id=\"dMsgs\"><\/div>\n    <\/section>\n    <div class=\"toolbar\"><div class=\"seg\" id=\"dBand\"><\/div><span class=\"note\" style=\"margin:0\" id=\"dBandNote\"><\/span><\/div>\n    <div class=\"dcharts\" id=\"dCharts\"><\/div>\n    <section class=\"panel\"><h2>구간별 기간 분포표 <span class=\"badge\" id=\"dTblTag\"><\/span><\/h2><div class=\"scroll-x\"><table class=\"data\" id=\"dTable\"><\/table><\/div>\n      <div class=\"note\">각 칸: 일반인 저점~고점 · 가운데 굵게 = 중간값 · 노란 숫자 = 재능.<\/div><\/section>\n    <details class=\"panel\"><summary>계산 방식 보기<\/summary><div class=\"disclaimer\" style=\"margin-top:10px\">\n      <p>· 구간 시작점: 아이언~골드 = 브론즈 중간, 플래~다이아 = 에메랄드 시작, 다이아 이후 = 마스터 시작. 입력한 성별·나이·체중으로 그 티어의 1RM을 계산해 출발해요.<\/p>\n      <p>· 성장 속도 = 티어별 기본 여력(높을수록 느림) × 나이 × 훈련 조건 6개(유효 세트·빈도·강도·과부하·단백질·수면) × 준수율 × 프로그램 맞춤도 × 에너지 상태 × 개인 반응도.<\/p>\n      <p>· 에너지 상태: 주당 체중 변화율로 정해요. 주 −0.2% 감량 0.85배, −0.4% 0.7배, −1% 0.45배 · 주 +0.2% 증량 1.07배, +0.4% 1.1배(상한).<\/p>\n      <p>· 체중 변화 중 근육 비율: 증량 20~60%(훈련·단백질이 좋을수록 큼, 체지방률이 높을수록 작음), 감량 15~32%(체지방률이 낮을수록 근육 손실이 큼). 골격근 = 제지방 × 0.56, 근력은 골격근 변화의 2/3제곱만큼 반영.<\/p>\n      <p>· 체중 대비 배수와 티어는 그 시점 체중으로 다시 계산해요. 그래서 감량 플랜은 1RM이 덜 올라도 배수·티어는 더 오를 수 있어요.<\/p>\n      <p>· 모든 값은 평균 경향을 바탕으로 한 추정이에요. 분포 배수는 연구에서 보고된 개인차의 대략적인 폭을 옮긴 것이고 직접 바꿀 수 있어요.<\/p>\n    <\/div><\/details>\n  <\/div>\n<\/div>"}, "ib": {"css": ":host{display:block}\n[hidden]{display:none!important}\n\n:host{\n  color-scheme: light;\n  --bg:#f4f3f0; --surface-1:#fcfcfb; --surface-2:#f0efec; --border:#dedcd6;\n  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#82817c;\n  --grid:#e6e4df; --axis:#b9b7b0;\n  - ce-between}\n.hero{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}\n@media (max-width:700px){.hero{grid-template-columns:repeat(2,1fr)}}\n.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:14px}\n.tile .k{font-size:12px;color:var(--text-secondary)}\n.tile .v{font-size:28px;font-weight:800;letter-spacing:-.8px;margin-top:2px;font-variant-numeric:tabular-nums}\n.tile .v small{font-size:14px;font-weight:500;color:var(--text-secondary);margin-left:2px}\n.tile .d{font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--text-secondary)}\n.good{color:var(--good)!important} .bad{color:var(--bad)!important}\n.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n@media (max-width:1250px){.charts{grid-template-columns:1fr}}\n.chart{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:12px 12px 6px;position:relative}\n.chart h4{margin:0;font-size:14px}\n.chart .unit{font-size:12px;color:var(--text-muted)}\n.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}\n.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text-secondary)}\n.legend span{display:inline-flex;align-items:center;gap:6px}\n.legend i{width:18px;height:3px;border-radius:2px;display:inline-block}\n.legend i.dash{background:none!important;border-top:3px dotted}\n.legend i.dot{width:10px;height:10px;border-radius:50%;background:var(--text-primary);box-shadow:0 0 0 2px var(--surface-1),0 0 0 3px var(--text-primary)}\n.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.14);display:none;min-width:160px;z-index:5}\n.tip .t{font-weight:700;margin-bottom:4px}\n.tip .r{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}\n.tip .r b{font-weight:700}\n.tip .sw{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}\n.two{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}\n@media (max-width:1100px){.two{grid-template-columns:1fr}}\n.msgs{display:flex;flex-direction:column;gap:8px}\n.msg{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:12px;padding:11px 13px}\n.msg .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}\n.msg.actual .n{background:var(--text-primary);color:var(--surface-1)}\n.msg p{margin:0;font-size:14px}\n.msg p b{font-weight:800}\n.shape-row{display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:center;margin:6px 0}\n.shape-row .lb{font-size:12px;color:var(--text-secondary)}\n.bar-track{position:relative;height:14px;background:var(--surface-2);border-radius:4px}\n.bar-track .std{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--axis)}\n.bar-fill{position:absolute;left:0;top:2px;height:10px;border-radius:0 4px 4px 0;background:var(--text-secondary)}\n.bar-fill.after{background:var(--series-3)}\n.bar-fill.real{background:var(--text-primary)}\n.shape-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px}\n.badge{display:inline-block;font-weight:800;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2)}\n.badge.a{border-color:var(--series-3);color:var(--good)}\n.badge.b{border-color:var(--series-2);color:var(--series-2)}\n.badge.due{border-color:var(--accent);color:var(--accent)}\ntable.data{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}\ntable.data th,table.data td{padding:7px 8px;border-bottom:1px solid var(--border);text-align:right}\ntable.data th:first-child,table.data td:first-child{text-align:left}\ntable.data th{color:var(--text-muted);font-weight:500;font-size:12px;white-space:nowrap}\ntable.data td:first-child{white-space:nowrap}\n.scroll-x{overflow-x:auto}\n.disclaimer{font-size:12px;color:var(--text-muted)}\ndetails summary{cursor:pointer;color:var(--text-secondary);font-size:13px}\n.empty{padding:40px 20px;text-align:center;color:var(--text-secondary)}\n.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}\n.modal{background:var(--surface-1);border-radius:14px;padding:18px;width:min(560px,100%);max-height:90vh;overflow:auto}\n.modal h3{margin:0 0 8px;font-size:16px}\n.modal textarea{min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px}\n.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}\n.modal .acts{position:sticky;bottom:-18px;background:var(--surface-1);padding:10px 0 4px}\n.scan-hdr{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800;padding:8px 16px;font-size:14px}\n.scan-big{width:100%;margin-bottom:10px;padding:14px;font-weight:800;font-size:15px;border:0;border-radius:12px;background:var(--accent);color:#fff}\n#scanner{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff}\n#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n#scanner .frame{position:relative;width:min(70vw,320px);aspect-ratio:1;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.45)}\n#scanner .top{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:2}\n#scanner .top b{font-size:16px}\n#scanner .bottom{position:absolute;bottom:0;left:0;right:0;padding:18px;z-index:2;display:flex;flex-direction:column;gap:10px;align-items:center;background:linear-gradient(transparent,rgba(0,0,0,.75))}\n#scanner .smsg{font-size:14px;text-align:center;min-height:20px;max-width:480px}\n#scanner .photo{display:inline-block;background:#fff;color:#000;font-weight:800;padding:12px 22px;border-radius:999px;cursor:pointer;font-size:15px}\n#scanner .photo input{display:none}\n#scanner .xbtn{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:8px 14px}\n#scanner .paste{display:flex;gap:6px;width:min(480px,100%)}\n#scanner .paste input{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3);font-size:12px}\n#scanner .paste button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:0 12px;white-space:nowrap}\n#scanner.nocam .frame{display:none}\n#scanner.nocam .bottom{position:static;background:none;gap:16px}\n#scanner.nocam .photo{padding:20px 36px;font-size:18px}\n/* 회원 설문 */\n#survey{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}\n#survey .sv-top{padding:14px 20px;background:var(--surface-1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}\n#survey .sv-top b{font-size:16px}\n#survey .bar{flex:1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}\n#survey .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}\n#survey .sv-body{flex:1;overflow:auto;padding:22px 20px 120px}\n#survey .sv-in{max-width:720px;margin:0 auto}\n#survey h2{font-size:22px;margin:0 0 4px;letter-spacing:-.4px}\n#survey .sv-sub{color:var(--text-secondary);font-size:14px;margin-bottom:18px}\n.sq{background:var(--surface-1);border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:12px}\n.sq .qt{font-size:17px;font-weight:700;margin-bottom:4px}\n.sq .qh{font-size:13px;color:var(--text-muted);margin-bottom:10px}\n.opts{display:flex;flex-wrap:wrap;gap:8px}\n.opt{font:inherit;font-size:15px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);cursor:pointer}\n.opt[aria-pressed=\"true\"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface-1));font-weight:700}\n.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}\n.scale .opt{padding:10px 0;border-radius:10px;text-align:center}\n.scale-lb{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);margin-top:4px}\n.sq input[type=text],.sq input[type=number],.sq textarea{font-size:16px}\n#survey .sv-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 20px;background:var(--surface-1);border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}\n#survey .sv-foot .btn{padding:12px 22px;font-size:16px}\n.brief-tbl{width:100%;border-collapse:collapse;font-size:15px}\n.brief-tbl td{padding:9px 6px;border-bottom:1px solid var(--border);vertical-align:top}\n.brief-tbl td:first-child{color:var(--text-secondary);width:130px;white-space:nowrap}\n.flag{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:10px}\n.ruler{display:flex;gap:16px;flex-wrap:wrap}\n.ruler div{background:var(--surface-2);border-radius:10px;padding:8px 12px}\n.ruler b{font-size:22px}\n/* 공략 가이드 */\n#guide .modal{width:min(760px,100%)}\n.gp{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:8px 0;background:var(--surface-2)}\n.gp .rk{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:12px;align-items:center;justify-content:center;margin-right:8px}\n.gp h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center}\n.gp .f{font-size:13px;color:var(--text-secondary)}\n.gp .q{font-size:14px;font-weight:700;margin-top:6px}\n.flow{counter-reset:st;list-style:none;padding:0;margin:0}\n.flow li{counter-increment:st;position:relative;padding:8px 0 8px 34px;border-bottom:1px dashed var(--border);font-size:14px}\n.flow li::before{content:counter(st);position:absolute;left:0;top:8px;width:24px;height:24px;border-radius:6px;background:var(--text-primary);color:var(--surface-1);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}\n.flow li b.h{display:block;font-size:12px;color:var(--text-muted)}\n.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}\n.res button[aria-pressed=\"true\"]{background:var(--accent);color:#fff;border-color:var(--accent)}\n.stat{font-size:13px;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:10px}\ndetails.objs{margin-top:12px;border-top:1px solid var(--border);padding-top:10px}\ndetails.objs summary{cursor:pointer;font-weight:800;color:var(--accent);font-size:14px}\n.obj{background:var(--surface-2);border-radius:10px;padding:10px 12px;margin-top:8px}\n.obj .oq{font-weight:800;font-size:15px;margin-bottom:4px}\n.obj .oa{font-size:14px;margin:3px 0}\n.obj .oa b{font-size:11px;color:var(--text-muted);margin-right:6px}\n.obj ul{margin:4px 0;padding-left:18px}\n/* 해설 */\n.viewbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}\n.rep-sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}\n.rep-sum .it{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:10px 12px}\n.rep-sum .k{font-size:12px;color:var(--text-secondary)}\n.rep-sum .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}\n.rep-sum .s{font-size:12px;font-weight:700}\n.st-low,.st-high{color:var(--bad)} .st-ok{color:var(--good)} .st-na{color:var(--text-muted)}\n.card{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;border-left:5px solid var(--axis)}\n.card.warn{border-left-color:var(--series-2)} .card.risk{border-left-color:var(--bad)} .card.opp{border-left-color:var(--series-1)} .card.stance{border-left-color:var(--series-3)} .card.good{border-left-color:var(--good)}\n.card .tag{display:inline-block;font-size:11px;font-weight:800;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-secondary);margin-bottom:6px}\n.card h3{margin:0 0 10px;font-size:17px;letter-spacing:-.3px}\n.card .lbl{font-size:12px;font-weight:800;color:var(--text-muted);margin:12px 0 4px;letter-spacing:.3px}\n.card ul{margin:0;padding-left:18px}\n.card li{margin:3px 0}\n.card .ev{font-size:14px}\n.card .ref{font-size:11px;color:var(--text-muted);white-space:nowrap}\n.card .et{font-size:11px;font-weight:800;color:var(--text-secondary);margin-right:4px}\n.card .proj{background:var(--surface-2);border-radius:10px;padding:8px 12px;margin-top:6px;font-size:14px}\n.card .ask{margin-top:12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:10px;padding:10px 12px;font-size:15px;font-weight:700}\n.card .ask small{display:block;font-size:11px;color:var(--accent);font-weight:800;margin-bottom:2px}\n.card .tnote{margin-top:10px;font-size:12px;color:var(--text-muted);border-top:1px dashed var(--border);padding-top:8px}\n.hide-notes .tnote{display:none}\n.chk-grid{display:flex;flex-wrap:wrap;gap:4px 12px}\n#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:var(--surface-1);border:1px solid var(--border);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:14px 16px;z-index:90;display:none}\n#toast .tt{font-weight:800;margin-bottom:4px}\n#toast .tv{font-size:13px;color:var(--text-secondary);font-variant-numeric:tabular-nums}\n#toast .ta{display:flex;gap:8px;margin-top:10px;align-items:center}\n#toast .ta input{flex:1}\n.qr-btn{width:100%;margin-bottom:12px;padding:10px;font-weight:700;border:1.5px dashed var(--accent);color:var(--accent);background:transparent;border-radius:10px}\n.qr-pick{display:block;text-align:center;padding:18px;border:1.5px dashed var(--border);border-radius:12px;cursor:pointer;background:var(--surface-2);font-weight:700}\n.qr-pick input{display:none}\n.qr-or{text-align:center;color:var(--text-muted);font-size:12px;margin:10px 0}\n.qr-status{font-size:13px;margin:10px 0;min-height:20px}\n.qr-prev{display:none;border-top:1px solid var(--border);margin-top:12px;padding-top:12px}\n.qr-prev .grid2{gap:8px}\n.qr-meta{font-size:12px;color:var(--text-secondary);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin:10px 0}\n.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--text-secondary);margin-top:8px}\n.chk input{width:auto}\n.hl input{border-color:var(--series-2)}\n", "html": "<header>\n  <div>\n    <h1>4T 상담지원 시뮬레이터<\/h1>\n    <div class=\"sub\">인바디 + 생활습관 → 3·6개월 뒤 변화 예측<\/div>\n  <\/div>\n  <div class=\"hdr-r\">\n    <span id=\"dueBadge\"><\/span>\n    <span class=\"saved\" id=\"saved\"><\/span>\n    <label class=\"btn scan-hdr\" style=\"cursor:pointer\">인바디 사진 올리기<input type=\"file\" id=\"upHdr\" accept=\"image/*\" style=\"display:none\"><\/label>\n    <button class=\"btn\" id=\"svImportBtn\">설문 코드 붙여넣기<\/button>\n    <button class=\"btn\" id=\"surveyBtn\">회원 설문 시작<\/button>\n    <button class=\"btn\" id=\"backupBtn\">백업 / 복원<\/button>\n  <\/div>\n<\/header>\n\n<div class=\"layout\">\n  <div class=\"inputs\">\n    <!-- 회원 -->\n    <section class=\"panel\">\n      <h2>회원<\/h2>\n      <div class=\"row\" style=\"margin-bottom:12px\">\n        <select id=\"memberSel\" aria-label=\"회원 선택\"><\/select>\n        <button class=\"btn primary\" id=\"newMember\">+ 새 회원<\/button>\n      <\/div>\n      <div class=\"grid2\">\n        <label class=\"f\">이름<input id=\"name\" data-m=\"name\"><\/label>\n        <label class=\"f\">성별<select id=\"sex\" data-m=\"sex\"><option value=\"m\">남성<\/option><option value=\"f\">여성<\/option><\/select><\/label>\n        <label class=\"f\">나이<input id=\"age\" data-m=\"age\" type=\"number\"><\/label>\n        <label class=\"f\">키 (cm)<input id=\"height\" data-m=\"height\" type=\"number\" step=\"0.1\"><\/label>\n        <label class=\"f full\">운동 경력<select id=\"exp\" data-m=\"exp\">\n          <option value=\"0\">처음 / 1년 넘게 쉼<\/option>\n          <option value=\"1\">1~2년 꾸준히<\/option>\n          <option value=\"2\">3년 이상<\/option>\n        <\/select><\/label>\n        <label class=\"f\">회원 유형<select id=\"type\" data-m=\"type\">\n          <option value=\"\">미분류<\/option>\n          <option value=\"comfort\">안주형<\/option>\n          <option value=\"achieve\">성취발전형<\/option>\n          <option value=\"mixed\">혼합형<\/option>\n        <\/select><\/label>\n        <label class=\"f\">재측정 예약일<input id=\"nextDate\" data-m=\"nextDate\" type=\"date\"><\/label>\n        <label class=\"f full\">상담 메모<textarea id=\"memo\" data-m=\"memo\" placeholder=\"회원이 직접 말한 목표, 불편함, 장애물 등\"><\/textarea><\/label>\n      <\/div>\n      <div style=\"display:flex;justify-content:flex-end;margin-top:8px\">\n        <button class=\"btn ghost danger sm\" id=\"delMember\">이 회원 삭제<\/button>\n      <\/div>\n    <\/section>\n\n    <!-- 측정 기록 -->\n    <section class=\"panel\">\n      <h2>인바디 측정 기록<\/h2>\n      <label class=\"scan-big\" style=\"display:block;text-align:center;cursor:pointer\">인바디 결과지 사진 올리기<input type=\"file\" id=\"upBig\" accept=\"image/*\" style=\"display:none\"><\/label>\n      <div class=\"note\" id=\"upMsg\" style=\"margin:-2px 0 8px;text-align:center\">결과지를 찍거나 앨범에서 고르면 QR을 읽어 자동으로 저장해요.<\/div>\n      <div style=\"text-align:right;margin:-4px 0 8px\"><button class=\"btn ghost sm\" id=\"qrOpen\">QR 값 확인하며 불러오기<\/button><\/div>\n      <table class=\"meas-table\">\n        <thead><tr><th>날짜<\/th><th>체중<\/th><th>골격근<\/th><th>체지방<\/th><th><\/th><\/tr><\/thead>\n        <tbody id=\"measBody\"><\/tbody>\n      <\/table>\n      <div class=\"add-meas\">\n        <input id=\"m_date\" type=\"date\" aria-label=\"측정일\">\n        <input id=\"m_w\" type=\"number\" step=\"0.1\" placeholder=\"체중\" aria-label=\"체중\">\n        <input id=\"m_smm\" type=\"number\" step=\"0.1\" placeholder=\"골격근\" aria-label=\"골격근량\">\n        <input id=\"m_fat\" type=\"number\" step=\"0.1\" placeholder=\"체지방\" aria-label=\"체지방량\">\n      <\/div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px\">\n        <span class=\"note\" style=\"margin:0\">'기준' 측정부터 예측을 시작하고, 이후 측정은 그래프에 실제 값으로 찍혀요.<\/span>\n        <button class=\"btn primary sm\" id=\"addMeas\">측정 추가<\/button>\n      <\/div>\n      <div class=\"warn\" id=\"measWarn\"><\/div>\n    <\/section>\n\n    <section class=\"panel\">\n      <h2>상담 체크 <span class=\"note\" style=\"margin:0;font-weight:400\">인바디 해설에 쓰여요<\/span><\/h2>\n      <label class=\"f\">현재 내과에서 관리 중인 항목<\/label>\n      <div class=\"chk-grid\" style=\"margin:4px 0 10px\">\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" data-c=\"med.none\">없음<\/label>\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" data-c=\"med.htn\">고혈압<\/label>\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" data-c=\"med.dm\">당뇨<\/label>\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" data-c=\"med.lipid\">고지혈증<\/label>\n        <label class=\"chk\" style=\"margin:0\"><input type=\"checkbox\" data-c=\"med.liver\">지방간<\/label>\n      <\/div>\n      <div class=\"grid2\">\n        <label class=\"f\" id=\"menoWrap\">폐경 상태<select data-c=\"meno\"><option value=\"\">묻지 않음<\/option><option value=\"pre\">폐경 전<\/option><option value=\"trans\">이행기 (주기 불규칙)<\/option><option value=\"post\">폐경 후<\/option><\/select><\/label>\n        <label class=\"f\">골밀도 검사<select data-c=\"bmd\"><option value=\"\">모름 / 안 받음<\/option><option value=\"ok\">정상<\/option><option value=\"penia\">골감소증<\/option><option value=\"porosis\">골다공증<\/option><\/select><\/label>\n        <label class=\"f\">내장지방레벨 <span style=\"color:var(--text-muted)\">(결과지)<\/span><input type=\"number\" step=\"1\" min=\"1\" max=\"20\" data-c=\"vfl\"><\/label>\n        <label class=\"chk\" style=\"align-self:end;margin-bottom:8px\"><input type=\"checkbox\" data-c=\"fall\">최근 1년 const _sm=sampleMember;sampleMember=function(){const m=_sm();for(const k in m.ex){const x=m.ex[k];if(PG[x.nw.preset])Object.assign(x.tgt,PG[x.nw.preset].c)}return m};

const rirF=r=>r<=3?1:r<=4?.7:.4;

const VARS=[

 ['pro','단백질','g/kg',c=>ip(c.pro,[.8,1.2,1.6],[.75,.9,1])],

// 체중 변화 중 근육(제지방)이 차지하는 비율. 증량: 0.2~0.6(훈련·단백질 질에 비례), 감량: 0.35~0.15. b=-1/0/1 은 범위 저점/중간/고점
function leanFrac(dbw,q,b){return dbw>=0?Math.max(.1,.2+.4*q+.12*b):Math.max(.05,.35-.2*q-.08*b)}
function autoCur(m,k,ss,pts,freq){
 const avg=f=>ss.reduce((a,s)=>a+f(s),0)/ss.length;
 const eff=+(avg(s=>(s.s||3)*rirF(s.rir))*freq).toFixed(1);

 const prog=pts.length>1?Math.round(up/(pts.length-1)*100):50;
 return{eff,freq,int,prog};
}
function condOf(m,k){
 const x=m.ex[k];const ss=x.sess.filter(valid).sort((a,b)=>a.d<b.d?-1:1);
 const pts=ss.map(s=>({t:new Date(s.d).getTime()/864e5,v:e1(s.w,s.r,s.rir)}));
 const O=x.curO||{};const freq=O.freq??1;
 const auto=ss.length?autoCur(m,k,ss,pts,freq):{eff:0,freq,int:0,prog:0};

 const t0={...x.tgt,pro:m.rec.tgt.pro,slp:m.rec.tgt.slp};const t={};for(const key in t0)t[key]=Math.max(t0[key],c[key]??0);t.freq=t0.freq>=c.freq?t0.freq:c.freq;t.bw6=m.rec.tgt.bw6??0;
 return{ss,pts,auto,c,t,O};

function analyze(m,k){

// ---------- 차트 ----------
function niceRange(min,max){const pad=(max-min)*.15||1;let lo=min-pad,hi=max+pad;const span=hi-lo;const step=[.5,1,2,5,10,20,50].find(s=>span/s<=5)||50;lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;const t=[];for(let v=lo;v<=hi+1e-9;v+=step)t.push(+v.toFixed(2));return{lo,hi,ticks:t}}
function drawChart(el,a,key,fmt,opt={}){
 const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
 const W=Math.max(300,el.clientWidth-24),H=230,mg={l:44,r:opt.tierAxis?62:84,t:16,b:28},iw=W-mg.l-mg.r,ih=H-mg.t-mg.b;

 let lo,hi,ticks;
 if(opt.tierAxis){lo=Math.floor(Math.min(...all));hi=Math.ceil(Math.max(...all)+.001);if(hi-lo<2)hi=lo+2;ticks=[];for(let v=Math.max(lo,0);v<=hi;v++)ticks.push(v)}
 else ({lo,hi,ticks}=niceRange(Math.min(...all),Math.max(...all)));

 if(lo===hi){const ok=L.r>=hi;return`<b>${kg(ok?L.w+2.5:L.w)}kg × ${hi}회</b> · ${sets}세트 · RIR ${nw.rir}${ok?' (지난번 성공 → +2.5kg)':' (같은 무게로 다시 성공부터)'}.`}

 return`<b>${kg(w2)}kg × ${r2}회</b> · RIR ${nw.rir} · ${sets}세트${L.r>=hi?` (지난번 ${hi}회 달성 → 무게 올리기)`:' (같은 무게로 반복 +1)'}.`;

let D;try{D=JSON.parse(localStorage.getItem(DKEY))}catch(e){}
if(!D||!D.q)D=DEF();

const ageF=a=>ip(a,[20,30,40,50,60,70],[1,1,.95,.88,.8,.7]);
const ageG=a=>ip(a,[20,30,40,50,60,70],[1,.95,.85,.75,.65,.55]);
function thrD(bw){const ex=EX[D.ex];const sf=D.sex==='f'?(ex.lower?.7:.55):1;const b=bw*sf*ageF(D.age);return[ex.m[0]/1.2,...ex.m].map(x=>x*b)}
function posD(v,bw){const T=thrD(bw);if(v<T[0])return v/T[0]-1;for(let i=0;i<9;i++)if(v<T[i+1])return i+(v-T[i])/(T[i+1]-T[i]);return 9+(v-T[9])/(T[9]-T[8])}
function invPos(p,bw){const T=thrD(bw);const i=Math.min(8,Math.floor(p));return T[i]+(p-i)*(T[i+1]-T[i])}
const cf=()=>({eff:D.eff,freq:D.freq,int:D.int,prog:D.prog,pro:D.pro,slp:D.slp});
const energyF=r=>ip(r,[-1,-.4,-.2,0,.2,.4],[.45,.7,.85,1,1.07,1.1]);
function qual(c){return Math.min(1,VARS.filter(v=>['eff','int','prog','pro'].includes(v[0])).reduce((a,v)=>a*v[3](c),1))}
function gainFrac(q){return Math.max(.1,Math.min(.75,(.2+.4*q)*ip(D.bf,[10,20,30,40],[1.15,1,.85,.7])))}
function lossFrac(q){return Math.max(.05,Math.min(.6,(.32-.17*q)*ip(D.bf,[8,15,25,35],[1.5,1.15,.9,.7])))}
function dBW(plan){const b=D.bw;return plan==='A'?+D.pA:plan==='B1'?b*D.pB1/100:plan==='B2'?b*D.pB2/100:plan==='C1'?-b*D.pC1/100:-b*D.pC2/100}
function sim(bp,plan,R){
 const c=cf(),q=qual(c),bw0=D.bw,smm0=bw0*(1-D.bf/100)*.56,dB=dBW(plan),Wp=Math.max(1,D.mon*4.345);
 const lf=dB>=0?gainFrac(q):lossFrac(q);
 const base=VARS.reduce((a,v)=>a*v[3](c),1)*ip(D.adh,[30,50,80,100],[.35,.55,.85,1]);
 const e0=invPos(bp,bw0);let v=e0;const out=[];
 for(let w=0;w<=52;w++){
  const fr=Math.min(w,Wp)/Wp,bw=bw0+dB*fr,r=w<=Wp?dB/bw0/Wp*100:0;
  const smm=smm0+(bw-bw0)*lf*.56,mF=Math.pow(Math.max(.5,smm/smm0),2/3);
  if(w){const p=Math.max(0,posD(v*mF,bw));const g=10*Math.exp(-.33*p)/100*ageG(D.age);const fit=PG[D.pg]?ip(p,PG[D.pg].fit[0],PG[D.pg].fit[1]):1;
   v*=1+g*base*fit*energyF(r)*R*12/52}
  const e=v*mF;out.push({e,bw,smm,pct:(e/e0-1)*100,bwx:e/bw,tier:posD(e,bw)})}
 const o0=out[0];out.forEach(d=>{d.dbwx=d.bwx-o0.bwx;d.dtier=d.tier-o0.tier});
 return out;
}

const MK={pct:'pct',bwx:'dbwx',tier:'dtier'};
const fmtM=(v,full)=>D.met==='pct'?`${v>=0?'+':'−'}${Math.abs(v).toFixed(1)}%`:D.met==='bwx'?`${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}배`:`${v>=0?'+':'−'}${Math.abs(v).toFixed(2)}티어`;
const val=(bi,pi,qi,w)=>RES[bi][pi][qi][w][MK[D.met]];

function renderBody(){const smm=D.bw*(1-D.bf/100)*.56;const T=thrD(D.bw);
 $('dBody').innerHTML=`제지방 ${(D.bw*(1-D.bf/100)).toFixed(1)}kg · 골격근 추정 ${smm.toFixed(1)}kg · ${EX[D.ex].n} 출발 1RM: ${BANDS.map(b=>`${b.n} ${kg(invPos(b.p,D.bw))}kg`).join(' · ')}`}
function matrix(){

 BANDS.forEach((b,bi)=>{let mn=0,mx=0;RES[bi].forEach((p,pi)=>{mn=Math.min(mn,val(bi,pi,0,w));mx=Math.max(mx,val(bi,pi,5,w),val(bi,pi,4,w))});
  const pad=(mx-mn)*.06||1;mn-=pad;mx+=pad;const X=v=>(v-mn)/(mx-mn)*100;

   h+=`<div class="mx-row"><div class="mx-lb" style="color:${col}">${nm}<span class="unit-s">${bw.toFixed(1)}kg</span></div><div class="mx-track"><div class="mx-zero" style="left:${X(0)}%"></div><div class="mx-out" style="left:${X(q[0])}%;width:${X(q[4])-X(q[0])}%;background:${col}"></div><div class="mx-in" style="left:${X(q[1])}%;width:${X(q[3])-X(q[1])}%;background:${col}"></div><div class="mx-mid" style="left:${X(q[2])}%"></div><div class="mx-tal" style="left:${X(q[5])}%"></div></div><div class="mx-v">${fmtM(q[0])}~${fmtM(q[4])}<br><span style="color:var(--talent);font-weight:700">재능 ${fmtM(q[5])}</span></div></div>`});
  h+=`<div class="mx-axis"><span></span><div><span>${fmtM(mn)}</span><span>${fmtM(mx)}</span></div><span></span></div></div>`});
 $('dMatrix').innerHTML=h;$('dMatTag').textContent=`${HZ[w]} · ${{pct:'1RM 변화',bwx:'체중 대비 배수 변화',tier:'티어 변화'}[D.met]}`;

function charts(){

 $('dBandNote').textContent=BANDS[bi].s+' · 5개 그래프 같은 눈금';
 const S=RES[bi];let mn=0,mx=0;S.forEach((p,pi)=>{for(let w=0;w<=52;w++){mn=Math.min(mn,val(bi,pi,0,w));mx=Math.max(mx,val(bi,pi,5,w))}});
 const pad=(mx-mn)*.08||1;mn-=pad;mx+=pad;
 const W=320,Hh=190,mg={l:44,r:10,t:12,b:24},iw=W-mg.l-mg.r,ih=Hh-mg.t-mg.b;const x=w=>mg.l+w/52*iw,y=v=>mg.t+(mx-v)/(mx-mn)*ih;
 const step=(()=>{const sp=mx-mn;return[.05,.1,.2,.25,.5,1,2,5,10,20,25,50].find(s=>sp/s<=5)||100})();
 $('dCharts').innerHTML=PLANS.map(([id,nm,col],pi)=>{const Q=S[pi];const k=MK[D.met];
  const area=(a,b)=>Q[a].map((d,w)=>`${w?'L':'M'}${x(w).toFixed(1)},${y(d[k]).toFixed(1)}`).join('')+Q[b].slice().reverse().map((d,j)=>`L${x(52-j).toFixed(1)},${y(d[k]).toFixed(1)}`).join('')+'Z';
  const line=i=>Q[i].map((d,w)=>`${w?'L':'M'}${x(w).toFixed(1)},${y(d[k]).toFixed(1)}`).join('');
  let s='';for(let v=Math.ceil(mn/step)*step;v<=mx;v+=step){const vv=+v.toFixed(3);s+=`<line x1="${mg.l}" x2="${W-mg.r}" y1="${y(vv)}" y2="${y(vv)}" stroke="${Math.abs(vv)<1e-9?'var(--axis)':'var(--grid)'}"/><text x="${mg.l-6}" y="${y(vv)+4}" font-size="10" text-anchor="end" fill="var(--text-muted)">${D.met==='pct'?vv:vv.toFixed(2)}</text>`}
  [[8,'8주'],[13,'3개월'],[26,'6개월'],[52,'1년']].forEach(([w,l])=>{s+=`<text x="${Math.min(x(w),W-mg.r-12)}" y="${Hh-6}" font-size="10" text-anchor="middle" fill="var(--text-${w===D.hz?'primary':'muted'})" font-weight="${w===D.hz?700:400}">${l}</text>`});
  s+=`<line x1="${x(D.hz)}" x2="${x(D.hz)}" y1="${mg.t}" y2="${mg.t+ih}" stroke="var(--axis)" stroke-dasharray="2 3"/>`;
  s+=`<path d="${area(4,0)}" fill="${col}" opacity=".16"/><path d="${area(3,1)}" fill="${col}" opacity=".34"/><path d="${line(2)}" fill="none" stroke="${col}" stroke-width="2.2"/><path d="${line(5)}" fill="none" stroke="var(--talent)" stroke-width="2.2" stroke-dasharray="6 3"/>`;
  const d=[0,2,4,5].map(i=>Q[i][D.hz][k]);
  s+=`<circle cx="${x(D.hz)}" cy="${y(d[1])}" r="4" fill="${col}" stroke="var(--surface-1)" stroke-width="2"/><circle cx="${x(D.hz)}" cy="${y(d[3])}" r="4" fill="var(--talent)" stroke="var(--surface-1)" stroke-width="2"/>`;
  const bw=Q[2][52].bw;
  return`<div class="chart"><h4 style="color:${col}">${nm} <span class="unit">체중 ${D.bw}→${bw.toFixed(1)}kg</span></h4><svg viewBox="0 0 ${W} ${Hh}">${s}</svg><div class="dc-foot"><span>${HZ[D.hz]} 일반인 <b>${fmtM(d[0])}~${fmtM(d[2])}</b></span><span style="color:var(--talent);font-weight:700">재능 ${fmtM(d[3])}</span></div></div>`}).join('');
}

 let h=`<tr><th>구간</th><th>플랜</th>${hz.map(w=>`<th>${HZ[w]}</th>`).join('')}</tr>`;
 BANDS.forEach((b,bi)=>PLANS.forEach(([id,nm,col],pi)=>{h+=`<tr${pi===0?' class="bstart"':''}><td>${pi===0?`<b>${b.n}</b>`:''}</td><td style="color:${col};font-weight:700">${nm}</td>${hz.map(w=>`<td>${fmtM(val(bi,pi,0,w))}~${fmtM(val(bi,pi,4,w))}<br><b>${fmtM(val(bi,pi,2,w))}</b> <span style="color:var(--talent);font-weight:700">${fmtM(val(bi,pi,5,w))}</span></td>`).join('')}</tr>`}));

function msgs(){

 const by=m=>PLANS.map((p,pi)=>({p,v:mid(pi,m)})).sort((a,b)=>b.v-a.v)[0];
 const bA=by('pct'),bR=by('dbwx'),bT=by('dtier');
 out.push(`<b>${BANDS[bi].n}</b> · ${HZ[w]} 중간값 기준, 1RM 절대값은 <b style="color:${bA.p[2]}">${bA.p[1]}</b>(${sg(bA.v)}%)이, 체중 대비 배수는 <b style="color:${bR.p[2]}">${bR.p[1]}</b>(${sg(bR.v,2)}배)이 가장 크게 올라요.`);
 const a=RES[bi][0],talA=a[5][w].pct,hiA=a[4][w].pct,midA=a[2][w].pct;
 out.push(`체중 유지(A)에서 일반인은 <b>${sg(a[0][w].pct)}~${sg(hiA)}%</b>, 중간 <b>${sg(midA)}%</b>. 재능은 <b style="color:var(--talent)">${sg(talA)}%</b>로 일반인 고점보다 ${sg(talA-hiA)}%p 높아요.`);
 const c2=RES[bi][4][2][w];out.push(`C2 감소(${D.pC2}%)는 1RM이 ${sg(c2.pct)}%지만 체중 대비 배수는 ${sg(c2.dbwx,2)}배, 티어는 ${sg(c2.dtier,2)}만큼 움직여요. 감량 중엔 절대 근력보다 체중 대비 지표로 설명하는 게 맞아요.`);

 out.push(`같은 조건·같은 기간이라도 구간이 오를수록 중간 성장률이 줄어요: ${BANDS.map((b,i)=>`${b.n} ${sg(lo[i])}%`).join(' → ')}.`);
 $('dMsgs').innerHTML=out.map((t,i)=>`<div class="msg"><div class="n">${i+1}</div><p>${t}</p></div>`).join('');
}
const FIELDS={dSex:'sex',dAge:'age',dBw:'bw',dBf:'bf',dEx:'ex',dPg:'pg',dEff:'eff',dFreq:'freq',dInt:'int',dProg:'prog',dAdh:'adh',dPro:'pro',dSlp:'slp',dPA:'pA',dPB1:'pB1',dPB2:'pB2',dPC1:'pC1',dPC2:'pC2',dMon:'mon'};

 saveD();render()});

  const hi=sex==='m'?20:28,ob=sex==='m'?25:32;

const sortedMeasures=m=>[...m.measures].sort((a,b)=>a.date.localeCompare(b.date));
function baseOf(m){const ms=sortedMeasures(m);return ms.find(x=>x.id===m.baseId)||ms[0]||null;}

// ---------- 시뮬레이션 ----------
function mix(c,t,a){const o={};for(const k in c)o[k]=c[k]+(t[k]-c[k])*a;return o;}
function lerp(x,xs,ys){if(x<=xs[0])return ys[0];for(let i=1;i<xs.length;i++){if(x<=xs[i]){const t=(x-xs[i-1])/(xs[i]-xs[i-1]);return ys[i-1]+t*(ys[i]-ys[i-1]);}}return ys[ys.length-1];}
function simulate(p,h){
  const male=p.sex==='m';
  const base=[0.45,0.25,0.12][p.exp]*(male?1:0.6);
  const freqF=lerp(h.str,[0,1,2,3,4],[0,0.4,0.75,0.95,1]);
  const proF=lerp(h.pro,[0.8,1.2,1.6],[0.55,0.8,1]);
  const slpF=lerp(h.slp,[5,6,7],[0.75,0.85,1]);
  const ageF=lerp(p.age,[30,45,60,75],[1,0.85,0.7,0.55]);
  const essential=male?0.04:0.11;
  let fat=p.fat,smm=p.smm,w=p.weight;
  const out=[{w,smm,fat,pbf:fat/w*100}];
  for(let wk=1;wk<=26;wk++){
    const month=wk/4.345;
    const intake=h.def+h.alc*400/7-h.car;
    const adapt=(p.weight-w)*35;
    const bal=intake+adapt;
    const deficit=Math.max(0,-bal);
    let dSmm;
    if(h.str>=0.5){
      const defF=lerp(deficit,[0,300,500,750,1000],[1,0.95,0.85,0.65,0.45]);
      dSmm=base*freqF*proF*slpF*ageF*defF*Math.exp(-0.035*month)/4.345;
    }else{
      dSmm=-(deficit/500)*0.15/4.345-(p.age>40?0.008:0.004)/4.345;
    }
    let dFat=bal*7/7700*0.8;
    if(bal<0){dFat*=(h.slp<6?0.85:1);dFat=Math.max(dFat,-0.01*w);dFat=Math.max(dFat,essential*w-fat);}
    else{dFat*=(h.str>=0.5?0.8:0.95);}
    smm+=dSmm;fat+=dFat;
    w=p.weight+(smm-p.smm)*1.7+(fat-p.fat);
    out.push({w,smm,fat,pbf:fat/w*100});
  }
  return out;
}
function paramsOf(m){
  const b=baseOf(m);
  return {sex:m.sex,age:+m.age||35,height:+m.height||170,exp:+m.exp||0,weight:b.w,smm:b.smm,fat:b.fat,cur:m.habits.cur,tgt:m.habits.tgt};
}
const runAll=p=>[simulate(p,p.cur),simulate(p,mix(p.cur,p.tgt,0.8)),simulate(p,mix(p.cur,p.tgt,1))];
function actualsOf(m){
  const b=baseOf(m); if(!b)return [];
  const t0=new Date(b.date).getTime();
  return sortedMeasures(m).filter(x=>x.id!==b.id&&x.date>b.date).map(x=>({...x,wk:(new Date(x.date).getTime()-t0)/864e5/7,pbf:x.fat/x.w*100}));
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>{const [y,mo,da]=d.split('-');return `${y.slice(2)}.${mo}.${da}`;};

function niceRange(min,max){
  const pad=(max-min)*0.15||1;let lo=min-pad,hi=max+pad;
  const span=hi-lo;const step=[0.5,1,2,5,10].find(s=>span/s<=5)||10;
  lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const ticks=[];for(let v=lo;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(2));
  return {lo,hi,ticks};
}
function drawChart(el,sims,acts,key,fmt){
  const svg=el.querySelector('svg'),tip=el.querySelector('.tip');
  const W=Math.max(300,el.clientWidth-24),H=230,m={l:40,r:62,t:16,b:28};
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  const visActs=acts.filter(a=>a.wk<=26.5);
  const all=visLines.flatMap(k=>sims[k]).map(d=>d[key]).concat(visActs.map(a=>a[key]));
  const {lo,hi,ticks}=niceRange(Math.min(...all),Math.max(...all));
  const x=i=>m.l+Math.min(i,26)/26*iw,y=v=>m.t+(hi-v)/(hi-lo)*ih;
  let s='';
  ticks.forEach(t=>{s+=`<line x1="${m.l}" x2="${m.l+iw}" y1="${y(t)}" y2="${y(t)}" stroke="var(--grid)"/><text x="${m.l-8}" y="${y(t)+4}" text-anchor="end" font-size="11" fill="var(--text-muted)">${t}</text>`;});
  [0,1,2,3,4,5,6].forEach(mo=>{const i=Math.min(26,Math.round(mo*4.345));const em=mo===3||mo===6;
    s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--text-${em?'secondary':'muted'})" font-weight="${em?700:400}">${mo===0?'기준':mo+'개월'}</text>`;});
  [13,26].forEach(i=>{s+=`<line x1="${x(i)}" x2="${x(i)}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--axis)" stroke-dasharray="2 3"/>`;});
  visLines.forEach(k=>{const d=sims[k].map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
    s+=`<path d="${d}" fill="none" stroke="${SC[k].color}" stroke-width="${k===focusSc?2.5:2}" stroke-linejoin="round" stroke-linecap="round" ${SC[k].dash?`stroke-dasharray="${SC[k].dash}"`:''} opacity="${k===focusSc?1:0.55}"/>`;});
  visLines.forEach(k=>{const v=sims[k][horizon][key];s+=`<circle cx="${x(horizon)}" cy="${y(v)}" r="5" fill="${SC[k].color}" stroke="var(--surface-1)" stroke-width="2"/>`;});
  // 실제 측정
  if(visActs.length){
    const base=sims[0][0][key];
    const pts=[{wk:0,v:base}].concat(visActs.map(a=>({wk:a.wk,v:a[key]})));
    s+=`<path d="${pts.map((p,i)=>`${i?'L':'M'}${x(p.wk).toFixed(1)},${y(p.v).toFixed(1)}`).join('')}" fill="none" stroke="var(--text-primary)" stroke-width="1.5" opacity=".5"/>`;
    visActs.forEach(a=>{s+=`<circle cx="${x(a.wk)}" cy="${y(a[key])}" r="6" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="2.5"/>`;});
    const la=visActs[visActs.length-1];
    s+=`<text x="${x(la.wk)}" y="${y(la[key])-12}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--text-primary)">실측 ${fmt(la[key])}</text>`;
  }
  const ends=visLines.map(k=>({k,v:sims[k][26][key],y:y(sims[k][26][key])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;
  ends.forEach(e=>{s+=`<text x="${x(26)+8}" y="${e.y+4}" font-size="11" fill="var(--text-secondary)" font-weight="${e.k===focusSc?700:400}">${fmt(e.v)}</text>`;});
  s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-muted)" visibility="hidden"/>`;
  s+=`<rect class="hit" x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  svg.innerHTML=s;
  const hit=svg.querySelector('.hit'),xh=svg.querySelector('.xh');
  const move=ev=>{
    const r=svg.getBoundingClientRect();const sx=(ev.clientX-r.left)*W/r.width;
    const i=Math.max(0,Math.min(26,Math.round((sx-m.l)/iw*26)));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');
    const mo=i/4.345;
    const near=visActs.find(a=>Math.abs(a.wk-i)<0.6);
    tip.innerHTML=`<div class="t">${i===0?'기준 측정':(mo<1?i+'주 뒤':mo.toFixed(1)+'개월 뒤 ('+i+'주)')}</div>`+
      (near?`<div class="r"><span><span class="sw" style="background:var(--text-primary)"></span>실제 (${fmtDate(near.date)})</span><b>${fmt(near[key])}</b></div>`:'')+
      [2,1,0].filter(k=>visLines.includes(k)).map(k=>`<div class="r"><span><span class="sw" style="background:${SC[k].color}"></span>${SC[k].name}</span><b>${fmt(sims[k][i][key])}</b></div>`).join('');
    tip.style.display='block';
    const px=12+(x(i)/W)*r.width,tw=tip.offsetWidth||170;
    let left=px+12;if(left+tw>el.clientWidth-4)left=px-12-tw;
    tip.style.left=Math.max(4,left)+'px';tip.style.top='40px';
  };
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);
  hit.addEventListener('pointerleave',()=>{tip.style.display='none';xh.setAttribute('visibility','hidden');});
}

const SCALE={w:[55,70,85,100,115,130,145,160,175,190,205],m:[70,80,90,100,110,120,130,140,150,160,170],f:[40,60,80,100,160,220,280,340,400,460,520]};
const pos=(pct,t)=>Math.max(0,Math.min(10,lerp(pct,t,t.map((_,i)=>i))));
function shapeOf(p,s){
  const sd=stdOf(p.sex,p.height),stdW=sd.w,stdM=sd.smm,stdF=sd.fat;
  const pw=pos(s.w/stdW*100,SCALE.w),pm=pos(s.smm/stdM*100,SCALE.m),pf=pos(s.fat/stdF*100,SCALE.f);
  let type='I자형';if(pm<pw-0.3&&pf>pm)type='C자형';else if(pm>pw+0.3&&pm>=pf)type='D자형';
  return {pw,pm,pf,type,std:[pos(100,SCALE.w),pos(100,SCALE.m),pos(100,SCALE.f)]};
}
const TYPE_DESC={'C자형':'근육 막대가 가장 짧은 체형 (근육 부족·지방 과다)','I자형':'세 막대가 비슷한 균형 체형','D자형':'근육 막대가 가장 긴 근육형 체형'};
function shapeBlock(title,s,cls){
  const bar=(lb,v,std)=>`<div class="shape-row"><div class="lb">${lb}</div><div class="bar-track"><div class="std" style="left:${std*10}%"></div><div class="bar-fill ${cls}" style="width:${Math.max(2,v*10)}%"></div></div></div>`;
  return `<div class="shape-head"><b>${title}</b><span class="badge">${s.type}</span></div>${bar('체중',s.pw,s.std[0])}${bar('골격근량',s.pm,s.std[1])}${bar('체지방량',s.pf,s.std[2])}<div class="note" style="margin-top:2px">${TYPE_DESC[s.type]}</div>`;
}

  rows.forEach(([lb,k])=>{h+=`<tr><td>${lb}</td><td>${s0[k].toFixed(1)}</td>${la?`<td><b>${la[k].toFixed(1)}</b></td>`:''}${[13,26].map(H=>sims.map(x=>`<td>${x[H][k].toFixed(1)}</td>`).join('')).join('')}</tr>`;});
  $('table').innerHTML=h;
  // events
  bindView(R);
  R.querySelectorAll('#horizonSeg button').forEach(bt=>bt.onclick=()=>{horizon=+bt.dataset.h;renderResults();});

  R.querySelectorAll('#lineSeg button').forEach(bt=>bt.onclick=()=>{lineMode=bt.dataset.l;renderResults();});
}

function drawMsgs(p,sims,acts){
  const tk=typeKey(cur());
  const H=horizon,hl=H===13?'3개월':'6개월';
  const c=sims[0][H],t=sims[2][H],e=sims[1][H],s0=sims[0][0];
  const msgs=[];
  // 실측 페이스
  const la=acts.filter(a=>a.wk<=26.5).pop();
  if(la){
    const i=Math.max(1,Math.min(26,Math.round(la.wk)));
    const err=k=>Math.abs(sims[k][i].fat-la.fat)+Math.abs(sims[k][i].smm-la.smm)*1.5;
    const best=[0,1,2].sort((a,b)=>err(a)-err(b))[0];
    const goal=s0.fat-sims[2][i].fat, done=s0.fat-la.fat;
    const rate=goal>0.1?Math.round(done/goal*100):null;
    msgs.push({a:1,t:`${fmtDate(la.date)} 재측정 결과, 기준 대비 체지방 <b>${sg(la.fat-s0.fat)}kg</b>, 골격근 <b>${sg(la.smm-s0.smm)}kg</b>. 지금 페이스는 <b>'${SC[best].name}'</b> 그래프에 가장 가까워요.`});
    if(rate!==null) msgs.push({a:1,t:`같은 시점 100% 실천 예측 대비 체지방 감량 달성률 <b>${rate}%</b>. ${rate>=90?'예측대로 잘 가고 있어요. 이대로 6개월 그래프까지 가 봐요.':rate>=40?'방향은 맞아요. 남은 기간에 무엇을 하나만 더 지킬지 같이 정해봐요.':'아직 습관이 바뀌기 전이에요. 가장 쉬운 것 하나부터 다시 시작해요.'}`});
  }
  const keep=msgs.length;
  msgs.push({k:'gap',t:`지금처럼 지내면 ${hl} 뒤 체지방은 <b>${sg(c.fat-s0.fat)}kg</b>, 가이드라인을 지키면 <b>${sg(t.fat-s0.fat)}kg</b>. 같은 ${hl}인데 체지방이 <b>${f1(c.fat-t.fat)}kg</b> 차이 나요.`});
  const smmGap=t.smm-c.smm;
  if(smmGap>0.05)msgs.push({k:'smm',t:`근육은 지금 습관 대비 <b>${f1(smmGap)}kg</b> 더 붙어요. 체중계 숫자보다 몸이 더 많이 바뀝니다.`});
  const tgt=p.tgt;
  const lever=(txt,h,neg)=>{const s=simulate(p,h)[H];
    if(neg){const d=s.fat-t.fat;if(d>0.05)msgs.push({k:'lever',t:`${txt} ${hl} 뒤 체지방이 <b>${f1(d)}kg</b> 덜 빠져요.`});return;}
    const parts=[];if(t.fat-s.fat>0.05)parts.push(`체지방 <b>${f1(t.fat-s.fat)}kg</b> 더 감소`);if(s.smm-t.smm>0.05)parts.push(`골격근 <b>${f1(s.smm-t.smm)}kg</b> 더 증가`);
    if(parts.length)msgs.push({k:'lever',t:`${txt} ${hl} 뒤 ${parts.join(', ')}.`});};
  if(tgt.str<6)lever(`근력운동을 주 ${tgt.str+1}회로 1회만 늘리면`,{...tgt,str:tgt.str+1});
  if(tgt.alc>0)lever('음주를 주 1회 줄이면',{...tgt,alc:tgt.alc-1});
  else if(p.cur.alc>0)lever('반대로 음주를 주 1회만 해도',{...tgt,alc:1},true);
  if(tgt.slp<7)lever('수면을 7시간으로 늘리면',{...tgt,slp:7});
  msgs.push({k:'e80',t:`완벽하지 않아도 괜찮아요. 80%만 지켜도 체지방 <b>${sg(e.fat-s0.fat)}kg</b>, 골격근 <b>${sg(e.smm-s0.smm)}kg</b>예요.`});
  const m0=cur(),age0=+m0.age||0;
  if(age0>=30)msgs.push({k:'loss10',t:`지금처럼 지내면 근육은 10년마다 3~8%씩 줄어요(P9). 회원님 기준으로 10년 뒤 골격근 약 <b>−${(s0.smm*0.03).toFixed(1)}~${(s0.smm*0.08).toFixed(1)}kg</b>이에요. 줄어든 상태에서 다시 시작하는 게 가장 비싸요.`});
  msgs.push({k:'gain100',t:`가이드라인을 100% 지키면 ${hl} 뒤 골격근 <b>${sg(t.smm-s0.smm)}kg</b>, 체지방 <b>${sg(t.fat-s0.fat)}kg</b>. 이게 회원님 몸이 낼 수 있는 최대치에 가까운 숫자예요.`});
  try{const b0=baseOf(m0);const pb=b0.ext&&b0.ext.pbf?b0.ext.pbf:b0.fat/b0.w*100;const g=RUNE.calc({age:age0,sex:m0.sex,h:+m0.height||170,w:b0.w,bf:pb},'squat',3).rows[2];
    msgs.push({k:'gold',t:`룬PT 목표: 스쿼트 <b>${g.kg}kg × ${g.reps}회</b>면 골드예요. 지금 기준을 재보고 몇 단계 남았는지 확인해요.`});}catch(_){}
  const pick=(...ks)=>{const out=msgs.slice(0,keep);ks.forEach(kk=>{const f=kk==='lever1'?msgs.find(x=>x.k==='lever'):null;
    if(f){out.push(f);return;}msgs.filter(x=>x.k===kk).forEach(x=>out.push(x));});return out;};
  const finalMsgs=tk==='comfort'?pick('loss10','e80','lever1'):tk==='achieve'?pick('gain100','lever','gold','smm'):pick('gap','smm','lever','e80');
  msgs.length=0;finalMsgs.forEach(x=>msgs.push(x));
  $('msgs').innerHTML=msgs.map((m,i)=>`<div class="msg ${m.a?'actual':''}"><div class="n">${i+1}</div><p>${m.t}</p></div>`).join('');
}

// ---------- 룬PT 승급표 (룬PT 승급표 계산기 2026-11-08 확정안에서 이식) ----------
const RUNE=(()=>{
  const TIERS=['아이언','브론즈','실버','골드','플래티넘','에메랄드','다이아몬드','마스터','그랜드마스터','챌린저'];
  const RATIO=[[1,1],[3,.93],[5,.87],[7,.82],[8,.80],[10,.75],[12,.70],[15,.66],[20,.60],[25,.55],[30,.50]];
  function ratio(r){if(r<=1)return 1;for(let i=1;i<RATIO.length;i++){const [r1,v1]=RATIO[i-1],[r2,v2]=RATIO[i];if(r<=r2)return v1+(v2-v1)*(r-r1)/(r2-r1);}return Math.max(.3,.50-(r-30)*.01);}
  const AGE=[[25,1,1],[35,.97,.98],[45,.92,.95],[55,.85,.90],[65,.75,.83],[75,.62,.72],[85,.50,.60]];
  function ageF1(age,k){if(age<=AGE[0][0])return AGE[0][k];for(let i=1;i<AGE.length;i++){if(age<=AGE[i][0]){const a=AGE[i-1],b=AGE[i];return a[k]+(b[k]-a[k])*(age-a[0])/(b[0]-a[0]);}}return AGE[AGE.length-1][k];}
  function ageF(age,reps){if(age>=60)return(ageF1(age,1)+ageF1(age,2))/2;return ageF1(age,reps<=7?1:2);}
  const REF={m:{w:75,h:175},f:{w:60,h:162}};
  const boer=(sex,w,h)=>sex==='m'?.407*w+.267*h-19.2:.252*w+.473*h-48.3;
  function bodyBasis(p){const ref=REF[p.sex],refL=boer(p.sex,ref.w,ref.h);let lbm=null;
    if(p.bf!=null&&!isNaN(p.bf))lbm=p.w*(1-p.bf/100);else if(p.age>=18&&p.h)lbm=boer(p.sex,p.w,p.h);
    if(lbm==null)return{bw:ref.w};const f=Math.min(1.15,Math.max(.85,lbm/refL));return{bw:ref.w*f};}
  function safeReps(age,reps){let r=reps;if(age<18&&r<5)r=5;if(age>=60){if(r===20)r=15;else if(r===30)r=20;if(r<8)r=8;}return r;}
  const SQ=[.75,.91,1.11,1.35,1.65,1.8,2.0,2.25,2.5],BAR=[12,12,10,5,7,3,1,20,1],ROWR=[15,15,10,5,15,5,5,20,5];
  const EX={
    squat:{name:'스쿼트',body:'lower',mult:SQ,reps:BAR},
    dead:{name:'데드리프트',body:'lower',mult:[1.00,1.19,1.41,1.68,2.00,2.2,2.4,2.6,2.8],reps:[12,12,10,5,7,3,1,10,1]},
    bench:{name:'벤치프레스',body:'upper',mult:[.50,.61,.74,.90,1.10,1.30,1.50,1.75,2.00],reps:BAR},
    ohp:{name:'오버헤드프레스',body:'upper',mult:[.35,.42,.51,.62,.75,.85,.95,1.05,1.2],reps:BAR},
    row:{name:'바벨로우',body:'upper',mult:[.50,.59,.69,.81,.95,1.05,1.15,1.3,1.4],reps:ROWR},
  };
  function calc(p,id,upto){
    const ex=EX[id],b=bodyBasis(p),rows=[];let prev=null;
    for(let i=0;i<upto;i++){
      let reps=safeReps(p.age,ex.reps[i]);
      const raw=ex.mult[i]*b.bw*ratio(reps)*(p.sex==='m'?1:(ex.body==='lower'?.7:.55))*ageF(p.age,reps);
      let kg=Math.max(6,Math.floor(raw/2.5+1e-9)*2.5);
      if(prev&&kg===6&&prev.kg===6){reps=Math.min(30,prev.reps+3);}
      else if(prev){let up=0;while(kg/ratio(reps)<=prev.e1+1e-9&&up<20){kg+=2.5;up++;}}
      const row={tier:TIERS[i+1],kg,reps,e1:kg/ratio(reps)};rows.push(row);prev=row;
    }
    return {name:ex.name,rows};
  }
  return {calc,TIERS};
})();

function objList(id,c){
