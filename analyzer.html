function card(o){
  return `<section class="card ${o.kind}"><span class="tag">${o.tag}</span><h3>${o.title}</h3>
    <div class="lbl">사실 · 오늘 측정</div><ul>${o.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
    ${o.mean.length?`<div class="lbl">의미 · 연구가 말하는 것</div><ul>${o.mean.map(evLi).join('')}</ul>`:''}
    <div class="lbl">희망 · 바뀔 수 있다는 근거</div><ul>${o.hope.map(evLi).join('')}</ul>${o.proj?`<div class="proj">${o.proj}</div>`:''}
    ${o.ask?`<div class="ask"><small>회원에게 먼저 물어보기</small>${o.ask}</div>`:''}
    ${o.note?`<div class="tnote">트레이너 메모 · ${o.note}</div>`:''}
    ${o.id?objList(o.id,objCtx):''}</section>`;
}

    `물론이죠. 혼자 해보시는 것도 좋은 방법이에요. 대신 "잘 되고 있는지"를 판단할 기준은 같이 정해두면 좋겠어요. 4주 뒤에 인바디를 다시 재서 오늘 그래프의 어느 선을 따라가고 있는지 같이 확인해요.`,
    ['B19','S35'],
    '혼자 하신다면 어떤 운동을 일주일에 몇 번 하실 계획이세요? 예전에 혼자 해보셨을 때는 어땠어요?',
    '안주형 회원은 여기서 등록을 밀지 말고 재측정 예약까지만 잡으세요. 재측정 결과가 "지금처럼" 선에 가까우면 그 자체가 다음 상담의 근거가 돼요.',
    `<div style="margin-top:10px"><button class="btn primary sm" id="book4w">4주 뒤 재측정 예약 잡기</button> <span class="note" id="bookMsg"></span></div>`)}
  </div></section>`;
}

function renderReport(m,p,sims){
  const ms=sortedMeasures(m), x=ms[ms.length-1], e=x.ext||{}, r=e.rng||{};
  const male=m.sex==='m', age=+m.age||0, ck=m.check||{med:{}}, med=ck.med||{};
  const hm=(+m.height||170)/100, smmStd=stdOf(m.sex,+m.height||170).smm;
  const smmPct=(e.pct&&e.pct.smm>30)?e.pct.smm:x.smm/smmStd*100, smmRatio=x.smm/x.w*100, pbf=e.pbf??x.fat/x.w*100, bmi=e.bmi??x.w/(hm*hm);
  const pbfStdHi=male?20:28, pbfObese=male?25:32;
  const pbfHigh=pbf>pbfStdHi, pbfOb=pbf>=pbfObese;
  const whrHi=r.whr?r.whr[1]:(male?0.90:0.85), whrHigh=e.whr!=null&&e.whr>whrHi;
  const vfl=e.vfl!=null?e.vfl:(ck.vfl?+ck.vfl:null), vflHigh=vfl!=null&&vfl>=10;
  const minLow=e.mineral!=null&&r.mineral&&e.mineral<r.mineral[0];
  const smmLow=smmPct<90;
  const anyMed=med.htn||med.dm||med.lipid||med.liver, noMed=!!med.none&&!anyMed;
  const s0=sims[0][0], s6=sims[2][26], s3=sims[2][13];
  const c6=sims[0][26];
  const tk=typeKey(m),tc=TYPES[tk],e6=sims[1][26];
  const lNow=`지금처럼: 골격근 ${sg(c6.smm-s0.smm)}kg · 체지방 ${sg(c6.fat-s0.fat)}kg${age>=30?` → 이대로 10년이면 골격근 약 <b>−${(x.smm*0.03).toFixed(1)}~${(x.smm*0.08).toFixed(1)}kg</b> (30세 이후 10년마다 3~8%, P9)`:''}`;
  const l80=`80% 실천: 골격근 <b>${sg(e6.smm-s0.smm)}kg</b> · 체지방 <b>${sg(e6.fat-s0.fat)}kg</b>`;
  const l100=`100% 실천: 골격근 <b>${sg(s6.smm-s0.smm)}kg</b> · 체지방 <b>${sg(s6.fat-s0.fat)}kg</b> (3개월 뒤 골격근 ${sg(s3.smm-s0.smm)}kg · 체지방 ${sg(s3.fat-s0.fat)}kg)`;
  const projTxt=`<b>6개월 뒤 갈림길 (시뮬레이터 예측 · ${tc.graph})</b><br>`+(tk==='comfort'?[lNow,l80]:tk==='achieve'?[l100,l80]:[lNow,l80,l100]).join('<br>');
  const st=(cls,t)=>`<span class="s st-${cls}">${t}</span>`;
  objCtx={male,smmGain:sg(s6.smm-s0.smm),protOnly:sg(simulate(p,{...p.cur,pro:1.6})[26].smm-s0.smm)};
  const rngTxt=a=>a?`표준 ${a[0]}~${a[1]}`:'';
  const sum=[
    ['체중',x.w.toFixed(1)+'kg',r.w?(x.w>r.w[1]?st('high','표준 초과'):x.w<r.w[0]?st('low','표준 미만'):st('ok','표준')):''],
    ['골격근량',x.smm.toFixed(1)+'kg',smmLow?st('low',`표준의 ${smmPct.toFixed(0)}%`):st('ok',`표준의 ${smmPct.toFixed(0)}%`)],
    ['체지방률',pbf.toFixed(1)+'%',pbfOb?st('high','비만 범위'):pbfHigh?st('high','표준 초과'):st('ok','표준')],
    ['무기질',e.mineral!=null?e.mineral.toFixed(2)+'kg':'-',e.mineral!=null?(minLow?st('low','표준 미만'):st('ok','표준')):st('na','QR 측정만')],
    ['복부지방률',e.whr!=null?e.whr.toFixed(2):'-',e.whr!=null?(whrHigh?st('high',`표준 초과 (~${whrHi})`):st('ok','표준')):st('na','QR 측정만')],
    ['내장지방레벨',vfl!=null?vfl:'-',vfl!=null?(vflHigh?st('high','10 이상'):st('ok','10 미만')):st('na','상담 체크에 입력')],
    ...(e.obesity?[['비만도',e.obesity+'%',e.obesity>110?st('high','표준 90~110 초과'):e.obesity<90?st('low','표준 미만'):st('ok','표준')]]:[]),
  ];
  const cards=[];
  // 1. 뼈·낙상
  const bmdBad=ck.bmd==='penia'||ck.bmd==='porosis';
  if(minLow||bmdBad||(!male&&age>=45&&smmPct<100)||(age>=65&&smmLow)||ck.fall){
    const f=[];
    if(e.mineral!=null)f.push(`무기질 <b>${e.mineral.toFixed(2)}kg</b> (결과지 ${rngTxt(r.mineral)}${minLow?' → <b>아래</b>':''})`);
    f.push(`골격근량 <b>${x.smm.toFixed(1)}kg</b> (표준의 ${smmPct.toFixed(0)}%)`);
    if(ck.bmd)f.push(`골밀도 검사: <b>${{ok:'정상',penia:'골감소증',porosis:'골다공증'}[ck.bmd]}</b>`);else f.push('골밀도 검사: 받은 적 없음 / 모름');
    if(ck.fall)f.push('최근 1년 안에 넘어진 적 있음');
    const mean=[];if(age>=50||bmdBad)mean.push('B11');if(!male&&!ck.bmd&&age>=50)mean.push('B12');if(age<50)mean.push('N1','N2');
    if(!male&&(ck.meno==='trans'||ck.meno==='post'||(age>=45&&age<=58&&ck.meno!=='pre')))mean.push('B13');
    if(age>=65||ck.fall)mean.push('F10','F17');if(smmLow&&age>=60)mean.push('F6');
    const hope=['B14'];if(!male&&age>=50)hope.push('B15');if(age>=60||ck.fall)hope.push('F9');hope.push('B19');
    cards.push({id:'bone',kind:minLow&&smmLow?'risk':'warn',tag:'뼈 · 낙상',
      title:minLow&&smmLow?'뼈와 근육이 함께 약해지고 있다는 신호예요':bmdBad?'골밀도 결과와 근육량을 같이 봐야 해요':'뼈 건강을 점검해야 하는 시기예요',
      facts:f,mean,hope,proj:projTxt,
      ask:!ck.bmd?'최근 2년 안에 골밀도 검사 받아보셨어요? 결과 기억나세요?':ck.fall?'넘어지셨을 때 어떤 상황이었어요? 그 뒤로 걷거나 계단 내려갈 때 조심하게 되셨어요?':'최근에 계단을 내려가거나 한 발로 설 때 불안했던 적 있으세요?',
      note:'인바디 무기질은 골밀도 검사(DXA)가 아니라 체성분 추정치예요. "골다공증이에요"가 아니라 "검사를 받아볼 신호예요"로 전하고, 골밀도 검사를 권하세요. 골다공증 진단을 받은 회원은 고강도 바벨 전에 주치의 확인이 먼저예요.'});
  }
  // 2. 대사
  if(pbfHigh||whrHigh||vflHigh||bmi>=25){
    const f=[`체지방률 <b>${pbf.toFixed(1)}%</b> (${male?'남성':'여성'} 표준 ~${pbfStdHi}%${pbfOb?', 비만 범위':''})`];
    if(e.whr!=null)f.push(`복부지방률 <b>${e.whr.toFixed(2)}</b> (결과지 ${rngTxt(r.whr)}${whrHigh?' → <b>초과</b>':''})`);
    if(vfl!=null)f.push(`내장지방레벨 <b>${vfl}</b> (10 이상이면 높음)`);
    f.push(`BMI <b>${bmi.toFixed(1)}</b>${bmi>=25?' (비만)':bmi>=23?' (비만 전단계)':' (정상)'}`);
    f.push(noMed?'현재 내과에서 관리받는 항목: <b>없음</b>':anyMed?`관리 중: <b>${[med.htn&&'고혈압',med.dm&&'당뇨',med.lipid&&'고지혈증',med.liver&&'지방간'].filter(Boolean).join(', ')}</b>`:'내과 관리 항목: 아직 묻지 않음');
    const mean=[];if(bmi<25&&(whrHigh||vflHigh))mean.push('P1');if(whrHigh)mean.push('P3');
    if(age>=30&&age<50&&bmi>=25)mean.push('P6');if(age>=30&&age<50&&whrHigh)mean.push('P4');
    if(med.liver)mean.push('P16');if((vflHigh||whrHigh)&&age>=35&&age<60)mean.push('P18');
    cards.push({id:'meta',kind:'risk',tag:'대사 · 복부지방',
      title:noMed?'지금 관리받는 건 없지만, 체성분은 먼저 움직이고 있어요':anyMed?'관리 중인 항목과 체성분이 같은 방향을 가리켜요':'체지방과 복부지방이 기준을 넘었어요',
      facts:f,mean,hope:['P7','P13','P15'],proj:projTxt,
      ask:anyMed?'담당 선생님이 운동이나 체중 얘기를 하신 적 있으세요? 그때 어떻게 하셨어요?':'최근 건강검진에서 혈압, 혈당, 중성지방, 간수치 중에 "조금 높다"는 말 들으신 적 있으세요?',
      note:'"몇 개월 안에 대사증후군 확률 몇 %"처럼 말하지 마세요. 인바디 수치로 그런 예측을 하는 검증된 모델은 없어요. "같은 상태인 사람들에게서 이런 차이가 관찰됐다"까지가 근거가 허용하는 범위예요. 진단은 검진·병원의 몫이고, 우리는 그 수치를 바꾸는 쪽이에요.'});
  }
  // 3. 근육
  if(smmLow){
    const mean=['P10','P9'];if(age>=65&&pbfHigh)mean.push('S29');if(age>=50)mean.push('S34');
    cards.push({id:'muscle',kind:'warn',tag:'근육',
      title:pbfHigh?'근육은 적고 지방은 많은 패턴이에요 (C자형)':'체중에 비해 근육이 부족해요',
      facts:[`골격근량 <b>${x.smm.toFixed(1)}kg</b> · 키 기준 표준의 <b>${smmPct.toFixed(0)}%</b> (90% 미만이면 부족)`,`체중 대비 근육 비율 <b>${smmRatio.toFixed(1)}%</b>`],
      mean,hope:pbfHigh?['P13','S35']:['S35','S38'],proj:projTxt,
      ...(bmi<23?{extraNote:true}:{}),
      ask:'계단을 오르거나 무거운 장바구니를 들 때, 예전과 다르다고 느끼신 적 있으세요?',
      note:'근육 부족을 "약하다"로 말하지 말고 "아직 안 써본 근육이 많다"로 말하면 방어가 줄어요.'+(bmi<23?' 체중이 많지 않은 회원이라 감량 목표를 세우지 마세요. 감량만 하면 근육과 뼈가 같이 빠질 수 있어요(#29). 목표는 근육 증가예요.':'')});
  }
  // 4. 생애주기
  {
    let t,mean,ask,note='';
    if(!male&&age<30){t='지금이 뼈와 근육을 "쌓을 수 있는" 마지막 구간이에요';mean=['N1','N2'];ask='지금 체력으로 10년 뒤에도 하고 싶은 게 있으세요?';}
    else if(!male&&age<45){t='30~40대에 쌓아둔 근력과 뼈로 50대 이후를 살아가요';mean=['N1','P9','P21'];ask='50대, 60대가 됐을 때 어떤 몸으로 지내고 싶으세요?';note='"지금 안 하면 늦는다"보다 "지금이 가장 싸게 저축할 수 있는 때"로 말하세요. 폐경 이행기(P21)는 몇 년 뒤의 일로 미리 알려주는 정도가 좋아요.';}
    else if(!male&&age<=58){t='폐경 전후는 체중계에 안 보이는 변화가 가장 빠른 시기예요';mean=['P21','B13','N1'];ask='최근 몇 년 사이에 체중은 그대로인데 몸이 달라졌다고 느끼신 적 있으세요?';}
    else if(!male){t='지금부터는 "지키는 근력"이 혼자 지낼 수 있는 기간을 정해요';mean=['B11','P9'];if(age>=65)mean.push('F10','K7');ask='10년 뒤에도 꼭 혼자 하고 싶은 일이 뭐예요?';}
    else if(age<50){t='30~40대 남성은 체중보다 근력과 허리둘레가 미래를 정해요';mean=['P5','S11','P9'];ask='20대 때와 비교하면 지금 체력은 몇 점 정도라고 생각하세요?';}
    else if(age<65){t='50대 이후 남성에게 근력은 가장 강력한 건강 지표 중 하나예요';mean=['S34','P9'];ask='요즘 힘이 예전 같지 않다고 느낀 순간이 있었어요?';}
    else{t='지금부터는 "지키는 근력"이 혼자 지낼 수 있는 기간을 정해요';mean=['S34','F10','K7'];ask='10년 뒤에도 꼭 혼자 하고 싶은 일이 뭐예요?';}
    const tests=age>=60?'한 발 서기 10초 · 의자 5회 일어서기(12초 기준) · 악력':age>=45?'한 발 서기 10초 · 악력 · 바닥에 앉았다 일어서기':male?'푸시업 최대 개수 · 악력 · 플랭크':'악력 · 바닥에 앉았다 일어서기 · 무릎 대고 푸시업';
    if(age>=50)mean.push('T2');
    cards.push({id:'life',kind:'opp',tag:`생애주기 · ${male?'남성':'여성'} ${age}세`,title:t,
      facts:[`${male?'남성':'여성'} ${age}세 · 골격근 ${x.smm.toFixed(1)}kg · 체지방률 ${pbf.toFixed(1)}%`,`<b>오늘 바로 재보기:</b> ${tests} — 회원이 직접 해보고 숫자를 확인하는 게 가장 강력해요`],mean,hope:['S35','S38'],ask,note});
  }
  // 5. 트레이닝 입장
  const rp={age,sex:m.sex,h:+m.height||170,w:x.w,bf:pbf};
  const lifts=['squat','dead',male?'bench':'row','ohp'].map(id=>RUNE.calc(rp,id,3));
  const goldTbl=`<table class="data" style="margin-top:4px"><tr><th>종목</th><th>브론즈</th><th>실버</th><th><b style="color:var(--t-gold,#c79a1c)">골드</b></th></tr>${lifts.map(l=>`<tr><td>${l.name}</td>${l.rows.map((r,i)=>`<td>${i===2?'<b>':''}${r.kg}kg × ${r.reps}${i===2?'</b>':''}</td>`).join('')}</tr>`).join('')}</table>`;
  cards.push({id:'stance',kind:'stance',tag:'트레이닝 원칙 · 룬PT',title:'부상 위험은 막고, 바벨 기준은 골드까지 올립니다',
    facts:['스쿼트 · 데드리프트 · 프레스 같은 기본 바벨 동작을 감독하에 단계적으로',`<b>${esc(m.name)} 회원님의 룬PT 승급 기준</b> (${m.sex==='m'?'남성':'여성'} ${age}세 · ${x.w}kg · 체지방 ${pbf.toFixed(1)}% 반영)${goldTbl}`+(age>=60?'<div class="note">60세 이상은 시험 반복을 8회 이상으로 조정했어요.</div>':'')+(ck.bmd==='porosis'?'<div class="note bad">골다공증 진단 회원은 주치의 확인 후 시작하세요.</div>':'')],
    mean:['B14','B19',male?'S11':'S34'],hope:['S38'],
    ask:'무거운 걸 드는 운동이 다칠까 봐 걱정되신 적 있으세요?',
    note:'"무겁게 해야 한다"보다 "다치지 않게 단계를 밟아 올린다"를 먼저 말하세요. LIFTMOR도 감독과 점진적 진행이 전제였어요. 기준 무게는 룬PT 승급표 계산식 그대로이고, 현장 테스트 후 ± 조정하세요.'});
  // 강점
  if(smmPct>=110||(!pbfHigh&&!whrHigh&&!smmLow)){
    cards.push({id:'good',kind:'good',tag:'강점',title:smmPct>=110?'근육량은 이미 자산이에요. 지키는 게 목표예요':'지금 체성분은 균형이 좋아요',
      facts:[`골격근량 표준의 ${smmPct.toFixed(0)}% · 체지방률 ${pbf.toFixed(1)}%`],mean:['P9'],hope:['S38'],
      ask:'지금 몸 상태에서 더 잘하고 싶은 게 있다면 뭐예요?',note:'강점부터 말하면 뒤의 관리 포인트를 더 잘 받아들여요.'});
  }
  const order=tc.order;
  cards.sort((a,b)=>order[a.kind]-order[b.kind]);
  lastReport={m,cards:cards.map(c=>({...c})),projTxt,x};
  return `<div class="results ${hideNotes?'hide-notes':''}" style="gap:12px">
    <div class="note" style="margin:0">${fmtDate(x.date)} 측정 기준${x.ext?'':' · 손으로 입력한 측정이라 무기질·복부지방률은 비어 있어요 (QR로 불러오면 채워져요)'}</div>
    <div class="rep-sum">${sum.map(([k,v,s2])=>`<div class="it"><div class="k">${k}</div><div class="v">${v}</div>${s2}</div>`).join('')}</div>

const PT_NAMES={bone:'뼈·낙상',meta:'대사·복부지방',muscle:'근육 부족',life:'생애주기',stance:'룬PT 승급 기준',good:'강점'};
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent;}
function openGuide(){
  const m=cur();
  if(!baseOf(m)){return;}
  if(!lastReport||lastReport.m!==m){renderReport(m,paramsOf(m),runAll(paramsOf(m)));}
  const cs=lastReport.cards, pts=cs.filter(c=>c.id!=='stance'&&c.id!=='good').slice(0,3);
  if(pts.length<3){cs.filter(c=>!pts.includes(c)).slice(0,3-pts.length).forEach(c=>pts.push(c));}
  const type=m.type||'';
  const evShort=k=>{const e=EV[k];return e?`${e[1]} <span class="ref">${e[2]}</span>`:'';};
  const first=pts[0];
  const closing=TYPES[type]?TYPES[type].closing:`<b>유형을 먼저 정하세요</b> (왼쪽 회원 정보의 '회원 유형')<br>안주형은 재측정 예약까지, 성취발전형은 목표와 등록 제안, 혼합형은 회원이 고른 선에 맞춰 단계 제안.`;
  const allC=store.members.flatMap(mm=>(mm.consults||[]));
  const rate=a=>a.length?Math.round(a.filter(c=>c.result==='reg').length/a.length*100):null;
  const byPt=Object.keys(PT_NAMES).map(k=>{const a=allC.filter(c=>c.points&&c.points.includes(k));return a.length?`${PT_NAMES[k]} ${rate(a)}% (${a.length}건)`:null;}).filter(Boolean);
  const mine=(m.consults||[]);
  $('guideBody').innerHTML=`
    <h3 style="display:flex;justify-content:space-between;align-items:center;gap:8px">트레이너 공략 가이드 · ${esc(m.name)}<span class="badge ${type==='achieve'?'a':type==='comfort'?'b':''}">${typeName(m)}</span></h3>
    <div class="note" style="margin-top:0">이 회원님 인바디상 공략 포인트예요. 회원에게 보여주는 화면이 아니라 트레이너용이에요.</div>

      <div class="f">${stripHtml(c.facts[0]||'')}</div>
      ${c.mean&&c.mean[0]?`<div class="f" style="margin-top:4px">근거: ${evShort(c.mean[0])}</div>`:''}
      ${c.ask?`<div class="q">질문: "${c.ask}"</div>`:''}${objList(c.id,objCtx)}</div>`).join('')}
    <div class="lbl" style="font-size:12px;font-weight:800;color:var(--text-muted);margin-top:14px">상담 흐름</div>
    <ol class="flow">
      <li><b class="h">회원이 문제를 직접 말하게</b>"${first.ask||''}" → 답을 듣고, 회원이 쓴 단어를 그대로 메모해 두세요.</li>
      <li><b class="h">지금까지 해본 노력을 회원이 먼저 말하게</b>"이 부분 때문에 지금까지 해보신 게 있으세요? 어디까지 해보셨어요?" → 걷기·식단·약 등이 나오면 '회원이 이렇게 말하면' 대응으로.</li>
      <li><b class="h">하지 않았을 때의 손해 보여주기</b><span class="f">${lastReport.projTxt}</span><br>→ 변화 예측 탭의 그래프를 같이 보세요.</li>
      <li><b class="h">마무리</b>${closing}</li>

    <div class="acts"><button class="btn primary" id="gclose">닫기</button></div>`;
  $('guide').style.display='flex';

    const points=[...ROOT.querySelectorAll('.gpchk:checked')].map(c=>c.value);
    if(!m.consults)m.consults=[];
    m.consults.push({date:today(),result:bt.dataset.r,points,type:m.type||''});
    if(bt.dataset.r==='recheck'&&!m.nextDate){const d=new Date();d.setDate(d.getDate()+28);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());m.nextDate=d.toISOString().slice(0,10);renderForm();}
    save();openGuide();$('gmsg').textContent='기록했어요.';
  });
}

// 운동 스타일 감별 (조절초점 + 운동 동기 유형 + 피드백·구조 선호 · 문항 적어 '단서' 수준)
function classifyStyle(a){
  if(!a)return null;
  let promo=0,prev=0,comfort=0,achieve=0,n=0;
  if(a.st1){n++;a.st1.startsWith('1년 뒤, 지금보다')?promo+=2:prev+=2;}
  if(a.st2){n++;a.st2.startsWith('일단')?promo++:prev++;}
  if(a.st3){n++;if(a.st3.includes('상위'))achieve++;else if(a.st3.includes('괜찮아요'))comfort++;}
  const mot=a.st4?({'별 생각 없다':'무동기','누가 뭐라 할까 신경 쓰인다':'외적','아쉽다, 내일은 꼭 가야지':'가치','몸이 근질근질하다':'내적'})[a.st4]:null;
  if(mot){n++;if(mot==='무동기')comfort+=2;else if(mot==='외적')comfort+=1;else achieve+=1;}
  if(a.st5){n++;if(a.st5==='꼭 다 모으고 싶다')achieve++;else if(a.st5==='별로 관심 없다')comfort++;}
  if(a.imp!=null){n++;if(a.imp<=5)comfort+=2;else if(a.imp>=7)achieve+=1;}

function parseInBodyQR(raw){
  let t=String(raw||'').trim();
  const k=t.indexOf('IBData=');
  if(k>=0){t=t.slice(k+7).split('&')[0];}
  try{t=decodeURIComponent(t);}catch(e){}
  const segs=t.split('!');
  const model=(segs[0]||'').split('-')[0];
  let si=-1,mm=null;
  for(let i=0;i<segs.length;i++){const r=/([MF])(20\d{12})/.exec(segs[i]);if(r){si=i;mm=r;break;}}
  if(!mm) throw new Error('인바디 결과지 QR 형식이 아니에요.');
  const prefix=segs[si].slice(0,mm.index), body=segs[si].slice(mm.index+mm[0].length), dt=mm[2];
  const n=(i,d)=>{const v=parseInt(body.substr(i*4,4),10);return isNaN(v)?NaN:v/d;};
  const v={model,sex:mm[1]==='M'?'m':'f',date:`${dt.slice(0,4)}-${dt.slice(4,6)}-${dt.slice(6,8)}`,time:`${dt.slice(8,10)}:${dt.slice(10,12)}`,
    protein:n(0,10),mineral:n(3,100),fat:n(6,10),tbw:n(9,10),ffm:n(12,10),w:n(13,10),smm:n(17,10),height:parseInt(prefix.slice(-8,-4),10)/10,bmi:n(20,10),pbf:n(21,10),pct:{w:n(16,10),smm:n(18,10),fat:n(19,10)}};
  const sc=parseInt(body.substr(88,3),10); v.score=isNaN(sc)?null:sc;
  v.rng={protein:[n(1,10),n(2,10)],mineral:[n(4,100),n(5,100)],fat:[n(7,10),n(8,10)],tbw:[n(10,10),n(11,10)],w:[n(14,10),n(15,10)]};
  const s2=segs[si+1]||'',m2=i=>parseInt(s2.substr(i*4,4),10);
  v.bmr=m2(1)>500&&m2(1)<4000?m2(1):null;
  const wh=m2(2)/100; if(wh>0.5&&wh<1.5){v.whr=wh;v.rng.whr=[m2(3)/100,m2(4)/100];} else v.whr=null;
  const vf=parseInt(s2.substr(20,2),10),kc=parseInt(s2.substr(30,4),10);
  const hh=v.height/100;
  v.vfl=(vf>=1&&vf<=30)?vf:null; v.kcal=(kc>800&&kc<5000)?kc:null;
  v.obesity=hh>1?Math.round(v.w/((v.sex==='m'?22:21)*hh*hh)*100):null;
  const ag=parseInt(prefix.slice(-4,-1),10); v.age=(ag>5&&ag<110)?ag:null;
  const ph=prefix.length>8?prefix.slice(0,-8):''; v.phoneKey=/^0\d{8,10}$/.test(ph)?hashKey(ph):null; v.last4=v.phoneKey?ph.slice(-4):null;
  const h=v.height/100;
  const fails=[];
  if(!(v.w>20&&v.w<300))fails.push('체중');
  if(!(h>1&&h<2.3))fails.push('키');
  if(!(Math.abs(v.ffm+v.fat-v.w)<0.4))fails.push('제지방+체지방≠체중');
  if(!(Math.abs(v.w/(h*h)-v.bmi)<0.3))fails.push('BMI');
  if(!(Math.abs(v.fat/v.w*100-v.pbf)<0.6))fails.push('체지방률');
  if(!(v.smm>v.ffm*0.35&&v.smm<v.ffm*0.72))fails.push('골격근량');
  if(fails.length){const err=new Error(`QR은 읽었는데 숫자 검산이 맞지 않아요 (${fails.join(', ')}). 값을 직접 확인해서 저장해 주세요.`);err.partial=v;err.raw=t;err.ph=ph;throw err;}
  return v;
}
let jsqrP=null;
function loadJsQR(){
  if(window.jsQR)return Promise.resolve(window.jsQR);
  if(jsqrP)return jsqrP;
  const urls=['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js'];
  jsqrP=new Promise((res,rej)=>{let i=0;const next=()=>{if(i>=urls.length){jsqrP=null;rej(new Error('QR 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'));return;}
    const sc=document.createElement('script');sc.src=urls[i++];sc.onload=()=>window.jsQR?res(window.jsQR):next();sc.onerror=next;document.head.appendChild(sc);};next();});
  return jsqrP;
}
let heicP=null;
function loadHeic(){if(window.heic2any)return Promise.resolve(window.heic2any);if(heicP)return heicP;
  heicP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';sc.onload=()=>window.heic2any?res(window.heic2any):rej();sc.onerror=()=>{heicP=null;rej();};document.head.appendChild(sc);});return heicP;}
async function decodeQRFromFile(file){
  const isHeic=/heic|heif/i.test(file.type)||/\.(heic|heif)$/i.test(file.name||'');
  if(isHeic){
    try{const h2a=await loadHeic();const out=await h2a({blob:file,toType:'image/jpeg',quality:0.92});file=Array.isArray(out)?out[0]:out;}
    catch(e){throw new Error('아이폰 사진(HEIC) 형식을 이 브라우저에서 열지 못했어요. 아이폰 설정 → 카메라 → 포맷 → "높은 호환성"으로 바꾸거나, 스크린샷으로 찍어서 올려주세요.');}
  }
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('이 브라우저에서 사진 파일을 열 수 없어요. JPG나 PNG로 다시 저장하거나 스크린샷으로 올려주세요.'));im.src=url;});
    if('BarcodeDetector' in window){
      try{const det=new BarcodeDetector({formats:['qr_code']});const r=await det.detect(img);if(r&&r.length)return r[0].rawValue;}catch(e){}
    }
    const jsQR=await loadJsQR();
    const c=document.createElement('canvas'),ctx=c.getContext('2d',{willReadFrequently:true});
    const W0=img.naturalWidth,H0=img.naturalHeight;
    const tryRegion=(sx,sy,sw,sh,maxSide)=>{
      const sc=Math.min(1,maxSide/Math.max(sw,sh));c.width=Math.round(sw*sc);c.height=Math.round(sh*sc);
      ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      const d=ctx.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,c.width,c.height,{inversionAttempts:'attemptBoth'});return r?r.data:null;
    };
    for(const ms of [1400,2200,900,3200]){const r=tryRegion(0,0,W0,H0,ms);if(r)return r;}
    // 사진을 겹치게 나눠서 다시 시도 (QR이 작게 찍힌 경우)
    for(const g of [2,3]){const sw=W0/g*1.4,sh=H0/g*1.4;
      for(let gy=0;gy<g;gy++)for(let gx=0;gx<g;gx++){
        const sx=Math.max(0,Math.min(W0-sw,gx*W0/g-sw*0.15)),sy=Math.max(0,Math.min(H0-sh,gy*H0/g-sh*0.15));
        const r=tryRegion(sx,sy,Math.min(sw,W0),Math.min(sh,H0),1400);if(r)return r;}}
    throw new Error(`사진에서 QR을 찾지 못했어요 (사진 크기 ${W0}×${H0}). 카톡으로 보냈다면 화질이 줄어서일 수 있어요. 원본으로 보내거나, QR 부분을 가까이 찍어서 다시 올려주세요.`);
  } finally{URL.revokeObjectURL(url);}
}

async function openScanner(){
  $('scanFile').value='';$('scanFile2').value='';$('scanPaste').value='';scanBusy=false;
  const sc=$('scanner');sc.style.display='flex';sc.classList.remove('nocam');scanMsg('카메라를 여는 중...');

    let allowed=true;
    try{const pp=document.permissionsPolicy||document.featurePolicy;if(pp&&pp.allowsFeature)allowed=pp.allowsFeature('camera');}catch(_){}
    if(!allowed)throw new Error('blocked');
    const req=navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    let timedOut=false;
    stream=await Promise.race([req,new Promise((_,rej)=>setTimeout(()=>{timedOut=true;rej(new Error('timeout'));},3500))]);
    req.then(st=>{if(timedOut)st.getTracks().forEach(t=>t.stop());}).catch(()=>{});
    if(!$('scanner').style.display||$('scanner').style.display==='none'){stream.getTracks().forEach(t=>t.stop());stream=null;return;}
    const v=$('scanVideo');v.srcObject=stream;await v.play();
    scanMsg('QR을 네모 안에 맞춰주세요');

            scanCanvas.width=scanCanvas.height=Math.round(side*sc2);
            scanCtx.drawImage(v,(vw-side)/2,(vh-side)/2,side,side,0,0,scanCanvas.width,scanCanvas.height);
            const d=scanCtx.getImageData(0,0,scanCanvas.width,scanCanvas.height);
            const r=window.jsQR(d.data,d.width,d.height,{inversionAttempts:'dontInvert'});if(r)txt=r.data;
          }

  }catch(e){
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
    sc.classList.add('nocam');
    scanMsg('여기서는 실시간 카메라가 막혀 있어요. 아래 버튼으로 결과지를 찍거나 사진을 올리면 자동으로 저장돼요.');

    const li=lastImport;const m=store.members.find(x=>x.id===li.mid);
    if(m){m.measures=m.measures.filter(x=>x.id!==li.xid);if(m.baseId===li.xid)m.baseId=null;
      if(li.isNew&&!m.measures.length){store.members=store.members.filter(x=>x.id!==m.id);if(!store.members.length)store.members.push(blankMember());store.currentId=store.members[0].id;}}
    lastImport=null;save();renderMemberSel();renderForm();validateHabits();renderResults();$('toast').style.display='none';};
  if(!askName)toastT=setTimeout(()=>{if(!ROOT.activeElement||ROOT.activeElement.id!=='toastName'){$('toast').style.display='none';lastImport=null;}},8000);
}
function upMsg(t,bad){const el=$('upMsg');el.innerHTML=bad?`<span class="bad">${esc(t)}</span>`:t;}
const onUpload=async(inp)=>{
  const f=inp.files[0];inp.value='';if(!f)return;
  upMsg('사진에서 QR을 읽는 중...');
  try{const txt=await decodeQRFromFile(f);const v=parseInBodyQR(txt);autoImport(v);upMsg('<span class="good">저장했어요.</span> 다음 결과지도 같은 방법으로 올리면 돼요.');}
  catch(e){if(e.partial){upMsg('QR은 읽었지만 숫자 확인이 필요해요. 열린 창에서 값을 확인해 주세요.',true);showPartial(e);return;}
    upMsg(e.message,true);ROOT.getElementById('upMsg').scrollIntoView({block:'center',behavior:'smooth'});}
};
$('upHdr').onchange=()=>onUpload($('upHdr'));$('upBig').onchange=()=>onUpload($('upBig'));
$('scanClose').onclick=stopScan;
$('scanPasteGo').onclick=()=>handleScanText($('scanPaste').value);
$('scanPaste').onkeydown=e=>{if(e.key==='Enter')handleScanText($('scanPaste').value);};
const onScanFile=async(inp)=>{
  const f=inp.files[0];if(!f)return;
  scanMsg('사진에서 QR을 읽는 중...');
  try{handleScanText(await decodeQRFromFile(f));}catch(e){scanMsg(e.message);}
  inp.value='';
};
$('scanFile').onchange=()=>onScanFile($('scanFile'));$('scanFile2').onchange=()=>onScanFile($('scanFile2'));

let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(renderResults,120);});

load();renderMemberSel();renderForm();validateHabits();renderResults();
if(!storageOK)$('saved').innerHTML='<span class="bad">이 브라우저에서는 자동 저장이 안 돼요. 백업을 이용하세요.</span>';
})();
</script>


<script>
(function(){
const $=id=>document.getElementById(id);
const TABS={redzone:'rz',himbody:'hb',inbody:'ib'};
window.__ROOTS={};const inited={};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
// ---------- 테마를 각 분석기 칸막이에 전달 ----------
function syncTheme(){const t=document.documentElement.getAttribute('data-theme');Object.values(window.__ROOTS).forEach(r=>{const h=r.host;h.classList.toggle('th-dark',t==='dark');h.classList.toggle('th-light',t==='light')})}
new MutationObserver(syncTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
// ---------- 분석기 열기 (처음 열 때 한 번만 실행) ----------
function initApp(k,host){if(inited[k])return;inited[k]=1;const A=window.__APPS[k];
 const root=host.attachShadow({mode:'open'});window.__ROOTS[k]=root;syncTheme();
 root.innerHTML=`<style>${A.css}</style><div class="app-root">${A.html}</div>`;
 for(let i=0;;i++){const el=document.getElementById(`code-${k}-${i}`);if(!el)break;
  const s=document.createElement('script');s.textContent=`(function(ROOT){try{\n${el.textContent}\n}catch(e){console.error('[${k}]',e)}})(window.__ROOTS['${k}']);`;document.head.appendChild(s)}
 const P=ls.get('rune-unified-profile');if(P&&P.auto)setTimeout(()=>applyTo(k,P),0);
}
function show(t){if(!TABS[t])t='inbody';document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
 Object.keys(TABS).forEach(x=>{$('app-'+x).hidden=x!==t});const host=$('app-'+t);host.querySelector('.loading')&&host.querySelector('.loading').remove();initApp(TABS[t],host);
 const P=ls.get('rune-unified-profile');if(P&&P.auto&&inited[TABS[t]])applyTo(TABS[t],P);
 window.dispatchEvent(new Event('resize'));if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);try{localStorage.setItem('rune-unified-tab',t)}catch(e){}}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){show(b.dataset.t);window.scrollTo(0,0)}});
window.addEventListener('hashchange',()=>show(location.hash.slice(1)));
// ---------- 공통 회원 프로필 → 각 분석기 입력칸 ----------
function setv(R,sel,v,ev){const el=R&&R.querySelector(sel);if(!el||v==null||v==='')return;el.value=String(v);el.dispatchEvent(new Event(ev,{bubbles:true}))}
function applyTo(k,P){const R=window.__ROOTS[k];if(!R)return;
 if(k==='rz'){setv(R,'#sex',P.sex,'change');setv(R,'#age',P.age,'input');setv(R,'#bw',P.bw,'input');setv(R,'#bf',P.bf,'input')}
 if(k==='hb'){setv(R,'#name',P.name,'input');setv(R,'#sex',P.sex,'change');if(P.age)setv(R,'#age',Math.max(20,Math.min(70,Math.floor(P.age/10)*10)),'change');setv(R,'#bw',P.bw,'input');setv(R,'#smm',P.smm,'input')}
 if(k==='ib'){setv(R,'#name',P.name,'input');setv(R,'#sex',P.sex,'input');setv(R,'#age',P.age,'input');setv(R,'#height',P.height,'input')}}
const F=['name','sex','age','height','bw','bf','smm'];
function readP(){const P={auto:$('p_auto').checked};F.forEach(f=>{const v=$('p_'+f).value;P[f]=f==='name'||f==='sex'?v:(v===''?null:+v)});return P}
function fillP(P){F.forEach(f=>{$('p_'+f).value=P[f]??''});$('p_auto').checked=!!P.auto}
function whoLabel(P){if(!P||!(P.name||P.bw)){$('whoName').textContent='공통 회원';$('whoSub').textContent='세 분석에 같은 몸 정보 쓰기';return}
 $('whoName').textContent=P.name||'이름 없음';$('whoSub').textContent=[P.sex==='f'?'여':'남',P.age?P.age+'세':'',P.bw?P.bw+'kg':'',P.bf?'체지방 '+(+P.bf).toFixed(1)+'%':''].filter(Boolean).join(' · ')}
function fromInbody(){const st=ls.get('4t-inbody-sim-v1');if(!st||!st.members)return null;const m=st.members.find(x=>x.id===st.currentId)||st.members[0];if(!m)return null;
 const ms=[...(m.measures||[])].sort((a,b)=>a.date.localeCompare(b.date));const x=ms[ms.length-1];
 return{name:m.name,sex:m.sex,age:+m.age||null,height:+m.height||null,bw:x?x.w:null,bf:x?+(x.fat/x.w*100).toFixed(1):null,smm:x?x.smm:null,_date:x?x.date:null}}
$('whoBtn').onclick=()=>{fillP(ls.get('rune-unified-profile')||fromInbody()||{sex:'m',auto:true});$('p_msg').textContent='';$('pfBg').hidden=false;$('p_name').focus()};
const closeP=()=>{$('pfBg').hidden=true;$('whoBtn').focus()};
$('pfX').onclick=closeP;$('pfBg').addEventListener('click',e=>{if(e.target.id==='pfBg')closeP()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pfBg').hidden)closeP()});
$('p_fromIb').onclick=()=>{const P=fromInbody();if(!P){$('p_msg').textContent='인바디 화면에 저장된 회원이 아직 없어요.';return}const keep=$('p_auto').checked;fillP({...P,auto:keep});$('p_msg').textContent=P._date?`${P.name} 회원의 ${P._date} 측정값을 가져왔어요.`:`${P.name} 회원 정보를 가져왔어요 (측정 기록 없음).`};
$('p_apply').onclick=()=>{const P=readP();ls.set('rune-unified-profile',P);whoLabel(P);const done=[];Object.keys(window.__ROOTS).forEach(k=>{applyTo(k,P);done.push({rz:'레드존',hb:'힘바디',ib:'인바디'}[k])});
 $('p_msg').textContent=`적용했어요${done.length?' ('+done.join(' · ')+')':''}. 아직 안 연 메뉴는 열 때 ${P.auto?'자동으로':'다시 적용을 눌러야'} 들어가요.`};
whoLabel(ls.get('rune-unified-profile'));
let t0=location.hash.slice(1);if(!TABS[t0]){try{t0=localStorage.getItem('rune-unified-tab')||'inbody'}catch(e){t0='inbody'}}
show(t0);
})();
</script>
