<style>
:root{--bg:#f3efe6;--pn:#fffaf0;--ln:#d9cdb2;--tx:#1d2430;--mu:#6b7280;--gd:#9a6f1c;--cy:#0b7e93;--hx:#efe6d0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d14;--pn:#0f1822;--ln:#2a3a4a;--tx:#e8e0cc;--mu:#8a98a8;--gd:#d9aa4e;--cy:#4fc3d9;--hx:#16222f}}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:12px 12px 84px}
.grb{display:inline-block;font-size:10px;line-height:1;padding:3px 5px;border-radius:6px;color:#fff;vertical-align:middle}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h1{font-size:20px;font-weight:900;margin:0}.h2{font-size:16px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.vb{font-size:12px;color:var(--mu)}.vb b{font-size:22px;color:var(--gd);font-weight:900}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:transparent;border-radius:8px;font-weight:700;font-size:12px}
.seg button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.stage{position:relative;height:340px}
.fld{position:relative;width:100%;max-width:560px;aspect-ratio:1;margin:8px auto;background:var(--hx);border-radius:16px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.fld.ed{touch-action:none}
.fld svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fal{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:12px;font-weight:700;line-height:1.15;max-width:24%;pointer-events:none}
.fal small{display:block;font-weight:500;color:var(--mu);font-size:10.5px}
.ftk{position:absolute;transform:translate(-50%,-50%);width:16%;min-width:46px;max-width:70px;border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;color:var(--tx)}
.ftk .orb{width:38px;height:38px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;box-shadow:0 1px 3px rgba(0,0,0,.28);position:relative}
.ftk .nm{font-size:10.5px;font-weight:700;background:var(--pn);border-radius:6px;padding:0 4px;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftk.off{opacity:.4}
.ftk .no{position:absolute;top:-6px;left:-6px;min-width:18px;height:18px;border-radius:9px;background:#c26a00;color:#fff;font-size:11px;display:grid;place-items:center;padding:0 3px}
.ftk.sel .orb{outline:3px solid var(--cy);outline-offset:1px}
.ftk.ed{cursor:grab}
.mphs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mph{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:12px;padding:6px 4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.mph.on{border-color:var(--cy);box-shadow:0 0 0 1px var(--cy)}
.mph svg{width:72%;aspect-ratio:1;display:block}
.mph b{font-size:13px}.mph span{font-size:11px;text-align:center}
.fseg{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.fseg button{border:1px solid var(--ln);background:var(--pn);color:var(--mu);border-radius:999px;padding:4px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.fseg button.on{background:var(--cy);border-color:var(--cy);color:#fff;font-weight:700}
.ms{font-weight:800;margin-left:4px;white-space:nowrap}.ms.s{color:#8d99a8}.ms.y{color:#d9a400}.ms.r{color:#e5484d}
.rpx{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin-top:8px;scrollbar-width:none}.rpx::-webkit-scrollbar{display:none}
.rpc{flex:0 0 100%;scroll-snap-align:center;box-sizing:border-box;min-height:330px;border-radius:18px;padding:22px 18px;background:#0b1424;color:#eef2f8;display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.rpt{font-size:22px;font-weight:900;text-align:center}.rps{font-size:13px;text-align:center;opacity:.85;line-height:1.5}
.rpw{display:flex;justify-content:center;gap:8px;margin:6px 0}.rpw span{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.rpw i{width:30px;height:30px;border-radius:50%;background:#24324a;display:grid;place-items:center;font-style:normal;color:#fff;font-weight:900}.rpw i.on{background:#1e90ff}
.rpg{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;margin:4px 0}.rpg div{display:flex;flex-direction:column}.rpg b{font-size:24px}.rpg span{font-size:12px;opacity:.8}
.rpl{font-size:14px;line-height:1.8}.rpl b{color:#4aa8ff;margin-right:6px}
.rpr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #22304a;font-size:14px}.rpr>span:first-child{min-width:0}.rpr small{display:block;font-size:11px;opacity:.7;margin-top:2px}.rpr>b{font-size:16px;white-space:nowrap}
.trd i.no{background:#e5484d}
.promo{position:relative;text-align:center;padding:18px 10px 14px;border-radius:18px;background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 45%,#0b1424),#0b1424 70%);color:#fff;overflow:hidden;margin-top:8px}
.pr-fx{position:relative;height:150px}
.pr-em{position:absolute;left:50%;top:50%;font-size:74px;line-height:1;color:var(--c);text-shadow:0 0 24px var(--c),0 0 4px #fff;transform:translate(-50%,-50%) scale(0);animation:prpop .9s cubic-bezier(.2,1.6,.4,1) .15s forwards}
.pr-em .emi{display:block;filter:drop-shadow(0 0 14px var(--c))}.cal .ce{position:absolute;right:1px;bottom:1px;pointer-events:none}
.pr-ring{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;border:3px solid var(--c);opacity:0;animation:prring 1.6s ease-out .2s infinite}.pr-ring.r2{animation-delay:.9s}
.pr-fx i{position:absolute;left:50%;top:50%;width:4px;height:22px;margin:-11px -2px;border-radius:2px;background:linear-gradient(var(--c),transparent);transform:rotate(var(--a)) translateY(-30px);opacity:0;animation:prray 1.4s ease-out var(--d) infinite}
.pr-t{font-size:26px;font-weight:900;margin-top:4px;animation:prup .6s ease-out .5s both}.pr-n{font-size:15px;opacity:.9;margin-top:4px;animation:prup .6s ease-out .7s both}
.pr-s{font-size:20px;margin-top:6px;animation:prup .6s ease-out .9s both}.pr-s b{color:var(--c);font-size:24px}.pr-eq{font-size:12px;opacity:.9;margin-top:10px;animation:prup .6s ease-out 1.1s both}
@keyframes prpop{to{transform:translate(-50%,-50%) scale(1)}}@keyframes prring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes prray{0%{transform:rotate(var(--a)) translateY(-30px);opacity:1}100%{transform:rotate(var(--a)) translateY(-95px);opacity:0}}@keyframes prup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.promo *{animation:none!important}.pr-em{transform:translate(-50%,-50%)}}
.cal button .tq{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;line-height:1}
.tqi{font-size:11px;font-weight:800;color:#e0a82e;white-space:nowrap;margin-left:4px}
.trl{margin-top:6px;padding:8px 10px;border:1px solid #e0a82e88;border-radius:10px}.trd{display:flex;gap:6px;margin-top:6px}.trd i{width:22px;height:8px;border-radius:4px;background:var(--ln)}.trd i.on{background:#e0a82e}
.seal{display:inline-block;margin-top:6px;padding:4px 10px;border-radius:999px;border:1px solid #2fbf73;color:#2fbf73;font-weight:800;font-size:12px}
.rpd{display:flex;justify-content:center;gap:6px;margin-top:8px}.rpd i{width:7px;height:7px;border-radius:50%;background:var(--ln)}.rpd i.on{background:var(--cy)}
.frl{display:flex;flex-direction:column;gap:2px;margin:4px 0}
.frow{display:flex;align-items:stretch;gap:4px;position:relative}
.frow.drg{z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:.92;background:var(--pn)}
.frow.tgt{box-shadow:0 -2px 0 var(--cy)}
.frow.ask{flex-wrap:wrap}
.fgh{display:grid;place-items:center;width:34px;flex:none;font-size:20px;color:var(--mu,#8a93a3);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.fdx{width:38px;flex:none;border:1px solid var(--ln);border-radius:10px;background:transparent;color:#e5484d;font-size:15px;cursor:pointer}
.frt{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-size:12.5px;margin:6px 0}
.frt b.n{display:inline-grid;place-items:center;min-width:19px;height:19px;border-radius:10px;background:#c26a00;color:#fff;font-size:11px;margin-right:3px}
.wb{display:flex;align-items:center;gap:6px;border-radius:999px;padding:3px 12px 3px 4px;font-weight:700;font-size:12.5px;width:fit-content;margin:4px 0}
.wb i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12px}
.wb.yel{background:#fbf1c9;color:#7a5c00}.wb.yel i{background:#e9b835;color:#2a1b00}
.wb.org{background:#fde4cc;color:#9a4300}.wb.org i{background:#ee8a2b;color:#2a1000}
.wb.red{background:#fbe0dd;color:#a1261b}.wb.red i{background:#d8372a;color:#fff}
:root[data-theme="dark"] .wb.yel{background:#3a3212;color:#f1d049}:root[data-theme="dark"] .wb.org{background:#3d2612;color:#ff9f4a}:root[data-theme="dark"] .wb.red{background:#3a1f19;color:#ee8b73}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .wb.yel{background:#3a3212;color:#f1d049}:root:not([data-theme="light"]) .wb.org{background:#3d2612;color:#ff9f4a}:root:not([data-theme="light"]) .wb.red{background:#3a1f19;color:#ee8b73}}
.sl{position:absolute;aspect-ratio:1}
.hx{position:absolute;inset:0;background:var(--c,var(--ln));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:0;padding:0;width:100%}
.hx i{position:absolute;inset:3px;background:var(--hx);clip-path:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;text-align:center;padding:0 8px}
.hx.empty{background:var(--ln)}
.hx.empty i{color:var(--mu);font-size:11px}
.hx i small{font-size:10px;color:var(--c);font-weight:700}
.hx i b{font-size:11px;line-height:1.2;word-break:keep-all}
.hx i em{font-size:10px;color:var(--mu);font-style:normal}
.rm{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#c0392b;color:#fff;border:0;border-radius:10px;padding:3px 10px;font-size:11px;font-weight:700;z-index:2}
.ctr{position:absolute;left:50%;top:70px;transform:translateX(-50%);text-align:center;width:30%}
.ctr b{font-size:20px;color:var(--gd);display:block}
.btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--gd);color:#fff;font-weight:900;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;border:0;background:transparent;padding:12px 4px;font-weight:700;font-size:12px;color:var(--mu)}
.nav button.on{color:var(--gd);box-shadow:inset 0 3px 0 var(--gd)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#md.on{display:flex}
.sheet{background:var(--pn);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.tabs button{border:1px solid var(--ln);background:transparent;border-radius:16px;padding:6px 12px;white-space:nowrap;font-size:12px;font-weight:700}
.tabs button.on{background:var(--cy);color:#fff;border-color:var(--cy)}
/* ===== 4px 격자 (수업·오늘 운동 화면, 종목 장착, 운동 기록 팝업): 간격·크기·둥글기는 4/8/12/16/24 단위 ===== */
.g4{--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s6:24px}
.g4 .pn{padding:16px;border-radius:16px;margin-bottom:16px}

.g4 .btn{min-height:48px;padding:12px 16px;border-radius:12px;font-size:16px;line-height:24px}
.g4 .btn.sm{min-height:40px;padding:8px 12px;font-size:14px;line-height:24px;border-radius:12px}
.g4 .seg{gap:8px;margin:12px 0}.g4 .seg button{min-height:40px;padding:8px 4px;border-radius:12px;font-size:14px}

.g4 .fseg{gap:8px;margin:8px 0}.g4 .fseg button{min-height:40px;padding:8px 12px;font-size:14px}
.g4 .eqc{min-height:40px;padding:8px 12px;margin:4px 8px 4px 0;font-size:14px}
.g4 .popb{display:flex;gap:8px;margin:8px 0}.g4 .popb .btn{flex:1}
.g4 .rtop{gap:8px;margin:12px 0 8px}.g4 .rtop span{font-size:12px;line-height:16px}.g4 .rtop b{font-size:24px;line-height:32px}
.g4 .pill{min-height:48px;padding:0 12px;border-radius:16px;font-size:16px}
.g4 .r2h{gap:8px;margin:12px 0 8px;font-size:12px;line-height:16px}.g4 .r2{gap:8px}
.g4 .r2h,.g4 .r2{grid-template-columns:44px 1fr 1fr 1fr 48px}

.g4 .mmb{padding:12px;gap:12px;margin:8px 0;border-radius:12px}
.g4 .gl{gap:8px;margin-top:8px}.g4 .gs{padding:4px 8px;border-radius:8px;font-size:12px;line-height:16px}
.g4 .nta{padding:12px;border-radius:12px;min-height:84px;font-size:16px;line-height:24px}

<script>
/* ===== 티어 코어 (rune-tier-core.js) ===== */
/* 룬PT 티어 코어 — DOM·네트워크 없는 순수 계산 모듈 (확정 규칙: tier-promotion-spec.md)
   브라우저: window.RuneTier / Node: module.exports */
(function (root) {
  'use strict';

  /* ---------- 티어·별·MP ---------- */
  const TIERS = ['아이언', '브론즈', '실버', '골드', '플래티넘', '에메랄드', '다이아몬드', '마스터', '그랜드마스터', '챌린저'];
  const TIER_ID = ['iron', 'bronze', 'silver', 'gold', 'platinum', 'emerald', 'diamond', 'master', 'grandmaster', 'challenger'];
  // 별 1개의 폭(MP). 초반은 1~2세션, 후반은 인내가 필요하도록 설계: 1성당 표준 세션 수 = 1/1.5/2/3/4/5.5/6.5/10/12/14
  // (표준 세션 = 메인 4세트 x 8회, 해당 티어 기준 무게의 70%, 벤치 75kg 남성 기준. 세트·무게가 많으면 더 빨리 쌓임)
  const WIDTH = [220, 420, 730, 1430, 2240, 3390, 4730, 8400, 11760, 15680]; // 챌린저는 승급이 없어 별 표시용
  const START = [0]; WIDTH.forEach((w, i) => { if (i < WIDTH.length - 1) START.push(START[i] + 5 * w); }); // 티어 시작 = 앞 티어 5성 폭의 합
  // 티어 수준 안내(추정): l = 비슷한 나이·성별·체격의 헬스 이용자 중 상위 %, g = 일반 성인 중 상위 %
  // 근거가 약한 가이드값이에요(공개 근력 기준표 기반 추정). 앱 회원 기록이 쌓이면 실제 분포로 교정해요.
  const TIER_RANK = [
    { n: '운동을 시작한 단계예요' }, { n: '기초 체력을 만든 단계예요', g: 50 },
    { l: 80, g: 43 }, { l: 65, g: 32 }, { l: 50, g: 20 }, { l: 40, g: 10 }, { l: 30, g: 6 }, { l: 20, g: 3 }, { l: 7, g: 0.5 }, { l: 3, g: 0.1 }
  ];
  function rankLine(tier) {
    const r = TIER_RANK[Math.max(0, Math.min(9, tier | 0))], pc = (v) => '상위 약 ' + v + '%';
    if (r.l == null) return r.g != null ? r.n + ' · 일반 성인 중 ' + pc(r.g) + ' 수준' : r.n;
    return '헬스 이용자 중 ' + pc(r.l) + ' · 일반 성인 중 ' + pc(r.g);
  }
  const MAX_STARS = 8, PROMO_STARS = 5, MAX_CARRY = 3;
  const CARRY_MAX_BY_TIER = { 6: 1, 7: 0, 8: 0 };   // 다이아→마스터 1성, 마스터→그마·그마→챌린저는 이월 없음 (마의 구간)
  const MULT = { beginner: 1, intermediate: 3, advanced: 6.5 };   // 레벨 버튼은 없앴고 내부 계수는 중급(3)으로 고정해서 써요
  const FLOOR_PCT = 0.5, BONUS_PCT = 0.85, BONUS = 1.3;  // 기준 1RM의 50% 미만 세트는 MP 제외, 85% 이상은 1.3배

  const multOf = (level, personal) => (personal > 0 ? personal : MULT[level] || 1);
  const capMP = (tier) => START[tier] + MAX_STARS * WIDTH[tier];
  const starsOf = (mp, tier) => Math.max(0, Math.min(MAX_STARS, Math.floor((mp - START[tier]) / WIDTH[tier] + 1e-9)));
  const toKg = (mp, mult) => mp * mult; // 화면 표시용: 현재 배율 기준 kg

  /* 세트 목록의 완료 볼륨(웜업 제외) */
  const volOf = (sets, ref1rm) => (sets || []).reduce((a, s) => {
    if (!(s && s.done && s.t !== 'W')) return a;
    const w = +s.w || 0, v = w * (+s.r || 0);
    if (!(ref1rm > 0)) return a + v;
    const p = w / ref1rm;
    return a + (p < FLOOR_PCT ? 0 : p >= BONUS_PCT ? v * BONUS : v);
  }, 0);

  /* ---------- 종목 마스터 ---------- */
  // kind: barbell | machine | dumbbell | body    quest: 'trainer'(바벨, 트레이너 부여·승인) | 'auto'(머신·덤벨, 우편함 자동)
  // role: head(왕룬) | aux(바벨 보조) | follower(머신·덤벨 등)   maxTier: 챌린저 9 / GM 8 / 마스터 7
  // base: 남성 1RM 기준 체중배수, 브론즈(티어 1)부터. 없으면 트레이너가 무게를 직접 설정
  // 20% 안(2026-11-08): 브론즈·에메랄드 기준은 그대로, 사이(실버·골드·플래티넘)는 약 20% 간격으로 재배치. 아이언은 브론즈의 1/1.2
  const IRON_RATIO = 1 / 1.2;
  const BASE = {
    squat: [.75, .91, 1.11, 1.35, 1.65, 1.8, 2, 2.25, 2.5],
    bench: [.5, .61, .74, .9, 1.1, 1.3, 1.5, 1.75, 2],
    deadlift: [1, 1.19, 1.41, 1.68, 2, 2.2, 2.4, 2.6, 2.8],
    ohp: [.35, .42, .51, .62, .75, .85, .95, 1.05, 1.2],
    bbrow: [.5, .59, .69, .81, .95, 1.05, 1.15, 1.3, 1.4],
    bbcurl: [.3, .36, .44, .54, .65, .72, .8, .88],
    latpull: [.475, .56, .655, .77, .9, 1, 1.09],
    cablerow: [.6, .7, .81, .95, 1.1, 1.25, 1.35],
    dbfly: [.24, .29, .36, .43, .53, .6, .67],
    chestfly: [.3, .37, .46, .57, .7, .8, .9],
    reardelt: [.2, .25, .32, .41, .52, .6, .68]
  };
  const REPS = {
    main: [12, 12, 10, 5, 7, 3, 1, 20, 1],
    deadlift: [12, 12, 10, 5, 7, 3, 1, 10, 1],
    pull: [15, 12, 10, 5, 12, 5, 12, 20, 5],     // 바벨로우(5회·12회 섞음, 챌린저 5RM)
    curl: [15, 15, 10, 5, 15, 5, 5, 20],          // 바벨컬·라잉 트라이셉스 (GM까지)
    upperMD: [15, 20, 10, 30, 20, 20, 20],
    lat: [15, 20, 15, 20, 20, 20, 20],            // 랫풀다운(골드 15·플래티넘 20: 무게가 줄지 않도록)
    legMD: [15, 20, 20, 30, 20, 25, 20],
    pullup: [15, 12, 10, 8, 5, 8, 12, 15, 10]    // 풀업·어시스티드 풀업 한 줄(챌린저는 가중 10회)
  };

  const E = (id, name, o) => Object.assign({ id, name, kind: 'machine', role: 'follower', quest: 'auto', maxTier: 7, head: null, region: 'upper', reps: 'upperMD', base: null }, o);
  const EXERCISES = [
    // 왕룬(헤드) — 바벨 주력 5종, 챌린저까지
    E('squat', '스쿼트', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, region: 'lower', reps: 'main', base: BASE.squat }),
    E('bench', '벤치프레스', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'main', base: BASE.bench }),
    E('deadlift', '데드리프트', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, region: 'lower', reps: 'deadlift', base: BASE.deadlift }),
    E('ohp', '오버헤드 프레스', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'main', base: BASE.ohp }),
    E('bbrow', '바벨 로우', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'pull', base: BASE.bbrow }),
    // 바벨 보조 — GM까지 (헤드 격차 규칙은 적용하지 않음: 바벨은 트레이너 승인 구조)
    E('bbcurl', '바벨 컬', { kind: 'barbell', role: 'aux', quest: 'trainer', maxTier: 8, reps: 'curl', base: BASE.bbcurl }),
    E('lyingtri', '라잉 트라이셉스 익스텐션', { kind: 'barbell', role: 'aux', quest: 'trainer', maxTier: 8, reps: 'curl', base: BASE.bbcurl }),
    // 머신·덤벨 — 마스터까지, 헤드 티어 +1 제한
    E('legpress_plate', '레그프레스', { head: 'squat', region: 'lower', reps: 'legMD', equip: 'plate' }),
    E('legpress_pin', '시티드 레그프레스', { head: 'squat', region: 'lower', reps: 'legMD', equip: 'pin' }),
    E('lunge', '런지', { kind: 'dumbbell', head: 'squat', region: 'lower', reps: 'legMD' }),
    E('pushup', '푸시업', { kind: 'body', head: 'bench' }),
    E('dbfly', '체스트 플라이', { kind: 'dumbbell', head: 'bench', base: BASE.dbfly }),
    E('chestfly', '펙덱 플라이', { head: 'bench', base: BASE.chestfly }),
    E('latpull', '랫풀다운', { head: 'bbrow', base: BASE.latpull, reps: 'lat' }),
    E('cablerow', '시티드 케이블 로우', { head: 'bbrow', base: BASE.cablerow }),
    E('reardelt', '리버스 펙덱', { head: 'bbrow', base: BASE.reardelt }),
    // 풀업 줄: 풀업(맨몸·가중)과 어시스티드 풀업 머신이 같은 티어를 공유. 투구 슬롯. 마스터 이상 승급은 트레이너 확인
    E('pullup', '풀업', { kind: 'body', head: 'bbrow', maxTier: 9, reps: 'pullup' }),
    // 5km 달리기: 신발 슬롯. 시간 기준(RUN_SEC), 트레이너 확인
    E('run5k', '5km 달리기', { kind: 'run', role: 'aux', quest: 'trainer', maxTier: 9, region: 'lower', reps: null })
  ];
  const BY_ID = {}; EXERCISES.forEach((e) => (BY_ID[e.id] = e)); BY_ID.assistpull = BY_ID.pullup; // 옛 카탈로그 호환

  /* 앱 종목명 → 마스터 id / 헤드 연결 (앱의 EX 목록과 이름으로 연결, 신규 종목 추가에도 안전) */
  const NAME_TO_ID = { '스쿼트': 'squat', '벤치프레스': 'bench', '데드리프트': 'deadlift', '오버헤드 프레스': 'ohp', '바벨 로우': 'bbrow', '바벨 컬': 'bbcurl', '라잉 트라이셉스 익스텐션': 'lyingtri', '스컬크러셔': 'lyingtri',
    '레그프레스': 'legpress_plate', '시티드 레그프레스': 'legpress_pin', '런지': 'lunge', '푸시업': 'pushup', '체스트 플라이': 'dbfly', '펙덱 플라이': 'chestfly',
    '랫풀다운': 'latpull', '시티드 케이블 로우': 'cablerow', '리버스 펙덱': 'reardelt', '어시스티드 풀업 머신': 'pullup', '풀업': 'pullup' };
  // 마스터에 수치가 없는 종목: 헤드만 연결(무게는 트레이너 설정). 힌지 계열 → 데드, 숄더 → OHP, 가슴 프레스 → 벤치, 당기기 → 로우, 무릎계 → 스쿼트
  const HEAD_BY_NAME = {
    '인클라인 덤벨프레스': 'bench', '케이블 크로스오버': 'bench', '딥스': 'bench', '체스트 프레스 머신': 'bench', '인클라인 체스트 프레스 머신': 'bench', '스미스 머신 벤치프레스': 'bench', '디클라인 체스트 프레스 머신': 'bench',
    '원암 덤벨 로우': 'bbrow', '시티드 로우 머신': 'bbrow', 'T바 로우 머신': 'bbrow', '풀오버 머신': 'bbrow', '하이 로우 머신': 'bbrow', '페이스 풀': 'bbrow', '리어델트 플라이': 'bbrow',
    '루마니안 데드리프트': 'deadlift', '레그 컬': 'deadlift', '힙 쓰러스트': 'deadlift', '백 익스텐션 머신': 'deadlift',
    '레그 익스텐션': 'squat', '핵 스쿼트 머신': 'squat', '스미스 머신 스쿼트': 'squat',
    '숄더 프레스 머신': 'ohp', '스미스 머신 숄더 프레스': 'ohp', '사이드 레터럴 레이즈': 'ohp', '프론트 레이즈': 'ohp', '사이드 레터럴 레이즈 머신': 'ohp', '케이블 사이드 레터럴 레이즈': 'ohp', '슈러그 머신': 'ohp'
  };
  const BARBELL_NAMES = new Set(['루마니안 데드리프트']);

  /* 종목명(+앱 정보) → 마스터 메타. 마스터에 없으면 일반 머신·덤벨 규칙(마스터까지, 무게는 트레이너 설정) */
  function metaFor(name, opts) {
    opts = opts || {};
    const id = NAME_TO_ID[name];
    if (id) return BY_ID[id];
    const head = HEAD_BY_NAME[name] || null;
    const bb = BARBELL_NAMES.has(name);
    return E('x:' + name, name, Object.assign({ kind: bb ? 'barbell' : (opts.machine ? 'machine' : 'dumbbell'), quest: bb ? 'trainer' : 'auto', head, region: opts.region || 'upper', generic: true }, GENERIC_OVR[name] || {}));
  }

  /* ---------- 카탈로그 적용 (종목 추가·변경을 코드 배포 없이) ----------
     rows: [{ id, name, tier?: { core?, head?, kind?, quest?, role?, region?, maxTier?, reps? }, std?: { version, base:[…] } }]
     · tier.core 가 있으면 코어 마스터(squat 등)와 연결 — 이름이 바뀌어도 연결이 유지돼요.
     · 코어에 없는 종목은 일반 머신·덤벨 규칙 + tier 값으로 덮어써요(GENERIC_OVR).
     · 잘못된 값은 건너뛰고 rejected 로 돌려줘요(앱이 멈추지 않게). 여러 번 호출해도 같은 결과(멱등). */
  const GENERIC_OVR = {};
  const DEFAULTS = {
    base: JSON.parse(JSON.stringify(BASE)), nameToId: Object.assign({}, NAME_TO_ID), headByName: Object.assign({}, HEAD_BY_NAME),
    ex: EXERCISES.map((e) => Object.assign({}, e)), barbell: Array.from(BARBELL_NAMES)
  };
  const validBase = (b) => Array.isArray(b) && b.length >= 1 && b.length <= 9 && b.every((v, i) => typeof v === 'number' && v > 0 && v < 10 && (i === 0 || v > b[i - 1]));
  function applyCatalog(rows) {
    const rejected = [];
    // 1) 기본값으로 되돌린 뒤 덮어써요
    Object.keys(BASE).forEach((k) => delete BASE[k]); Object.keys(DEFAULTS.base).forEach((k) => (BASE[k] = DEFAULTS.base[k].slice()));
    Object.keys(NAME_TO_ID).forEach((k) => delete NAME_TO_ID[k]); Object.assign(NAME_TO_ID, DEFAULTS.nameToId);
    Object.keys(HEAD_BY_NAME).forEach((k) => delete HEAD_BY_NAME[k]); Object.assign(HEAD_BY_NAME, DEFAULTS.headByName);
    Object.keys(GENERIC_OVR).forEach((k) => delete GENERIC_OVR[k]);
    BARBELL_NAMES.clear(); DEFAULTS.barbell.forEach((n) => BARBELL_NAMES.add(n));
    EXERCISES.length = 0; DEFAULTS.ex.forEach((e) => EXERCISES.push(Object.assign({}, e, { base: e.base && e.base.slice() })));
    EXERCISES.forEach((e) => { if (e.base && DEFAULTS.base[e.id]) e.base = BASE[e.id]; });
    Object.keys(BY_ID).forEach((k) => delete BY_ID[k]); EXERCISES.forEach((e) => (BY_ID[e.id] = e)); BY_ID.assistpull = BY_ID.pullup;
    // 2) 행 적용 (같은 이름이 여러 행이면 정렬 앞쪽이 우선)
    (rows || []).forEach((r) => {
      if (!r || !r.id || !r.name) return;
      if (r.status && r.status !== 'active') return; // 숨김·폐기·병합 종목은 연결하지 않아요(기록 표시는 앱 쪽 EX 가 담당)
      const t = r.tier || {};
      const std = r.std && r.std.base != null ? r.std : null;
      if (std && !validBase(std.base)) { rejected.push({ id: r.id, reason: '기준표(체중배수)가 올바르지 않아요: 1~9개, 0보다 크고 올라가는 숫자' }); }
      const base = std && validBase(std.base) ? std.base.slice() : null;
      if (t.maxTier != null && !(t.maxTier >= 1 && t.maxTier <= 9)) { rejected.push({ id: r.id, reason: 'maxTier 범위 밖' }); return; }
      if (t.reps != null && !REPS[t.reps]) { rejected.push({ id: r.id, reason: '알 수 없는 반복 기준: ' + t.reps }); return; }
      if (t.head != null && !(DEFAULTS.ex.some((e) => e.id === t.head && e.role === 'head') || BY_ID[t.head])) { rejected.push({ id: r.id, reason: '연결할 왕룬 종목이 없어요: ' + t.head }); return; }
      if (t.core) {
        const ex = BY_ID[t.core];
        if (!ex) { rejected.push({ id: r.id, reason: '코어 종목 없음: ' + t.core }); return; }
        NAME_TO_ID[r.name] = t.core;
        if (base) { BASE[t.core] = base; ex.base = base; }
        ['maxTier', 'reps', 'quest', 'region'].forEach((k) => { if (t[k] != null) ex[k] = t[k]; });
        ex.stdVersion = std ? std.version : ex.stdVersion;
      } else {
        const o = {};
        ['head', 'kind', 'quest', 'role', 'region', 'maxTier', 'reps'].forEach((k) => { if (t[k] != null) o[k] = t[k]; });
        if (base) o.base = base;
        if (std) o.stdVersion = std.version;
        if (t.head) HEAD_BY_NAME[r.name] = t.head;
        if (t.kind === 'barbell') BARBELL_NAMES.add(r.name);
        if (Object.keys(o).length) GENERIC_OVR[r.name] = o;
      }
    });
    return { rejected };
  }

  /* ---------- 진행도 계산 ---------- */
  // 진행 상태 = { tier, baseMp, sinceDate }  (승급 때 baseMp=시작점+이월별×폭, sinceDate=승급일 다음 날)
  // mp = baseMp + Σ(since 이후 세션 볼륨 ÷ 그날 배율) → 같은 날 저장을 여러 번 해도 중복 집계되지 않아요
  const newState = () => ({ tier: 0, baseMp: 0, sinceDate: '0000-00-00' });

  function progressOf(state, sessions, multAt, exId, refFn) {
    const ref = refFn ? refFn(state.tier) : null; // 기준 1RM(kg): 없으면 가벼운 세트 제외·무거운 세트 보너스를 적용하지 않아요
    // sessions: { 'YYYY-MM-DD': [{exId, sets}] } 형태가 아니라 호출부에서 exId별 [{date, sets}] 로 넘겨도 되도록 두 모양 지원
    let add = 0;
    const list = Array.isArray(sessions) ? sessions : [];
    for (const r of list) {
      if (r.date < state.sinceDate) continue;
      add += volOf(r.sets, ref) / (multAt(r.date) || 1);
    }
    const cap = capMP(state.tier);
    const mp = Math.min(cap, state.baseMp + add);
    const stars = starsOf(mp, state.tier);
    const into = mp - START[state.tier] - Math.min(stars, MAX_STARS) * WIDTH[state.tier];
    return { tier: state.tier, mp, stars, toNext: stars >= MAX_STARS ? 0 : WIDTH[state.tier] - into, pct: stars >= MAX_STARS ? 1 : into / WIDTH[state.tier], atCap: mp >= cap };
  }

  function carryOf(stars, fromTier) { const cap = fromTier != null && CARRY_MAX_BY_TIER[fromTier] != null ? CARRY_MAX_BY_TIER[fromTier] : MAX_CARRY; return Math.max(0, Math.min(cap, stars - PROMO_STARS)); }

  /* 승급 가능/잠김 판정 (퀘스트 수락·수행 여부는 3단계에서 별도 확인) */
  function promoStatus(ex, prog, headTierOf, subHeadOf) {
    if (prog.tier >= ex.maxTier) return { state: 'max', reason: '이 종목의 최고 티어예요' };
    if (prog.stars < PROMO_STARS) return { state: 'notyet', reason: `5성부터 승급 퀘스트가 열려요 (${prog.stars}/5)` };
    const lim = headLimit(ex, headTierOf, subHeadOf);
    if (lim && prog.tier + 1 > lim.maxTier) return { state: 'locked', reason: `${lim.headName} 티어가 ${TIERS[lim.headTier]}라서 ${TIERS[lim.maxTier]}까지만 올릴 수 있어요`, head: lim.headId };
    return { state: 'ready', reason: ex.quest === 'trainer' ? '승급 미션을 요청할 수 있어요' : '승급 퀘스트가 우편함에 도착해요' };
  }

  /* 헤드 격차 규칙: 머신·덤벨은 연결된 왕룬 티어 +1까지. 기록 없는 헤드는 아이언. 트레이너가 대체 헤드 지정 가능 */
  function headLimit(ex, headTierOf, subHeadOf) {
    if (ex.role !== 'follower' || !ex.head) return null;
    const headId = (subHeadOf && subHeadOf(ex.id)) || ex.head;
    const headTier = headTierOf(headId) || 0;
    return { headId, headName: (BY_ID[headId] || { name: headId }).name, headTier, maxTier: Math.min(ex.maxTier, headTier + 1) };
  }

  function promote(state, stars, today, tbl) {
    const t = state.tier + 1, c = carryOf(stars, state.tier), ST = tbl ? tbl.START : START, WD = tbl ? tbl.WIDTH : WIDTH;
    const d = new Date(today + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1);
    return { tier: t, baseMp: ST[t] + c * WD[t], sinceDate: d.toISOString().slice(0, 10), carry: c };
  }

  /* ---------- 승급 목표(반복수·무게) ---------- */
  const RM = [[1, 1.0], [3, .93], [5, .87], [7, .82], [8, .80], [10, .75], [12, .70], [15, .66], [20, .60], [25, .55], [30, .50]];
  function rmPct(reps) {
    if (reps <= 1) return 1;
    for (let i = 1; i < RM.length; i++) {
      if (reps <= RM[i][0]) { const [r0, p0] = RM[i - 1], [r1, p1] = RM[i]; return p0 + (p1 - p0) * (reps - r0) / (r1 - r0); }
    }
    return RM[RM.length - 1][1];
  }
  function repsForPct(pct) { // rmPct 역함수(반올림)
    if (pct >= 1) return 1;
    for (let i = 1; i < RM.length; i++) {
      if (pct >= RM[i][1]) { const [r0, p0] = RM[i - 1], [r1, p1] = RM[i]; return Math.round(r0 + (r1 - r0) * (p0 - pct) / (p0 - p1)); }
    }
    return 30;
  }

  const AGE_ANCHOR = [25, 35, 45, 55, 65, 75, 85];            // 20대·30대·…·80+ 의 중앙 나이
  const AGE_STR = [1.00, .97, .92, .85, .75, .62, .50];        // 최대근력(7RM 이하)
  const AGE_END = [1.00, .98, .95, .90, .83, .72, .60];        // 근지구력(10RM 이상)
  function lerpTable(age, ys) {
    if (age <= AGE_ANCHOR[0]) return ys[0];
    if (age >= AGE_ANCHOR[AGE_ANCHOR.length - 1]) return ys[ys.length - 1];
    for (let i = 1; i < AGE_ANCHOR.length; i++) if (age <= AGE_ANCHOR[i]) { const t = (age - AGE_ANCHOR[i - 1]) / (AGE_ANCHOR[i] - AGE_ANCHOR[i - 1]); return ys[i - 1] + (ys[i] - ys[i - 1]) * t; }
  }
  function ageCoef(age, reps) {
    const s = lerpTable(age, AGE_STR), e = lerpTable(age, AGE_END);
    if (age >= 60) return (s + e) / 2; // 60세 이상은 시험이 모두 8회 이상이라 계수를 하나로 통일(상위 티어 역전 방지)
    return reps <= 7 ? s : reps >= 10 ? e : (s + e) / 2; // 8~9RM은 평균
  }

  /* 안전 규칙: 반복수 보정 + 안내 */
  function safeReps(reps, age, tierIdx) {
    const notes = [];
    let r = reps;
    if (age != null) {
      if (age < 18 && r <= 3) { r = 5; notes.push('만 18세 미만은 1~3RM 금지 → 5RM'); }
      if (age < 13) { const c = Math.max(12, Math.min(15, r < 12 ? 12 : r)); if (c !== r) notes.push('어린이는 12~15RM 범위'); r = c; }
      if (age >= 60 && r >= 30) { r = 20; notes.push('60세 이상 30RM → 20RM'); }
      else if (age >= 60 && r >= 20) { r = 15; notes.push('60세 이상 20RM → 15RM'); }
      if (age >= 60 && r < 8) { r = 8; notes.push('60세 이상은 8RM 이상'); }
    }
    return { reps: r, notes };
  }
  // 나이별 티어 상한: 12세 이하 에메랄드(5), 13~15세 다이아몬드(6), 16~17세 마스터(7)
  const ageTierCap = (age) => (age == null ? 9 : age < 13 ? 5 : age < 16 ? 6 : age < 18 ? 7 : 9);
  const childTierCap = ageTierCap;
  const BAR_MIN = 6; // 센터에 6kg·8kg 바벨이 있어 바벨 종목의 최소 목표는 6kg

  const sexCoef = (sex, ex, variant) => {
    if (sex !== 'F') return 1;
    if (ex.region === 'upper') return .55;
    return .7; // 하체(스쿼트·데드·루마니안 포함) 여성 계수 0.7
  };

  /* 체격 보정: 키·체중으로 제지방량(Boer 공식)을 추정해, 체중에 단순 비례하던 기준을 체격에 맞게 미세 조정.
     기준 체격(남 75kg·175cm, 여 60kg·162cm)에서는 1.0, 같은 체중이면 키가 클수록 높고, 체지방이 많은 체격일수록 낮아져요.
     보정 폭은 ±15%로 제한. 체지방률 측정값이 있으면 그것을 우선 사용하고(키는 영향 없음), 없으면 키·체중 추정, 키도 없으면 보정 없음(1.0). 초안이라 실제 회원 기록으로 검증이 필요해요. */
  const BODY_REF = { M: { kg: 75, cm: 175 }, F: { kg: 60, cm: 162 } };
  const BODY_CLAMP = [0.85, 1.15];
  const lbm = (sex, kg, cm) => (sex === 'F' ? 0.252 * kg + 0.473 * cm - 48.3 : 0.407 * kg + 0.267 * cm - 19.2);
  const bfOk = (v) => v != null && v !== '' && +v >= 3 && +v <= 60;
  /* 체지방률(측정값)이 있으면 제지방 비율 = 1 − 체지방률, 없으면 키·체중으로 추정(Boer). 기준 체격 대비 비율로 보정 */
  function bodyBasis(member) {
    if (!member || !member.bodyKg) return 'none';
    if (bfOk(member.bodyFatPct)) return 'measured';
    if (member.age != null && member.age < 18) return 'none'; // 추정식(Boer)은 성인용이라 미성년은 측정값이 있을 때만 보정
    return member.heightCm ? 'estimated' : 'none';
  }
  function bodyFactor(member) {
    const basis = bodyBasis(member);
    if (basis === 'none') return 1;
    const sex = member.sex === 'F' ? 'F' : 'M', ref = BODY_REF[sex];
    const f = basis === 'measured' ? 1 - member.bodyFatPct / 100 : lbm(sex, member.bodyKg, member.heightCm) / member.bodyKg;
    const f0 = lbm(sex, ref.kg, ref.cm) / ref.kg;
    return Math.max(BODY_CLAMP[0], Math.min(BODY_CLAMP[1], f / f0));
  }

  const roundTo = (x, step) => Math.round(x / step) * step;
  const ceilTo = (x, step) => Math.ceil(x / step - 1e-9) * step;

  /* ---------- 풀업 줄 · 5km 달리기 ---------- */
  // 풀업: 순부하 L=(체중−보조+추가)/체중, 목표 환산 1RM(체중배수, 남성)·반복은 REPS.pullup. 여성 ×0.70, 나이·안전 규칙 적용
  const PULL_E1 = [.68, .80, .93, 1.00, 1.15, 1.25, 1.43, 1.52, 1.58];
  function pullTarget(t, member) {
    const age = member.age == null ? 30 : member.age, sr = safeReps(REPS.pullup[t - 1], age, t), reps = sr.reps;
    const c = (member.sex === 'F' ? .70 : 1) * ageCoef(age, reps), bw = member.bodyKg;
    let L = PULL_E1[t - 1] * c * rmPct(reps), assist = 0, added = 0;
    if (L < 1) { assist = roundTo(bw * (1 - L), 5); if (assist < 2.5) assist = 0; L = (bw - assist) / bw; }
    else { added = roundTo(bw * (L - 1), 2.5); L = (bw + added) / bw; }
    const text = assist > 0 ? '보조 ' + assist + 'kg × ' + reps + '회' : added > 0 ? '맨몸 +' + added + 'kg × ' + reps + '회' : '맨몸 × ' + reps + '회';
    return { reps, L, assist, added, text, eqL: L / rmPct(reps), notes: sr.notes };
  }
  /* 시험 통과 판정: 5~15회 세트의 순부하 환산 1RM이 목표 이상 */
  function pullPass(t, member, netL, reps) {
    if (!(reps >= 5 && reps <= 15) || !(netL > 0) || !member || !member.bodyKg) return false;
    return netL / rmPct(reps) >= pullTarget(t, member).eqL - 1e-9;
  }
  // 5km: 기준 시간(남 20~39세), 여성 ×1.12, 나이 시간계수(35세 1.00 → 80세 1.70 보간)
  const RUN_SEC = [2700, 2280, 1920, 1680, 1500, 1350, 1230, 1110, 990];
  const RUN_AGE = [[35, 1], [40, 1.03], [45, 1.07], [50, 1.12], [55, 1.17], [60, 1.24], [65, 1.32], [70, 1.42], [75, 1.55], [80, 1.70]];
  function runAgeCoef(age) {
    if (age == null || age <= 35) return 1; if (age >= 80) return 1.70;
    for (let i = 1; i < RUN_AGE.length; i++) if (age <= RUN_AGE[i][0]) { const a = RUN_AGE[i - 1], b = RUN_AGE[i]; return a[1] + (b[1] - a[1]) * (age - a[0]) / (b[0] - a[0]); }
  }
  const fmtSec = (s) => Math.floor(s / 60) + ':' + String(Math.round(s % 60)).padStart(2, '0');
  function runTarget(t, member) {
    const sec = Math.round(RUN_SEC[t - 1] * runAgeCoef(member && member.age) * (member && member.sex === 'F' ? 1.12 : 1));
    return { sec, text: '5km ' + fmtSec(sec) + ' 이내' + (t === 1 ? ' (걷기 혼합 가능)' : t === 2 ? ' (연속 달리기)' : '') + (t >= 6 ? ' · 7일 이상 떨어진 2회' : '') };
  }
  // 달리기 MP(km 환산): 거리 × (내 티어 기준 페이스 ÷ 실제 페이스)², 0.7~1.3 제한. 별 폭(km 환산)은 시뮬레이션 전 임시값
  const RUN_W = [5, 10, 15, 25, 35, 50, 65, 90, 110, 130];
  const RUN_START = [0]; RUN_W.forEach((w, i) => { if (i < 9) RUN_START.push(RUN_START[i] + 5 * w); });
  const RUN_TBL = { START: RUN_START, WIDTH: RUN_W };
  function runMP(r, tier, member) {
    const refSec = tier >= 1 ? runTarget(tier, member).sec : runTarget(1, member).sec * 1.2;
    const f = Math.max(.7, Math.min(1.3, Math.pow((refSec / 5) / (r.sec / r.km), 2)));
    return r.km * f;
  }
  function runProgress(state, runs, member) {
    let add = 0; (runs || []).forEach((r) => { if (r.date >= state.sinceDate && r.km > 0 && r.sec > 0) add += runMP(r, state.tier, member); });
    const cap = RUN_START[state.tier] + MAX_STARS * RUN_W[state.tier], mp = Math.min(cap, state.baseMp + add);
    const stars = Math.max(0, Math.min(MAX_STARS, Math.floor((mp - RUN_START[state.tier]) / RUN_W[state.tier] + 1e-9)));
    const into = mp - RUN_START[state.tier] - Math.min(stars, MAX_STARS) * RUN_W[state.tier];
    return { tier: state.tier, mp, stars, toNext: stars >= MAX_STARS ? 0 : RUN_W[state.tier] - into, pct: stars >= MAX_STARS ? 1 : into / RUN_W[state.tier], atCap: mp >= cap };
  }
  // 트레이너 확인이 필요한 승급인지: 바벨·달리기는 항상, 풀업은 마스터 이상(가중)
  const needsTrainer = (ex, targetTier) => ex.quest === 'trainer' || (ex.id === 'pullup' && targetTier >= 7);

  /* 승급 목표 계산.
     member: { sex:'M'|'F', age, bodyKg }, targetTier: 올라갈 티어(1~9), opts: { dumbbellStep, variant } */
  function targetFor(ex, targetTier, member, opts) {
    opts = opts || {};
    const idx = targetTier - 1; // base/reps 배열은 브론즈(티어1)부터
    if (targetTier < 1 || targetTier > ex.maxTier) return { ok: false, reason: '범위 밖 티어' };
    if (ex.id === 'pullup' || ex.id === 'run5k') {
      const age0 = member && member.age != null ? member.age : 30, o2 = { ok: true, exId: ex.id, targetTier, kg: null, notes: [], variant: null };
      if (ageTierCap(age0) < targetTier) { o2.blocked = true; o2.notes.push(age0 < 13 ? '12세 이하는 에메랄드까지만 부여' : age0 < 16 ? '13~15세는 다이아몬드까지만 부여' : '16~17세는 마스터까지만 부여'); }

function passDates(b,T,mem){
  const R=window.RuneTier,ex=b.m,out={};

    if(T>=6)return ok.filter(d=>ok.some(e=>(new Date(d)-new Date(e))/864e5>=7));

  }
  if(ex.id==='pullup'){
    if(!mem.bodyKg)return [];

    return Object.keys(out).sort();

function trialScan(b,st,T,mem){

    if(win){win.h.push({d,p});win.n++;if(p)win.got++;

function hGate(ex,cur,headT){

function gapOf(ex,tier,headT){const R=window.RuneTier;if(ex.role!=='follower'||!ex.head||tier<4)return null;const ht=headT(ex.head)||0;return tier-ht>=2?{name:(R.BY_ID[ex.head]||{name:'바벨 종목'}).name,ht,d:tier-ht}:null}

  if(D.length<AUTO_N)return null;

/* ---- 세트 평가: 웜업을 뺀 완료 세트마다 내 체격 기준 시험구간 티어로 환산 (예: 브3 골1 마3) ---- */
const TAB=['아','브','실','골','플','에','다','마','그','챌'];
function gradeCalc(x,memOv){
  const R=window.RuneTier,e=EX[x.id];
  if(!e||e.missing)return{ok:false,why:'종목 정보를 찾을 수 없어요'};
  const mem=memOv||memberCalc();
  if(!mem.bodyKg||!mem.sex||mem.age==null)return{ok:false,why:'몸 정보를 입력하면 평가할 수 있어요'};
  const m=R.metaFor(e.name,{machine:e.m,region:e.part==='leg'?'lower':'upper'});
  if(m&&m.id==='pullup')return{ok:false,why:'풀업은 순부하 기준이라 세트 평가는 아직 지원하지 않아요 (승급 시험 기준은 티어 화면에서 확인)'};
  const dbm=!!m&&m.kind==='dumbbell';
  if(!m)return{ok:false,why:'종목 정보를 찾을 수 없어요'};
  let L;try{L=(dbm&&dbLad(m,mem))||R.ladderFor(m,mem)}catch(err){L=[]}
  if(dbm&&!(L.some(q=>q&&q.ok&&q.kg>0)))return{ok:false,why:'이 덤벨 종목은 아직 시험 기준표가 없어요 (기록·볼륨은 정상 집계돼요)'};
  const th=L.map((r,i)=>r&&r.ok&&!r.trainerSet&&r.kg>0&&r.reps>0?{t:i+1,eq:r.kg/R.rmPct(r.reps),kg:r.kg,reps:r.reps}:null).filter(Boolean);
  if(!th.length)return{ok:false,why:'이 종목은 아직 시험 기준표가 없어요'};
  const rows=[],skip=[];
  x.sets.forEach((s,i)=>{
    if(!s.done)return;
    if(dbm){const e1=dbE1(s);if(e1==null){if(dbSides(s).some(q=>q.r>20))skip.push(i);return}let t=0;th.forEach(h=>{if(e1>=h.eq-1e-9)t=h.t});const sd=dbSides(s),lo=sd[0].w<=sd[1].w?sd[0]:sd[1];rows.push({i,w:lo.w,r:lo.r,e1,t,txt:setTxt(s)});return}
    if(!(s.w>0)||!(s.r>=1))return;
    if(s.r>20){skip.push(i);return}
    const e1=s.w/R.rmPct(s.r);let t=0;th.forEach(h=>{if(e1>=h.eq-1e-9)t=h.t});
    rows.push({i,w:s.w,r:s.r,e1,t});
  });
  const cnt={};rows.forEach(r=>cnt[r.t]=(cnt[r.t]||0)+1);
  const sum=Object.keys(cnt).map(Number).sort((a,b)=>a-b).map(t=>TAB[t]+cnt[t]).join(' ');
  let spread=null;if(rows.length>1){const v=rows.map(r=>r.e1),mx=Math.max(...v),mn=Math.min(...v);spread=(mx-mn)/mx}
  return{ok:true,rows,sum,spread,skip,th,name:e.name,m};
}
function gradeHTML(sl){
  const R=window.RuneTier;
  const body=sl.map(x=>{
    const g=gradeCalc(x),nm=esc(EX[x.id]?EX[x.id].name:'종목');
    if(!g.ok)return `<div class="pn"><b>${nm}</b><div class="mu" style="margin-top:4px">${g.why}</div></div>`;
    if(!g.rows.length)return `<div class="pn"><b>${nm}</b><div class="mu" style="margin-top:4px">완료(✔)한 세트가 없어요. 세트를 마치면 체크해 주세요</div></div>`;
    const chips=g.rows.map((r,k)=>`<span class="gs"><small>${k+1}세트</small> ${r.w}kg×${r.r} <b>${TAB[r.t]}</b></span>`).join('');
    const sp=g.spread==null?'세트가 1개라 일관성은 비교할 수 없어요':g.spread<=.08?`세트 간 편차 ${Math.round(g.spread*100)}% · 일정하게 유지했어요`:g.spread<=.2?`세트 간 편차 ${Math.round(g.spread*100)}% · 약간 차이가 있어요`:`세트 간 편차 ${Math.round(g.spread*100)}% · 차이가 커요 (피라미드·드롭 세트라면 정상이에요)`;
    const sel=[5,8,10,12];
    const tb=g.th.map(h=>`<tr><td class="emw">${embImg(h.t,18)}${R.TIERS[h.t]}</td><td>${h.kg}×${h.reps}</td>${sel.map(r=>`<td>${Math.round(h.eq*R.rmPct(r)*2)/2}</td>`).join('')}</tr>`).join('');
    return `<div class="pn"><div class="row"><b>${nm}</b><b style="font-size:17px;color:var(--gd)">${g.sum}</b></div><div class="gl">${chips}</div><div class="mu" style="margin-top:6px">${sp}${g.skip.length?` · 20회 초과 ${g.skip.length}세트는 제외`:''}</div>
    <details style="margin-top:6px"><summary class="mu">내 몸 기준 티어표 보기</summary><table class="gt"><tr><th>티어</th><th>시험</th><th>5회</th><th>8회</th><th>10회</th><th>12회</th></tr>${tb}</table><div class="mu" style="font-size:11px">내 체격(키·체중·체지방률·나이)에 맞춘 무게(kg)예요. 칸의 무게×횟수를 해내면 그 티어 수준이에요.</div></details></div>`;
  }).join('');
  return `<div class="row"><b class="h2">오늘 세트 평가</b><button class="x" data-act="close">✕</button></div><div class="mu" style="margin:4px 0 8px">웜업·실패 세트를 포함한 완료 세트를 승급 시험 기준으로 환산했어요. 아 아이언 · 브 브론즈 · 실 실버 · 골 골드 · 플 플래티넘 · 에 에메랄드 · 다 다이아 · 마 마스터 · 그 그랜드마스터 · 챌 챌린저. 세트 구성이 비슷할수록 일관된 운동이에요.</div>${body}`;
}

const MAX=[['back','등'],['chest','가슴'],['leg','다리'],['core','코어'],['shoulder','어깨'],['arm','팔'],['cardio','심폐']];
function mileOf(list,runs){const o={};MAX.forEach(a=>o[a[0]]=0);(list||[]).forEach(x=>{const e=x&&EX[x.id];if(!e||!(e.part in o))return;o[e.part]+=vol(x.sets||[],x.id)});(runs||[]).forEach(q=>o.cardio+=(+q.km||0));return o}

const mStars=(v,u,ys=10,rs=100)=>{const k=Math.floor(v/u),m=k%rs;return{r:Math.floor(k/rs),y:Math.floor(m/ys),s:m%ys,k}};

function planDedup(){
  const P=S.adm&&S.adm.plans;if(!P)return 0;let n=0;
  Object.keys(P).forEach(d=>{const a=P[d];if(!a||a.length<2)return;

      if(i<0){keep.push(it);return}
      let k=keep[i],o=it;if(richOf(o)>richOf(k)){keep[i]=o;o=k;k=keep[i]}
      ['memo','hw','goal','special'].forEach(f=>{if(!k[f]&&o[f])k[f]=o[f]});
      if(!k.mid&&o.mid){k.mid=o.mid;k.name=o.name;k.amb=0}

      if(!k.no&&o.no)k.no=o.no;if(o.sent)k.sent=true;if(o.done)k.done=true;n++});

}

function pdState(pd,se,vas){

function pdMap(m){

/* ===== 회차별 산책로 레이더 겹쳐보기 ===== */
const PRC=['#e8590c','#2f9e44','#1c7ed6','#9c36b5','#d6336c','#0ca678','#f08c00','#5c7cfa'];
const PRR={};
function prRows(src){
  const rows=[],mk=(key,lab,date,items)=>{const v={},c={};PKS.forEach(k=>v[k]=c[k]=0);const ex=[];
    items.forEach(x=>{const e=EX[x.id];if(!e||!PKS.includes(e.part))return;const ds=(x.sets||[]).filter(q=>q.done||(!q.tmp&&+q.r>0));if(!ds.length)return;v[e.part]+=vol(ds.map(q=>Object.assign({},q,{done:true})),x.id)||0;c[e.part]+=ds.length;ex.push(e.name)});

  if(src==='me'){allDates().sort().forEach(d=>mk(d,mdl(d),d,dayItems(d).filter(x=>x&&x.id&&x.sets)))}
  else{const m=AD().members.find(x=>x.id===src);if(!m)return rows;const ss=memSess(m);let n=0;
    Object.keys(ss).sort().forEach(d=>ss[d].forEach(it=>{n++;mk(d+'|'+(it.time||''),(it.no||n)+'회차',d,(it.slots||[]).filter(Boolean))}))}
  rows.forEach((r,i)=>r.c0=PRC[i%PRC.length]);return rows.slice(-12)}
function pathRadarInner(src){

  const key=st.mode,on=new Set(st.on),sh=rows.filter(r=>on.has(r.key)),last=sh.length?rows.indexOf(sh[sh.length-1]):-1;

  <div class="prcs">${chips}</div>${sh.length?`<svg viewBox="0 0 260 230" width="100%" role="img" aria-label="회차별 부위 레이더">${grid}${polys}${lab}</svg>`:''}${det}

function coreIds(slots){const sl=(slots||[]).filter(Boolean);if(sl.length<2||sl.length>4)return [];const st=sl.filter(x=>x.star).map(x=>x.id);if(st.length)return st.slice(0,2);return sl.map(x=>({id:x.id,v:(()=>{try{return vol(x.sets||[],x.id)}catch(e){return 0}})()})).sort((a,b)=>b.v-a.v).slice(0,2).map(x=>x.id)}

  else if(kind==='rec'){(arg||[]).slice().sort((a,b)=>a.session_date<b.session_date?-1:1).forEach(g=>(g.items||[]).filter(x=>x&&x.id&&EX[x.id]&&!EX[x.id].missing).forEach(x=>o.push({d:g.session_date,no:x.gno||0,x})))}
  else{allDates().sort().forEach(d=>dayItems(d).forEach(x=>{if(x&&x.id&&EX[x.id]&&!EX[x.id].missing)o.push({d,no:x.gno||0,x})}))}

function lkCardHTML(ent,key){

const LKS={};

/* 주간 운동량 (전적조회 회원 상세) */
const WKS={m:'n',s:'all'};
function wkKey(d){const t=new Date(d+'T00:00:00');t.setDate(t.getDate()-((t.getDay()+6)%7));return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function wkData(){
  const c=REC.cur,ss=REC.ss||[],mm=AD().members.find(x=>x.uid===c.id),pt=new Set();
  if(mm){const q=memSess(mm);Object.keys(q).forEach(d=>{if(q[d].some(it=>(it.slots||[]).some(Boolean)||nsTags(it).length||it.sent||it.done))pt.add(d)})}
  const cur=wkKey(T),keys=[];for(let i=7;i>=0;i--){const t=new Date(cur+'T00:00:00');t.setDate(t.getDate()-7*i);keys.push(t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'))}
  const mk=()=>keys.map(()=>({days:new Set(),v:0,t:0}));const out={all:mk(),pt:mk(),me:mk()};
  ss.forEach(g=>{const d=g.session_date,i=keys.indexOf(wkKey(d));if(i<0)return;let v=0;const ats=[];(g.items||[]).forEach(x=>{if(!x||!x.sets||!x.id||!EX[x.id])return;try{v+=vol(x.sets,x.id)||0}catch(e){}x.sets.forEach(s=>{if(s.done&&s.at)ats.push(+s.at)})});
    const any=(g.items||[]).some(x=>x&&(x.sets||[]).some(s=>s.done));if(!any)return;const tm=ats.length>1?Math.round((Math.max(...ats)-Math.min(...ats))/60000):0;
    [pt.has(d)?'pt':'me','all'].forEach(k=>{const w=out[k][i];w.days.add(d);w.v+=v;w.t+=tm})});
  Object.keys(out).forEach(k=>out[k]=out[k].map(w=>({n:w.days.size,t:w.t,v:Math.round(w.v)})));return{keys,out,hasPt:!!mm}}
const wkFmt=(k,x)=>k==='v'?(x>=1000?(Math.round(x/100)/10)+'k kg':x+'kg'):k==='t'?(x>=60?Math.floor(x/60)+'시간 '+(x%60?x%60+'분':''):x+'분'):x+'회';
const wkDl=(k,d)=>k==='v'?(Math.abs(d)>=1000?(Math.round(Math.abs(d)/100)/10)+'k kg':Math.abs(d)+'kg'):k==='t'?Math.abs(d)+'분':Math.abs(d)+'번';

  const ln=(k,nm)=>{const d=c[k]-p[k];return d===0?`· ${nm} 지난 주와 같아요.`:`· ${nm} 지난 주보다 ${wkDl(k,d)} ${d>0?'늘었어요':'줄었어요'}.`};
  return `[주간 운동 리포트] 이번 주는 오늘까지 기록으로 지난 주와 비교했어요.\n${ln('n','운동 횟수는')}\n${ln('t','운동 시간은')}\n${ln('v','운동 볼륨은')}\n${c.n<p.n?'이번 주 남은 날 한 번 더 움직여 볼까요? 😊':'꾸준히 잘 하고 계세요! 💪'}`}
function wkInner(){
  const D=wkData(),m=WKS.m,a=D.out[WKS.s].map(w=>w[m]),c=a[a.length-1],p=a[a.length-2],d=c-p,mx=Math.max(1,...a);
  const seg=(arr,key,cur)=>`<div class="seg" style="margin:6px 0">${arr.map(x=>`<button class="${cur===x[0]?'on':''}" data-act="${key}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`;
  return seg([['n','운동 횟수'],['t','운동 시간'],['v','볼륨']],'wkm',m)+seg([['all','전체 기록'],['pt','PT 수업만'],['me','개인 운동만']],'wks',WKS.s)+(WKS.s!=='all'&&!D.hasPt?'<div class="mu">이 회원은 내 회원 명부와 연결되지 않아 PT/개인 구분이 정확하지 않아요</div>':'')+
  `<div class="cmp3"><div><b>${wkFmt(m,c)}</b><span>이번 주 (진행 중)</span></div><div><b>${wkFmt(m,p)}</b><span>지난 주</span></div><div><b style="color:${d>=0?'#1f7a4d':'#d83a3f'}">${d>=0?'▲':'▼'} ${d===0?'변화 없음':wkDl(m,d)}</b><span>변화</span></div></div>
  <div class="wkch">${a.map((x,i)=>`<div class="${i===a.length-1?'cur':i===a.length-2?'prv':''}"><b>${m==='v'?(x/1000).toFixed(1)+'k':x}</b><i style="height:${Math.max(4,x/mx*85)}%"></i><small>${D.keys[i].slice(5).replace('-','/')}</small></div>`).join('')}</div>
  <div class="mu">최근 8주 · 월~일 기준 · 최근 기록 60회까지 불러와요</div>
  <div style="margin-top:10px"><b style="font-size:13px">✉️ 이번 주 리포트 보내기</b> <span class="mu">고쳐서 보낼 수 있어요</span></div><div class="wkmsg" id="wkmsg" contenteditable="true">${esc(wkMsg(D))}</div>

/* ===== 지난 길 탐색: 최근 4회 순서도 · 레이더 · 번호 팝업 · 종목별 기록 추이(티어) ===== */
const PXS={tab:'route',on:null,sel:null,tx:null,tm:'w',ctx:''};
const PXCOL=['#f1a98a','#2f9e44','#1c7ed6','#c98ad8'];
const PXAX=['back','chest','leg','core','shoulder','arm','cardio'];

const pxSets=x=>(x.sets||[]).map(q=>Object.assign({},q,{done:!!(q.done||(!q.tmp&&+q.r>0))}));
function pxAll(){

  if(S.mode==='admin'&&ADM.cur){const m=rscMem();if(!m)return out;const ss=memSess(m);
    Object.keys(ss).sort().forEach(d=>ss[d].forEach(it=>{if(it===ADM.cur||it.id===ADM.cur.id)return;if(d>ADM.date||(d===ADM.date&&(it.time||'')>=(ADM.cur.time||'')))return;

function pxCtx(){const c=(S.mode==='admin'&&ADM.cur)?'l'+ADM.cur.id:'me';if(PXS.ctx!==c){PXS.ctx=c;PXS.on=null;PXS.sel=null;PXS.tx=null}}

  const labs=PXAX.map((a,i)=>{const v=pt(i,1.2);return `<text x="${v[0]}" y="${v[1]}" text-anchor="middle" font-size="11" font-weight="700" fill="${PC[a]}">${P[a]}</text><text x="${v[0]}" y="${v[1]+12}" text-anchor="middle" font-size="9.5" fill="var(--mu)">${cnt[i]}개</text>`}).join('');

function pxTrend(){

  const i=+t.dataset.i;if(i!==RF){const x=draft().slots[RC],o=$('#hn'+RF);if(o)o.remove();RF=i;const w=t.closest('.sw');if(x&&w&&x.sets[i]&&x.sets[i].t!=='W')w.insertAdjacentHTML('afterend',zoneRow(x,i))}});

document.addEventListener('focusout',e=>{const t=e.target;if(!(t.matches&&t.matches('.r2 input')))return;if(t.dataset.prev!==undefined&&t.value===''&&t.classList.contains('tmp'))t.value=t.dataset.prev;delete t.dataset.prev;if(t.classList.contains('tmp'))t.placeholder=''});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('.r2 input.tmp')){t.classList.remove('tmp');delete t.dataset.prev;t.placeholder=''}},true);
/* 세트를 왼쪽으로 밀면 삭제 버튼 */
let swp=null,swSup=0,SMI=0;
const swClose=ex=>document.querySelectorAll('.sw.open,.sw.openr').forEach(x=>{if(x!==ex){x.classList.remove('open','openr');x.querySelector('.r2').style.transform=''}});
document.addEventListener('click',e=>{if(Date.now()-swSup<150){e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('.sw');if(!w||e.target.closest('.sdl,.smm'))return;swClose(w);swp={w,row:w.querySelector('.r2'),x:e.clientX,y:e.clientY,base:w.classList.contains('open')?-96:w.classList.contains('openr')?84:0,drag:false,cur:0}});
document.addEventListener('pointermove',e=>{if(!swp)return;const dx=e.clientX-swp.x,dy=e.clientY-swp.y;
  if(!swp.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){swp.drag=true;swp.row.style.transition='none';const a=document.activeElement;if(a&&a.blur)a.blur()}else{if(Math.abs(dy)>10)swp=null;return}}
  swp.cur=Math.max(-96,Math.min(84,swp.base+dx));swp.row.style.transform='translateX('+swp.cur+'px)'});
const swEnd=()=>{if(!swp)return;if(swp.drag){const o=swp.cur<-48,r=swp.cur>42;swp.row.style.transition='';swp.row.style.transform=o?'translateX(-96px)':r?'translateX(84px)':'';swp.w.classList.toggle('open',o);swp.w.classList.toggle('openr',r);swSup=Date.now()}swp=null};
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
setInterval(()=>{if(RT>0){RT--;const b=$('#rest');if(b)b.textContent=rtTxt()}},1000);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.st==='ex'){ST.ex=t.value;stRe();return}
  if(t.dataset.rk==='ex'){RK.ex=t.value;rkRows();return}
  if(t.dataset.sim!==undefined||t.dataset.simb!==undefined){const m=AD().members.find(x=>x.id===SIMM);if(!m)return;
    if(t.dataset.simb){m.body=m.body||{};const k=t.dataset.simb,v=t.value;m.body[k]=k==='sex'?v:(v===''?(k==='bf'?null:undefined):+v);persist();m.sim.forEach((r,i)=>{const e2=document.getElementById('simr'+i);if(e2)e2.innerHTML=simRes(m,r)});return}
    const [i,k]=t.dataset.sim.split('|'),r=m.sim[+i];if(!r)return;r[k]=k==='id'?t.value:(t.value===''?'':+t.value);persist();const e2=document.getElementById('simr'+i);if(e2)e2.innerHTML=simRes(m,r);return}
  if(t.dataset.pf){OB[t.dataset.pf]=t.value;obRefresh();return}
  if(t.id==='recq'){REC.q=t.value;clearTimeout(REC.tm);REC.tm=setTimeout(async()=>{REC.feed=null;REC.members=null;await recLoad(false);const e=$('#recq');if(e){e.focus();try{e.setSelectionRange(e.value.length,e.value.length)}catch(x){}}},350);return}
  if(t.id==='mpq'){MP.q=t.value;const l=$('#mpl');if(l)l.innerHTML=mpList();return}
  if(t.id==='fq'){FQ=t.value;const l=$('#fqr'),r=$('#fqrec'),h=fqHTML(draft());if(r){if(FQ.trim()){if(l)l.innerHTML=h;r.innerHTML=''}else{if(l)l.innerHTML='';r.innerHTML=h}}else if(l)l.innerHTML=h;return}
  if(t.id==='mq'){MQ=t.value;const l=$('#mqr');if(l)l.innerHTML=mqHTML();return}
  if(t.id==='msq'){MSQ=t.value;const l=$('#mlist');if(l)l.innerHTML=memRowsHTML();return}
  if(t.id==='pq'){PK.q=t.value;pickList();return}
  if(t.id==='pm'){PK.m=t.checked;pickList();return}
  if(t.id==='ad'){ADM.date=t.value||T;render();return}
  const af=t.dataset.af;
  if(af){ADM.cur[af]=af==='no'?(Number(t.value)||0):t.value;if(af==='hw')ADM.cur.hwDone=false;if(af==='special')ADM.cur.spDone=false;if(af==='memo'){try{compileLesson(ADM.cur)}catch(e){}}if(af==='name'){ADM.cur.mid=null;$('#sug').innerHTML=sugHTML()}persist();return}
  if(t.dataset.pr!==undefined){const r=PZ.rows[+t.dataset.pr];if(r)r.pick=t.value;return}
  if(t.dataset.hp){S.hp=S.hp||{};if(t.value==='')delete S.hp[t.dataset.hp];else S.hp[t.dataset.hp]=+t.value;persist();const sm=t.closest('details').querySelector('summary .mu'),n=Object.keys(S.hp).length;if(sm)sm.textContent=n?n+'곳 설정됨':'전체 설정 따름';return}
  if(t.id==='hope'){S.hopeTier=t.value===''?null:+t.value;persist();saveHope();const hd=t.closest('.pn').querySelector('.row .mu');if(hd)hd.textContent=S.hopeTier==null?'자동 (내 현재 티어)':'희망 '+window.RuneTier.TIERS[S.hopeTier];return}
  if(t.id==='rvt'){S.reviews=S.reviews||{};const r=S.reviews[T]||(S.reviews[T]={r:0,t:''});r.t=t.value;persist();return}
  if(t.dataset.act==='dauto'){S.autoSend=t.checked;persist();return}
  if(t.dataset.rg){const [id,a,f]=t.dataset.rg.split('|'),m=AD().members.find(x=>x.id===id);if(m){
      if(a==='n0'){if(t.value==='')delete m.n0;else m.n0=Math.max(0,Math.floor(+t.value)||0)}
      else if(a==='since'){if(t.value)m.since=t.value;else delete m.since}
      else{const r=(m.reg||[])[+a];if(r){if(f==='n'){if(t.value==='')delete r.n;else r.n=Math.max(0,Math.floor(+t.value)||0)}else r.d=t.value}}
      persist();const s2=togetherTxt(m);document.querySelectorAll(`[data-rgt="${id}"]`).forEach(e=>e.textContent=s2||'미기록');document.querySelectorAll(`[data-rgs="${id}"]`).forEach(e=>e.textContent=s2)}return}
  if(t.dataset.rm){const [id,ym,f]=t.dataset.rm.split('|'),m=AD().members.find(x=>x.id===id);if(m){m.rm=m.rm||{};const r=m.rm[ym]||(m.rm[ym]={});if(t.value==='')delete r[f];else r[f]=Math.max(0,Math.floor(+t.value)||0);if(!Object.keys(r).length)delete m.rm[ym];if(!Object.keys(m.rm).length)delete m.rm;
    const x=rmCalc(m,ym,rmDone(ym));document.querySelectorAll(`[data-rs="${id}"]`).forEach(e=>e.innerHTML=rmBadge(x));document.querySelectorAll(`[data-rx="${id}"]`).forEach(e=>e.textContent=x.exp==null?'-':x.exp);persist()}return}
  if(t.dataset.mf){const m=AD().members.find(x=>x.id===t.dataset.mf);if(m){m.focus=t.value;persist()}return}
  if(t.dataset.hx){const x=draft().slots[RC];if(x){S.hx=S.hx||{};if(t.value==='')delete S.hx[x.id];else S.hx[x.id]=+t.value;persist();recRe()}return}
  if(t.dataset.sm){const x=draft().slots[RC],st=x&&x.sets[SMI];if(st){const v=t.value.trim();if(v)st.memo=t.value;else delete st.memo;persist()}return}
  if(t.dataset.nf){t.style.height='auto';t.style.height=Math.min(t.scrollHeight+2,window.innerHeight*.5)+'px';const x=draft().slots[RC];if(x){x[t.dataset.nf]=t.value;persist()}return}
  if(!t.dataset.f)return;
  const s=draft().slots[RC].sets[+t.dataset.i];
  if(t.dataset.f==='v'){s.v=t.value;persist();return}
  if(t.dataset.f==='g'){s.g=Math.max(0,Number(t.value)||0);persist();const e=$('#fgs'+t.dataset.i);if(e)e.innerHTML=fgTxt(s);return}
  if(s.tr===undefined)s.tr=s.tmp?1:0;
  if(t.dataset.f==='done'){s.done=t.checked;if(t.checked){s.at=Date.now();s.tmp=0;s.tr=0}else delete s.at}else{s[t.dataset.f]=Math.max(0,Number(t.value)||0);if(t.dataset.f==='w'||t.dataset.f==='w2')s.tmp=0;else s.tr=0}
  if(!s.tmp){t.closest('.r2').querySelectorAll('input[data-f=w].tmp,input[data-f=w2].tmp').forEach(g=>g.classList.remove('tmp'))}
  if(!s.tr){t.closest('.r2').querySelectorAll('input[data-f=r].tmp,input[data-f=r2].tmp').forEach(g=>g.classList.remove('tmp'))}
  persist();const rv=$('#rv');if(rv)rv.textContent=fmt(vol(draft().slots[RC].sets,draft().slots[RC].id));
  if(t.dataset.f==='r'&&s.t==='F'){const a=$('#fgr'+t.dataset.i),b=$('#fgs'+t.dataset.i);if(a)a.textContent=s.r;if(b)b.innerHTML=fgTxt(s)}
  if(t.dataset.f==='w'||t.dataset.f==='r'){const hn=$('#hn'+t.dataset.i);if(hn)hn.innerHTML=zoneInner(draft().slots[RC],+t.dataset.i)}
});
$('#md').addEventListener('click',e=>{if(e.target.id!=='md')return;if(ADM.pop&&$('#md').querySelector('[data-edit]'))A.aback();else A.close()});
initAuth();
applyTheme(themeMode());
render();
</script>
