<style>

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}

code{font-size:11px;background:var(--bg);padding:1px 4px;border-radius:4px}

.chip.on{background:var(--gd);color:#fff;border-color:var(--gd)}

  background:linear-gradient(180deg,#34c777 0%,#17863f 100%);box-shadow:0 0 0 4px rgba(52,199,119,.18),0 14px 34px rgba(23,134,63,.45);font-weight:900}

.admbox small{display:block;font-size:10px;font-weight:700;opacity:.9}
.lo{position:fixed;left:14px;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:30;border:0;background:transparent;color:var(--mu);font-size:12px;text-decoration:underline}

<div id="app"></div>

<script>
/* ===== 티어 코어 (rune-tier-core.js) ===== */
/* 룬PT 티어 코어 — DOM·네트워크 없는 순수 계산 모듈 (확정 규칙: tier-promotion-spec.md)
   브라우저: window.RuneTier / Node: module.exports */
(function (root) {
  'use strict';

  /* ---------- 티어·별·MP ---------- */
  const TIERS = ['아이언', '브론즈', '실버', '골드', '플래티넘', '에메랄드', '다이아몬드', '마스터', '그랜드마스터', '챌린저'];
  const TIER_ID = ['iron', 'bronze', 'silver', 'gold', 'platinum', 'emerald', 'diamond', 'master', 'grandmaster', 'challenger'];
  // 별 1개의 폭(MP). 초반은 1~2세션, 후반은 인내가 필요하도록 설계: 1성당 표준 세션 수 = 1/1.5/2/3/4/5.5/6.5/10/12/14
  // (표준 세션 = 메인 4세트 x 8회, 해당 티어 기준 무게의 70%, 벤치 75kg 남성 기준. 세트·무게가 많으면 더 빨리 쌓임)
  const WIDTH = [220, 420, 730, 1430, 2240, 3390, 4730, 8400, 11760, 15680]; // 챌린저는 승급이 없어 별 표시용
  const START = [0]; WIDTH.forEach((w, i) => { if (i < WIDTH.length - 1) START.push(START[i] + 5 * w); }); // 티어 시작 = 앞 티어 5성 폭의 합
  // 티어 수준 안내(추정): l = 비슷한 나이·성별·체격의 헬스 이용자 중 상위 %, g = 일반 성인 중 상위 %
  // 근거가 약한 가이드값이에요(공개 근력 기준표 기반 추정). 앱 회원 기록이 쌓이면 실제 분포로 교정해요.
  const TIER_RANK = [
    { n: '운동을 시작한 단계예요' }, { n: '기초 체력을 만든 단계예요', g: 50 },
    { l: 80, g: 43 }, { l: 65, g: 32 }, { l: 50, g: 20 }, { l: 40, g: 10 }, { l: 30, g: 6 }, { l: 20, g: 3 }, { l: 7, g: 0.5 }, { l: 3, g: 0.1 }
  ];
  function rankLine(tier) {
    const r = TIER_RANK[Math.max(0, Math.min(9, tier | 0))], pc = (v) => '상위 약 ' + v + '%';
    if (r.l == null) return r.g != null ? r.n + ' · 일반 성인 중 ' + pc(r.g) + ' 수준' : r.n;
    return '헬스 이용자 중 ' + pc(r.l) + ' · 일반 성인 중 ' + pc(r.g);
  }
  const MAX_STARS = 8, PROMO_STARS = 5, MAX_CARRY = 3;
  const CARRY_MAX_BY_TIER = { 6: 1, 7: 0, 8: 0 };   // 다이아→마스터 1성, 마스터→그마·그마→챌린저는 이월 없음 (마의 구간)
  const MULT = { beginner: 1, intermediate: 3, advanced: 6.5 };   // 레벨 버튼은 없앴고 내부 계수는 중급(3)으로 고정해서 써요
  const FLOOR_PCT = 0.5, BONUS_PCT = 0.85, BONUS = 1.3;  // 기준 1RM의 50% 미만 세트는 MP 제외, 85% 이상은 1.3배

  const multOf = (level, personal) => (personal > 0 ? personal : MULT[level] || 1);
  const capMP = (tier) => START[tier] + MAX_STARS * WIDTH[tier];
  const starsOf = (mp, tier) => Math.max(0, Math.min(MAX_STARS, Math.floor((mp - START[tier]) / WIDTH[tier] + 1e-9)));
  const toKg = (mp, mult) => mp * mult; // 화면 표시용: 현재 배율 기준 kg

  /* 세트 목록의 완료 볼륨(웜업 제외) */
  const volOf = (sets, ref1rm) => (sets || []).reduce((a, s) => {
    if (!(s && s.done && s.t !== 'W')) return a;
    const w = +s.w || 0, v = w * (+s.r || 0);
    if (!(ref1rm > 0)) return a + v;
    const p = w / ref1rm;
    return a + (p < FLOOR_PCT ? 0 : p >= BONUS_PCT ? v * BONUS : v);
  }, 0);

  /* ---------- 종목 마스터 ---------- */
  // kind: barbell | machine | dumbbell | body    quest: 'trainer'(바벨, 트레이너 부여·승인) | 'auto'(머신·덤벨, 우편함 자동)
  // role: head(왕룬) | aux(바벨 보조) | follower(머신·덤벨 등)   maxTier: 챌린저 9 / GM 8 / 마스터 7
  // base: 남성 1RM 기준 체중배수, 브론즈(티어 1)부터. 없으면 트레이너가 무게를 직접 설정
  // 20% 안(2026-11-08): 브론즈·에메랄드 기준은 그대로, 사이(실버·골드·플래티넘)는 약 20% 간격으로 재배치. 아이언은 브론즈의 1/1.2
  const IRON_RATIO = 1 / 1.2;
  const BASE = {
    squat: [.75, .91, 1.11, 1.35, 1.65, 1.8, 2, 2.25, 2.5],
    bench: [.5, .61, .74, .9, 1.1, 1.3, 1.5, 1.75, 2],
    deadlift: [1, 1.19, 1.41, 1.68, 2, 2.2, 2.4, 2.6, 2.8],
    ohp: [.35, .42, .51, .62, .75, .85, .95, 1.05, 1.2],
    bbrow: [.5, .59, .69, .81, .95, 1.05, 1.15, 1.3, 1.4],
    bbcurl: [.3, .36, .44, .54, .65, .72, .8, .88],
    latpull: [.475, .56, .655, .77, .9, 1, 1.09],
    cablerow: [.6, .7, .81, .95, 1.1, 1.25, 1.35],
    dbfly: [.24, .29, .36, .43, .53, .6, .67],
    chestfly: [.3, .37, .46, .57, .7, .8, .9],
    reardelt: [.2, .25, .32, .41, .52, .6, .68]
  };
  const REPS = {
    main: [12, 12, 10, 5, 7, 3, 1, 20, 1],
    deadlift: [12, 12, 10, 5, 7, 3, 1, 10, 1],
    pull: [15, 12, 10, 5, 12, 5, 12, 20, 5],     // 바벨로우(5회·12회 섞음, 챌린저 5RM)
    curl: [15, 15, 10, 5, 15, 5, 5, 20],          // 바벨컬·라잉 트라이셉스 (GM까지)
    upperMD: [15, 20, 10, 30, 20, 20, 20],
    lat: [15, 20, 15, 20, 20, 20, 20],            // 랫풀다운(골드 15·플래티넘 20: 무게가 줄지 않도록)
    legMD: [15, 20, 20, 30, 20, 25, 20],
    pullup: [15, 12, 10, 8, 5, 8, 12, 15, 10]    // 풀업·어시스티드 풀업 한 줄(챌린저는 가중 10회)
  };

  const E = (id, name, o) => Object.assign({ id, name, kind: 'machine', role: 'follower', quest: 'auto', maxTier: 7, head: null, region: 'upper', reps: 'upperMD', base: null }, o);
  const EXERCISES = [
    // 왕룬(헤드) — 바벨 주력 5종, 챌린저까지
    E('squat', '스쿼트', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, region: 'lower', reps: 'main', base: BASE.squat }),
    E('bench', '벤치프레스', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'main', base: BASE.bench }),
    E('deadlift', '데드리프트', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, region: 'lower', reps: 'deadlift', base: BASE.deadlift }),
    E('ohp', '오버헤드 프레스', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'main', base: BASE.ohp }),
    E('bbrow', '바벨 로우', { kind: 'barbell', role: 'head', quest: 'trainer', maxTier: 9, reps: 'pull', base: BASE.bbrow }),
    // 바벨 보조 — GM까지 (헤드 격차 규칙은 적용하지 않음: 바벨은 트레이너 승인 구조)
    E('bbcurl', '바벨 컬', { kind: 'barbell', role: 'aux', quest: 'trainer', maxTier: 8, reps: 'curl', base: BASE.bbcurl }),
    E('lyingtri', '라잉 트라이셉스 익스텐션', { kind: 'barbell', role: 'aux', quest: 'trainer', maxTier: 8, reps: 'curl', base: BASE.bbcurl }),
    // 머신·덤벨 — 마스터까지, 헤드 티어 +1 제한
    E('legpress_plate', '레그프레스', { head: 'squat', region: 'lower', reps: 'legMD', equip: 'plate' }),
    E('legpress_pin', '시티드 레그프레스', { head: 'squat', region: 'lower', reps: 'legMD', equip: 'pin' }),
    E('lunge', '런지', { kind: 'dumbbell', head: 'squat', region: 'lower', reps: 'legMD' }),
    E('pushup', '푸시업', { kind: 'body', head: 'bench' }),
    E('dbfly', '체스트 플라이', { kind: 'dumbbell', head: 'bench', base: BASE.dbfly }),
    E('chestfly', '펙덱 플라이', { head: 'bench', base: BASE.chestfly }),
    E('latpull', '랫풀다운', { head: 'bbrow', base: BASE.latpull, reps: 'lat' }),
    E('cablerow', '시티드 케이블 로우', { head: 'bbrow', base: BASE.cablerow }),
    E('reardelt', '리버스 펙덱', { head: 'bbrow', base: BASE.reardelt }),
    // 풀업 줄: 풀업(맨몸·가중)과 어시스티드 풀업 머신이 같은 티어를 공유. 투구 슬롯. 마스터 이상 승급은 트레이너 확인
    E('pullup', '풀업', { kind: 'body', head: 'bbrow', maxTier: 9, reps: 'pullup' }),
    // 5km 달리기: 신발 슬롯. 시간 기준(RUN_SEC), 트레이너 확인
    E('run5k', '5km 달리기', { kind: 'run', role: 'aux', quest: 'trainer', maxTier: 9, region: 'lower', reps: null })
  ];
  const BY_ID = {}; EXERCISES.forEach((e) => (BY_ID[e.id] = e)); BY_ID.assistpull = BY_ID.pullup; // 옛 카탈로그 호환

  /* 앱 종목명 → 마스터 id / 헤드 연결 (앱의 EX 목록과 이름으로 연결, 신규 종목 추가에도 안전) */
  const NAME_TO_ID = { '스쿼트': 'squat', '벤치프레스': 'bench', '데드리프트': 'deadlift', '오버헤드 프레스': 'ohp', '바벨 로우': 'bbrow', '바벨 컬': 'bbcurl', '라잉 트라이셉스 익스텐션': 'lyingtri', '스컬크러셔': 'lyingtri',
    '레그프레스': 'legpress_plate', '시티드 레그프레스': 'legpress_pin', '런지': 'lunge', '푸시업': 'pushup', '체스트 플라이': 'dbfly', '펙덱 플라이': 'chestfly',
    '랫풀다운': 'latpull', '시티드 케이블 로우': 'cablerow', '리버스 펙덱': 'reardelt', '어시스티드 풀업 머신': 'pullup', '풀업': 'pullup' };
  // 마스터에 수치가 없는 종목: 헤드만 연결(무게는 트레이너 설정). 힌지 계열 → 데드, 숄더 → OHP, 가슴 프레스 → 벤치, 당기기 → 로우, 무릎계 → 스쿼트
  const HEAD_BY_NAME = {
    '인클라인 덤벨프레스': 'bench', '케이블 크로스오버': 'bench', '딥스': 'bench', '체스트 프레스 머신': 'bench', '인클라인 체스트 프레스 머신': 'bench', '스미스 머신 벤치프레스': 'bench', '디클라인 체스트 프레스 머신': 'bench',
    '원암 덤벨 로우': 'bbrow', '시티드 로우 머신': 'bbrow', 'T바 로우 머신': 'bbrow', '풀오버 머신': 'bbrow', '하이 로우 머신': 'bbrow', '페이스 풀': 'bbrow', '리어델트 플라이': 'bbrow',
    '루마니안 데드리프트': 'deadlift', '레그 컬': 'deadlift', '힙 쓰러스트': 'deadlift', '백 익스텐션 머신': 'deadlift',
    '레그 익스텐션': 'squat', '핵 스쿼트 머신': 'squat', '스미스 머신 스쿼트': 'squat',
    '숄더 프레스 머신': 'ohp', '스미스 머신 숄더 프레스': 'ohp', '사이드 레터럴 레이즈': 'ohp', '프론트 레이즈': 'ohp', '사이드 레터럴 레이즈 머신': 'ohp', '케이블 사이드 레터럴 레이즈': 'ohp', '슈러그 머신': 'ohp'
  };
  const BARBELL_NAMES = new Set(['루마니안 데드리프트']);

  /* 종목명(+앱 정보) → 마스터 메타. 마스터에 없으면 일반 머신·덤벨 규칙(마스터까지, 무게는 트레이너 설정) */
  function metaFor(name, opts) {
    opts = opts || {};
    const id = NAME_TO_ID[name];
    if (id) return BY_ID[id];
    const head = HEAD_BY_NAME[name] || null;
    const bb = BARBELL_NAMES.has(name);
    return E('x:' + name, name, Object.assign({ kind: bb ? 'barbell' : (opts.machine ? 'machine' : 'dumbbell'), quest: bb ? 'trainer' : 'auto', head, region: opts.region || 'upper', generic: true }, GENERIC_OVR[name] || {}));
  }

  /* ---------- 카탈로그 적용 (종목 추가·변경을 코드 배포 없이) ----------
     rows: [{ id, name, tier?: { core?, head?, kind?, quest?, role?, region?, maxTier?, reps? }, std?: { version, base:[…] } }]
     · tier.core 가 있으면 코어 마스터(squat 등)와 연결 — 이름이 바뀌어도 연결이 유지돼요.
     · 코어에 없는 종목은 일반 머신·덤벨 규칙 + tier 값으로 덮어써요(GENERIC_OVR).
     · 잘못된 값은 건너뛰고 rejected 로 돌려줘요(앱이 멈추지 않게). 여러 번 호출해도 같은 결과(멱등). */
  const GENERIC_OVR = {};
  const DEFAULTS = {
    base: JSON.parse(JSON.stringify(BASE)), nameToId: Object.assign({}, NAME_TO_ID), headByName: Object.assign({}, HEAD_BY_NAME),
    ex: EXERCISES.map((e) => Object.assign({}, e)), barbell: Array.from(BARBELL_NAMES)
  };
  const validBase = (b) => Array.isArray(b) && b.length >= 1 && b.length <= 9 && b.every((v, i) => typeof v === 'number' && v > 0 && v < 10 && (i === 0 || v > b[i - 1]));
  function applyCatalog(rows) {
    const rejected = [];
    // 1) 기본값으로 되돌린 뒤 덮어써요
    Object.keys(BASE).forEach((k) => delete BASE[k]); Object.keys(DEFAULTS.base).forEach((k) => (BASE[k] = DEFAULTS.base[k].slice()));
    Object.keys(NAME_TO_ID).forEach((k) => delete NAME_TO_ID[k]); Object.assign(NAME_TO_ID, DEFAULTS.nameToId);
    Object.keys(HEAD_BY_NAME).forEach((k) => delete HEAD_BY_NAME[k]); Object.assign(HEAD_BY_NAME, DEFAULTS.headByName);
    Object.keys(GENERIC_OVR).forEach((k) => delete GENERIC_OVR[k]);
    BARBELL_NAMES.clear(); DEFAULTS.barbell.forEach((n) => BARBELL_NAMES.add(n));
    EXERCISES.length = 0; DEFAULTS.ex.forEach((e) => EXERCISES.push(Object.assign({}, e, { base: e.base && e.base.slice() })));
    EXERCISES.forEach((e) => { if (e.base && DEFAULTS.base[e.id]) e.base = BASE[e.id]; });
    Object.keys(BY_ID).forEach((k) => delete BY_ID[k]); EXERCISES.forEach((e) => (BY_ID[e.id] = e)); BY_ID.assistpull = BY_ID.pullup;
    // 2) 행 적용 (같은 이름이 여러 행이면 정렬 앞쪽이 우선)
    (rows || []).forEach((r) => {
      if (!r || !r.id || !r.name) return;
      if (r.status && r.status !== 'active') return; // 숨김·폐기·병합 종목은 연결하지 않아요(기록 표시는 앱 쪽 EX 가 담당)
      const t = r.tier || {};
      const std = r.std && r.std.base != null ? r.std : null;
      if (std && !validBase(std.base)) { rejected.push({ id: r.id, reason: '기준표(체중배수)가 올바르지 않아요: 1~9개, 0보다 크고 올라가는 숫자' }); }
      const base = std && validBase(std.base) ? std.base.slice() : null;
      if (t.maxTier != null && !(t.maxTier >= 1 && t.maxTier <= 9)) { rejected.push({ id: r.id, reason: 'maxTier 범위 밖' }); return; }
      if (t.reps != null && !REPS[t.reps]) { rejected.push({ id: r.id, reason: '알 수 없는 반복 기준: ' + t.reps }); return; }
      if (t.head != null && !(DEFAULTS.ex.some((e) => e.id === t.head && e.role === 'head') || BY_ID[t.head])) { rejected.push({ id: r.id, reason: '연결할 왕룬 종목이 없어요: ' + t.head }); return; }
      if (t.core) {
        const ex = BY_ID[t.core];
        if (!ex) { rejected.push({ id: r.id, reason: '코어 종목 없음: ' + t.core }); return; }
        NAME_TO_ID[r.name] = t.core;
        if (base) { BASE[t.core] = base; ex.base = base; }
        ['maxTier', 'reps', 'quest', 'region'].forEach((k) => { if (t[k] != null) ex[k] = t[k]; });
        ex.stdVersion = std ? std.version : ex.stdVersion;
      } else {
        const o = {};
        ['head', 'kind', 'quest', 'role', 'region', 'maxTier', 'reps'].forEach((k) => { if (t[k] != null) o[k] = t[k]; });
        if (base) o.base = base;
        if (std) o.stdVersion = std.version;
        if (t.head) HEAD_BY_NAME[r.name] = t.head;
        if (t.kind === 'barbell') BARBELL_NAMES.add(r.name);
        if (Object.keys(o).length) GENERIC_OVR[r.name] = o;
      }
    });
    return { rejected };
  }

  /* ---------- 진행도 계산 ---------- */
  // 진행 상태 = { tier, baseMp, sinceDate }  (승급 때 baseMp=시작점+이월별×폭, sinceDate=승급일 다음 날)
  // mp = baseMp + Σ(since 이후 세션 볼륨 ÷ 그날 배율) → 같은 날 저장을 여러 번 해도 중복 집계되지 않아요
  const newState = () => ({ tier: 0, baseMp: 0, sinceDate: '0000-00-00' });

  function progressOf(state, sessions, multAt, exId, refFn) {
    const ref = refFn ? refFn(state.tier) : null; // 기준 1RM(kg): 없으면 가벼운 세트 제외·무거운 세트 보너스를 적용하지 않아요
    // sessions: { 'YYYY-MM-DD': [{exId, sets}] } 형태가 아니라 호출부에서 exId별 [{date, sets}] 로 넘겨도 되도록 두 모양 지원
    let add = 0;
    const list = Array.isArray(sessions) ? sessions : [];
    for (const r of list) {
      if (r.date < state.sinceDate) continue;
      add += volOf(r.sets, ref) / (multAt(r.date) || 1);
    }
    const cap = capMP(state.tier);
    const mp = Math.min(cap, state.baseMp + add);
    const stars = starsOf(mp, state.tier);
    const into = mp - START[state.tier] - Math.min(stars, MAX_STARS) * WIDTH[state.tier];
    return { tier: state.tier, mp, stars, toNext: stars >= MAX_STARS ? 0 : WIDTH[state.tier] - into, pct: stars >= MAX_STARS ? 1 : into / WIDTH[state.tier], atCap: mp >= cap };
  }

  function carryOf(stars, fromTier) { const cap = fromTier != null && CARRY_MAX_BY_TIER[fromTier] != null ? CARRY_MAX_BY_TIER[fromTier] : MAX_CARRY; return Math.max(0, Math.min(cap, stars - PROMO_STARS)); }

  /* 승급 가능/잠김 판정 (퀘스트 수락·수행 여부는 3단계에서 별도 확인) */
  function promoStatus(ex, prog, headTierOf, subHeadOf) {
    if (prog.tier >= ex.maxTier) return { state: 'max', reason: '이 종목의 최고 티어예요' };
    if (prog.stars < PROMO_STARS) return { state: 'notyet', reason: `5성부터 승급 퀘스트가 열려요 (${prog.stars}/5)` };
    const lim = headLimit(ex, headTierOf, subHeadOf);
    if (lim && prog.tier + 1 > lim.maxTier) return { state: 'locked', reason: `${lim.headName} 티어가 ${TIERS[lim.headTier]}라서 ${TIERS[lim.maxTier]}까지만 올릴 수 있어요`, head: lim.headId };
    return { state: 'ready', reason: ex.quest === 'trainer' ? '승급 미션을 요청할 수 있어요' : '승급 퀘스트가 우편함에 도착해요' };
  }

  /* 헤드 격차 규칙: 머신·덤벨은 연결된 왕룬 티어 +1까지. 기록 없는 헤드는 아이언. 트레이너가 대체 헤드 지정 가능 */
  function headLimit(ex, headTierOf, subHeadOf) {
    if (ex.role !== 'follower' || !ex.head) return null;
    const headId = (subHeadOf && subHeadOf(ex.id)) || ex.head;
    const headTier = headTierOf(headId) || 0;
    return { headId, headName: (BY_ID[headId] || { name: headId }).name, headTier, maxTier: Math.min(ex.maxTier, headTier + 1) };
  }

  function promote(state, stars, today, tbl) {
    const t = state.tier + 1, c = carryOf(stars, state.tier), ST = tbl ? tbl.START : START, WD = tbl ? tbl.WIDTH : WIDTH;
    const d = new Date(today + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + 1);
    return { tier: t, baseMp: ST[t] + c * WD[t], sinceDate: d.toISOString().slice(0, 10), carry: c };
  }

  /* ---------- 승급 목표(반복수·무게) ---------- */
  const RM = [[1, 1.0], [3, .93], [5, .87], [7, .82], [8, .80], [10, .75], [12, .70], [15, .66], [20, .60], [25, .55], [30, .50]];
  function rmPct(reps) {
    if (reps <= 1) return 1;
    for (let i = 1; i < RM.length; i++) {
      if (reps <= RM[i][0]) { const [r0, p0] = RM[i - 1], [r1, p1] = RM[i]; return p0 + (p1 - p0) * (reps - r0) / (r1 - r0); }
    }
    return RM[RM.length - 1][1];
  }
  function repsForPct(pct) { // rmPct 역함수(반올림)
    if (pct >= 1) return 1;
    for (let i = 1; i < RM.length; i++) {
      if (pct >= RM[i][1]) { const [r0, p0] = RM[i - 1], [r1, p1] = RM[i]; return Math.round(r0 + (r1 - r0) * (p0 - pct) / (p0 - p1)); }
    }
    return 30;

    const v = (sess.sets || []).map(setE1).filter(Boolean);
    return v.length ? Math.max.apply(null, v) : null;
  }
  // 최근 3~4세션 기록으로 현재 기준(e1RM) 추정. 로우컨디션 세션은 일부러 가볍게 한 것이라 제외
  function estimate(history) {
    const use = (history || []).filter((h) => h.mode !== 'low').slice(-4);
    const es = use.map(sessionE1).filter(Boolean);
    if (!es.length) return null;
    const top = es.slice().sort((a, b) => b - a).slice(0, es.length >= 3 ? 3 : es.length); // 컨디션 나쁜 하루는 버림
    let e = top.reduce((a, b) => a + b, 0) / top.length;
    const last = use[use.length - 1];
    const planned = (last.sets || []).filter((s) => s.pr);
    if (planned.length && planned.every((s) => s.done && s.r >= s.pr)) e *= BUMP; // 점진 과부하
    return Math.round(e * 10) / 10;
  }
  // 배치고사: 워밍업 후 여유 1~2회 남기고 한 세트(3~12회) → 기준 추정
  const fromTest = (w, r) => (w > 0 && r >= 3 && r <= 12 ? Math.round(w / (T.rmPct(r) * 0.97) * 10) / 10 : null);

  /* 오늘의 추천 모드 */
  function recommend(ctx) { // ctx: { lowCondition, lastMode, questReady }
    if (ctx.lowCondition) return { mode: 'low', why: '컨디션이 낮은 날이에요. 부담 없이 움직이는 쪽을 권해요' };
    if (ctx.questReady) return { mode: 'strength', why: '승급 시험이 열려 있어요. 기록 무게를 다지는 쪽을 권해요' };
    if (ctx.lastMode === 'volume') return { mode: 'strength', why: '지난번 볼륨형 다음엔 힘을 다지는 날을 권해요' };
    return { mode: 'volume', why: '숙련도와 운동감을 쌓는 볼륨형을 권해요' };
  }

  /* 한 종목의 오늘 루틴. e1rm: 추정 1RM(kg), opts: { step, age, topReps(스트렝스 상단 반복, 기본 5) } */
  function plan(mode, e1rm, opts) {
    opts = opts || {}; const M = MODES[mode]; if (!M || !(e1rm > 0)) return null;
    const step = opts.step || 2.5, age = opts.age == null ? 30 : opts.age, notes = [];
    let reps = M.reps.slice();
    if (mode === 'strength') {
      const top = Math.min(5, opts.topReps || 5);
      reps = reps.map((r, i) => (i < 3 ? top : r));
    }
    reps = reps.map((r) => T.safeReps(r, age, 1).reps);
    const sets = reps.map((r, i) => {
      const f = mode === 'low' ? 1 : EFFORT; // 로우컨디션은 15RM 무게 그대로 10회
      const base = mode === 'low' ? T.rmPct(15) : T.rmPct(r);
      return { n: i + 1, r, w: roundStep(e1rm * base * f, step), pr: r };
    });
    return { mode, name: M.name, note: M.note, sets, optional: M.optional.slice(), notes };
  }

  /* MP에 반영되는 세트 볼륨 (코어 규칙과 동일: 1RM 50% 미만 제외·85% 이상 1.3배) */
  const mpVolume = (sets, e1rm) => T.volOf(sets, e1rm);

  /* 티어·별·체격으로 시작 기준(추정 1RM, kg)과 목표선을 계산.
     tier: 현재 티어(0 아이언 ~ 9), stars: 현재 별(0~8). 체중·체지방률·키·성별·나이는 targetFor와 같은 보정을 사용.
     기준선 = 현재 티어 시험 기준(그 티어를 통과한 수준)에서 다음 티어 시험 기준까지, 별 5개를 채울수록 가까워짐 */
  function std1RM(ex, tierN, member) { // 티어 tierN(1~)의 1RM 기준 kg, 없으면 null
    if (!ex.base || tierN < 1 || tierN > ex.base.length) return null;
    const age = member.age == null ? 30 : member.age;
    return member.bodyKg * T.bodyFactor(member) * ex.base[tierN - 1] * T.sexCoef(member.sex, ex) * T.ageCoef(age, 1);
  }
  /* MP 계산용 기준 1RM: 현재 티어를 통과한 수준의 체격 보정 기준(아이언은 브론즈의 1/1.2). 기준표 없는 종목·체중 없음은 null */
  function refFor(ex, tier, member) {
    if (!ex || !ex.base || !member || !member.bodyKg) return null;
    const v = tier >= 1 ? std1RM(ex, tier, member) : (std1RM(ex, 1, member) || 0) * T.IRON_RATIO;
    return v > 0 ? v : null;
  }
  function seed(ex, tier, stars, member) {
    const cur = tier >= 1 ? std1RM(ex, tier, member) : (std1RM(ex, 1, member) || 0) * T.IRON_RATIO;
    const next = std1RM(ex, tier + 1, member);
    if (cur == null || !member || !member.bodyKg) return null;
    const frac = Math.min(1, (stars || 0) / 5);
    const e = next == null ? cur : cur + (next - cur) * frac;
    return { e1rm: Math.round(e * 10) / 10, from: Math.round(cur * 10) / 10, goal: next == null ? null : Math.round(next * 10) / 10, frac,
             bodyFactor: Math.round(T.bodyFactor(member) * 1000) / 1000, basis: T.bodyBasis(member) };
  }
  /* 오늘 쓸 기준: 기록이 없으면 티어·별·체격에서 구한 시작 기준, 기록이 쌓이면(3세션까지) 점점 실제 기록 쪽으로 */
  function current(seedE, history) {
    const est = estimate(history);
    if (est == null) return seedE == null ? null : seedE;
    if (seedE == null) return est;
    const n = Math.min(3, (history || []).filter((h) => h.mode !== 'low' && sessionE1(h)).length), w = n / 3;
    return Math.round((est * w + seedE * (1 - w)) * 10) / 10;
  }
  return { MODES, EFFORT, estimate, current, std1RM, refFor, seed, fromTest, recommend, plan, mpVolume, setE1, sessionE1, BUMP };
});

  function build(rows, hints) {

function planFor(id){
  const R=window.RuneTier,RR=window.RuneRoutine,e=EX[id],mem=memberCalc();
  if(!RR||!mem.bodyKg)return null;
  const m=R.metaFor(e.name,{machine:e.m,region:e.part==='leg'?'lower':'upper'}),ex=m&&R.BY_ID[m.id];
  if(ex&&ex.kind==='dumbbell')return null; // 덤벨 표기(한쪽/합계)가 정해지기 전까지 기본 세트
  let seedE=null;
  if(ex&&ex.base){const row=tierRows().find(r=>r.name===e.name),sd=RR.seed(ex,row?row.p.tier:0,row?row.p.stars:0,mem);seedE=sd?sd.e1rm:null}
  const e1=RR.current(seedE,histOf(id));if(!e1)return null;
  const pl=RR.plan(shownMode(),e1,{step:2.5,age:mem.age});if(!pl)return null;
  return[{t:'W',w:rnd(pl.sets[0].w/2),r:5,done:false,tmp:1}].concat(pl.sets.map(s=>({t:'M',w:s.w,r:s.r,pr:s.pr,done:false,tmp:1})));
}
function mkSets(id){

  const r=big?10:20,w=rnd(big?per/10:per/10/2);

}

}

/* ===== 회원 이름·정보 수정 / 같은 사람 합치기 ===== */
const memByName=(n,exceptId)=>AD().members.find(x=>x.id!==exceptId&&x.name===n);
const memCnt=m=>{let n=0;Object.keys(AD().plans).forEach(d=>AD().plans[d].forEach(it=>{if(it.mid===m.id||(it.name&&it.name.trim()===m.name))n++}));return n};
/* "은경"(2글자)과 "이은경"(3글자)처럼 같은 사람일 수 있는 쌍 찾기 */
function memDups(){
  const ms=AD().members,out=[],seen={};
  ms.forEach(a=>{if(a.name.length!==2)return;ms.forEach(b=>{if(b===a||b.name.length!==3||b.name.slice(1)!==a.name)return;
    if(a.uid&&b.uid)return;const k=a.id+'|'+b.id;if(seen[k])return;seen[k]=1;
    out.push(a.uid&&!b.uid?{from:b.id,to:a.id}:{from:a.id,to:b.id})})});
  return out;
}
/* from 회원의 수업·기록·티어·몸 정보를 to 회원으로 옮기고 from을 지움 */
function memMerge(fid,tid){
  const ms=AD().members,f=ms.find(x=>x.id===fid),t=ms.find(x=>x.id===tid);if(!f||!t||f===t)return false;
  Object.keys(AD().plans).forEach(d=>AD().plans[d].forEach(it=>{
    if(it.mid===f.id||(!it.mid&&it.name&&it.name.trim()===f.name)){it.mid=t.id;it.name=t.name;if(it.amb){it.amb=0;it.cand=null;it.why=''}}
    if(it.cand===f.id)it.cand=t.id}));
  const seen={};t.log=(t.log||[]).concat(f.log||[]).filter(e=>{const s=e.date+'|'+e.time+'|'+(e.memo||'');if(seen[s])return false;return seen[s]=1});if(!t.log.length)delete t.log;
  const tt=t.tiers||(t.tiers={});Object.keys(f.tiers||{}).forEach(k=>{const a=tt[k],b=f.tiers[k];if(!a||b.tier>a.tier||(b.tier===a.tier&&(b.hist||[]).length>(a.hist||[]).length))tt[k]=b});if(!Object.keys(tt).length)delete t.tiers;
  if(f.runs&&f.runs.length){const m={};(t.runs||[]).concat(f.runs).forEach(r=>{m[r.id]=r});t.runs=Object.values(m)}
  if(f.body){t.body=Object.assign({},f.body,t.body||{});Object.keys(t.body).forEach(k=>{if(t.body[k]==null||t.body[k]==='')t.body[k]=f.body[k]})}
  if(f.focus&&!t.focus)t.focus=f.focus;
  if(f.note&&f.note!==t.note)t.note=(t.note?t.note+' / ':'')+f.note;
  if(!f.temp)delete t.temp;if(t.uid)delete t.temp;
  ms.splice(ms.indexOf(f),1);return true;
}

function zoneCalc(x){

  const m=R.metaFor(e.name,{machine:e.m,region:e.part==='leg'?'lower':'upper'});
  if(!m||m.kind==='dumbbell')return null;
  let L;try{L=R.ladderFor(m,mem)}catch(err){return null}
  const eqT={};L.forEach((r,i)=>{if(r&&r.ok&&!r.trainerSet&&r.kg>0&&r.reps>0)eqT[i+1]=r.kg/R.rmPct(r.reps)});

  const hope=S.hopeTier!=null&&S.hopeTier>=0&&S.hopeTier<=9,T=hope?S.hopeTier:(row?row.p.tier:((S.tiers&&S.tiers[m.id]&&S.tiers[m.id].tier)||(S.tiers&&m.head&&S.tiers[m.head]&&S.tiers[m.head].tier)||0)),mx=Math.max(...ks),mn=Math.min(...ks);
  const eqAt=t=>{if(eqT[t])return eqT[t];if(t<mn)return eqT[mn]/Math.pow(1.2,mn-t);if(t>mx){const a=eqT[mx],b=eqT[mx-1]||a/1.1;return a*Math.pow(a/b,t-mx)}return null};

}

    putToday(sl);persist();toast(curNo()>1?`오늘 ${curNo()}번째 운동 기록을 저장했어요`:'오늘 기록을 저장했어요');openM(gradeHTML(sl))},
  grades:()=>{const sl=draft().slots.filter(Boolean);if(!sl.length){toast('먼저 룬에 종목을 장착해 주세요');return}openM(gradeHTML(sl))},
  newsess:async()=>{const sl=draft().slots.filter(Boolean);if(!sl.length){toast('먼저 룬에 종목을 장착해 주세요');return}
    putToday(sl);clearTimeout(stmr);
    if(sb&&UID&&PULLED&&S.mode!=='admin')await syncToday();   // 현재 회차를 서버에 먼저 저장한 뒤 다음 회차로 넘어가요
    const n=curNo()+1;S.curNo[T]=n;S.drafts[T]={slots:Array(6).fill(null)};DB.save(S);render();toast(`오늘 ${n}번째 운동을 시작했어요`)},
  mon:d=>{CM.m+=+d.v;if(CM.m<0){CM.m=11;CM.y--}if(CM.m>11){CM.m=0;CM.y++}render()},
  day:d=>{CD=d.d;render()},
  theme:d=>{applyTheme(d.v);render()},
  login:d=>{const pv={'카카오':'kakao','구글':'google'}[d.p];if(!pv)return;if(!sb){toast('로그인은 GitHub 주소(upvible.github.io)에서만 동작해요');return}sb.auth.signInWithOAuth({provider:pv,options:{redirectTo:APP_URL}}).then(r=>{if(r.error)toast('로그인을 시작하지 못했어요: '+r.error.message)})},
  syncnow:async()=>{toast('동기화 중…');await syRefresh(true);toast(SY.err?'동기화 오류가 있어요':'동기화했어요')},
  logout:async()=>{if(sb&&UID){await upProfile();await syncToday();clearTimeout(SY.t);let w=0;while(SY.busy&&w++<50)await new Promise(r=>setTimeout(r,100));await syFlush();if(SYNC==='err'||SY.err||(SY.ready&&syKeys().some(syDirty))){toast('서버에 저장이 끝나지 않았어요. 연결을 확인하고 다시 시도해 주세요');return}syStop();await sb.auth.signOut()}else syStop();S.adm=null;S.tiers=undefined;S.equip=undefined;S.equipSeen=undefined;S.runs=[];S.hopeTier=undefined;S.wm={};S.mode=undefined;S.sy={ts:{},h:{}};S.user=null;UID=null;ROLE=null;GUEST=false;PULLED=false;SYNC='off';S.sessions={};S.more={};S.curNo={};S.reviews={};S.drafts={};S.profile=null;S.lvSet=false;S.bodyLog=[];srvSave(null);SCR='auth';persist();render()},
  reset:()=>{S={user:null,level:'intermediate',sessions:{},more:{},curNo:{},drafts:{},wm:{}};ADM.cur=null;tab='today';persist();render();toast('데이터를 지웠어요')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.stopPropagation();const f=A[el.dataset.act];if(f)f(el.dataset)});
/* 회색(자동 채운 임시값) 칸은 누르는 순간 비워서, 새 숫자가 뒤에 붙지 않고 바로 대체되게 한다. 안 쓰고 나가면 원래 값 복원 */
document.addEventListener('focusin',e=>{const t=e.target;if(!(t.matches&&t.matches('.r2 input')))return;
  if(t.classList.contains('tmp')){t.dataset.prev=t.value;t.placeholder=t.value;t.value=''}else{t.dataset.sel='1';setTimeout(()=>{try{t.select()}catch(x){}},0)}
  const i=+t.dataset.i;if(i!==RF){const x=draft().slots[RC],o=$('#hn'+RF);if(o)o.remove();RF=i;const w=t.closest('.sw');if(x&&w&&x.sets[i]&&x.sets[i].t!=='W')w.insertAdjacentHTML('afterend',zoneRow(x,i))}});
document.addEventListener('mouseup',e=>{const t=e.target;if(t.matches&&t.matches('.r2 input')&&t.dataset.sel){e.preventDefault();delete t.dataset.sel}});
document.addEventListener('focusout',e=>{const t=e.target;if(!(t.matches&&t.matches('.r2 input')))return;if(t.dataset.prev!==undefined&&t.value===''&&t.classList.contains('tmp'))t.value=t.dataset.prev;delete t.dataset.prev;if(t.classList.contains('tmp'))t.placeholder=''});
document.addEventListener('input',e=>{const t=e.target;if(t.matches&&t.matches('.r2 input.tmp')){t.classList.remove('tmp');delete t.dataset.prev;t.placeholder=''}},true);
/* 세트를 왼쪽으로 밀면 삭제 버튼 */
let swp=null,swSup=0;
const swClose=ex=>document.querySelectorAll('.sw.open').forEach(x=>{if(x!==ex){x.classList.remove('open');x.querySelector('.r2').style.transform=''}});
document.addEventListener('click',e=>{if(Date.now()-swSup<150){e.stopImmediatePropagation();e.preventDefault()}},true);
document.addEventListener('pointerdown',e=>{const w=e.target.closest&&e.target.closest('.sw');if(!w||e.target.closest('.sdl'))return;swClose(w);swp={w,row:w.querySelector('.r2'),x:e.clientX,y:e.clientY,base:w.classList.contains('open')?-96:0,drag:false,cur:0}});
document.addEventListener('pointermove',e=>{if(!swp)return;const dx=e.clientX-swp.x,dy=e.clientY-swp.y;
  if(!swp.drag){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.5){swp.drag=true;swp.row.style.transition='none';const a=document.activeElement;if(a&&a.blur)a.blur()}else{if(Math.abs(dy)>10)swp=null;return}}
  swp.cur=Math.max(-96,Math.min(0,swp.base+dx));swp.row.style.transform='translateX('+swp.cur+'px)'});
const swEnd=()=>{if(!swp)return;if(swp.drag){const o=swp.cur<-48;swp.row.style.transition='';swp.row.style.transform=o?'translateX(-96px)':'';swp.w.classList.toggle('open',o);swSup=Date.now()}swp=null};
document.addEventListener('pointerup',swEnd);document.addEventListener('pointercancel',swEnd);
setInterval(()=>{if(RT>0){RT--;const b=$('#rest');if(b)b.textContent=rtTxt()}},1000);
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf){OB[t.dataset.pf]=t.value;obRefresh();return}
  if(t.id==='mpq'){MP.q=t.value;const l=$('#mpl');if(l)l.innerHTML=mpList();return}
  if(t.id==='pq'){PK.q=t.value;pickList();return}
  if(t.id==='pm'){PK.m=t.checked;pickList();return}
  if(t.id==='ad'){ADM.date=t.value||T;render();return}
  const af=t.dataset.af;
  if(af){ADM.cur[af]=af==='no'?(Number(t.value)||0):t.value;if(af==='hw')ADM.cur.hwDone=false;if(af==='special')ADM.cur.spDone=false;if(af==='name'){ADM.cur.mid=null;$('#sug').innerHTML=sugHTML()}persist();return}
  if(t.dataset.pr!==undefined){const r=PZ.rows[+t.dataset.pr];if(r)r.pick=t.value;return}
  if(t.id==='hope'){S.hopeTier=t.value===''?null:+t.value;persist();saveHope();const hd=t.closest('.pn').querySelector('.row .mu');if(hd)hd.textContent=S.hopeTier==null?'자동 (내 현재 티어)':'희망 '+window.RuneTier.TIERS[S.hopeTier];return}
  if(t.id==='rvt'){S.reviews=S.reviews||{};const r=S.reviews[T]||(S.reviews[T]={r:0,t:''});r.t=t.value;persist();return}
  if(t.dataset.mf){const m=AD().members.find(x=>x.id===t.dataset.mf);if(m){m.focus=t.value;persist()}return}
  if(t.dataset.nf){const x=draft().slots[RC];if(x){x.note=t.value;persist()}return}
  if(!t.dataset.f)return;
  const s=draft().slots[RC].sets[+t.dataset.i];
  if(t.dataset.f==='v'){s.v=t.value;persist();return}
  if(s.tr===undefined)s.tr=s.tmp?1:0;
  if(t.dataset.f==='done'){s.done=t.checked;if(t.checked){s.tmp=0;s.tr=0}}else{s[t.dataset.f]=Math.max(0,Number(t.value)||0);if(t.dataset.f==='w')s.tmp=0;else s.tr=0}
  if(!s.tmp){const g=t.closest('.r2').querySelector('input[data-f=w].tmp');if(g)g.classList.remove('tmp')}
  if(!s.tr){const g=t.closest('.r2').querySelector('input[data-f=r].tmp');if(g)g.classList.remove('tmp')}
  persist();const rv=$('#rv');if(rv)rv.textContent=fmt(vol(draft().slots[RC].sets));
  if(t.dataset.f==='w'||t.dataset.f==='r'){const hn=$('#hn'+t.dataset.i);if(hn)hn.innerHTML=zoneInner(draft().slots[RC],+t.dataset.i)}
});
$('#md').addEventListener('click',e=>{if(e.target.id!=='md')return;if(ADM.pop&&$('#md').querySelector('[data-edit]'))A.aback();else A.close()});
initAuth();
applyTheme(themeMode());
render();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
