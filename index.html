<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>룬PT 루틴·숙련도 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--pn:#fffaf0;--ln:#d9cdb2;--tx:#1d2430;--mu:#6b7280;--gd:#9a6f1c;--cy:#0b7e93;--hx:#efe6d0}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080d14;--pn:#0f1822;--ln:#2a3a4a;--tx:#e8e0cc;--mu:#8a98a8;--gd:#d9aa4e;--cy:#4fc3d9;--hx:#16222f}}
:root[data-theme="dark"]{--bg:#080d14;--pn:#0f1822;--ln:#2a3a4a;--tx:#e8e0cc;--mu:#8a98a8;--gd:#d9aa4e;--cy:#4fc3d9;--hx:#16222f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
#app{max-width:480px;margin:0 auto;padding:12px 12px 84px}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h1{font-size:20px;font-weight:900;margin:0}.h2{font-size:16px;font-weight:700}.mu{color:var(--mu);font-size:12px}
.vb{font-size:12px;color:var(--mu)}.vb b{font-size:22px;color:var(--gd);font-weight:900}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:9px 4px;border:1px solid var(--ln);background:transparent;border-radius:8px;font-weight:700;font-size:12px}
.seg button.on{background:var(--gd);color:#fff;border-color:var(--gd)}
.stage{position:relative;height:340px}
.sl{position:absolute;aspect-ratio:1}
.hx{position:absolute;inset:0;background:var(--c,var(--ln));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);border:0;padding:0;width:100%}
.hx i{position:absolute;inset:3px;background:var(--hx);clip-path:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;font-style:normal;text-align:center;padding:0 8px}
.hx.empty{background:var(--ln)}
.hx.empty i{color:var(--mu);font-size:11px}
.hx i small{font-size:10px;color:var(--c);font-weight:700}
.hx i b{font-size:11px;line-height:1.2;word-break:keep-all}
.hx i em{font-size:10px;color:var(--mu);font-style:normal}
.rm{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#c0392b;color:#fff;border:0;border-radius:10px;padding:3px 10px;font-size:11px;font-weight:700;z-index:2}
.ctr{position:absolute;left:50%;top:70px;transform:translateX(-50%);text-align:center;width:30%}
.ctr b{font-size:20px;color:var(--gd);display:block}
.btn{width:100%;padding:12px;border-radius:10px;border:0;background:var(--gd);color:#fff;font-weight:900;font-size:15px}
.btn.ghost{background:transparent;border:1px solid var(--ln);color:var(--tx)}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.nav div{display:flex;width:100%;max-width:480px}
.nav button{flex:1;border:0;background:transparent;padding:12px 4px;font-weight:700;font-size:12px;color:var(--mu)}
.nav button.on{color:var(--gd);box-shadow:inset 0 3px 0 var(--gd)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50}
#md.on{display:flex}
.sheet{background:var(--pn);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:8px 0}
.tabs button{border:1px solid var(--ln);background:transparent;border-radius:16px;padding:6px 12px;white-space:nowrap;font-size:12px;font-weight:700}
.tabs button.on{background:var(--cy);color:#fff;border-color:var(--cy)}
input[type=text],input[type=number]{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.ex{display:flex;justify-content:space-between;width:100%;padding:11px 8px;border:0;border-bottom:1px solid var(--ln);background:transparent;text-align:left}
.sg{display:grid;grid-template-columns:46px 1fr 64px 56px 34px 34px;gap:5px;align-items:center;margin-bottom:6px;text-align:center}
.sg.hd{font-size:11px;color:var(--mu)}
.sg input[type=number]{text-align:center;padding:8px 2px}
.sg input[type=checkbox]{width:22px;height:22px;accent-color:var(--cy)}
.ty{border:1px solid var(--ln);border-radius:6px;padding:7px 0;font-weight:900;background:transparent}
.ty.W{background:#b45309;color:#fff;border-color:#b45309}.ty.F{background:#b91c1c;color:#fff;border-color:#b91c1c}.ty.M{background:var(--cy);color:#fff;border-color:var(--cy)}.sg input.tmp{color:var(--mu);font-style:italic}
.x{border:0;background:transparent;color:var(--mu);font-size:16px}
.prev{font-size:11px;color:var(--mu)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{text-align:center;font-size:11px;color:var(--mu)}
.cal button{aspect-ratio:1;border:1px solid var(--ln);border-radius:8px;background:transparent;font-size:12px;position:relative}
.cal button.sel{outline:2px solid var(--cy)}
.cal button.td{border-color:var(--gd);font-weight:900}
.cal button[data-l="1"]{background:color-mix(in srgb,var(--cy) 25%,transparent)}
.cal button[data-l="2"]{background:color-mix(in srgb,var(--cy) 50%,transparent)}
.cal button[data-l="3"]{background:color-mix(in srgb,var(--cy) 80%,transparent);color:#fff}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cards div{border:1px solid var(--ln);border-radius:10px;padding:10px}.cards b{display:block;font-size:18px}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--c)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:99}
.sp{border-top:1px solid var(--ln);padding:8px 0}
.sm{width:auto;padding:8px 12px;font-size:12px;display:inline-block;text-decoration:none;text-align:center;border-radius:8px}
.fi{flex:1;min-width:0;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.tr{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:10px;margin-bottom:6px;border:1px solid var(--ln);border-radius:10px;background:var(--pn)}.tr.empty{background:transparent;border-style:dashed}
.qr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--ln)}.qr.dn .qt{opacity:.5;text-decoration:line-through}.qc{flex:none;width:30px;height:30px;border-radius:8px;border:2px solid var(--gd);background:transparent;font-weight:900;color:var(--gd)}.qr.dn .qc{background:var(--gd);color:#fff}.qt{flex:1;text-align:left;border:0;background:transparent;padding:0;font-size:14px;line-height:1.5}
.trw{margin-bottom:6px}.trw .tr{margin-bottom:0;border-radius:10px 10px 0 0}.ra{display:flex;flex-wrap:wrap;gap:6px;padding:6px 10px;border:1px solid var(--ln);border-top:0;border-radius:0 0 10px 10px;background:var(--pn)}
.stars{display:flex;gap:6px;margin:8px 0}.sb{flex:1;border:1px solid var(--ln);background:transparent;border-radius:10px;padding:10px 0;font-size:22px;font-weight:900;color:var(--mu)}.sb.on{background:#d9aa4e;color:#1d2430;border-color:#d9aa4e}
.cal .st{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:11px;color:#f5b301}
.cal button.hl{background:rgba(205,255,0,.62);color:#1d2430;font-weight:700}
.cal .gr{position:absolute;left:0;right:0;bottom:1px;font-style:normal;font-size:10px;font-weight:900;color:#1d2430}
@media(min-width:900px){#app.wide{max-width:1000px}#app.wide .dual{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}}
code{font-size:11px;background:var(--bg);padding:1px 4px;border-radius:4px}
@media(prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="md"></div>
<div class="nav"><div id="nav"></div></div>
<script>
const P={chest:'가슴',back:'등',leg:'다리',shoulder:'어깨',arm:'팔',core:'코어'};
const PC={chest:'#e5604a',back:'#2aa7c0',leg:'#d9aa4e',shoulder:'#9b7bf0',arm:'#3bb56a',core:'#e0559e'};
const BIG={chest:1,back:1,leg:1};
const RAW={chest:'벤치프레스,인클라인 덤벨프레스,체스트 플라이,푸시업,케이블 크로스오버,딥스',
back:'데드리프트,랫풀다운,바벨 로우,시티드 케이블 로우,풀업,원암 덤벨 로우',
leg:'스쿼트,레그프레스,루마니안 데드리프트,런지,레그 익스텐션,레그 컬,힙 쓰러스트,카프 레이즈',
shoulder:'오버헤드 프레스,사이드 레터럴 레이즈,프론트 레이즈,리어델트 플라이,페이스 풀,숄더 프레스 머신',
arm:'바벨 컬,해머 컬,프리처 컬,트라이셉스 푸시다운,스컬크러셔,덤벨 킥백',
core:'플랭크,크런치,레그 레이즈,러시안 트위스트,케이블 크런치,행잉 니레이즈'};
const RAWM={chest:'체스트 프레스 머신|머신 벤치프레스/체프,인클라인 체스트 프레스 머신,펙덱 플라이|버터플라이/펙덱/팩덱,스미스 머신 벤치프레스,디클라인 체스트 프레스 머신',
back:'어시스티드 풀업 머신|어시스트 풀업/보조 풀업,시티드 로우 머신|체스트 서포트 로우/머신 로우,T바 로우 머신|티바 로우,풀오버 머신,하이 로우 머신',
leg:'핵 스쿼트 머신|핵스쿼트,힙 어브덕션 머신|아웃타이/바깥쪽 허벅지,힙 어덕션 머신|인타이/안쪽 허벅지,스미스 머신 스쿼트,시티드 카프 레이즈 머신',
shoulder:'리버스 펙덱|리어델트 머신/후면 어깨,사이드 레터럴 레이즈 머신|옆 어깨 머신,스미스 머신 숄더 프레스,슈러그 머신|트랩,케이블 사이드 레터럴 레이즈',
arm:'바이셉스 컬 머신|이두 머신,프리처 컬 머신,트라이셉스 익스텐션 머신|삼두 머신,트라이셉스 딥 머신|삼두 딥,케이블 오버헤드 트라이셉스 익스텐션',
core:'어브도미널 크런치 머신|복근 머신/앱 크런치,로터리 토르소 머신|옆구리 머신/토르소,캡틴스 체어 레그 레이즈|롬안 체어,케이블 우드찹|우드찹,백 익스텐션 머신|허리 머신/하이퍼 익스텐션'};
const MSET=['레그프레스','레그 익스텐션','레그 컬','랫풀다운','숄더 프레스 머신','시티드 케이블 로우','케이블 크로스오버','트라이셉스 푸시다운','케이블 크런치','페이스 풀'];
const EX={};Object.keys(RAW).forEach(p=>{const a=RAW[p].split(','),b=RAWM[p].split(',');a.concat(b).forEach((s,i)=>{const[n,al]=s.split('|');EX[p+i]={id:p+i,name:n,part:p,al:al||'',m:i>=a.length||MSET.includes(n)}})});
const LV={beginner:{n:3,v:600,t:'초급'},intermediate:{n:4,v:1600,t:'중급'},advanced:{n:5,v:3000,t:'고급'}};
const TIER=[[0,'브론즈'],[30000,'실버'],[100000,'골드'],[250000,'플래티넘'],[600000,'다이아']];
const POS=[[7,6,30],[63,6,30],[2,236,22],[26,236,22],[52,236,22],[76,236,22]];
const $=s=>document.querySelector(s);
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fmt=n=>Math.round(n).toLocaleString('ko-KR');
const T=ymd(new Date());

/* 저장소 어댑터: 나중에 Supabase/Firebase 호출로 이 두 함수만 교체 */
let mem=null;
const DB={
  load(){try{const r=localStorage.getItem('rpt1');if(r)return JSON.parse(r)}catch(e){}return mem||{user:null,level:'beginner',sessions:{},drafts:{}}},
  save(s){mem=s;try{localStorage.setItem('rpt1',JSON.stringify(s))}catch(e){}}
};
let S=DB.load();S.sessions=S.sessions||{};S.drafts=S.drafts||{};S.level=S.level||'beginner';
const fixT=l=>l.forEach(x=>x&&x.sets.forEach(s=>{if(s.t==='N')s.t='M'}));Object.values(S.sessions).forEach(fixT);Object.values(S.drafts).forEach(d=>fixT(d.slots));
const DEMO=[['m1','김민수'],['m2','이서연'],['m3','박지훈'],['m4','최유나'],['m5','정하늘']];
const AD=()=>S.adm||(S.adm={members:DEMO.map(([id,name])=>({id,name})),plans:{}});
const persist=()=>DB.save(S);
let ADM={date:T,cur:null},tab=S.mode==='admin'?'acal':'today',PK={slot:0,part:'chest',q:''},RC=0,CM=(()=>{const d=new Date();return{y:d.getFullYear(),m:d.getMonth()}})(),CD=T;

const vol=sets=>sets.reduce((a,s)=>a+(s.done&&s.t!=='W'?s.w*s.r:0),0);
const pvol=sets=>sets.reduce((a,s)=>a+(s.t!=='W'?s.w*s.r:0),0);
const draft=()=>ADM.cur||S.drafts[T]||(S.drafts[T]={slots:Array(6).fill(null)});
const rnd=x=>Math.max(2.5,Math.round(x/2.5)*2.5);
function mkSets(id){
  const c=LV[S.level],per=c.v/c.n,big=BIG[EX[id].part];
  const r=big?10:20,w=rnd(big?per/10:per/10/2);
  return [{t:'W',w:rnd(w/2),r,done:false,tmp:1},{t:'M',w,r,done:false,tmp:1},{t:'M',w,r,done:false,tmp:1}];
}
function prevOf(id){
  const ds=Object.keys(S.sessions).filter(d=>d!==T).sort().reverse();
  for(const d of ds){const it=S.sessions[d].find(x=>x&&x.id===id);if(it)return{d,sets:it.sets}}
  return null;
}
function partVol(from,to){
  const o={chest:0,back:0,leg:0,shoulder:0,arm:0,core:0};
  Object.keys(S.sessions).forEach(d=>{if(d>=from&&d<=to)S.sessions[d].forEach(x=>{if(x)o[EX[x.id].part]+=vol(x.sets)})});
  return o;
}
const dAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return ymd(d)};
const dayVol=d=>(S.sessions[d]||[]).reduce((a,x)=>a+(x?vol(x.sets):0),0);

/* 화면 */
function viewToday(){
  const d=draft(),tv=d.slots.reduce((a,x)=>a+(x?vol(x.sets):0),0),pt=d.slots.reduce((a,x)=>a+(x?pvol(x.sets):0),0);
  const dt=new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});
  const nodes=d.slots.map((x,i)=>{
    const [l,t,w]=POS[i],lab=(i<2?'메인':'보조')+(i<2?i+1:i-1);
    const inner=x?`<i style="--c:${PC[EX[x.id].part]}"><small>${P[EX[x.id].part]}</small><b>${EX[x.id].name}</b><em>${fmt(pvol(x.sets))}kg</em></i>`:`<i>+<br>${lab}</i>`;
    return `<div class="sl" style="left:${l}%;top:${t}px;width:${w}%"><button class="hx ${x?'':'empty'}" style="--c:${x?PC[EX[x.id].part]:''}" data-act="slot" data-i="${i}" aria-label="${lab}">${inner}</button>${x?`<button class="rm" data-act="rm" data-i="${i}">해제</button>`:''}</div>`;
  }).join('');
  const sets=d.slots.reduce((a,x)=>a+(x?x.sets.filter(s=>s.done&&s.t!=='W').length:0),0);
  return `<div class="row"><div><h1 class="h1">${ADM.cur?'수업 룬 페이지':'룬PT'}</h1><div class="mu">${ADM.cur?ADM.cur.time+' · '+(ADM.cur.name||'회원 미지정'):dt}</div></div><div class="vb">완료 볼륨 (예정 ${fmt(pt)})<br><b>${fmt(tv)}</b> kg</div></div>
  <div class="pn"><div class="h2">내 수준</div><div class="mu">새로 장착하는 종목부터 기본 세트가 자동으로 채워져요</div>
  <div class="seg">${Object.keys(LV).map(k=>`<button class="${S.level===k?'on':''}" data-act="level" data-v="${k}">${LV[k].t}<br><small>${LV[k].n}세트·${fmt(LV[k].v)}kg</small></button>`).join('')}</div></div>
  <div class="pn"><div class="h2">오늘의 룬 페이지</div><div class="mu">빈 룬을 눌러 종목 장착, 장착된 룬을 눌러 기록</div>
  <div class="stage">${nodes}<div class="ctr">${miniRadar(d.slots)}</div></div></div>
  ${ADM.cur?'':reviewHTML(d)}${ADM.cur?'<button class="btn" data-act="admdone">수업 칸에 저장</button>':'<button class="btn" data-act="save">오늘 기록 저장</button>'}`;
}
function viewCal(){
  const {y,m}=CM,first=new Date(y,m,1).getDay(),dim=new Date(y,m+1,0).getDate();
  let cells=['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')+'<i></i>'.repeat(first);
  for(let i=1;i<=dim;i++){
    const k=`${y}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`,v=dayVol(k),lv=v?(v<2000?1:v<5000?2:3):0;
    cells+=`<button data-act="day" data-d="${k}" data-l="0" class="${v?'hl':''} ${k===CD?'sel':''} ${k===T?'td':''}">${i}${S.reviews&&S.reviews[k]&&S.reviews[k].g?'<i class="gr">'+S.reviews[k].g+'</i>':''}</button>`;
  }
  const items=(S.sessions[CD]||[]).filter(Boolean);

  mcal:d=>{const m=AD().members.find(x=>x.id===d.id),ks=Object.keys(memSess(m)).sort(),last=ks.length?ks[ks.length-1]:T,p=last.split('-');MC={id:d.id,y:+p[0],m:+p[1]-1,d:ks.length?last:null};openM(memHTML2())},
  mday:d=>{MC.d=d.d;openM(memHTML2())},
  mmon:d=>{MC.m+=+d.v;if(MC.m<0){MC.m=11;MC.y--}if(MC.m>11){MC.m=0;MC.y++}openM(memHTML2())},
  arsave:()=>{const w=wk(ADM.date);let n=0;w.days.forEach(d=>plan(d).forEach(it=>{if(!it.name||!it.name.trim()||!(it.special||it.hw))return;let m=AD().members.find(x=>x.id===it.mid)||AD().members.find(x=>x.name===it.name.trim());if(!m){m={id:'t'+Date.now()+n,name:it.name.trim(),temp:1};AD().members.push(m)}it.mid=m.id;m.log=m.log||[];const e={date:d,time:it.time,no:it.no||0,special:it.special||'',hw:it.hw||'',hwDone:!!it.hwDone,spDone:!!it.spDone},i=m.log.findIndex(x=>x.date===d&&x.time===it.time);if(i>=0)m.log[i]=e;else m.log.push(e);n++}));persist();render();toast(n+'건을 회원정보에 저장했어요')},
  arcopy:()=>{const w=wk(ADM.date);let t=`[주간 리포트] ${w.m.getMonth()+1}/${w.m.getDate()} ~ ${w.e.getMonth()+1}/${w.e.getDate()}`;w.days.forEach(d=>{const l=plan(d).filter(x=>x.name&&x.name.trim()).sort((a,b)=>a.time<b.time?-1:1);if(!l.length)return;t+=`\n\n${DOW[new Date(d+'T00:00:00').getDay()]} ${d.slice(5).replace('-','/')}`;l.forEach(it=>{t+=`\n- ${it.name} - 특이사항: ${it.special||'없음'} - 과제: ${it.hw||'없음'}`})});copyText(t,'주간 리포트를 복사했어요')},
  aq:d=>{const it=fi(d.id);if(!it)return;const k=d.k==='hw'?'hwDone':'spDone';it[k]=!it[k];persist();render()},
  aday:d=>{ADM.date=d.d;tab='day';render();scrollTo(0,0)},
  amon2:d=>{ACM.m+=+d.v;if(ACM.m<0){ACM.m=11;ACM.y--}if(ACM.m>11){ACM.m=0;ACM.y++}render()},
  adnav:d=>{const x=new Date(ADM.date+'T00:00:00');x.setDate(x.getDate()+ +d.v);ADM.date=ymd(x);render()},
  aslot:d=>{const l=plan(ADM.date);let it=l.find(x=>x.time===d.t);if(!it){it={id:'p'+Date.now(),time:d.t,name:'',mid:null,no:0,memo:'',hw:'',goal:'',special:'',slots:Array(6).fill(null),sent:false};l.push(it)}ADM.cur=it;ADM.live=innerWidth<900&&!it.memo;ADM.pop=true;persist();render()},
  acal:d=>{const w=window.open(calURL(fi(d.id),ADM.date),'_blank');if(w){w.opener=null}else toast('캘린더 창이 막혔어요. 목록 화면의 캘린더 버튼을 이용해 주세요')},
  grade:d=>{S.reviews=S.reviews||{};const r=S.reviews[T]||(S.reviews[T]={g:'',t:''});r.g=r.g===d.g?'':d.g;const sl=draft().slots.filter(Boolean);if(sl.length)S.sessions[T]=JSON.parse(JSON.stringify(sl));persist();render()},
  mode:d=>{S.mode=d.v;ADM.cur=null;ADM.pop=false;tab=d.v==='admin'?'acal':'today';persist();render()},
  aadd:()=>{const t=$('#at').value,l=plan(ADM.date);if(l.some(x=>x.time===t)){toast('이미 있는 시간이에요');return}const it={id:'p'+Date.now(),time:t,name:'',mid:null,no:0,memo:'',hw:'',goal:'',slots:Array(6).fill(null),sent:false};l.push(it);ADM.cur=it;ADM.live=true;ADM.pop=true;persist();render()},
  aedit:d=>{ADM.cur=fi(d.id);ADM.live=innerWidth<900&&!ADM.cur.memo;ADM.pop=true;render()},
  alive:()=>{ADM.live=!ADM.live;render();scrollTo(0,0)},
  aexp:()=>{const l=plan(ADM.date);if(!l.length){toast('보낼 수업 칸이 없어요');return}copyText('RPT1:'+btoa(unescape(encodeURIComponent(JSON.stringify({d:ADM.date,items:l})))),'코드를 복사했어요. 카톡 나와의 채팅 등으로 보내세요')},
  aimp:()=>{const raw=($('#imp').value||'').trim();try{if(!raw.startsWith('RPT1:'))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(5)))));const l=plan(o.d);let add=0,upd=0,skip=0;o.items.forEach(it=>{const i=l.findIndex(x=>x.id===it.id);if(i>=0){l[i]=it;upd++}else if(l.some(x=>x.time===it.time)){skip++}else{l.push(it);add++}});ADM.date=o.d;persist();render();toast(`가져왔어요 (추가 ${add}, 갱신 ${upd}, 시간 겹쳐 건너뜀 ${skip})`)}catch(e){toast('코드를 읽을 수 없어요. 처음부터 끝까지 복사했는지 확인해 주세요')}},
  aback:()=>closeEdit(),
  admdone:()=>{closeEdit();toast('수업 칸에 저장했어요')},
  adel:d=>{const l=plan(ADM.date),i=l.findIndex(x=>x.id===d.id);if(i>=0)l.splice(i,1);persist();render()},
  acopy:d=>copyText(briefText(fi(d.id),ADM.date)),
  asend:d=>{const it=fi(d.id);if(!it.name.trim()){toast('회원을 먼저 지정해 주세요');return}it.sent=true;persist();render();toast('발송 처리했어요 (데모: 서버 연동 후 회원 선물함에 도착)')},
  asendall:()=>{let n=0;plan(ADM.date).forEach(it=>{if(it.name.trim()&&!it.sent){it.sent=true;n++}});persist();render();toast(n+'건 발송 처리했어요')},
  agcal:()=>toast('구글 로그인 연동 후 사용할 수 있어요 (다음 단계)'),
  apick:d=>{const m=AD().members.find(x=>x.id===d.id);ADM.cur.name=m.name;ADM.cur.mid=m.id;persist();render()},
  atemp:()=>{const q=ADM.cur.name.trim(),m={id:'t'+Date.now(),name:q,temp:1};AD().members.push(m);ADM.cur.mid=m.id;persist();render()},
  aprev:()=>{const c=ADM.cur,ps=AD().plans;let f=null;Object.keys(ps).filter(k=>k<ADM.date).sort().reverse().some(k=>{const it=ps[k].find(x=>x.name.trim()&&x.name===c.name&&x.slots.some(Boolean));if(it){f=it;return true}});if(!f){toast('이전 수업 기록이 없어요');return}c.slots=JSON.parse(JSON.stringify(f.slots)).map(x=>x&&{id:x.id,sets:x.sets.map(s=>({...s,done:false}))});if(!c.no)c.no=(f.no||0)+1;persist();render();toast('지난 루틴을 불러왔어요')},
  amadd:()=>{const v=$('#mn').value.trim();if(!v)return;AD().members.push({id:'m'+Date.now(),name:v});persist();render()},
  tab:d=>{tab=d.v;ADM.cur=null;ADM.pop=false;render()},
  level:d=>{S.level=d.v;persist();render()},
  slot:d=>{const i=+d.i,x=draft().slots[i];if(x){RC=i;openM(recHTML())}else openPick(i)},
  rm:d=>{draft().slots[+d.i]=null;persist();render()},
  ptab:d=>{PK.part=d.v;PK.q='';$('#pq').value='';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));pickList()},
  pick:d=>{const sl=draft().slots;if(sl.some(x=>x&&x.id===d.id)){toast('이미 장착된 종목이에요');return}sl[PK.slot]={id:d.id,sets:mkSets(d.id)};persist();RC=PK.slot;openM(recHTML())},
  close:()=>{persist();closeM()},
  ty:d=>{const s=draft().slots[RC].sets[+d.i],o={W:'M',M:'F',F:'W'};s.t=o[s.t];persist();openM(recHTML())},
  sdel:d=>{const x=draft().slots[RC];if(x.sets.length<=1){toast('세트는 최소 1개 필요해요');return}x.sets.splice(+d.i,1);persist();openM(recHTML())},
  sadd:d=>{const x=draft().slots[RC],m=x.sets.filter(s=>s.t==='M'),l=m[m.length-1]||x.sets[x.sets.length-1],w=d.t==='W';const at=w?Math.max(0,x.sets.findIndex(s=>s.t==='M')):x.sets.length;x.sets.splice(at,0,{t:d.t,w:w?rnd(l.w/2):l.w,r:l.r,done:false,tmp:(w||l.tmp)?1:0});persist();openM(recHTML())},
  save:()=>{const sl=draft().slots.filter(Boolean);if(!sl.length){toast('먼저 룬에 종목을 장착해 주세요');return}
    S.sessions[T]=JSON.parse(JSON.stringify(sl));persist();toast('오늘 기록을 저장했어요')},
  mon:d=>{CM.m+=+d.v;if(CM.m<0){CM.m=11;CM.y--}if(CM.m>11){CM.m=0;CM.y++}render()},
  day:d=>{CD=d.d;render()},
  login:d=>{S.user={name:d.p+' 회원(데모)',provider:d.p};persist();render();toast('로그인했어요 (데모)')},
  logout:()=>{S.user=null;persist();render()},
  reset:()=>{S={user:null,level:'beginner',sessions:{},drafts:{}};ADM.cur=null;tab='today';persist();render();toast('데이터를 지웠어요')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.stopPropagation();const f=A[el.dataset.act];if(f)f(el.dataset)});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='pq'){PK.q=t.value;pickList();return}
  if(t.id==='pm'){PK.m=t.checked;pickList();return}
  if(t.id==='ad'){ADM.date=t.value||T;render();return}
  const af=t.dataset.af;
  if(af){ADM.cur[af]=af==='no'?(Number(t.value)||0):t.value;if(af==='hw')ADM.cur.hwDone=false;if(af==='special')ADM.cur.spDone=false;if(af==='name'){ADM.cur.mid=null;$('#sug').innerHTML=sugHTML()}persist();return}
  if(t.id==='rvt'){S.reviews=S.reviews||{};const r=S.reviews[T]||(S.reviews[T]={r:0,t:''});r.t=t.value;persist();return}
  if(t.dataset.mf){const m=AD().members.find(x=>x.id===t.dataset.mf);if(m){m.focus=t.value;persist()}return}
  if(t.dataset.nf){const x=draft().slots[RC];if(x){x.note=t.value;persist()}return}
  if(!t.dataset.f)return;
  const s=draft().slots[RC].sets[+t.dataset.i];
  if(t.dataset.f==='done'){s.done=t.checked;if(t.checked)s.tmp=0}else{s[t.dataset.f]=Math.max(0,Number(t.value)||0);if(t.dataset.f==='w')s.tmp=0}
  if(!s.tmp){const g=t.closest('.sg').querySelector('input.tmp');if(g)g.classList.remove('tmp')}
  persist();const rv=$('#rv');if(rv)rv.textContent=fmt(vol(draft().slots[RC].sets));
});
$('#md').addEventListener('click',e=>{if(e.target.id!=='md')return;if(ADM.pop&&$('#md').querySelector('[data-edit]'))A.aback();else A.close()});
render();
</script>
</body>
